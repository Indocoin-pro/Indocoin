<style>
:root{
  --gold:#facc15;--gold2:#fbbf24;--gold3:#f59e0b;
  --dark:#0a0f1e;--dark2:#0f172a;--dark3:#1e293b;
  --text:#e2e8f0;--muted:#64748b;
  --green:#34d399;--red:#f87171;--cyan:#38bdf8;--violet:#a78bfa;
  --orange:#fb923c;
  --border:rgba(250,204,21,0.12);--card:rgba(15,23,42,0.97);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--dark);color:var(--text);font-family:'Rajdhani',sans-serif;min-height:100vh;overflow-x:hidden;}

.star{position:fixed;background:#fff;border-radius:50%;animation:twinkle var(--d) ease-in-out infinite alternate;z-index:0;pointer-events:none;}
@keyframes twinkle{from{opacity:.04}to{opacity:.45}}
.grid-bg{position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(250,204,21,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(250,204,21,0.03) 1px,transparent 1px);
  background-size:40px 40px;animation:gridMove 20s linear infinite;}
@keyframes gridMove{from{background-position:0 0}to{background-position:40px 40px}}

/* TOPNAV */
.topnav{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;
  background:rgba(5,10,25,0.98);backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(250,204,21,0.12);
  position:sticky;top:0;z-index:100;}
.nav-back{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--gold);}
.nav-brand{font-family:'Orbitron',sans-serif;font-size:13px;font-weight:900;color:var(--gold);letter-spacing:2px;}
.nav-sub{font-family:'Share Tech Mono',monospace;font-size:8px;color:var(--muted);letter-spacing:1px;}
.nav-badge{font-family:'Orbitron',sans-serif;font-size:9px;font-weight:700;
  background:rgba(250,204,21,0.1);border:1px solid rgba(250,204,21,0.35);
  border-radius:20px;padding:4px 10px;color:var(--gold);}

/* HERO */
.hero{position:relative;z-index:1;padding:20px 16px 12px;text-align:center;}
.hero::before{content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 0%,rgba(250,204,21,0.06) 0%,transparent 70%);pointer-events:none;}
.hero-title{font-family:'Orbitron',sans-serif;font-size:22px;font-weight:900;
  background:linear-gradient(135deg,var(--gold),var(--orange),var(--gold2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  letter-spacing:3px;margin-bottom:4px;}
.hero-sub{font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:2px;}

/* SEARCH */
.search-wrap{position:relative;z-index:1;padding:10px 12px 6px;}
.search-box{width:100%;padding:11px 16px 11px 40px;border-radius:12px;
  background:rgba(15,23,42,0.8);border:1px solid rgba(250,204,21,0.2);
  color:var(--text);font-family:'Rajdhani',sans-serif;font-size:14px;outline:none;
  transition:border-color .2s;}
.search-box:focus{border-color:rgba(250,204,21,0.5);}
.search-box::placeholder{color:var(--muted);}
.search-icon{position:absolute;left:24px;top:50%;transform:translateY(-50%);font-size:14px;pointer-events:none;}
.search-count{position:absolute;right:24px;top:50%;transform:translateY(-50%);
  font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--muted);}

/* CATEGORY FILTER */
.cat-filter{position:relative;z-index:1;padding:6px 12px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;}
.cat-filter::-webkit-scrollbar{display:none;}
.cfbtn{flex-shrink:0;padding:6px 14px;border-radius:20px;cursor:pointer;
  font-family:'Orbitron',sans-serif;font-size:8px;font-weight:700;letter-spacing:.5px;
  border:1px solid var(--border);background:rgba(255,255,255,0.03);color:var(--muted);
  transition:all .2s;}
.cfbtn.on{background:rgba(250,204,21,0.08);border-color:rgba(250,204,21,0.45);color:var(--gold);
  box-shadow:0 0 10px rgba(250,204,21,0.1);}

/* GRID */
.page{position:relative;z-index:1;padding:8px 10px 84px;}
.game-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

/* CARD */
.game-card{position:relative;border-radius:14px;overflow:hidden;cursor:pointer;
  border:1px solid rgba(250,204,21,0.1);background:var(--card);
  transition:transform .2s,box-shadow .2s;animation:fadeUp .3s ease both;}
.game-card:active{transform:scale(0.96);}
.game-card:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(250,204,21,0.1);}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

.card-thumb{height:110px;position:relative;overflow:hidden;
  background:linear-gradient(135deg,rgba(250,204,21,0.08),rgba(251,146,60,0.06));}
.card-thumb::after{content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 40%,rgba(10,15,30,0.85));}
.thumb-img{width:100%;height:100%;object-fit:cover;transition:transform .3s;}
.game-card:hover .thumb-img{transform:scale(1.08);}
.thumb-fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-family:'Orbitron',sans-serif;font-size:28px;font-weight:900;
  color:rgba(250,204,21,0.2);letter-spacing:-2px;user-select:none;}
.card-cat-badge{position:absolute;top:6px;right:6px;z-index:2;
  font-family:'Orbitron',sans-serif;font-size:6px;font-weight:700;
  padding:2px 7px;border-radius:20px;letter-spacing:.5px;
  background:rgba(250,204,21,0.12);border:1px solid rgba(250,204,21,0.35);color:var(--gold);}

.card-body{padding:8px 10px 10px;}
.card-name{font-family:'Orbitron',sans-serif;font-size:9px;font-weight:700;
  color:var(--text);letter-spacing:.5px;margin-bottom:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card-cat{font-family:'Share Tech Mono',monospace;font-size:7px;color:var(--muted);margin-bottom:8px;}
.card-play-btn{width:100%;padding:6px;border-radius:8px;border:none;cursor:pointer;
  background:linear-gradient(135deg,rgba(250,204,21,0.12),rgba(251,146,60,0.15));
  border:1px solid rgba(250,204,21,0.3);
  font-family:'Orbitron',sans-serif;font-size:7px;font-weight:700;

.card-play-btn:hover{background:linear-gradient(135deg,rgba(250,204,21,0.3),rgba(251,146,60,0.25));
  box-shadow:0 0 10px rgba(250,204,21,0.12);}

const VAULT_CA_G     = "0xb1136B943A855F1e743ae2a7452B147Bb89f85eD";

const BSC_ID         = "0x38";
const BSC_RPC        = "https://bsc-dataseed.binance.org/";

const GAME_ACCESS_ABI = [
  "function buyAccess(string) external",
  "function hasActiveAccess(address, string) external view returns (bool)",
  "function getAccessInfo(address, string) external view returns (bool, uint256, uint256)",
  "function getCurrentPrice() external view returns (uint256)",
];
const VAULT_ABI_G = [
  "function getGameBalance(address) external view returns (uint256)",
];
const SAVINGS_ABI = [
  "function deposit(address user, uint256 amount) external",
  "function checkIn() external",
  "function getUserInfo(address user) external view returns (uint256,uint256,uint256,uint256,bool,bool,uint256)",
  "function isActive(address user) external view returns (bool)",
];
const INDC_ABI_G = [
  "function approve(address spender, uint256 amount) external returns (bool)",
  "function allowance(address owner, address spender) external view returns (uint256)",
];

let provider, signer, userAddress;
let gameAccessContract, vaultContract, savingsContract, indcContract;
let currentPriceINDC = 5;
const DEPOSIT_AMOUNT = "5000000000"; // 5 INDC decimal 9
let walletReady = false;

// ── CONNECT WALLET ──
async function connectWallet() {
  try {
    if (!window.ethereum) { showToast('❌ Buka via DApps browser!'); return false; }
    await window.ethereum.request({method:'eth_requestAccounts'});
    try {
      await window.ethereum.request({method:'wallet_switchEthereumChain', params:[{chainId:BSC_ID}]});
    } catch(e) {
      if(e.code===4902) {
        await window.ethereum.request({method:'wallet_addEthereumChain', params:[{
          chainId:BSC_ID, chainName:'BNB Smart Chain',
          nativeCurrency:{name:'BNB',symbol:'BNB',decimals:18},
          rpcUrls:[BSC_RPC], blockExplorerUrls:['https://bscscan.com']
        }]});
      }
    }
    provider = new ethers.BrowserProvider(window.ethereum);
    signer   = await provider.getSigner();
    userAddress = await signer.getAddress();
    gameAccessContract = new ethers.Contract(GAME_ACCESS_CA, GAME_ACCESS_ABI, signer);
    vaultContract      = new ethers.Contract(VAULT_CA_G, VAULT_ABI_G, provider);
    savingsContract    = new ethers.Contract(SAVINGS_CA, SAVINGS_ABI, signer);
    indcContract       = new ethers.Contract(INDC_CA_G, INDC_ABI_G, signer);
    try {
      const p = await gameAccessContract.getCurrentPrice();
      currentPriceINDC = parseFloat(ethers.formatUnits(p, 9));
    } catch(e) {}
    walletReady = true;
    return true;
  } catch(e) {
    showToast('❌ ' + (e.message || 'Gagal connect wallet'));
    return false;
  }
}

async function getVaultBalance() {
  try {
    const r = await vaultContract.getGameBalance(userAddress);
    return parseFloat(ethers.formatUnits(r, 9));
  } catch(e) { return 0; }
}

let activeCat = 'all';
let pendingSlug = '';
let pendingName = '';

function getEmoji(cat){
  const m={Racing:'🏎️',Action:'⚔️',Strategy:'🏰',Puzzle:'🧩',Simulation:'🚀'};
  return m[cat]||'🎮';
}
function getLetters(name){
  return name.split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase();
}
function setCategory(cat,el){
  activeCat=cat;
  document.querySelectorAll('.cfbtn').forEach(b=>b.classList.remove('on'));
  el.classList.add('on');
  filterGames();
}
function filterGames(){
  const sv=document.getElementById('searchBox').value.toLowerCase().trim();
  const grid=document.getElementById('gameGrid');
  grid.innerHTML='';
  const filtered=HARD_GAMES.filter(g=>{
    const mc=activeCat==='all'||g.cat===activeCat;
    const ms=!sv||g.name.toLowerCase().includes(sv)||g.cat.toLowerCase().includes(sv);
    return mc&&ms;
  });
  document.getElementById('searchCount').textContent=filtered.length;
  document.getElementById('totalBadge').textContent=filtered.length+' GAMES';
  if(filtered.length===0){
    const e=document.createElement('div');
    e.className='empty-state';
    e.textContent='Game tidak ditemukan.';
    grid.appendChild(e);
    return;
  }
  filtered.forEach((g,i)=>{
    const card=document.createElement('div');
    card.className='game-card';
    card.style.animationDelay=Math.min(i,20)*0.04+'s';
    card.innerHTML=`
      <div class="card-thumb">
        <img class="thumb-img"
          src="https://www.madkidgames.com/games/${g.slug}/thumb_1.jpg"
          alt="${g.name}"
          onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
        <div class="thumb-fallback" style="display:none">${getLetters(g.name)}</div>
        <div class="card-cat-badge">${g.cat.toUpperCase()}</div>
      </div>
      <div class="card-body">
        <div class="card-name" title="${g.name}">${g.name}</div>
        <div class="card-cat">${getEmoji(g.cat)} ${g.cat}</div>
        <button class="card-play-btn" id="btn-${g.slug}" onclick="handleClick('${g.slug}','${g.name.replace(/'/g,"\\'")}')">
          MAIN — ${currentPriceINDC} INDC
        </button>
      </div>`;
    grid.appendChild(card);
  });
  if(walletReady && userAddress) checkAllAccess(filtered);
}

function formatSisa(expiry){
  const now=Math.floor(Date.now()/1000);
  const sisa=Number(expiry)-now;
  if(sisa<=0) return null;
  const jam=Math.floor(sisa/3600);
  const menit=Math.floor((sisa%3600)/60);
  return jam>0?`${jam}j ${menit}m`:`${menit}m`;
}

function setBtnAktif(slug, expiry){
  const btn=document.getElementById('btn-'+slug);
  if(!btn) return;
  const isPermanent = expiry.toString().length > 15;
  const sisa = isPermanent ? null : formatSisa(expiry);
  btn.textContent = sisa ? `▶ MAIN · ${sisa}` : '▶ MAIN SEKARANG';
  btn.style.background='linear-gradient(135deg,rgba(52,211,153,0.2),rgba(56,189,248,0.15))';
  btn.style.borderColor='rgba(52,211,153,0.4)';
  btn.style.color='#34d399';
  btn.onclick=()=>bukaGame(slug, btn.closest('.game-card').querySelector('.card-name').textContent);
}

async function checkAllAccess(games){
  for(const g of games){
    try{
      const info=await gameAccessContract.getAccessInfo(userAddress,g.slug);
      if(info[0]) setBtnAktif(g.slug, info[1]);
    }catch(e){}
  }
}

function handleClick(slug, name){
  if(!walletReady){
    connectWallet().then(ok=>{
      if(ok) showModal(slug, name).catch(e=>showToast('❌ '+(e.message||'Error')));
    }).catch(e=>showToast('❌ '+(e.message||'Gagal connect')));
    return;
  }
  showModal(slug, name).catch(e=>showToast('❌ '+(e.message||'Error')));
}

async function showModal(slug, name){
  try{
    const active = await gameAccessContract.hasActiveAccess(userAddress, slug);
    if(active){ bukaGame(slug, name); return; }
  }catch(e){}

  const vaultBal = await getVaultBalance();
  const price = currentPriceINDC;
  pendingSlug = slug;
  pendingName = name;

  document.getElementById('payTitle').textContent = name;
  document.getElementById('payPriceVal').textContent = price+' INDC';
  document.getElementById('payVaultBal').textContent = vaultBal.toFixed(2)+' INDC';

  const btn = document.getElementById('payBtn');
  const note = document.getElementById('payNote');

  if(vaultBal < price){
    btn.textContent = 'SALDO KURANG — TOPUP DULU';
    btn.onclick = ()=>{ window.location.href='assets.html'; };
    note.innerHTML = `⚠️ Saldo vault <b style="color:#f87171">${vaultBal.toFixed(2)} INDC</b><br>Butuh ${price} INDC. Topup dulu di Assets.`;
  } else {
    btn.textContent = `BAYAR ${price} INDC & MAIN`;
    btn.onclick = doPayment;
    note.innerHTML = `• Bayar sekali, akses 24 jam<br>• Dipotong dari wallet vault<br>• Saldo vault: <b style="color:var(--gold)">${vaultBal.toFixed(2)} INDC</b>`;
  }
  document.getElementById('payModal').classList.add('open');
}

async function doPayment(){
  const btn = document.getElementById('payBtn');
  btn.textContent = '⏳ Proses...';
  btn.onclick = null;
  try{
    showToast('⏳ Konfirmasi di wallet...');
    const tx = await gameAccessContract.buyAccess(pendingSlug);
    showToast('⏳ Menunggu blockchain...');
    await tx.wait();

    // Auto deposit 5 INDC ke GameSavings
    try{
      showToast('⏳ Menyimpan ke tabungan...');
      // Cek allowance dulu
      const allowance = await indcContract.allowance(userAddress, SAVINGS_CA);
      if(BigInt(allowance) < BigInt(DEPOSIT_AMOUNT)){
        const appTx = await indcContract.approve(SAVINGS_CA, "999999999999999999");
        await appTx.wait();
      }
      const depTx = await savingsContract.deposit(userAddress, DEPOSIT_AMOUNT);
      await depTx.wait();
      showToast('✅ Akses aktif + 5 INDC masuk tabungan!');
    }catch(e){
      // Deposit gagal tidak batalkan akses
      showToast('✅ Akses aktif 24 jam!');
    }

    closePayModal();
    tampilSplash(pendingSlug, pendingName);
  }catch(e){
    showToast('❌ '+(e.reason||e.message||'Gagal'));
    btn.textContent=`BAYAR ${currentPriceINDC} INDC & MAIN`;
    btn.onclick=doPayment;
  }
}

function bukaGame(slug, name){
  const existing = document.getElementById('gameFrame');
  if(existing) existing.remove();

  const overlay = document.createElement('div');
  overlay.id = 'gameFrame';
  overlay.style.cssText = 'position:fixed;inset:0;z-index:9999;background:#000;';

  // Tombol tutup kecil di pojok kanan atas
  const closeBtn = document.createElement('div');
  closeBtn.textContent = '✕';
  closeBtn.style.cssText = 'position:absolute;top:8px;right:8px;z-index:10000;' +
    'width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,0.6);' +
    'color:#fff;font-size:14px;display:flex;align-items:center;justify-content:center;' +
    'cursor:pointer;border:1px solid rgba(255,255,255,0.2);';
  closeBtn.onclick = () => {
    overlay.remove();
    if(document.exitFullscreen) document.exitFullscreen().catch(()=>{});
  };

  const iframe = document.createElement('iframe');
  iframe.src = `https://www.madkidgames.com/full/${slug}`;
  iframe.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;border:none;';
  iframe.setAttribute('allowfullscreen', '');
  iframe.setAttribute('allow', 'fullscreen;gamepad');

  overlay.appendChild(iframe);
  overlay.appendChild(closeBtn);
  document.body.appendChild(overlay);

  // Request fullscreen
  overlay.requestFullscreen && overlay.requestFullscreen().catch(()=>{});
}

  clearTimeout(t._t);
  t._t=setTimeout(()=>t.style.display='none',3000);
}

  filterGames();
});
