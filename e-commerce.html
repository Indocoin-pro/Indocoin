<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INDOCOIN — E-Commerce</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
<style>
:root{
  --gold:#facc15;--gold2:#fbbf24;--gold3:#f59e0b;
  --dark:#0a0f1e;--dark2:#0f172a;--dark3:#1e293b;--dark4:#162032;
  --text:#e2e8f0;--muted:#64748b;--green:#22c55e;--blue:#3b82f6;--red:#ef4444;--orange:#f97316;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--dark);color:var(--text);font-family:'Rajdhani',sans-serif;min-height:100vh;padding-bottom:80px;}
@keyframes goldShimmer{0%{background-position:0% center}100%{background-position:300% center}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

.topnav{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:rgba(10,15,30,0.97);backdrop-filter:blur(16px);border-bottom:2px solid rgba(255,255,255,0.12);position:sticky;top:0;z-index:100;}
.nav-brand-main{font-family:'Orbitron',sans-serif;font-size:13px;font-weight:900;background:linear-gradient(90deg,#f59e0b,#facc15,#fef08a,#facc15,#f59e0b);background-size:300% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:goldShimmer 3s linear infinite;letter-spacing:2px;}
.nav-brand-sub{font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--orange);letter-spacing:2px;}
.cart-btn{position:relative;background:var(--dark3);border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:8px 12px;color:var(--text);font-size:16px;cursor:pointer;}
.cart-count{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;font-size:10px;font-weight:700;border-radius:50%;width:17px;height:17px;display:flex;align-items:center;justify-content:center;}

.container{max-width:820px;margin:0 auto;padding:14px;}

.paste-box{background:var(--dark2);border:1px solid rgba(250,204,21,0.25);border-radius:14px;padding:14px;margin-bottom:16px;}
.paste-box label{font-size:12px;color:var(--gold);font-weight:600;margin-bottom:6px;display:block;}
.paste-row{display:flex;gap:8px;}
.paste-row input{flex:1;padding:11px 12px;border-radius:9px;border:1px solid rgba(255,255,255,0.12);background:var(--dark3);color:var(--text);font-size:13px;}
.btn-cari{padding:11px 16px;border-radius:9px;border:none;background:linear-gradient(90deg,var(--gold3),var(--gold));color:#0a0f1e;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap;}
.paste-hint{font-size:10px;color:var(--muted);margin-top:6px;}

.section-title{font-family:'Orbitron',sans-serif;font-size:13px;color:var(--gold);margin:20px 0 10px;letter-spacing:1px;}

.kategori-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:10px;}
.kategori-chip{flex-shrink:0;padding:7px 14px;border-radius:20px;background:var(--dark3);border:1px solid rgba(255,255,255,0.08);font-size:12px;cursor:pointer;color:var(--muted);white-space:nowrap;}
.kategori-chip.active{background:linear-gradient(90deg,var(--gold3),var(--gold));color:#0a0f1e;border-color:transparent;}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.produk-card{background:var(--dark2);border:1px solid rgba(255,255,255,0.08);border-radius:12px;overflow:hidden;cursor:pointer;animation:fadeUp 0.3s ease;}
.produk-thumb{width:100%;aspect-ratio:1;object-fit:cover;background:var(--dark3);}
.produk-body{padding:8px 10px;}
.produk-nama{font-size:12px;font-weight:600;line-height:1.3;max-height:2.6em;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.produk-badge{display:inline-block;font-size:9px;padding:2px 6px;border-radius:6px;background:rgba(255,255,255,0.06);color:var(--muted);margin-top:4px;}
.produk-harga{font-size:13px;color:var(--gold);font-weight:700;margin-top:4px;}

.empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:13px;}

.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:200;align-items:flex-end;justify-content:center;}
.modal-overlay.show{display:flex;}
.modal-sheet{background:var(--dark2);border-radius:20px 20px 0 0;max-width:820px;width:100%;max-height:90vh;overflow-y:auto;padding:18px;animation:fadeUp 0.25s ease;}
.modal-close{float:right;background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;}
.modal-foto{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;background:var(--dark3);margin-bottom:12px;}
.modal-nama{font-size:16px;font-weight:700;margin-bottom:4px;}
.modal-toko{font-size:12px;color:var(--muted);margin-bottom:10px;}
.modal-desc{font-size:12px;color:var(--text);line-height:1.5;max-height:6em;overflow-y:auto;background:var(--dark3);padding:10px;border-radius:10px;margin-bottom:12px;}
.price-box{background:var(--dark3);border-radius:12px;padding:12px;margin-bottom:14px;}
.price-row{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;}
.price-row.total{border-top:1px dashed rgba(255,255,255,0.15);margin-top:6px;padding-top:8px;font-weight:700;color:var(--gold);font-size:14px;}
.btn-full{width:100%;padding:13px;border-radius:12px;border:none;font-weight:700;font-size:14px;cursor:pointer;margin-top:6px;}
.btn-keranjang{background:var(--dark4);color:var(--gold);border:1px solid var(--gold);}
.btn-gagal-fetch{background:rgba(239,68,68,0.1);color:var(--red);border:1px solid var(--red);padding:12px;border-radius:10px;font-size:12px;text-align:center;}

.keranjang-item{display:flex;gap:10px;align-items:center;background:var(--dark3);border-radius:10px;padding:8px;margin-bottom:8px;}
.keranjang-thumb{width:48px;height:48px;border-radius:8px;object-fit:cover;flex-shrink:0;background:var(--dark4);}
.keranjang-info{flex:1;min-width:0;}
.keranjang-nama{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.keranjang-harga{font-size:11px;color:var(--gold);}
.btn-hapus-item{background:none;border:none;color:var(--red);font-size:16px;cursor:pointer;padding:4px 8px;}

.form-group{margin-bottom:10px;}
.form-group label{font-size:11px;color:var(--muted);display:block;margin-bottom:4px;}
.form-group input,.form-group textarea{width:100%;padding:10px;border-radius:8px;border:1px solid rgba(255,255,255,0.12);background:var(--dark3);color:var(--text);font-size:13px;}

.metode-row{display:flex;gap:8px;margin:10px 0;}
.metode-chip{flex:1;text-align:center;padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,0.1);background:var(--dark3);font-size:12px;font-weight:600;cursor:pointer;color:var(--muted);}
.metode-chip.active{border-color:var(--gold);color:var(--gold);background:rgba(250,204,21,0.08);}

.status-msg{text-align:center;font-size:12px;color:var(--gold3);margin-top:10px;min-height:16px;}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--dark3);border:1px solid rgba(255,255,255,0.15);border-radius:10px;padding:10px 18px;font-size:12px;z-index:999;display:none;}

.link-riwayat{display:block;text-align:center;margin-top:20px;font-size:12px;color:var(--muted);text-decoration:none;}
</style>
</head>
<body>

<div class="topnav">
  <div>
    <div class="nav-brand-main">INDOCOIN</div>
    <div class="nav-brand-sub">E-COMMERCE</div>
  </div>
  <div style="display:flex;gap:8px;align-items:center;">
    <button class="cart-btn" style="font-size:11px;padding:8px 10px;" onclick="window.location.href='ecommerce-riwayat.html'">🕐 Riwayat</button>
    <button id="btnAdminEcommerce" class="cart-btn" style="display:none;font-size:11px;padding:8px 10px;border-color:rgba(34,197,94,0.4);color:var(--green);" onclick="window.location.href='ecommerce-admin.html'">📝 Admin</button>
    <button class="cart-btn" onclick="bukaKeranjang()">🛒<span id="cartCount" class="cart-count" style="display:none">0</span></button>
  </div>
</div>

<div class="container">

  <div class="paste-box">
    <label>📎 Tempel Link Produk (Shopee/Tokopedia)</label>
    <div class="paste-row">
      <input id="inputLink" placeholder="https://shopee.co.id/...">
      <button class="btn-cari" onclick="cariProduk()">Cari</button>
    </div>
    <div class="paste-hint">Cari & beli produk apa pun dari Shopee/Tokopedia, bayar pakai USDT/INDC</div>
  </div>

  <div class="section-title">🛍️ Katalog Unggulan</div>
  <div class="kategori-scroll" id="kategoriScroll"></div>
  <div class="grid" id="katalogGrid"></div>

  <a class="link-riwayat" href="ecommerce-riwayat.html">📦 Lihat Riwayat Pesanan Saya</a>
</div>

<div class="modal-overlay" id="modalDetail">
  <div class="modal-sheet">
    <button class="modal-close" onclick="tutupModal()">✕</button>
    <div id="modalContent"></div>
  </div>
</div>

<div class="modal-overlay" id="modalKeranjang">
  <div class="modal-sheet">
    <button class="modal-close" onclick="tutupKeranjang()">✕</button>
    <div id="keranjangContent"></div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
const API_BASE = 'https://ecommerce-api.indocoin.id/api';

const SC = {
  ECOMMERCE_GATEWAY: '0xD60A746f440CE4424634b76e68349e7d6B7bB739',
  USDT: '0x55d398326f99059fF775485246999027B3197955',
  INDC: '0xD772c96e1beFd2ea9C9a83182c71f4d32f306571',
  CHAIN_ID: 56,
  DEV_WALLET: '0xa16E9579E19eB19e6E24B211121BdCD7996809Cc',
};

const GATEWAY_ABI = [
  'function payWithUSDT(bytes32 orderId, bytes32 orderRef, uint256 modalUsdt, uint256 profitUsdt, uint256 expiry, bytes calldata signature) external',
  'function payWithPlatformINDC(bytes32 orderId, bytes32 orderRef, uint256 indcAmount, uint256 modalUsdtEquivalent, uint256 profitUsdtEquivalent, uint256 expiry, bytes calldata signature) external',
];
const ERC20_ABI = [
  'function approve(address spender, uint256 amount) external returns (bool)',
  'function allowance(address owner, address spender) external view returns (uint256)',
];

function cekTombolAdmin(){
  const btn = document.getElementById('btnAdminEcommerce');
  if(!btn) return;
  const isDev = _wallet && _wallet.toLowerCase() === SC.DEV_WALLET.toLowerCase();
  btn.style.display = isDev ? 'inline-block' : 'none';
}

let _wallet = null, _provider = null, _signer = null;
let _keranjang = [];
let _metodeBayar = 'usdt';

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(()=>t.style.display='none', 3000);
}

async function connectWalletJikaBelum(){
  if(_wallet) return _wallet;
  if(!window.ethereum){ toast('Wallet browser tidak terdeteksi'); return null; }
  const accounts = await window.ethereum.request({method:'eth_requestAccounts'});
  _wallet = accounts[0];
  _provider = new ethers.providers.Web3Provider(window.ethereum);
  _signer = _provider.getSigner();
  cekTombolAdmin();
  return _wallet;
}

// Auto-cek kalau wallet sudah terhubung sebelumnya (tab lain / kunjungan sebelumnya),
// biar tombol Admin langsung muncul tanpa perlu klik connect dulu.
if(window.ethereum && window.ethereum.selectedAddress){
  _wallet = window.ethereum.selectedAddress;
  _provider = new ethers.providers.Web3Provider(window.ethereum);
  _signer = _provider.getSigner();
  cekTombolAdmin();
}

let _kategoriAktif = null;

async function muatKatalog(){
  try{
    const res = await fetch(`${API_BASE}/katalog${_kategoriAktif ? '?kategori='+encodeURIComponent(_kategoriAktif) : ''}`);
    const list = await res.json();
    const grid = document.getElementById('katalogGrid');
    if(!list.length){ grid.innerHTML = '<div class="empty" style="grid-column:1/-1">Katalog masih kosong, coba tempel link produk di atas</div>'; return; }

    grid.innerHTML = list.map((p) => {
      const foto = (p.foto_url && p.foto_url[0]) || '';
      return `
      <div class="produk-card" onclick='tampilkanDetail(${JSON.stringify(p.link_produk)})'>
        ${foto ? `<img class="produk-thumb" src="${foto}">` : '<div class="produk-thumb"></div>'}
        <div class="produk-body">
          <div class="produk-nama">${p.nama_produk || 'Produk'}</div>
          <div class="produk-badge">${p.platform || ''}</div>
          <div class="produk-harga">Rp${Number(p.harga_modal||0).toLocaleString('id-ID')}</div>
        </div>
      </div>`;
    }).join('');

    const kategoriSet = [...new Set(list.map(p=>p.kategori).filter(Boolean))];
    const scroll = document.getElementById('kategoriScroll');
    scroll.innerHTML = ['Semua', ...kategoriSet].map(k =>
      `<div class="kategori-chip ${(_kategoriAktif===k || (k==='Semua' && !_kategoriAktif)) ? 'active':''}" onclick="pilihKategori(${k==='Semua'?'null':JSON.stringify(k)})">${k}</div>`
    ).join('');
  }catch(err){
    document.getElementById('katalogGrid').innerHTML = `<div class="empty" style="grid-column:1/-1">Gagal memuat katalog</div>`;
  }
}

function pilihKategori(k){ _kategoriAktif = k; muatKatalog(); }

async function cariProduk(){
  const link = document.getElementById('inputLink').value.trim();
  if(!link){ toast('Tempel link produk dulu'); return; }
  await tampilkanDetail(link);
}

async function tampilkanDetail(link){
  document.getElementById('modalContent').innerHTML = '<div class="empty">Mengambil data produk...</div>';
  document.getElementById('modalDetail').classList.add('show');

  try{
    const res = await fetch(`${API_BASE}/quote`, {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ link })
    });
    const data = await res.json();

    if(!data.berhasil){
      document.getElementById('modalContent').innerHTML = `
        <div class="btn-gagal-fetch">
          ⚠️ ${data.alasan || 'Tidak bisa ambil data produk otomatis saat ini.'}<br>
          <span style="font-size:11px">Order tetap bisa lanjut, admin akan cek manual.</span>
        </div>`;
      return;
    }

    const p = data.produk;
    const foto = (p.fotoUrl && p.fotoUrl[0]) || '';

    document.getElementById('modalContent').innerHTML = `
      ${foto ? `<img class="modal-foto" src="${foto}">` : ''}
      <div class="modal-nama">${p.namaProduk || 'Produk'}</div>
      <div class="modal-toko">🏪 ${p.namaToko || '-'} ${p.lokasiToko ? '· '+p.lokasiToko : ''} ${p.rating ? '· ⭐'+p.rating : ''}</div>
      ${p.deskripsi ? `<div class="modal-desc">${p.deskripsi}</div>` : ''}
      <div class="price-box">
        <div class="price-row"><span>Harga Produk + Ongkir</span><span>Rp${data.hargaModal.toLocaleString('id-ID')}</span></div>
        <div class="price-row"><span>Biaya Admin</span><span>Rp${data.fee.toLocaleString('id-ID')}</span></div>
        <div class="price-row total"><span>Total</span><span>Rp${data.hargaTotal.toLocaleString('id-ID')}</span></div>
      </div>
      <button class="btn-full btn-keranjang" onclick='tambahKeKeranjang(${JSON.stringify({
        link, namaProduk: p.namaProduk, fotoUrl: p.fotoUrl,
        hargaModal: data.hargaModal, fee: data.fee, hargaTotal: data.hargaTotal,
      })})'>+ Tambah ke Keranjang</button>
    `;
  }catch(err){
    document.getElementById('modalContent').innerHTML = `<div class="btn-gagal-fetch">Gagal memproses: ${err.message}</div>`;
  }
}

function tutupModal(){ document.getElementById('modalDetail').classList.remove('show'); }

function tambahKeKeranjang(item){
  if(_keranjang.some(it => it.link === item.link)){ toast('Produk ini sudah ada di keranjang'); return; }
  _keranjang.push(item);
  updateCartBadge();
  tutupModal();
  toast('Ditambahkan ke keranjang');
}

function hapusDariKeranjang(link){
  _keranjang = _keranjang.filter(it => it.link !== link);
  updateCartBadge();
  renderKeranjang();
}

function updateCartBadge(){
  const badge = document.getElementById('cartCount');
  if(_keranjang.length){ badge.style.display='flex'; badge.textContent = _keranjang.length; }
  else { badge.style.display='none'; }
}

function bukaKeranjang(){
  document.getElementById('modalKeranjang').classList.add('show');
  renderKeranjang();
}
function tutupKeranjang(){ document.getElementById('modalKeranjang').classList.remove('show'); }

function renderKeranjang(){
  const el = document.getElementById('keranjangContent');
  if(!_keranjang.length){
    el.innerHTML = '<div class="empty">Keranjang masih kosong</div>';
    return;
  }

  const totalModal = _keranjang.reduce((s,it)=>s+it.hargaModal,0);
  const totalFee = _keranjang.reduce((s,it)=>s+it.fee,0);
  const totalHarga = totalModal + totalFee;

  el.innerHTML = `
    <div class="section-title" style="margin-top:0">🛒 Keranjang (${_keranjang.length} produk)</div>
    ${_keranjang.map(it => `
      <div class="keranjang-item">
        ${(it.fotoUrl&&it.fotoUrl[0]) ? `<img class="keranjang-thumb" src="${it.fotoUrl[0]}">` : '<div class="keranjang-thumb"></div>'}
        <div class="keranjang-info">
          <div class="keranjang-nama">${it.namaProduk||'Produk'}</div>
          <div class="keranjang-harga">Rp${it.hargaTotal.toLocaleString('id-ID')}</div>
        </div>
        <button class="btn-hapus-item" onclick='hapusDariKeranjang(${JSON.stringify(it.link)})'>🗑</button>
      </div>
    `).join('')}

    <div class="price-box">
      <div class="price-row"><span>Subtotal Produk+Ongkir</span><span>Rp${totalModal.toLocaleString('id-ID')}</span></div>
      <div class="price-row"><span>Total Biaya Admin</span><span>Rp${totalFee.toLocaleString('id-ID')}</span></div>
      <div class="price-row total"><span>Total Bayar</span><span>Rp${totalHarga.toLocaleString('id-ID')}</span></div>
    </div>

    <div class="section-title">📍 Alamat Pengiriman</div>
    <div class="form-group"><label>Nama Penerima</label><input id="alamatNama"></div>
    <div class="form-group"><label>No. Telepon</label><input id="alamatTelp"></div>
    <div class="form-group"><label>Alamat Lengkap (jalan, kecamatan, kota, kode pos)</label><textarea id="alamatLengkap" rows="3"></textarea></div>

    <div class="section-title">💳 Metode Bayar</div>
    <div class="metode-row">
      <div class="metode-chip ${_metodeBayar==='usdt'?'active':''}" onclick="pilihMetode('usdt')">USDT</div>
      <div class="metode-chip ${_metodeBayar==='indc'?'active':''}" onclick="pilihMetode('indc')">INDC (Saldo Reward)</div>
    </div>

    <button class="btn-full btn-cari" onclick="checkout()">🔒 Bayar Sekarang</button>
    <div class="status-msg" id="checkoutStatus"></div>
  `;
}

function pilihMetode(m){ _metodeBayar = m; renderKeranjang(); }

function generateOrderId(){
  return ethers.utils.hexlify(ethers.utils.randomBytes(32));
}

async function checkout(){
  const nama = document.getElementById('alamatNama').value.trim();
  const telp = document.getElementById('alamatTelp').value.trim();
  const alamatLengkap = document.getElementById('alamatLengkap').value.trim();
  const statusEl = document.getElementById('checkoutStatus');

  if(!nama || !telp || !alamatLengkap){ toast('Lengkapi alamat pengiriman dulu'); return; }
  if(!_keranjang.length){ toast('Keranjang kosong'); return; }

  const wallet = await connectWalletJikaBelum();
  if(!wallet) return;

  const chainHex = await window.ethereum.request({method:'eth_chainId'});
  if(parseInt(chainHex,16) !== SC.CHAIN_ID){ toast('Silakan pindah ke jaringan BSC Mainnet'); return; }

  try{
    const orderId = generateOrderId();

    statusEl.textContent = 'Mendaftarkan pesanan...';
    const regRes = await fetch(`${API_BASE}/orders/register`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        orderId, userWallet: wallet,
        items: _keranjang.map(it => ({ link: it.link, hargaModal: it.hargaModal, fee: it.fee })),
        alamatPenerima: { nama, telepon: telp, alamatLengkap },
        sumber: 'paste_link',
      })
    });
    const reg = await regRes.json();
    if(!reg.sukses) throw new Error(reg.error || 'Gagal mendaftarkan pesanan');

    const gateway = new ethers.Contract(SC.ECOMMERCE_GATEWAY, GATEWAY_ABI, _signer);

    if(_metodeBayar === 'usdt'){
      const totalUsdt = ethers.BigNumber.from(reg.modalUsdt).add(reg.profitUsdt);
      const usdtContract = new ethers.Contract(SC.USDT, ERC20_ABI, _signer);
      const allowance = await usdtContract.allowance(wallet, SC.ECOMMERCE_GATEWAY);

      if(allowance.lt(totalUsdt)){
        statusEl.textContent = 'Approve USDT di wallet (sekali saja)...';
        const txApprove = await usdtContract.approve(SC.ECOMMERCE_GATEWAY, ethers.constants.MaxUint256);
        await txApprove.wait();
      }

      statusEl.textContent = 'Konfirmasi pembayaran di wallet...';
      const tx = await gateway.payWithUSDT(orderId, reg.orderRef, reg.modalUsdt, reg.profitUsdt, reg.expiry, reg.signature);
      statusEl.textContent = 'Menunggu konfirmasi blockchain...';
      await tx.wait();
    } else {
      if(!reg.indcAmount) throw new Error('Metode INDC belum didukung penuh di server saat ini — coba pakai USDT dulu');
      statusEl.textContent = 'Konfirmasi pembayaran di wallet...';
      const tx = await gateway.payWithPlatformINDC(orderId, reg.orderRef, reg.indcAmount, reg.modalUsdt, reg.profitUsdt, reg.expiry, reg.signature);
      statusEl.textContent = 'Menunggu konfirmasi blockchain...';
      await tx.wait();
    }

    statusEl.textContent = '✅ Pembayaran berhasil! Menunggu admin memproses pesanan.';
    toast('Order berhasil dibuat!');
    _keranjang = [];
    updateCartBadge();
    setTimeout(()=>{ window.location.href = 'ecommerce-riwayat.html'; }, 1500);

  }catch(err){
    statusEl.textContent = '';
    toast('Gagal checkout: ' + (err.reason || err.message));
  }
}

muatKatalog();
</script>

</body>
</html>
