<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sanjaya — Founder & CVO INDOCOIN</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --gold: #C9A84C;
  --gold-light: #E8C97A;
  --dark: #050A14;
  --dark2: #0A1628;
  --dark3: #0F1F3D;
  --blue: #1A3A6B;
  --text: #E8EDF5;
  --text-dim: #8A9AB8;
  --typing-bg: #0D1A30;
}

* { margin:0; padding:0; box-sizing:border-box; }

html, body {
  height: 100%;
  background: var(--dark);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  overflow: hidden;
}

/* ── LAYOUT ── */
.page {
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
}

/* ── SANJAYA PANEL (1/3 atas) ── */
.sanjaya-panel {
  flex: 0 0 38%;
  position: relative;
  overflow: hidden;
  background: linear-gradient(180deg, #020810 0%, var(--dark2) 100%);
  border-bottom: 1px solid rgba(201,168,76,0.2);
}

/* Background glow */
.sanjaya-panel::before {
  content: '';
  position: absolute;
  bottom: -40px; left: 50%; transform: translateX(-50%);
  width: 300px; height: 150px;
  background: radial-gradient(ellipse, rgba(201,168,76,0.12) 0%, transparent 70%);
  pointer-events: none;
}

/* Foto Sanjaya */
.sanjaya-photo-wrap {
  position: absolute;
  bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; height: 100%;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}

.sanjaya-photo {
  height: 100%;
  width: auto;
  max-width: 100%;
  object-fit: cover;
  object-position: top center;
  display: block;
  transition: opacity 0.4s ease;
  position: absolute;
  bottom: 0; left: 50%; transform: translateX(-50%);
}

.sanjaya-photo.hidden { opacity: 0; pointer-events: none; }
.sanjaya-photo.visible { opacity: 1; }

/* Animasi napas saat idle */
@keyframes breathe {
  0%, 100% { transform: translateX(-50%) scale(1); }
  50% { transform: translateX(-50%) scale(1.008); }
}
.sanjaya-photo.state-idle {
  animation: breathe 4s ease-in-out infinite;
}

/* Animasi typing — sedikit condong */
@keyframes typing-lean {
  0%, 100% { transform: translateX(-50%) translateY(0px); }
  50% { transform: translateX(-50%) translateY(3px); }
}
.sanjaya-photo.state-typing {
  animation: typing-lean 0.8s ease-in-out infinite;
}

/* Info bar */
.sanjaya-info {
  position: absolute;
  top: 12px; left: 0; right: 0;
  text-align: center;
  z-index: 10;
}
.sanjaya-name {
  font-family: 'Orbitron', sans-serif;
  font-size: 15px;
  font-weight: 700;
  color: var(--gold);
  letter-spacing: 2px;
  text-shadow: 0 0 20px rgba(201,168,76,0.5);
}
.sanjaya-title {
  font-size: 10px;
  color: var(--text-dim);
  letter-spacing: 1.5px;
  margin-top: 2px;
}

/* Status indicator */
.sanjaya-status {
  position: absolute;
  bottom: 10px; left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: 6px;
  background: rgba(5,10,20,0.7);
  padding: 4px 12px;
  border-radius: 20px;
  border: 1px solid rgba(201,168,76,0.2);
  font-size: 10px;
  color: var(--text-dim);
  z-index: 10;
  backdrop-filter: blur(8px);
  transition: all 0.3s ease;
}
.status-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: #4CAF50;
  animation: pulse-dot 2s ease-in-out infinite;
}
@keyframes pulse-dot {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(0.8); }
}
.sanjaya-status.typing .status-dot {
  background: var(--gold);
  animation: pulse-fast 0.5s ease-in-out infinite;
}
@keyframes pulse-fast {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

/* Laptop glow effect saat typing */
.laptop-glow {
  position: absolute;
  bottom: 0; left: 50%; transform: translateX(-50%);
  width: 60%; height: 30%;
  background: radial-gradient(ellipse at center bottom, rgba(100,180,255,0.15) 0%, transparent 70%);
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.5s ease;
  z-index: 5;
}
.laptop-glow.active { opacity: 1; }

/* ── CHAT PANEL (2/3 bawah) ── */
.chat-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: var(--dark2);
  overflow: hidden;
}

/* Messages */
.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  scroll-behavior: smooth;
}
.chat-messages::-webkit-scrollbar { width: 3px; }
.chat-messages::-webkit-scrollbar-track { background: transparent; }
.chat-messages::-webkit-scrollbar-thumb { background: rgba(201,168,76,0.3); border-radius: 2px; }

/* Bubble */
.bubble {
  max-width: 88%;
  padding: 10px 14px;
  border-radius: 14px;
  font-size: 13.5px;
  line-height: 1.55;
  animation: bubble-in 0.3s ease;
}
@keyframes bubble-in {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
.bubble.sanjaya {
  align-self: flex-start;
  background: var(--dark3);
  border: 1px solid rgba(201,168,76,0.15);
  border-bottom-left-radius: 4px;
  color: var(--text);
}
.bubble.sanjaya .bubble-sender {
  font-size: 10px;
  color: var(--gold);
  font-weight: 600;
  letter-spacing: 0.5px;
  margin-bottom: 4px;
}
.bubble.user {
  align-self: flex-end;
  background: linear-gradient(135deg, #1A3A6B, #0F2448);
  border: 1px solid rgba(100,150,255,0.2);
  border-bottom-right-radius: 4px;
  color: var(--text);
}

/* Typing indicator */
.typing-indicator {
  align-self: flex-start;
  background: var(--dark3);
  border: 1px solid rgba(201,168,76,0.15);
  border-radius: 14px;
  border-bottom-left-radius: 4px;
  padding: 10px 16px;
  display: none;
  gap: 5px;
  align-items: center;
}
.typing-indicator.show {
  display: flex;
}
.typing-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--gold);
  animation: typing-dots 1.2s ease-in-out infinite;
}
.typing-dot:nth-child(2) { animation-delay: 0.2s; }
.typing-dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes typing-dots {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
  30% { transform: translateY(-6px); opacity: 1; }
}

/* Input area */
.chat-input-wrap {
  padding: 10px 12px;
  background: var(--dark);
  border-top: 1px solid rgba(201,168,76,0.1);
  display: flex;
  gap: 8px;
  align-items: flex-end;
}
.chat-input {
  flex: 1;
  background: var(--dark3);
  border: 1px solid rgba(201,168,76,0.2);
  border-radius: 20px;
  padding: 10px 16px;
  color: var(--text);
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  outline: none;
  resize: none;
  max-height: 80px;
  min-height: 40px;
  line-height: 1.4;
  transition: border-color 0.2s;
}
.chat-input:focus {
  border-color: rgba(201,168,76,0.5);
}
.chat-input::placeholder { color: var(--text-dim); }

.btn-send {
  width: 40px; height: 40px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--gold), #A07830);
  border: none;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: transform 0.15s, opacity 0.15s;
}
.btn-send:active { transform: scale(0.92); }
.btn-send:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-send svg { width: 18px; height: 18px; fill: #050A14; }

/* Step progress */
.step-bar {
  padding: 8px 16px;
  background: rgba(5,10,20,0.6);
  border-bottom: 1px solid rgba(201,168,76,0.08);
  display: flex;
  gap: 4px;
  align-items: center;
  overflow-x: auto;
}
.step-bar::-webkit-scrollbar { display: none; }
.step-item {
  display: flex; align-items: center; gap: 4px;
  flex-shrink: 0;
}
.step-dot {
  width: 20px; height: 20px;
  border-radius: 50%;
  background: rgba(201,168,76,0.1);
  border: 1px solid rgba(201,168,76,0.2);
  display: flex; align-items: center; justify-content: center;
  font-size: 8px;
  color: var(--text-dim);
  transition: all 0.3s;
}
.step-dot.active {
  background: var(--gold);
  color: var(--dark);
  border-color: var(--gold);
  font-weight: 700;
}
.step-dot.done {
  background: rgba(76,175,80,0.2);
  border-color: #4CAF50;
  color: #4CAF50;
}
.step-line {
  width: 12px; height: 1px;
  background: rgba(201,168,76,0.2);
  flex-shrink: 0;
}
.step-label {
  font-size: 8px;
  color: var(--text-dim);
  margin-left: 2px;
  white-space: nowrap;
}
</style>
</head>
<body>

<div class="page">

  <!-- SANJAYA PANEL -->
  <div class="sanjaya-panel">
    <div class="sanjaya-info">
      <div class="sanjaya-name">SANJAYA</div>
      <div class="sanjaya-title">FOUNDER & CHIEF VISIONARY OFFICER · INDOCOIN</div>
    </div>

    <div class="sanjaya-photo-wrap">
      <!-- Foto idle (normal) -->
      <img id="photoIdle"
           src="sanjaya-idle.png"
           class="sanjaya-photo visible state-idle"
           alt="Sanjaya">
      <!-- Foto typing -->
      <img id="photoTyping"
           src="sanjaya-typing.png"
           class="sanjaya-photo hidden"
           alt="Sanjaya mengetik">
      <!-- Foto smile -->
      <img id="photoSmile"
           src="sanjaya-smile.png"
           class="sanjaya-photo hidden"
           alt="Sanjaya senyum">
    </div>

    <div class="laptop-glow" id="laptopGlow"></div>

    <div class="sanjaya-status" id="sanjayaStatus">
      <div class="status-dot"></div>
      <span id="statusText">Online</span>
    </div>
  </div>

  <!-- CHAT PANEL -->
  <div class="chat-panel">

    <!-- Step progress bar -->
    <div class="step-bar" id="stepBar">
      <div class="step-item">
        <div class="step-dot active" id="step1">1</div>
        <div class="step-label">Sambutan</div>
      </div>
      <div class="step-line"></div>
      <div class="step-item">
        <div class="step-dot" id="step2">2</div>
        <div class="step-label">Wallet</div>
      </div>
      <div class="step-line"></div>
      <div class="step-item">
        <div class="step-dot" id="step3">3</div>
        <div class="step-label">Exchange</div>
      </div>
      <div class="step-line"></div>
      <div class="step-item">
        <div class="step-dot" id="step4">4</div>
        <div class="step-label">Beli USDT</div>
      </div>
      <div class="step-line"></div>
      <div class="step-item">
        <div class="step-dot" id="step5">5</div>
        <div class="step-label">Beli INDC</div>
      </div>
      <div class="step-line"></div>
      <div class="step-item">
        <div class="step-dot" id="step6">6</div>
        <div class="step-label">Staking</div>
      </div>
      <div class="step-line"></div>
      <div class="step-item">
        <div class="step-dot" id="step7">🎉</div>
        <div class="step-label">Selesai</div>
      </div>
    </div>

    <!-- Messages -->
    <div class="chat-messages" id="chatMessages">
      <div class="typing-indicator" id="typingIndicator">
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
      </div>
    </div>

    <!-- Input -->
    <div class="chat-input-wrap">
      <textarea
        class="chat-input"
        id="chatInput"
        placeholder="Ketik pesan..."
        rows="1"
        disabled></textarea>
      <button class="btn-send" id="btnSend" disabled>
        <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
      </button>
    </div>

  </div>
</div>

<script>
// ── State ──────────────────────────────────────────────────────────────
const WS_URL = 'wss://ws.indocoin.id';
let currentState = 'idle'; // idle | typing | smile
let smileTimer = null;
let currentStep = 1;
let userName = '';
let userGender = '';
let conversationHistory = [];
let isWaiting = false;

// Deteksi referral dari URL
const urlParams = new URLSearchParams(window.location.search);
const referralCode = urlParams.get('ref') || urlParams.get('referral') || '';

// ── Photo state ────────────────────────────────────────────────────────
function setState(state) {
  if (currentState === state) return;
  currentState = state;

  const idle = document.getElementById('photoIdle');
  const typing = document.getElementById('photoTyping');
  const smile = document.getElementById('photoSmile');
  const glow = document.getElementById('laptopGlow');
  const status = document.getElementById('sanjayaStatus');
  const statusText = document.getElementById('statusText');

  // Reset semua
  [idle, typing, smile].forEach(p => {
    p.classList.remove('visible','hidden','state-idle','state-typing');
    p.classList.add('hidden');
  });
  glow.classList.remove('active');
  status.classList.remove('typing');

  if (state === 'idle') {
    idle.classList.remove('hidden');
    idle.classList.add('visible','state-idle');
    statusText.textContent = 'Online';
  } else if (state === 'typing') {
    typing.classList.remove('hidden');
    typing.classList.add('visible','state-typing');
    glow.classList.add('active');
    status.classList.add('typing');
    statusText.textContent = 'Sedang mengetik...';
  } else if (state === 'smile') {
    smile.classList.remove('hidden');
    smile.classList.add('visible');
    statusText.textContent = 'Online';
    // Kembali ke idle setelah 2 detik
    if (smileTimer) clearTimeout(smileTimer);
    smileTimer = setTimeout(() => setState('idle'), 2000);
  }
}

// ── Chat helpers ───────────────────────────────────────────────────────
function addBubble(role, text) {
  const messages = document.getElementById('chatMessages');
  const indicator = document.getElementById('typingIndicator');

  const bubble = document.createElement('div');
  bubble.className = `bubble ${role}`;

  if (role === 'sanjaya') {
    bubble.innerHTML = `<div class="bubble-sender">Sanjaya</div><div>${formatText(text)}</div>`;
  } else {
    bubble.textContent = text;
  }

  messages.insertBefore(bubble, indicator);
  messages.scrollTop = messages.scrollHeight;
  return bubble;
}

function formatText(text) {
  return text
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.*?)\*/g, '<em>$1</em>')
    .replace(/`(.*?)`/g, '<code style="background:rgba(201,168,76,0.1);padding:1px 4px;border-radius:3px;font-size:12px;">$1</code>')
    .replace(/\n/g, '<br>');
}

function showTyping(show) {
  const ind = document.getElementById('typingIndicator');
  if (show) {
    ind.classList.add('show');
    setState('typing');
    document.getElementById('chatMessages').scrollTop = 999999;
  } else {
    ind.classList.remove('show');
  }
}

function setInputEnabled(enabled) {
  document.getElementById('chatInput').disabled = !enabled;
  document.getElementById('btnSend').disabled = !enabled;
}

// ── Step update ────────────────────────────────────────────────────────
function setStep(n) {
  currentStep = n;
  for (let i = 1; i <= 7; i++) {
    const el = document.getElementById(`step${i}`);
    if (!el) continue;
    el.classList.remove('active','done');
    if (i < n) el.classList.add('done');
    else if (i === n) el.classList.add('active');
  }
}

// ── Send message ───────────────────────────────────────────────────────
async function sendMessage(text) {
  if (!text.trim() || isWaiting) return;
  isWaiting = true;
  setInputEnabled(false);

  addBubble('user', text);
  conversationHistory.push({ role: 'user', content: text });

  // Clear input
  const input = document.getElementById('chatInput');
  input.value = '';
  input.style.height = 'auto';

  showTyping(true);

  try {
    const response = await fetch('https://ws.indocoin.id/ai-chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        messages: conversationHistory,
        userName,
        userGender,
        mode: 'onboarding',
        currentStep,
        referralCode,
      })
    });

    const data = await response.json();
    const reply = data.reply || data.content || 'Maaf, ada gangguan. Silakan coba lagi.';

    showTyping(false);
    setState('smile');
    addBubble('sanjaya', reply);
    conversationHistory.push({ role: 'assistant', content: reply });

    // Deteksi step dari jawaban
    detectStep(reply);

  } catch(e) {
    showTyping(false);
    setState('idle');
    addBubble('sanjaya', 'Maaf, koneksi bermasalah. Silakan coba lagi. 🙏');
  }

  isWaiting = false;
  setInputEnabled(true);
  setTimeout(() => document.getElementById('chatInput').focus(), 100);
}

// ── Deteksi step dari reply ────────────────────────────────────────────
function detectStep(text) {
  const t = text.toLowerCase();
  if (t.includes('wallet') || t.includes('metamask') || t.includes('tokenpocket')) setStep(2);
  if (t.includes('exchange') || t.includes('indodax') || t.includes('tokocrypto')) setStep(3);
  if (t.includes('beli usdt') || t.includes('rupiah') || t.includes('topup')) setStep(4);
  if (t.includes('beli indc') || t.includes('transfer usdt')) setStep(5);
  if (t.includes('staking') || t.includes('stake')) setStep(6);
  if (t.includes('selamat') && t.includes('berhasil')) setStep(7);
  if (t.includes('elara')) {
    setTimeout(() => {
      addBubble('sanjaya', '💫 Untuk pertanyaan lebih lanjut tentang fitur platform, Anda bisa chat dengan <strong>Elara</strong> — asisten resmi INDOCOIN. Ketuk tombol Elara di halaman utama ya!');
    }, 1500);
  }
}

// ── Init: sambutan otomatis ────────────────────────────────────────────
async function initChat() {
  // Tunda sebentar agar terasa natural
  await new Promise(r => setTimeout(r, 800));
  showTyping(true);
  await new Promise(r => setTimeout(r, 1800));
  showTyping(false);
  setState('smile');

  const greeting = referralCode
    ? `Selamat datang di INDOCOIN! 🎉\n\nSaya **Sanjaya**, Founder & Chief Visionary Officer INDOCOIN.\n\nSenang sekali Anda bergabung melalui komunitas kami. Saya akan pandu Anda langkah demi langkah — dari awal hingga sukses melakukan staking pertama Anda.\n\nBoleh saya tahu nama Anda?`
    : `Halo! Selamat datang di INDOCOIN! 🎉\n\nSaya **Sanjaya**, Founder & Chief Visionary Officer INDOCOIN.\n\nSaya di sini untuk memastikan perjalanan pertama Anda di dunia DeFi berjalan lancar dan menyenangkan.\n\nBoleh saya tahu nama Anda?`;

  addBubble('sanjaya', greeting);
  conversationHistory.push({ role: 'assistant', content: greeting });
  setInputEnabled(true);
  document.getElementById('chatInput').focus();
}

// ── Input handler ──────────────────────────────────────────────────────
const input = document.getElementById('chatInput');
const btnSend = document.getElementById('btnSend');

input.addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 80) + 'px';
});

input.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage(this.value.trim());
  }
});

btnSend.addEventListener('click', () => {
  sendMessage(input.value.trim());
});

// ── Start ──────────────────────────────────────────────────────────────
initChat();
</script>
</body>
</html>
