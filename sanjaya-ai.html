<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Sanjaya — INDOCOIN</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --gold: #C9A84C;
  --dark: #050A14;
  --dark2: #0A1628;
  --dark3: #0F1F3D;
  --text: #E8EDF5;
  --text-dim: #8A9AB8;
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; background:var(--dark); color:var(--text); font-family:'Inter',sans-serif; overflow:hidden; }

.page { display:flex; flex-direction:column; height:100vh; height:100dvh; }

/* ── FOTO PANEL ── */
.photo-panel {
  flex: 0 0 38%;
  position: relative;
  overflow: hidden;
  background: #020810;
}

/* Container 3 foto — crossfade */
.photo-stack {
  position: absolute;
  inset: 0;
}
.photo-stack img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: top center;
  opacity: 0;
  transition: opacity 0.6s ease;
}
.photo-stack img.active { opacity: 1; }

/* Animasi idle — napas halus */
@keyframes breathe {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.006); }
}
.photo-stack img#photoIdle.active {
  animation: breathe 4s ease-in-out infinite;
}

/* Animasi typing — gerak halus */
@keyframes typing-move {
  0%,100% { transform: scale(1) translateY(0); }
  25% { transform: scale(1.002) translateY(1px); }
  75% { transform: scale(1.002) translateY(-1px); }
}
.photo-stack img#photoTyping.active {
  animation: typing-move 0.7s ease-in-out infinite;
}

/* Glow laptop saat typing */
.laptop-glow {
  position: absolute;
  bottom: 0; left: 50%; transform: translateX(-50%);
  width: 70%; height: 35%;
  background: radial-gradient(ellipse at center bottom, rgba(80,160,255,0.18) 0%, transparent 70%);
  opacity: 0;
  transition: opacity 0.5s ease;
  pointer-events: none;
  z-index: 2;
}
.laptop-glow.on { opacity: 1; }

/* Status pill */
.status-pill {
  position: absolute;
  bottom: 10px; left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: 6px;
  background: rgba(5,10,20,0.75);
  padding: 4px 14px;
  border-radius: 20px;
  border: 1px solid rgba(201,168,76,0.2);
  font-size: 10px; color: var(--text-dim);
  z-index: 10;
  backdrop-filter: blur(8px);
  transition: all 0.3s;
  white-space: nowrap;
}
.status-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: #4CAF50;
  animation: blink 2s ease-in-out infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.4} }
.status-pill.typing .status-dot {
  background: var(--gold);
  animation: blink 0.5s ease-in-out infinite;
}

/* ── CHAT PANEL ── */
.chat-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: var(--dark2);
  overflow: hidden;
}

.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  scroll-behavior: smooth;
}
.chat-messages::-webkit-scrollbar { width: 2px; }
.chat-messages::-webkit-scrollbar-thumb { background: rgba(201,168,76,0.3); }

.bubble {
  max-width: 90%;
  padding: 10px 13px;
  border-radius: 14px;
  font-size: 13.5px;
  line-height: 1.55;
  animation: pop-in 0.25s ease;
}
@keyframes pop-in {
  from { opacity:0; transform:translateY(6px); }
  to { opacity:1; transform:translateY(0); }
}
.bubble.sanjaya {
  align-self: flex-start;
  background: var(--dark3);
  border: 1px solid rgba(201,168,76,0.15);
  border-bottom-left-radius: 4px;
}
.bubble.sanjaya .sender {
  font-size: 10px; color: var(--gold);
  font-weight: 600; letter-spacing: 0.5px;
  margin-bottom: 4px;
}
.bubble.user {
  align-self: flex-end;
  background: linear-gradient(135deg, #1A3A6B, #0F2448);
  border: 1px solid rgba(100,150,255,0.2);
  border-bottom-right-radius: 4px;
}

/* Typing dots */
.typing-dots {
  align-self: flex-start;
  background: var(--dark3);
  border: 1px solid rgba(201,168,76,0.15);
  border-radius: 14px;
  border-bottom-left-radius: 4px;
  padding: 10px 16px;
  display: none; gap: 5px; align-items: center;
}
.typing-dots.show { display: flex; }
.dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--gold);
  animation: bounce 1.2s ease-in-out infinite;
}
.dot:nth-child(2) { animation-delay:0.2s }
.dot:nth-child(3) { animation-delay:0.4s }
@keyframes bounce {
  0%,60%,100% { transform:translateY(0); opacity:0.4; }
  30% { transform:translateY(-6px); opacity:1; }
}

/* Input area */
.input-area {
  padding: 10px 12px;
  background: var(--dark);
  border-top: 1px solid rgba(201,168,76,0.1);
  display: flex; gap: 8px; align-items: flex-end;
}
.input-wrap {
  flex: 1;
  display: flex; align-items: flex-end;
  background: var(--dark3);
  border: 1px solid rgba(201,168,76,0.2);
  border-radius: 20px;
  padding: 0 4px 0 14px;
  transition: border-color 0.2s;
  gap: 4px;
}
.input-wrap:focus-within { border-color: rgba(201,168,76,0.5); }

textarea#chatInput {
  flex: 1;
  background: transparent;
  border: none;
  padding: 10px 4px;
  color: var(--text);
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  outline: none;
  resize: none;
  max-height: 80px;
  min-height: 40px;
  line-height: 1.4;
}
textarea#chatInput::placeholder { color: var(--text-dim); }

/* Tombol upload foto */
.btn-img {
  width: 32px; height: 32px; margin-bottom: 4px;
  background: none; border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  opacity: 0.5; transition: opacity 0.2s;
  flex-shrink: 0;
}
.btn-img:hover { opacity: 1; }
.btn-img svg { width: 20px; height: 20px; fill: var(--gold); }

/* Preview gambar di input */
.img-preview {
  padding: 6px 12px 0;
  display: none;
}
.img-preview.show { display: block; }
.img-preview img {
  max-height: 80px; border-radius: 8px;
  border: 1px solid rgba(201,168,76,0.3);
}
.img-preview-remove {
  position: absolute;
  background: rgba(0,0,0,0.6);
  color: white; border: none; cursor: pointer;
  border-radius: 50%; width: 20px; height: 20px;
  font-size: 12px; display: flex; align-items: center; justify-content: center;
  margin-top: -76px; margin-left: 64px;
}

.btn-send {
  width: 40px; height: 40px; border-radius: 50%;
  background: linear-gradient(135deg, var(--gold), #A07830);
  border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: transform 0.15s, opacity 0.15s;
}
.btn-send:active { transform: scale(0.9); }
.btn-send:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-send svg { width: 18px; height: 18px; fill: #050A14; }

/* Hidden file input */
#fileInput { display: none; }

/* Image bubble */
.bubble-img {
  max-width: 200px;
  border-radius: 10px;
  margin-top: 6px;
  display: block;
}
</style>
</head>
<body>

<div class="page">

  <!-- FOTO PANEL -->
  <div class="photo-panel">
    <div class="photo-stack">
      <img id="photoIdle"    src="sanjaya-idle.png"   class="active" alt="">
      <img id="photoTyping"  src="sanjaya-typing.png" alt="">
      <img id="photoSmile"   src="sanjaya-smile.png"  alt="">
    </div>
    <div class="laptop-glow" id="laptopGlow"></div>
    <div class="status-pill" id="statusPill">
      <div class="status-dot"></div>
      <span id="statusText">Online</span>
    </div>
  </div>

  <!-- CHAT PANEL -->
  <div class="chat-panel">
    <div class="chat-messages" id="chatMessages">
      <div class="typing-dots" id="typingDots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </div>

    <!-- Preview gambar sebelum kirim -->
    <div class="img-preview" id="imgPreview">
      <img id="imgPreviewSrc" src="" alt="preview">
      <button class="img-preview-remove" onclick="removeImage()">✕</button>
    </div>

    <div class="input-area">
      <div class="input-wrap">
        <textarea id="chatInput" placeholder="Ketik pesan..." rows="1" disabled></textarea>
        <!-- Tombol upload foto -->
        <button class="btn-img" onclick="document.getElementById('fileInput').click()" title="Kirim screenshot">
          <svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
        </button>
      </div>
      <button class="btn-send" id="btnSend" disabled>
        <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
      </button>
      <input type="file" id="fileInput" accept="image/*">
    </div>
  </div>
</div>

<script>
// ── Config ──
const API_URL = 'https://ws.indocoin.id/ai-chat';
const urlParams = new URLSearchParams(window.location.search);
const referralCode = urlParams.get('ref') || urlParams.get('referral') || '';

// ── State ──
let state = 'idle';
let smileTimer = null;
let userName = '';
let userGender = '';
let history = [];
let waiting = false;
let pendingImage = null; // base64 image

// ── Photo state (crossfade) ──
function setPhotoState(s) {
  if (state === s) return;
  state = s;

  const idle    = document.getElementById('photoIdle');
  const typing  = document.getElementById('photoTyping');
  const smile   = document.getElementById('photoSmile');
  const glow    = document.getElementById('laptopGlow');
  const pill    = document.getElementById('statusPill');
  const txt     = document.getElementById('statusText');

  [idle, typing, smile].forEach(p => p.classList.remove('active'));
  glow.classList.remove('on');
  pill.classList.remove('typing');

  if (s === 'idle') {
    idle.classList.add('active');
    txt.textContent = 'Online';
  } else if (s === 'typing') {
    typing.classList.add('active');
    glow.classList.add('on');
    pill.classList.add('typing');
    txt.textContent = 'Sedang mengetik...';
  } else if (s === 'smile') {
    smile.classList.add('active');
    txt.textContent = 'Online';
    if (smileTimer) clearTimeout(smileTimer);
    smileTimer = setTimeout(() => setPhotoState('idle'), 2200);
  }
}

// ── Add bubble ──
function addBubble(role, text, imgSrc) {
  const box = document.getElementById('chatMessages');
  const dots = document.getElementById('typingDots');
  const el = document.createElement('div');
  el.className = `bubble ${role}`;

  if (role === 'sanjaya') {
    let html = `<div class="sender">Sanjaya</div><div>${fmt(text)}</div>`;
    if (imgSrc) html += `<img class="bubble-img" src="${imgSrc}">`;
    el.innerHTML = html;
  } else {
    el.textContent = text;
    if (imgSrc) {
      const img = document.createElement('img');
      img.className = 'bubble-img';
      img.src = imgSrc;
      el.appendChild(img);
    }
  }

  box.insertBefore(el, dots);
  box.scrollTop = box.scrollHeight;
}

function fmt(t) {
  return t
    .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.*?)\*/g,'<em>$1</em>')
    .replace(/`(.*?)`/g,'<code style="background:rgba(201,168,76,0.1);padding:1px 5px;border-radius:3px;font-size:12px">$1</code>')
    .replace(/\n/g,'<br>');
}

function showDots(show) {
  const d = document.getElementById('typingDots');
  d.classList.toggle('show', show);
  if (show) document.getElementById('chatMessages').scrollTop = 999999;
}

function setEnabled(on) {
  document.getElementById('chatInput').disabled = !on;
  document.getElementById('btnSend').disabled = !on;
}

// ── Image upload ──
document.getElementById('fileInput').addEventListener('change', function() {
  const file = this.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    pendingImage = e.target.result; // base64
    document.getElementById('imgPreviewSrc').src = pendingImage;
    document.getElementById('imgPreview').classList.add('show');
  };
  reader.readAsDataURL(file);
  this.value = '';
});

function removeImage() {
  pendingImage = null;
  document.getElementById('imgPreview').classList.remove('show');
  document.getElementById('imgPreviewSrc').src = '';
}

// ── Send ──
async function send(text) {
  text = text.trim();
  if ((!text && !pendingImage) || waiting) return;
  waiting = true;
  setEnabled(false);

  const imgSrc = pendingImage;
  addBubble('user', text || '📸 Screenshot', imgSrc);
  removeImage();

  // Build message content
  let content;
  if (imgSrc) {
    const base64 = imgSrc.split(',')[1];
    const mime = imgSrc.match(/data:(.*?);/)[1];
    content = [
      { type: 'image', source: { type: 'base64', media_type: mime, data: base64 } }
    ];
    if (text) content.push({ type: 'text', text });
    else content.push({ type: 'text', text: 'Tolong analisis screenshot ini dan berikan panduan langkah selanjutnya.' });
  } else {
    content = text;
  }

  history.push({ role: 'user', content });

  showDots(true);
  setPhotoState('typing');

  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        messages: history,
        userName,
        userGender,
        mode: 'onboarding',
        currentStep: 1,
        referralCode,
      })
    });
    const data = await res.json();
    const reply = data.reply || data.content || 'Maaf, ada gangguan. Silakan coba lagi.';

    showDots(false);
    setPhotoState('smile');
    addBubble('sanjaya', reply);
    history.push({ role: 'assistant', content: reply });

    // Deteksi nama user dari percakapan awal
    if (!userName && history.length <= 4) {
      const last = history.filter(m=>m.role==='user').pop();
      const txt = typeof last?.content === 'string' ? last.content : '';
      if (txt.length < 30 && txt.length > 1 && !txt.includes(' ') === false) {
        const words = txt.trim().split(' ');
        if (words.length <= 3) userName = words[0];
      }
    }

  } catch(e) {
    showDots(false);
    setPhotoState('idle');
    addBubble('sanjaya', 'Maaf, koneksi bermasalah. Silakan coba lagi. 🙏');
  }

  waiting = false;
  setEnabled(true);
  setTimeout(() => document.getElementById('chatInput').focus(), 100);
}

// ── Input events ──
const inp = document.getElementById('chatInput');
inp.addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 80) + 'px';
});
inp.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(inp.value); inp.value=''; inp.style.height='auto'; }
});
document.getElementById('btnSend').addEventListener('click', () => {
  send(inp.value); inp.value=''; inp.style.height='auto';
});

// ── Init ──
async function init() {
  await new Promise(r => setTimeout(r, 700));
  showDots(true);
  setPhotoState('typing');
  await new Promise(r => setTimeout(r, 1800));
  showDots(false);
  setPhotoState('smile');

  const msg = referralCode
    ? `Selamat datang di INDOCOIN! 🎉\n\nSaya **Sanjaya**, Founder & Chief Visionary Officer INDOCOIN.\n\nSenang sekali Anda bergabung melalui komunitas kami. Saya akan pandu Anda langkah demi langkah — dari awal hingga sukses melakukan staking pertama.\n\nBoleh saya tahu nama Anda?`
    : `Halo! Selamat datang di INDOCOIN! 🎉\n\nSaya **Sanjaya**, Founder & Chief Visionary Officer INDOCOIN.\n\nSaya di sini untuk memastikan perjalanan pertama Anda di dunia DeFi berjalan lancar dan menyenangkan.\n\nBoleh saya tahu nama Anda?`;

  addBubble('sanjaya', msg);
  history.push({ role: 'assistant', content: msg });
  setEnabled(true);
  inp.focus();
}

init();
</script>
</body>
</html>
