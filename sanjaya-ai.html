<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Sanjaya — INDOCOIN</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --gold: #C9A84C;
  --gold2: #E8C97A;
  --dark: #050A14;
  --dark2: #0A1628;
  --dark3: #0F1F3D;
  --text: #E8EDF5;
  --text-dim: #8A9AB8;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;background:var(--dark);color:var(--text);font-family:'Inter',sans-serif;overflow:hidden;}

.page{display:flex;flex-direction:column;height:100vh;height:100dvh;}

/* ── HEADER FOTO ── */
.header{
  flex-shrink:0;
  background:linear-gradient(180deg,#020810 0%,var(--dark2) 100%);
  border-bottom:1px solid rgba(201,168,76,0.15);
  padding:14px 16px 12px;
  display:flex;align-items:center;gap:14px;
  position:relative;
  z-index:10;
}

/* Foto bulat */
.avatar-wrap{
  position:relative;
  flex-shrink:0;
}
.avatar-ring{
  width:72px;height:72px;
  border-radius:50%;
  border:2.5px solid var(--gold);
  padding:2px;
  position:relative;
  transition:border-color 0.4s;
}
.avatar-ring.typing{
  border-color:var(--gold2);
  animation:ring-pulse 0.8s ease-in-out infinite;
}
@keyframes ring-pulse{
  0%,100%{box-shadow:0 0 0 0 rgba(201,168,76,0.4);}
  50%{box-shadow:0 0 0 6px rgba(201,168,76,0);}
}
.avatar-stack{
  width:100%;height:100%;
  border-radius:50%;overflow:hidden;
  position:relative;
}
.avatar-stack img{
  position:absolute;inset:0;
  width:100%;height:100%;
  object-fit:cover;object-position:top center;
  opacity:0;
  transition:opacity 0.5s ease;
}
.avatar-stack img.on{opacity:1;}

/* Animasi idle napas */
@keyframes breathe{
  0%,100%{transform:scale(1);}
  50%{transform:scale(1.015);}
}
#avIdle.on{animation:breathe 4s ease-in-out infinite;}

/* Animasi typing */
@keyframes type-bob{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(2px);}
}
#avTyping.on{animation:type-bob 0.6s ease-in-out infinite;}

/* Dot online */
.online-dot{
  position:absolute;
  bottom:3px;right:3px;
  width:12px;height:12px;
  border-radius:50%;
  background:#4CAF50;
  border:2px solid var(--dark2);
  transition:background 0.3s;
}
.online-dot.typing{background:var(--gold);}

/* Info di samping foto */
.header-info{flex:1;}
.header-name{
  font-family:'Orbitron',sans-serif;
  font-size:16px;font-weight:700;
  color:var(--gold);
  letter-spacing:1.5px;
  text-shadow:0 0 15px rgba(201,168,76,0.4);
}
.header-sub{
  font-size:10px;color:var(--text-dim);
  margin-top:2px;letter-spacing:0.5px;
}
.header-status{
  display:flex;align-items:center;gap:5px;
  margin-top:5px;
}
.status-dot{
  width:6px;height:6px;border-radius:50%;
  background:#4CAF50;
  animation:blink 2s ease-in-out infinite;
}
.status-dot.typing{
  background:var(--gold);
  animation:blink 0.5s ease-in-out infinite;
}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0.3;}}
.status-txt{font-size:10px;color:var(--text-dim);}

/* Partikel bintang background */
.stars{
  position:absolute;inset:0;pointer-events:none;overflow:hidden;
  z-index:0;
}
.star{
  position:absolute;
  width:1.5px;height:1.5px;
  border-radius:50%;
  background:rgba(201,168,76,0.4);
  animation:twinkle var(--d) ease-in-out infinite;
}
@keyframes twinkle{0%,100%{opacity:0;}50%{opacity:1;}}

/* ── CHAT ── */
.chat-panel{
  flex:1;
  display:flex;flex-direction:column;
  background:var(--dark2);
  overflow:hidden;
}

.chat-messages{
  flex:1;overflow-y:auto;
  padding:14px;
  display:flex;flex-direction:column;gap:10px;
  scroll-behavior:smooth;
}
.chat-messages::-webkit-scrollbar{width:2px;}
.chat-messages::-webkit-scrollbar-thumb{background:rgba(201,168,76,0.3);}

/* Bubble */
.bubble{
  max-width:88%;
  padding:10px 13px;
  border-radius:14px;
  font-size:13.5px;
  line-height:1.6;
  animation:pop .25s ease;
}
@keyframes pop{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

.bubble-row{
  display:flex;gap:8px;align-items:flex-end;
}
.bubble-row.user{flex-direction:row-reverse;}

.mini-av{
  width:28px;height:28px;
  border-radius:50%;overflow:hidden;
  flex-shrink:0;
  border:1.5px solid rgba(201,168,76,0.3);
}
.mini-av img{width:100%;height:100%;object-fit:cover;object-position:top;}
.mini-av.user-av{
  background:var(--dark3);
  display:flex;align-items:center;justify-content:center;
}
.mini-av.user-av svg{width:16px;height:16px;fill:var(--text-dim);}

.bubble.sanjaya{
  background:var(--dark3);
  border:1px solid rgba(201,168,76,0.15);
  border-bottom-left-radius:4px;
}
.bubble.sanjaya .sender{
  font-size:10px;color:var(--gold);
  font-weight:600;letter-spacing:0.5px;margin-bottom:4px;
}
.bubble.user{
  background:linear-gradient(135deg,#1A3A6B,#0F2448);
  border:1px solid rgba(100,150,255,0.2);
  border-bottom-right-radius:4px;
}

/* Image dalam bubble */
.bubble-img{
  max-width:100%;border-radius:8px;
  margin-top:8px;display:block;
  border:1px solid rgba(201,168,76,0.2);
}

/* Typing dots */
.typing-row{
  display:none;
  gap:8px;align-items:flex-end;
}
.typing-row.show{display:flex;}
.typing-bubble{
  background:var(--dark3);
  border:1px solid rgba(201,168,76,0.15);
  border-radius:14px;border-bottom-left-radius:4px;
  padding:10px 16px;
  display:flex;gap:5px;align-items:center;
}
.dot{
  width:7px;height:7px;border-radius:50%;
  background:var(--gold);
  animation:bounce 1.2s ease-in-out infinite;
}
.dot:nth-child(2){animation-delay:.2s;}
.dot:nth-child(3){animation-delay:.4s;}
@keyframes bounce{
  0%,60%,100%{transform:translateY(0);opacity:.4;}
  30%{transform:translateY(-6px);opacity:1;}
}

/* ── INPUT ── */
.input-area{
  padding:10px 12px;
  background:var(--dark);
  border-top:1px solid rgba(201,168,76,0.1);
  display:flex;gap:8px;align-items:flex-end;
}
.input-wrap{
  flex:1;
  display:flex;align-items:flex-end;
  background:var(--dark3);
  border:1px solid rgba(201,168,76,0.2);
  border-radius:20px;
  padding:0 4px 0 14px;
  transition:border-color .2s;gap:4px;
}
.input-wrap:focus-within{border-color:rgba(201,168,76,0.5);}

textarea#inp{
  flex:1;background:transparent;border:none;
  padding:10px 4px;color:var(--text);
  font-family:'Inter',sans-serif;font-size:13px;
  outline:none;resize:none;
  max-height:80px;min-height:40px;line-height:1.4;
}
textarea#inp::placeholder{color:var(--text-dim);}

.btn-img{
  width:32px;height:32px;margin-bottom:4px;
  background:none;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  opacity:.5;transition:opacity .2s;flex-shrink:0;
}
.btn-img:hover{opacity:1;}
.btn-img svg{width:20px;height:20px;fill:var(--gold);}

.btn-send{
  width:40px;height:40px;border-radius:50%;
  background:linear-gradient(135deg,var(--gold),#A07830);
  border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  transition:transform .15s,opacity .15s;
}
.btn-send:active{transform:scale(.9);}
.btn-send:disabled{opacity:.4;cursor:not-allowed;}
.btn-send svg{width:18px;height:18px;fill:#050A14;}

/* Preview gambar */
.img-preview{
  padding:6px 12px 0;
  display:none;position:relative;
}
.img-preview.show{display:block;}
.img-preview img{max-height:70px;border-radius:8px;border:1px solid rgba(201,168,76,0.3);}
.remove-img{
  position:absolute;top:0;left:70px;
  background:rgba(0,0,0,.7);color:#fff;
  border:none;cursor:pointer;border-radius:50%;
  width:18px;height:18px;font-size:11px;
  display:flex;align-items:center;justify-content:center;
}

#fileInp{display:none;}
</style>
</head>
<body>
<div class="page">

  <!-- HEADER -->
  <div class="header">
    <div class="stars" id="stars"></div>

    <div class="avatar-wrap">
      <div class="avatar-ring" id="avatarRing">
        <div class="avatar-stack">
          <img id="avIdle"   src="sanjaya-idle.png"   class="on" alt="">
          <img id="avTyping" src="sanjaya-typing.png" alt="">
        </div>
      </div>
      <div class="online-dot" id="onlineDot"></div>
    </div>

    <div class="header-info">
      <div class="header-name">SANJAYA</div>
      <div class="header-sub">Founder & Chief Visionary Officer · INDOCOIN</div>
      <div class="header-status">
        <div class="status-dot" id="sDot"></div>
        <span class="status-txt" id="sTxt">Online · Siap memandu</span>
      </div>
    </div>
  </div>

  <!-- CHAT -->
  <div class="chat-panel">
    <div class="chat-messages" id="msgs">
      <div class="typing-row" id="typingRow">
        <div class="mini-av"><img src="sanjaya-idle.png" alt=""></div>
        <div class="typing-bubble">
          <div class="dot"></div><div class="dot"></div><div class="dot"></div>
        </div>
      </div>
    </div>

    <div class="img-preview" id="imgPrev">
      <img id="prevImg" src="" alt="">
      <button class="remove-img" onclick="clearImg()">✕</button>
    </div>

    <div class="input-area">
      <div class="input-wrap">
        <textarea id="inp" placeholder="Ketik pesan atau kirim screenshot..." rows="1" disabled></textarea>
        <button class="btn-img" onclick="document.getElementById('fileInp').click()" title="Kirim screenshot">
          <svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
        </button>
      </div>
      <button class="btn-send" id="btnSend" disabled>
        <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
      </button>
      <input type="file" id="fileInp" accept="image/*">
    </div>
  </div>
</div>

<script>
// ── Config ──────────────────────────────────────────────────────────
const API = 'https://ws.indocoin.id/ai-chat';
const params = new URLSearchParams(location.search);
const refCode = params.get('ref') || params.get('referral') || '';

// ── State ────────────────────────────────────────────────────────────
let photoState = 'idle';
let smileTimer = null;
let userName = '';
let userGender = '';
let history = [];
let busy = false;
let pendingImg = null;

// ── Stars background ─────────────────────────────────────────────────
(function(){
  const c = document.getElementById('stars');
  for(let i=0;i<18;i++){
    const s=document.createElement('div');
    s.className='star';
    s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${2+Math.random()*3}s;animation-delay:${Math.random()*3}s`;
    c.appendChild(s);
  }
})();

// ── Photo state ───────────────────────────────────────────────────────
function setPhoto(s){
  if(photoState===s) return;
  photoState=s;
  const idle=document.getElementById('avIdle');
  const typing=document.getElementById('avTyping');
  const ring=document.getElementById('avatarRing');
  const dot=document.getElementById('onlineDot');
  const sDot=document.getElementById('sDot');
  const sTxt=document.getElementById('sTxt');

  [idle,typing].forEach(p=>p.classList.remove('on'));
  ring.classList.remove('typing');
  dot.classList.remove('typing');
  sDot.classList.remove('typing');

  if(s==='idle'){
    idle.classList.add('on');
    sTxt.textContent='Online · Siap memandu';
  } else if(s==='typing'){
    typing.classList.add('on');
    ring.classList.add('typing');
    dot.classList.add('typing');
    sDot.classList.add('typing');
    sTxt.textContent='Sedang mengetik...';
  }
}

// ── Chat helpers ──────────────────────────────────────────────────────
function addMsg(role, text, imgSrc){
  const box=document.getElementById('msgs');
  const tr=document.getElementById('typingRow');

  const row=document.createElement('div');
  row.className=`bubble-row ${role}`;

  // Avatar
  const av=document.createElement('div');
  if(role==='sanjaya'){
    av.className='mini-av';
    av.innerHTML='<img src="sanjaya-idle.png" alt="">';
  } else {
    av.className='mini-av user-av';
    av.innerHTML='<svg viewBox="0 0 24 24"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg>';
  }

  const bub=document.createElement('div');
  bub.className=`bubble ${role}`;

  if(role==='sanjaya'){
    let html=`<div class="sender">Sanjaya</div><div>${fmt(text)}</div>`;
    if(imgSrc) html+=`<img class="bubble-img" src="${imgSrc}">`;
    bub.innerHTML=html;
    row.appendChild(av);
    row.appendChild(bub);
  } else {
    bub.textContent=text||'📸 Screenshot';
    if(imgSrc) bub.innerHTML+='<img class="bubble-img" src="'+imgSrc+'">';
    row.appendChild(bub);
    row.appendChild(av);
  }

  box.insertBefore(row,tr);
  box.scrollTop=box.scrollHeight;
}

function fmt(t){
  return t
    .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.*?)\*/g,'<em>$1</em>')
    .replace(/`(.*?)`/g,'<code style="background:rgba(201,168,76,0.1);padding:1px 5px;border-radius:3px;font-size:12px">$1</code>')
    .replace(/\n/g,'<br>');
}

function showDots(v){
  const r=document.getElementById('typingRow');
  r.classList.toggle('show',v);
  if(v) document.getElementById('msgs').scrollTop=999999;
}

function setEnabled(v){
  document.getElementById('inp').disabled=!v;
  document.getElementById('btnSend').disabled=!v;
}

// ── Image upload ──────────────────────────────────────────────────────
document.getElementById('fileInp').addEventListener('change',function(){
  const f=this.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=e=>{
    pendingImg=e.target.result;
    document.getElementById('prevImg').src=pendingImg;
    document.getElementById('imgPrev').classList.add('show');
  };
  r.readAsDataURL(f);
  this.value='';
});

function clearImg(){
  pendingImg=null;
  document.getElementById('imgPrev').classList.remove('show');
  document.getElementById('prevImg').src='';
}

// ── Send ──────────────────────────────────────────────────────────────
async function send(text){
  text=text.trim();
  if((!text&&!pendingImg)||busy) return;
  busy=true; setEnabled(false);

  const imgSrc=pendingImg;
  addMsg('user',text,imgSrc);
  clearImg();

  // Build content
  let content;
  if(imgSrc){
    const b64=imgSrc.split(',')[1];
    const mime=imgSrc.match(/data:(.*?);/)[1];
    content=[
      {type:'image',source:{type:'base64',media_type:mime,data:b64}},
      {type:'text',text:text||'Tolong analisis screenshot ini dan panduan langkah selanjutnya yang perlu saya lakukan.'}
    ];
  } else { content=text; }

  history.push({role:'user',content});
  showDots(true); setPhoto('typing');

  try{
    const res=await fetch(API,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        messages:history,
        userName, userGender,
        mode:'onboarding',
        referralCode:refCode,
      })
    });
    const data=await res.json();
    const reply=data.reply||data.content||'Koneksi terputus sebentar. Silakan ulangi pertanyaan Anda.';

    showDots(false); setPhoto('idle');
    addMsg('sanjaya',reply);
    history.push({role:'assistant',content:reply});
  saveHistory();

    // Deteksi nama user
    if(!userName && history.filter(m=>m.role==='user').length<=2){
      const last=history.filter(m=>m.role==='user').pop();
      const t=typeof last?.content==='string'?last.content:'';
      if(t.length>1&&t.length<25&&!t.includes('?')){
        userName=t.trim().split(' ')[0];
      }
    }

  } catch(e){
    showDots(false); setPhoto('idle');
    addMsg('sanjaya','Koneksi terputus sebentar. Silakan ulangi pertanyaan Anda.');
  }

  busy=false; setEnabled(true);
  setTimeout(()=>document.getElementById('inp').focus(),100);
}

// ── Input events ──────────────────────────────────────────────────────
const inp=document.getElementById('inp');
inp.addEventListener('input',function(){
  this.style.height='auto';
  this.style.height=Math.min(this.scrollHeight,80)+'px';
});
inp.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){
    e.preventDefault();
    const v=inp.value; inp.value=''; inp.style.height='auto';
    send(v);
  }
});
document.getElementById('btnSend').addEventListener('click',()=>{
  const v=inp.value; inp.value=''; inp.style.height='auto';
  send(v);
});

// ── localStorage helpers ──────────────────────────────────────────────
const STORAGE_KEY = 'sanjaya_history';
const TIME_KEY = 'sanjaya_last';
const THIRTY_MIN = 30 * 60 * 1000;

function saveHistory() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
  localStorage.setItem(TIME_KEY, Date.now().toString());
}

function loadHistory() {
  const lastTime = localStorage.getItem(TIME_KEY);
  if (!lastTime || (Date.now() - parseInt(lastTime)) > THIRTY_MIN) {
    localStorage.removeItem(STORAGE_KEY);
    localStorage.removeItem(TIME_KEY);
    return false;
  }
  const saved = localStorage.getItem(STORAGE_KEY);
  if (!saved) return false;
  try {
    const parsed = JSON.parse(saved);
    if (parsed && parsed.length > 0) {
      history = parsed;
      return true;
    }
  } catch(e) {}
  return false;
}

// Platform link dikirim Sanjaya lewat chat saat waktunya tepat

// ── Init ──────────────────────────────────────────────────────────────
async function init(){
  await new Promise(r=>setTimeout(r,600));
  showDots(true); setPhoto('typing');
  await new Promise(r=>setTimeout(r,1600));
  showDots(false); setPhoto('idle');

  // Cek history tersimpan
  const hasHistory = loadHistory();
  if (hasHistory) {
    showDots(false); setPhoto('idle');
    // Tampilkan history
    const msgs = [...history];
    history = [];
    msgs.forEach(m => {
      if (m.role === 'assistant' && typeof m.content === 'string') {
        addMsg('sanjaya', m.content);
        history.push(m);
      }
      if (m.role === 'user' && typeof m.content === 'string') {
        addMsg('user', m.content);
        history.push(m);
      }
    });
    
    setEnabled(true);
    inp.focus();
    return;
  }

  const msg=`Halo! Selamat datang di INDOCOIN! 🎉\n\nSaya **Sanjaya**, Founder & Chief Visionary Officer INDOCOIN.\n\nSaya di sini untuk memastikan perjalanan Anda berjalan lancar — dari langkah pertama hingga sukses berpartisipasi di ekosistem INDOCOIN.\n\nBoleh saya tahu nama Anda?`;
  addMsg('sanjaya',msg);
  history.push({role:'assistant',content:msg});
  saveHistory();
  setEnabled(true);
  inp.focus();
}

init();
</script>
</body>
</html>
