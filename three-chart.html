<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Three Trade — Live Chart</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --dark:#0a0f1e;--dark2:#0f172a;
  --teal:#14b8a6;--gold:#facc15;--green:#34d399;--red:#f87171;
  --ga:#38bdf8;--gb:#f97316;
  --muted:#64748b;--text:#e2e8f0;--border:rgba(20,184,166,0.15);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--dark);color:var(--text);font-family:'Share Tech Mono',monospace;overflow-x:hidden;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}

/* TOPNAV */
.topnav{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;
  background:rgba(10,15,30,0.98);border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:100;}
.btn-back{font-family:'Orbitron',sans-serif;font-size:9px;font-weight:700;
  padding:6px 12px;border:1px solid var(--border);border-radius:8px;
  background:transparent;color:var(--teal);cursor:pointer;}
.nav-title{font-family:'Orbitron',sans-serif;font-size:10px;font-weight:700;color:var(--gold);}
.tab-switch{display:flex;gap:4px;}
.ts-btn{font-family:'Orbitron',sans-serif;font-size:7px;font-weight:700;
  padding:5px 10px;border-radius:6px;border:1px solid var(--border);
  background:transparent;color:var(--muted);cursor:pointer;transition:all 0.2s;}
.ts-btn.active{background:rgba(20,184,166,0.12);color:var(--teal);border-color:rgba(20,184,166,0.3);}

/* TIMER */
.timer-section{padding:10px 12px;background:var(--dark2);border-bottom:1px solid var(--border);}
.timer-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.timer-lbl{font-size:7px;color:var(--muted);letter-spacing:1px;}
.timer-val{font-family:'Orbitron',sans-serif;font-size:24px;font-weight:900;color:var(--text);}
.timer-val.urgent{color:var(--red);animation:blink 1s infinite;}
.progress-track{height:6px;background:rgba(255,255,255,0.06);border-radius:3px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--gold));
  border-radius:3px;transition:width 1s linear;}

/* PNL STRIP */
.pnl-strip{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;padding:8px 12px;
  background:rgba(255,255,255,0.02);border-bottom:1px solid var(--border);align-items:center;}
.pnl-side{text-align:center;}
.pnl-lbl{font-size:6px;color:var(--muted);letter-spacing:1px;margin-bottom:2px;}
.pnl-val{font-family:'Orbitron',sans-serif;font-size:14px;font-weight:900;}
.pnl-mid{font-family:'Orbitron',sans-serif;font-size:11px;font-weight:900;color:var(--gold);text-align:center;}
.pnl-status{font-size:7px;margin-top:2px;letter-spacing:1px;}

/* TF BAR */
.tf-bar{display:flex;gap:6px;padding:8px 12px;overflow-x:auto;border-bottom:1px solid var(--border);}
.tf-bar::-webkit-scrollbar{display:none;}
.tf-btn{font-family:'Orbitron',sans-serif;font-size:8px;font-weight:700;
  padding:4px 10px;border-radius:6px;border:1px solid var(--border);
  background:transparent;color:var(--muted);cursor:pointer;white-space:nowrap;transition:all 0.2s;flex-shrink:0;}
.tf-btn.active{background:rgba(20,184,166,0.12);color:var(--teal);border-color:rgba(20,184,166,0.3);}

/* CHART SECTION */
.chart-section{padding:8px 12px;}
.chart-item{margin-bottom:10px;}
.chart-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
.ch-sym{font-family:'Orbitron',sans-serif;font-size:10px;font-weight:700;}
.ch-price{font-family:'Orbitron',sans-serif;font-size:13px;font-weight:900;transition:color 0.2s;}
.ch-price.up{color:var(--green);}
.ch-price.down{color:var(--red);}
.ch-chg{font-size:8px;padding:2px 6px;border-radius:4px;}
.ch-chg.up{background:rgba(52,211,153,0.1);color:var(--green);}
.ch-chg.down{background:rgba(248,113,113,0.1);color:var(--red);}
.ch-pct{font-family:'Orbitron',sans-serif;font-size:8px;font-weight:700;}
.chart-frame{border-radius:8px;overflow:hidden;border:1px solid var(--border);}
.live-dot{width:5px;height:5px;border-radius:50%;background:var(--green);
  animation:pulse 1s infinite;display:inline-block;margin-right:4px;}
.page{padding-bottom:20px;}
</style>
</head>
<body>

<!-- TOPNAV -->
<nav class="topnav">
  <button class="btn-back" onclick="history.back()">← KEMBALI</button>
  <div class="nav-title">📊 LIVE CHART</div>
  <div class="tab-switch">
    <button class="ts-btn active" id="tsMe"  onclick="switchView('me')">👤 SAYA</button>
    <button class="ts-btn"        id="tsMac" onclick="switchView('machine')">🤖 MESIN</button>
  </div>
</nav>

<div class="page">

  <!-- TIMER -->
  <div class="timer-section">
    <div class="timer-top">
      <div>
        <div class="timer-lbl">⏱️ SISA WAKTU SESI</div>
        <div class="timer-val" id="timerVal">--:--:--</div>
      </div>
      <div style="text-align:right;">
        <div class="timer-lbl">SESI</div>
        <div style="font-family:'Orbitron',sans-serif;font-size:11px;color:var(--teal);" id="sessId">#—</div>
      </div>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill" style="width:100%"></div>
    </div>
  </div>

  <!-- P&L STRIP -->
  <div class="pnl-strip">
    <div class="pnl-side">
      <div class="pnl-lbl" style="color:var(--ga)">👤 AKUMULASIKU</div>
      <div class="pnl-val" id="myAccum" style="color:var(--teal)">—</div>
      <div class="pnl-status" id="myStatus" style="color:var(--muted)">—</div>
    </div>
    <div class="pnl-mid" id="vsStatus">VS</div>
    <div class="pnl-side">
      <div class="pnl-lbl" style="color:var(--gb)">🤖 AKUMULASI MESIN</div>
      <div class="pnl-val" id="machAccum" style="color:var(--gb)">—</div>
      <div class="pnl-status" id="machStatus" style="color:var(--muted)">—</div>
    </div>
  </div>

  <!-- TF BAR -->
  <div class="tf-bar">
    <button class="tf-btn" onclick="setTF('1')">1M</button>
    <button class="tf-btn active" onclick="setTF('5')" id="tf5">5M</button>
    <button class="tf-btn" onclick="setTF('15')">15M</button>
    <button class="tf-btn" onclick="setTF('30')">30M</button>
    <button class="tf-btn" onclick="setTF('60')">1H</button>
    <button class="tf-btn" onclick="setTF('240')">4H</button>
    <button class="tf-btn" onclick="setTF('D')">1D</button>
  </div>

  <!-- CHART SECTION -->
  <div class="chart-section" id="chartSection">
    <!-- Diisi JS -->
  </div>

</div>

<script>
// Parse URL params
const params = new URLSearchParams(location.search);
const myTokens  = [params.get("t1"),params.get("t2"),params.get("t3")].filter(Boolean);
const machTokens= [params.get("m1"),params.get("m2"),params.get("m3")].filter(Boolean);
const endTime   = parseInt(params.get("end")||"0");
const sid       = params.get("sid")||"—";
let curTF       = "5";
let curView     = "me"; // "me" or "machine"
let wsConns     = {};
let prices      = {};
let prevPrices  = {};
let entryPrices = {}; // untuk hitung % dari entry
let timerInterval;

document.getElementById("sessId").textContent = "#"+sid;

// ═══ SWITCH VIEW ════════════════════════════════════════
function switchView(v) {
  curView = v;
  document.getElementById("tsMe").classList.toggle("active", v==="me");
  document.getElementById("tsMac").classList.toggle("active", v==="machine");
  renderCharts();
}

// ═══ RENDER CHARTS ══════════════════════════════════════
function renderCharts() {
  const tokens = curView==="me" ? myTokens : machTokens;
  const color  = curView==="me" ? "var(--ga)" : "var(--gb)";
  const label  = curView==="me" ? "👤 TOKEN KAMU" : "🤖 TOKEN MESIN";
  const el     = document.getElementById("chartSection");

  if (!tokens.length) {
    el.innerHTML = `<div style="text-align:center;padding:40px;color:var(--muted);font-size:9px;">
      Token tidak tersedia</div>`;
    return;
  }

  el.innerHTML = `
    <div style="font-family:'Orbitron',sans-serif;font-size:8px;color:${color};
      letter-spacing:1px;margin-bottom:8px;padding:4px 0;">${label}</div>
    ${tokens.map((sym,i) => `
      <div class="chart-item">
        <div class="chart-header">
          <div style="display:flex;align-items:center;gap:6px;">
            <span class="live-dot"></span>
            <span class="ch-sym" style="color:${color}">${sym}/USDT</span>
          </div>
          <div style="display:flex;align-items:center;gap:6px;">
            <span class="ch-price" id="price-${sym}">—</span>
            <span class="ch-chg" id="chg-${sym}">—</span>
          </div>
        </div>
        <div style="display:flex;justify-content:space-between;margin-bottom:4px;">
          <span style="font-size:7px;color:var(--muted);">Entry: <span id="entry-${sym}" style="color:var(--text)">—</span></span>
          <span style="font-size:7px;">Dari entry: <span id="frentry-${sym}" class="ch-pct">—</span></span>
        </div>
        <div class="chart-frame" style="height:180px;">
          <iframe
            id="chart-${sym}"
            src="https://www.tradingview.com/widgetsnippet/symbol/${sym}USDT/?interval=${curTF}&theme=dark&style=1&locale=id&toolbar_bg=%230a0f1e&enable_publishing=false&hide_top_toolbar=true&hide_legend=true&save_image=false&container_id=chart_${sym}_${i}"
            width="100%" height="180"
            style="border:none;display:block;">
          </iframe>
        </div>
      </div>`).join("")}`;

  // Start WS untuk token yang ditampilkan
  tokens.forEach(sym => startWS(sym));
  // Start WS semua token untuk akumulasi
  [...myTokens,...machTokens].forEach(sym => { if(!wsConns[sym]) startWS(sym); });
}

// ═══ TIMEFRAME ══════════════════════════════════════════
function setTF(tf) {
  curTF = tf;
  document.querySelectorAll(".tf-btn").forEach(b => b.classList.remove("active"));
  event.target.classList.add("active");
  // Reload iframes dengan TF baru
  const tokens = curView==="me" ? myTokens : machTokens;
  tokens.forEach((sym,i) => {
    const iframe = document.getElementById("chart-"+sym);
    if (iframe) {
      iframe.src = `https://www.tradingview.com/widgetsnippet/symbol/${sym}USDT/?interval=${tf}&theme=dark&style=1&locale=id&toolbar_bg=%230a0f1e&enable_publishing=false&hide_top_toolbar=true&hide_legend=true&save_image=false&container_id=chart_${sym}_${i}`;
    }
  });
}

// ═══ WEBSOCKET ══════════════════════════════════════════
function startWS(sym) {
  if (wsConns[sym]) return;
  const pair = sym.toLowerCase()+"usdt";
  try {
    const ws = new WebSocket(`wss://stream.binance.com:9443/ws/${pair}@ticker`);
    ws.onmessage = e => {
      const d    = JSON.parse(e.data);
      const cur  = parseFloat(d.c);
      const pct  = parseFloat(d.P);
      const isUp = pct >= 0;
      prevPrices[sym] = prices[sym]||cur;
      prices[sym]     = cur;

      // Update price display
      const pEl   = document.getElementById("price-"+sym);
      const cEl   = document.getElementById("chg-"+sym);
      const frEl  = document.getElementById("frentry-"+sym);

      if (pEl) {
        const fmt = cur>100?"$"+cur.toLocaleString("en",{maximumFractionDigits:2}):"$"+cur.toFixed(4);
        pEl.textContent = fmt;
        pEl.className   = "ch-price "+(isUp?"up":"down");
      }
      if (cEl) {
        cEl.textContent = (isUp?"▲ +":"▼ ")+Math.abs(pct).toFixed(2)+"%";
        cEl.className   = "ch-chg "+(isUp?"up":"down");
      }

      // Hitung dari entry
      if (entryPrices[sym] && frEl) {
        const fromEntry = (cur - entryPrices[sym])/entryPrices[sym]*100;
        frEl.textContent = (fromEntry>=0?"+":"")+fromEntry.toFixed(2)+"%";
        frEl.style.color = fromEntry>=0?"var(--green)":"var(--red)";
      }

      updateAccum();
    };
    ws.onclose = () => { delete wsConns[sym]; setTimeout(()=>startWS(sym),3000); };
    wsConns[sym] = ws;
  } catch(e) {}
}

// ═══ AKUMULASI ═══════════════════════════════════════════
function updateAccum() {
  // Hitung akumulasi my tokens
  let myTotal = 0, myCount = 0;
  myTokens.forEach(sym => {
    if (entryPrices[sym] && prices[sym]) {
      myTotal += (prices[sym]-entryPrices[sym])/entryPrices[sym]*100;
      myCount++;
    }
  });

  // Hitung akumulasi machine tokens
  let machTotal = 0, machCount = 0;
  machTokens.forEach(sym => {
    if (entryPrices[sym] && prices[sym]) {
      machTotal += (prices[sym]-entryPrices[sym])/entryPrices[sym]*100;
      machCount++;
    }
  });

  const myA   = myCount>0   ? myTotal   : null;
  const machA = machCount>0 ? machTotal : null;

  const myEl   = document.getElementById("myAccum");
  const machEl = document.getElementById("machAccum");
  const vsEl   = document.getElementById("vsStatus");

  if (myEl && myA !== null) {
    myEl.textContent = (myA>=0?"+":"")+myA.toFixed(2)+"%";
    myEl.style.color = myA>=0?"var(--green)":"var(--red)";
  }
  if (machEl && machA !== null) {
    machEl.textContent = (machA>=0?"+":"")+machA.toFixed(2)+"%";
    machEl.style.color = machA>=0?"var(--green)":"var(--red)";
  }
  if (vsEl && myA!==null && machA!==null) {
    const winning = myA > machA;
    vsEl.textContent = winning?"🏆 UNGGUL":"⚠️ TERTINGGAL";
    vsEl.style.color = winning?"var(--green)":"var(--red)";
  }
}

// ═══ TIMER ═══════════════════════════════════════════════
function startTimer() {
  if (!endTime) return;
  const startTs = Math.floor(Date.now()/1000);
  const totalDur = endTime - startTs + (endTime-startTs);

  timerInterval = setInterval(() => {
    const now  = Math.floor(Date.now()/1000);
    const left = endTime - now;
    const el   = document.getElementById("timerVal");
    const pEl  = document.getElementById("progressFill");

    if (el) {
      el.textContent = fmtTime(Math.max(0,left));
      el.className   = "timer-val "+(left<300?"urgent":"");
    }
    if (pEl && totalDur > 0) {
      const pct = Math.max(0, Math.min(100, left/totalDur*100));
      pEl.style.width = pct+"%";
      pEl.style.background = left<300
        ? "linear-gradient(90deg,var(--red),#ff6b6b)"
        : left<3600
        ? "linear-gradient(90deg,var(--gold),#fbbf24)"
        : "linear-gradient(90deg,var(--teal),var(--gold))";
    }
    if (left <= 0) clearInterval(timerInterval);
  }, 1000);
}

// ═══ LOAD ENTRY PRICES ═══════════════════════════════════
async function loadEntryPrices() {
  // Coba ambil dari contract kalau ada sid
  if (!sid || sid==="—") return;
  try {
    // Tanpa ethers — pakai read call langsung
    const allSyms = [...myTokens,...machTokens];
    // Fallback: gunakan harga pertama WS sebagai pseudo-entry
    // Contract call butuh ethers — skip untuk halaman ini
  } catch(e) {}
}

// ═══ HELPERS ════════════════════════════════════════════
function fmtTime(s) {
  if(s<=0) return "00:00:00";
  const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;
  return `${h.toString().padStart(2,"0")}:${m.toString().padStart(2,"0")}:${sec.toString().padStart(2,"0")}`;
}

// ═══ INIT ════════════════════════════════════════════════
window.addEventListener("load",()=>{
  renderCharts();
  startTimer();
  loadEntryPrices();

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/sw.js").then(reg => {
      setInterval(() => reg.update(), 60000);
      reg.addEventListener("updatefound", () => {
        const n = reg.installing;
        n.addEventListener("statechange", () => {
          if (n.state === "activated") window.location.reload();
        });
      });
    }).catch(e => console.warn(e));
    navigator.serviceWorker.addEventListener("controllerchange", () => window.location.reload());
  }
});
</script>
</body>
</html>
