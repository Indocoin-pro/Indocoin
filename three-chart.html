<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Three Trade — Live Chart</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --dark:#0a0f1e;--dark2:#0f172a;
  --teal:#14b8a6;--gold:#facc15;--green:#34d399;--red:#f87171;
  --ga:#38bdf8;--gb:#f97316;
  --muted:#64748b;--text:#e2e8f0;--border:rgba(20,184,166,0.15);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--dark);color:var(--text);font-family:'Share Tech Mono',monospace;overflow-x:hidden;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}
@keyframes spin{to{transform:rotate(360deg)}}
.topnav{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;
  background:rgba(10,15,30,0.98);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;}
.btn-back{font-family:'Orbitron',sans-serif;font-size:9px;font-weight:700;padding:6px 12px;
  border:1px solid var(--border);border-radius:8px;background:transparent;color:var(--teal);cursor:pointer;}
.nav-title{font-family:'Orbitron',sans-serif;font-size:10px;font-weight:700;color:var(--gold);}
.tab-switch{display:flex;gap:4px;}
.ts-btn{font-family:'Orbitron',sans-serif;font-size:7px;font-weight:700;padding:5px 10px;
  border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;}
.ts-btn.active{background:rgba(20,184,166,0.12);color:var(--teal);border-color:rgba(20,184,166,0.3);}
.timer-section{padding:10px 12px;background:var(--dark2);border-bottom:1px solid var(--border);}
.timer-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.timer-lbl{font-size:7px;color:var(--muted);letter-spacing:1px;}
.timer-val{font-family:'Orbitron',sans-serif;font-size:24px;font-weight:900;color:var(--text);}
.timer-val.urgent{color:var(--red);animation:blink 1s infinite;}
.progress-track{height:6px;background:rgba(255,255,255,0.06);border-radius:3px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--gold));border-radius:3px;transition:width 1s linear;}
.pnl-strip{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;padding:8px 12px;
  background:rgba(255,255,255,0.02);border-bottom:1px solid var(--border);align-items:center;}
.pnl-side{text-align:center;}
.pnl-lbl{font-size:6px;color:var(--muted);letter-spacing:1px;margin-bottom:2px;}
.pnl-val{font-family:'Orbitron',sans-serif;font-size:14px;font-weight:900;}
.pnl-mid{font-family:'Orbitron',sans-serif;font-size:11px;font-weight:900;color:var(--gold);text-align:center;}
.tf-bar{display:flex;gap:6px;padding:8px 12px;overflow-x:auto;border-bottom:1px solid var(--border);}
.tf-bar::-webkit-scrollbar{display:none;}
.tf-btn{font-family:'Orbitron',sans-serif;font-size:8px;font-weight:700;padding:4px 10px;
  border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--muted);
  cursor:pointer;white-space:nowrap;flex-shrink:0;}
.tf-btn.active{background:rgba(20,184,166,0.12);color:var(--teal);border-color:rgba(20,184,166,0.3);}
.chart-section{padding:8px 12px;}
.section-lbl{font-family:'Orbitron',sans-serif;font-size:8px;letter-spacing:1px;margin-bottom:8px;padding:4px 0;}
.chart-item{margin-bottom:12px;background:var(--dark2);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.chart-header{display:flex;justify-content:space-between;align-items:center;padding:8px 10px 4px;}
.ch-sym{font-family:'Orbitron',sans-serif;font-size:10px;font-weight:700;}
.ch-price{font-family:'Orbitron',sans-serif;font-size:12px;font-weight:900;color:var(--text);}
.ch-chg{font-size:8px;padding:2px 6px;border-radius:4px;color:var(--muted);}
.ch-chg.up{background:rgba(52,211,153,0.1);color:var(--green);}
.ch-chg.down{background:rgba(248,113,113,0.1);color:var(--red);}
.entry-row{display:flex;justify-content:space-between;padding:0 10px 6px;font-size:7px;color:var(--muted);}
.ch-pct{font-family:'Orbitron',sans-serif;font-size:8px;font-weight:700;}
.tv-wrap{position:relative;height:200px;}
.tv-loading{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:6px;background:var(--dark2);z-index:5;}
.tv-loading.hide{display:none;}
.spin{width:20px;height:20px;border:2px solid rgba(20,184,166,0.15);
  border-top-color:var(--teal);border-radius:50%;animation:spin 0.8s linear infinite;}
.loading-txt{font-size:8px;color:var(--muted);letter-spacing:1px;}
.live-dot{width:5px;height:5px;border-radius:50%;background:var(--green);
  animation:pulse 1s infinite;display:inline-block;margin-right:4px;vertical-align:middle;}
.page{padding-bottom:20px;}
.sync-bar{padding:3px 12px;background:rgba(20,184,166,0.05);border-bottom:1px solid var(--border);
  font-size:7px;color:var(--muted);display:flex;justify-content:space-between;}
</style>
</head>
<body>
<nav class="topnav">
  <button class="btn-back" onclick="history.back()">← KEMBALI</button>
  <div class="nav-title">📊 LIVE CHART</div>
  <div class="tab-switch">
    <button class="ts-btn active" id="tsMe" onclick="switchView('me')">👤 SAYA</button>
    <button class="ts-btn" id="tsMac" onclick="switchView('machine')">🤖 MESIN</button>
  </div>
</nav>
<div class="page">
  <div class="timer-section">
    <div class="timer-top">
      <div><div class="timer-lbl">⏱️ SISA WAKTU SESI</div>
        <div class="timer-val" id="timerVal">--:--:--</div></div>
      <div style="text-align:right;"><div class="timer-lbl">SESI</div>
        <div style="font-family:'Orbitron',sans-serif;font-size:11px;color:var(--teal);" id="sessId">#—</div></div>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:100%"></div></div>
  </div>
  <div class="pnl-strip">
    <div class="pnl-side">
      <div class="pnl-lbl" style="color:var(--ga)">👤 AKUMULASIKU</div>
      <div class="pnl-val" id="myAccum" style="color:var(--teal)">—</div>
    </div>
    <div class="pnl-mid" id="vsStatus">VS</div>
    <div class="pnl-side">
      <div class="pnl-lbl" style="color:var(--gb)">🤖 MESIN</div>
      <div class="pnl-val" id="machAccum" style="color:var(--gb)">—</div>
    </div>
  </div>
  <div class="sync-bar">
    <span>🔄 Update dari Three Trade</span>
    <span id="lastSync">—</span>
  </div>
  <div class="tf-bar">
    <button class="tf-btn" onclick="setTF('5')">5M</button>
    <button class="tf-btn active" onclick="setTF('15')">15M</button>
    <button class="tf-btn" onclick="setTF('30')">30M</button>
    <button class="tf-btn" onclick="setTF('60')">1H</button>
    <button class="tf-btn" onclick="setTF('240')">4H</button>
    <button class="tf-btn" onclick="setTF('D')">1D</button>
  </div>
  <div class="chart-section" id="chartSection"></div>
</div>

<script>
const params     = new URLSearchParams(location.search);
const myTokens   = [params.get("t1"),params.get("t2"),params.get("t3")].filter(Boolean);
const machTokens = [params.get("m1"),params.get("m2"),params.get("m3")].filter(Boolean);
const endTime    = parseInt(params.get("end")||"0");
const sid        = params.get("sid")||"—";
const startTs    = Math.floor(Date.now()/1000);

let curTF    = "15";
let curView  = "me";
let tvLoaded = false;
let timerInt;

document.getElementById("sessId").textContent = "#"+sid;

// ════ BACA DATA DARI LOCALSTORAGE ════
function readLocalData() {
  try {
    // Baca entry prices
    const entryRaw = localStorage.getItem("threeEntry_"+sid);
    if (entryRaw) {
      const entry = JSON.parse(entryRaw);
      // Update entry di UI
      [...myTokens,...machTokens].forEach(sym=>{
        if (!entry[sym]) return;
        const eEl = document.getElementById("entry-"+sym);
        if (eEl) {
          const v = entry[sym];
          eEl.textContent = v>100?"$"+v.toLocaleString("en",{maximumFractionDigits:2}):"$"+v.toFixed(4);
        }
      });
    }

    // Baca chart data (harga live + akumulasi)
    const dataRaw = localStorage.getItem("threeChart_"+sid);
    if (!dataRaw) return;
    const data = JSON.parse(dataRaw);

    // Cek umur data — max 30 detik
    const age = (Date.now() - data.ts) / 1000;
    document.getElementById("lastSync").textContent = age<5?"baru saja":Math.floor(age)+"dtk lalu";
    if (age > 30) {
      document.getElementById("lastSync").textContent = "⚠️ "+Math.floor(age)+"dtk — buka three trade!";
      return;
    }

    // Update akumulasi
    const myEl  = document.getElementById("myAccum");
    const mEl   = document.getElementById("machAccum");
    const vsEl  = document.getElementById("vsStatus");

    if (myEl && data.myAccum !== null) {
      myEl.textContent = (data.myAccum>=0?"+":"")+data.myAccum.toFixed(2)+"%";
      myEl.style.color = data.myAccum>=0?"var(--green)":"var(--red)";
    }
    if (mEl && data.machAccum !== null) {
      mEl.textContent = (data.machAccum>=0?"+":"")+data.machAccum.toFixed(2)+"%";
      mEl.style.color = data.machAccum>=0?"var(--green)":"var(--red)";
    }
    if (vsEl && data.winning !== null) {
      vsEl.textContent = data.winning?"🏆 UNGGUL":"⚠️ TERTINGGAL";
      vsEl.style.color = data.winning?"var(--green)":"var(--red)";
    }

    // Update harga + frentry per token
    const tokens = curView==="me" ? myTokens : machTokens;
    tokens.forEach(sym=>{
      const pEl  = document.getElementById("price-"+sym);
      const cEl  = document.getElementById("chg-"+sym);
      const frEl = document.getElementById("frentry-"+sym);

      if (pEl && data.prices[sym]) {
        const cur = data.prices[sym];
        pEl.textContent = cur>100?"$"+cur.toLocaleString("en",{maximumFractionDigits:2}):"$"+cur.toFixed(4);
      }
      if (frEl && data.frEntry[sym] !== undefined) {
        const fe = data.frEntry[sym];
        frEl.textContent = (fe>=0?"+":"")+fe.toFixed(2)+"%";
        frEl.style.color = fe>=0?"var(--green)":"var(--red)";
      }
    });

  } catch(e) { console.warn("readLocalData error",e); }
}

// ════ TV WIDGET ════
function loadTVScript(cb) {
  if (tvLoaded) { cb(); return; }
  if (window.TradingView) { tvLoaded=true; cb(); return; }
  const s=document.createElement("script");
  s.src="https://s3.tradingview.com/tv.js";
  s.async=true;
  s.onload=()=>{tvLoaded=true;cb();};
  s.onerror=()=>{
    document.querySelectorAll(".tv-loading").forEach(el=>{
      el.innerHTML=`<div style="font-size:9px;color:#64748b;">⚠️ Gagal memuat chart</div>`;
    });
  };
  document.head.appendChild(s);
}

function createWidget(sym, containerId, loadingId) {
  if (!window.TradingView) return;
  document.getElementById(loadingId).classList.remove("hide");
  document.getElementById(containerId).innerHTML="";
  new TradingView.widget({
    container_id: containerId,
    symbol: "BINANCE:"+sym+"USDT",
    interval: curTF,
    timezone: "Asia/Jakarta",
    theme: "dark",
    style: "1",
    locale: "id",
    toolbar_bg: "#0f172a",
    enable_publishing: false,
    hide_top_toolbar: true,
    hide_legend: true,
    hide_side_toolbar: true,
    save_image: false,
    allow_symbol_change: false,
    studies: [],
    overrides:{
      "paneProperties.background":"#0a0f1e",
      "paneProperties.backgroundType":"solid",
      "paneProperties.vertGridProperties.color":"rgba(255,255,255,0.03)",
      "paneProperties.horzGridProperties.color":"rgba(255,255,255,0.03)",
      "scalesProperties.textColor":"#64748b",
      "mainSeriesProperties.candleStyle.upColor":"#34d399",
      "mainSeriesProperties.candleStyle.downColor":"#f87171",
      "mainSeriesProperties.candleStyle.borderUpColor":"#34d399",
      "mainSeriesProperties.candleStyle.borderDownColor":"#f87171",
      "mainSeriesProperties.candleStyle.wickUpColor":"#34d399",
      "mainSeriesProperties.candleStyle.wickDownColor":"#f87171",
    },
    width:"100%", height:200, autosize:false,
    loading_screen:{backgroundColor:"#0a0f1e",foregroundColor:"#14b8a6"},
    withdateranges:false, details:false, hotlist:false, calendar:false,
  });
  setTimeout(()=>document.getElementById(loadingId).classList.add("hide"),2000);
}

// ════ RENDER ════
function renderCharts() {
  const tokens    = curView==="me"?myTokens:machTokens;
  const color     = curView==="me"?"var(--ga)":"var(--gb)";
  const accentHex = curView==="me"?"#38bdf8":"#f97316";
  const label     = curView==="me"?"👤 TOKEN KAMU":"🤖 TOKEN MESIN";
  const el        = document.getElementById("chartSection");

  el.innerHTML=`
    <div class="section-lbl" style="color:${color}">${label}</div>
    ${tokens.map((sym,i)=>`
      <div class="chart-item">
        <div class="chart-header">
          <div><span class="live-dot"></span>
            <span class="ch-sym" style="color:${color}">${sym}/USDT</span>
          </div>
          <div style="display:flex;gap:6px;align-items:center;">
            <span class="ch-price" id="price-${sym}">—</span>
            <span class="ch-chg" id="chg-${sym}">—</span>
          </div>
        </div>
        <div class="entry-row">
          <span>Entry: <span id="entry-${sym}" style="color:var(--text)">—</span></span>
        </div>
        <div class="tv-wrap">
          <div class="tv-loading" id="tvload-${sym}-${i}">
            <div class="spin"></div>
            <div class="loading-txt">MEMUAT CHART...</div>
          </div>
          <div id="tvchart-${sym}-${i}" style="width:100%;height:200px;"></div>
        </div>
      </div>`).join("")}`;

  loadTVScript(()=>{
    tokens.forEach((sym,i)=>createWidget(sym,"tvchart-"+sym+"-"+i,"tvload-"+sym+"-"+i));
  });

  // Langsung baca data setelah render
  readLocalData();
}

function switchView(v){
  curView=v;
  document.getElementById("tsMe").classList.toggle("active",v==="me");
  document.getElementById("tsMac").classList.toggle("active",v==="machine");
  renderCharts();
}

function setTF(tf){
  curTF=tf;
  document.querySelectorAll(".tf-btn").forEach(b=>{
    const map={"5":"5M","15":"15M","30":"30M","60":"1H","240":"4H","D":"1D"};
    b.classList.toggle("active",b.textContent===(map[tf]||tf));
  });
  renderCharts();
}

// ════ TIMER ════
function startTimer(){
  if(!endTime) return;
  const totalDur=endTime-startTs;
  timerInt=setInterval(()=>{
    const now=Math.floor(Date.now()/1000),left=endTime-now;
    const el=document.getElementById("timerVal"),pEl=document.getElementById("progressFill");
    if(el){el.textContent=fmtTime(Math.max(0,left));el.className="timer-val "+(left<300?"urgent":"");}
    if(pEl&&totalDur>0){pEl.style.width=Math.max(0,Math.min(100,left/totalDur*100))+"%";
      pEl.style.background=left<300?"linear-gradient(90deg,var(--red),#ff6b6b)":left<3600?"linear-gradient(90deg,var(--gold),#fbbf24)":"linear-gradient(90deg,var(--teal),var(--gold))";}
    if(left<=0) clearInterval(timerInt);
  },1000);
}

function fmtTime(s){
  if(s<=0) return "00:00:00";
  return `${Math.floor(s/3600).toString().padStart(2,"0")}:${Math.floor((s%3600)/60).toString().padStart(2,"0")}:${(s%60).toString().padStart(2,"0")}`;
}

// ════ INIT ════
window.addEventListener("load",()=>{
  renderCharts();
  startTimer();
  // Poll localStorage setiap 5 detik
  setInterval(readLocalData, 5000);

  if("serviceWorker" in navigator){
    navigator.serviceWorker.register("/sw.js").then(reg=>{
      setInterval(()=>reg.update(),60000);
      reg.addEventListener("updatefound",()=>{const n=reg.installing;n.addEventListener("statechange",()=>{if(n.state==="activated")window.location.reload();});});
    }).catch(e=>console.warn(e));
    navigator.serviceWorker.addEventListener("controllerchange",()=>window.location.reload());
  }
});
</script>
</body>
</html>
