<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Three Trade — Live Chart</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --dark:#0a0f1e;--dark2:#0f172a;
  --teal:#14b8a6;--gold:#facc15;--green:#34d399;--red:#f87171;
  --ga:#38bdf8;--gb:#f97316;
  --muted:#64748b;--text:#e2e8f0;--border:rgba(20,184,166,0.15);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--dark);color:var(--text);font-family:'Share Tech Mono',monospace;overflow-x:hidden;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}

.topnav{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;
  background:rgba(10,15,30,0.98);border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:100;}
.btn-back{font-family:'Orbitron',sans-serif;font-size:9px;font-weight:700;
  padding:6px 12px;border:1px solid var(--border);border-radius:8px;
  background:transparent;color:var(--teal);cursor:pointer;}
.nav-title{font-family:'Orbitron',sans-serif;font-size:10px;font-weight:700;color:var(--gold);}
.tab-switch{display:flex;gap:4px;}
.ts-btn{font-family:'Orbitron',sans-serif;font-size:7px;font-weight:700;
  padding:5px 10px;border-radius:6px;border:1px solid var(--border);
  background:transparent;color:var(--muted);cursor:pointer;transition:all 0.2s;}
.ts-btn.active{background:rgba(20,184,166,0.12);color:var(--teal);border-color:rgba(20,184,166,0.3);}

.timer-section{padding:10px 12px;background:var(--dark2);border-bottom:1px solid var(--border);}
.timer-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.timer-lbl{font-size:7px;color:var(--muted);letter-spacing:1px;}
.timer-val{font-family:'Orbitron',sans-serif;font-size:24px;font-weight:900;color:var(--text);}
.timer-val.urgent{color:var(--red);animation:blink 1s infinite;}
.progress-track{height:6px;background:rgba(255,255,255,0.06);border-radius:3px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--gold));border-radius:3px;transition:width 1s linear;}

.pnl-strip{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;padding:8px 12px;
  background:rgba(255,255,255,0.02);border-bottom:1px solid var(--border);align-items:center;}
.pnl-side{text-align:center;}
.pnl-lbl{font-size:6px;color:var(--muted);letter-spacing:1px;margin-bottom:2px;}
.pnl-val{font-family:'Orbitron',sans-serif;font-size:14px;font-weight:900;}
.pnl-mid{font-family:'Orbitron',sans-serif;font-size:11px;font-weight:900;color:var(--gold);text-align:center;}

.chart-section{padding:8px 12px;}
.chart-item{margin-bottom:14px;background:var(--dark2);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.chart-header{display:flex;justify-content:space-between;align-items:center;padding:8px 10px 4px;}
.ch-sym{font-family:'Orbitron',sans-serif;font-size:10px;font-weight:700;}
.ch-price{font-family:'Orbitron',sans-serif;font-size:13px;font-weight:900;}
.ch-price.up{color:var(--green);}
.ch-price.down{color:var(--red);}
.ch-chg{font-size:8px;padding:2px 6px;border-radius:4px;}
.ch-chg.up{background:rgba(52,211,153,0.1);color:var(--green);}
.ch-chg.down{background:rgba(248,113,113,0.1);color:var(--red);}
.entry-row{display:flex;justify-content:space-between;padding:0 10px 6px;font-size:7px;color:var(--muted);}
.ch-pct{font-family:'Orbitron',sans-serif;font-size:8px;font-weight:700;}
canvas{display:block;width:100%;background:#0a0f1e;}
.live-dot{width:5px;height:5px;border-radius:50%;background:var(--green);
  animation:pulse 1s infinite;display:inline-block;margin-right:4px;vertical-align:middle;}
.page{padding-bottom:20px;}
.loading-txt{text-align:center;padding:30px;font-size:9px;color:var(--muted);}
</style>
</head>
<body>

<nav class="topnav">
  <button class="btn-back" onclick="history.back()">← KEMBALI</button>
  <div class="nav-title">📊 LIVE CHART</div>
  <div class="tab-switch">
    <button class="ts-btn active" id="tsMe"  onclick="switchView('me')">👤 SAYA</button>
    <button class="ts-btn"        id="tsMac" onclick="switchView('machine')">🤖 MESIN</button>
  </div>
</nav>

<div class="page">
  <div class="timer-section">
    <div class="timer-top">
      <div>
        <div class="timer-lbl">⏱️ SISA WAKTU SESI</div>
        <div class="timer-val" id="timerVal">--:--:--</div>
      </div>
      <div style="text-align:right;">
        <div class="timer-lbl">SESI</div>
        <div style="font-family:'Orbitron',sans-serif;font-size:11px;color:var(--teal);" id="sessId">#—</div>
      </div>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:100%"></div></div>
  </div>

  <div class="pnl-strip">
    <div class="pnl-side">
      <div class="pnl-lbl" style="color:var(--ga)">👤 AKUMULASIKU</div>
      <div class="pnl-val" id="myAccum" style="color:var(--teal)">—</div>
    </div>
    <div class="pnl-mid" id="vsStatus">VS</div>
    <div class="pnl-side">
      <div class="pnl-lbl" style="color:var(--gb)">🤖 MESIN</div>
      <div class="pnl-val" id="machAccum" style="color:var(--gb)">—</div>
    </div>
  </div>

  <div class="chart-section" id="chartSection"></div>
</div>

<script>
const params     = new URLSearchParams(location.search);
const myTokens   = [params.get("t1"),params.get("t2"),params.get("t3")].filter(Boolean);
const machTokens = [params.get("m1"),params.get("m2"),params.get("m3")].filter(Boolean);
const endTime    = parseInt(params.get("end")||"0");
const sid        = params.get("sid")||"—";
const startTs    = Math.floor(Date.now()/1000);

let curView     = "me";
let wsConns     = {};
let prices      = {};
let entryPrices = {};
let priceHistory= {}; // {sym: [price, price, ...]} max 200 points
let timerInt;

const MAX_POINTS = 200;

document.getElementById("sessId").textContent = "#"+sid;

// ════════════════════════════════════
// DRAW LINE CHART
// ════════════════════════════════════
function drawLineChart(sym, accentColor) {
  const canvas = document.getElementById("cv-"+sym);
  if (!canvas) return;
  const ctx  = canvas.getContext("2d");
  const W    = canvas.width;
  const H    = canvas.height;
  const data = priceHistory[sym] || [];

  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = "#0a0f1e";
  ctx.fillRect(0,0,W,H);

  if (data.length < 2) {
    ctx.fillStyle = "#475569";
    ctx.font = "10px Share Tech Mono";
    ctx.textAlign = "center";
    ctx.fillText("⏳ Menunggu data realtime...", W/2, H/2-6);
    ctx.font = "8px Share Tech Mono";
    ctx.fillText("Chart terbentuk otomatis", W/2, H/2+10);
    return;
  }

  const PAD_L=42, PAD_R=8, PAD_T=10, PAD_B=18;
  const chartW = W-PAD_L-PAD_R;
  const chartH = H-PAD_T-PAD_B;

  // Range
  let minP = Math.min(...data);
  let maxP = Math.max(...data);
  if (entryPrices[sym]) {
    minP = Math.min(minP, entryPrices[sym]);
    maxP = Math.max(maxP, entryPrices[sym]);
  }
  const range = maxP-minP||minP*0.001;
  const pad   = range*0.1;
  const lo    = minP-pad;
  const hi    = maxP+pad;
  const span  = hi-lo||1;

  const toX = i => PAD_L + (i/(data.length-1))*chartW;
  const toY = p => PAD_T + chartH - ((p-lo)/span)*chartH;

  // Grid
  ctx.strokeStyle = "rgba(255,255,255,0.04)";
  ctx.lineWidth = 1;
  for (let i=0;i<=3;i++) {
    const y = PAD_T + (chartH/3)*i;
    ctx.beginPath(); ctx.moveTo(PAD_L,y); ctx.lineTo(W-PAD_R,y); ctx.stroke();
    const price = hi-(span/3)*i;
    ctx.fillStyle="#475569"; ctx.font="8px Share Tech Mono"; ctx.textAlign="right";
    ctx.fillText(price>1000?price.toFixed(0):price>10?price.toFixed(2):price.toFixed(4), PAD_L-2, y+3);
  }

  // Garis entry (dashed)
  if (entryPrices[sym]) {
    const ey = toY(entryPrices[sym]);
    ctx.strokeStyle = accentColor;
    ctx.lineWidth = 1.5;
    ctx.setLineDash([5,4]);
    ctx.beginPath(); ctx.moveTo(PAD_L,ey); ctx.lineTo(W-PAD_R,ey); ctx.stroke();
    ctx.setLineDash([]);
    // Label entry
    ctx.fillStyle = accentColor;
    ctx.font = "7px Share Tech Mono";
    ctx.textAlign = "right";
    ctx.fillText("ENTRY", PAD_L-2, ey-2);
  }

  // Area gradient bawah garis
  const isProfit = data[data.length-1] >= (entryPrices[sym]||data[0]);
  const lineColor = isProfit ? "#34d399" : "#f87171";
  const grad = ctx.createLinearGradient(0, PAD_T, 0, PAD_T+chartH);
  grad.addColorStop(0, isProfit?"rgba(52,211,153,0.25)":"rgba(248,113,113,0.25)");
  grad.addColorStop(1, "rgba(0,0,0,0)");

  ctx.beginPath();
  ctx.moveTo(toX(0), toY(data[0]));
  for (let i=1;i<data.length;i++) ctx.lineTo(toX(i), toY(data[i]));
  ctx.lineTo(toX(data.length-1), PAD_T+chartH);
  ctx.lineTo(toX(0), PAD_T+chartH);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();

  // Garis harga (line)
  ctx.strokeStyle = lineColor;
  ctx.lineWidth   = 2;
  ctx.lineJoin    = "round";
  ctx.beginPath();
  ctx.moveTo(toX(0), toY(data[0]));
  for (let i=1;i<data.length;i++) ctx.lineTo(toX(i), toY(data[i]));
  ctx.stroke();

  // Titik harga terakhir
  const lastX = toX(data.length-1);
  const lastY = toY(data[data.length-1]);
  ctx.beginPath();
  ctx.arc(lastX, lastY, 3, 0, Math.PI*2);
  ctx.fillStyle = lineColor;
  ctx.fill();

  // Current price line (dashed kuning)
  if (prices[sym]) {
    const py = toY(prices[sym]);
    ctx.strokeStyle = "rgba(250,204,21,0.5)";
    ctx.lineWidth   = 1;
    ctx.setLineDash([2,3]);
    ctx.beginPath(); ctx.moveTo(PAD_L,py); ctx.lineTo(W-PAD_R,py); ctx.stroke();
    ctx.setLineDash([]);
  }
}

// ════════════════════════════════════
// RENDER
// ════════════════════════════════════
function renderCharts() {
  const tokens    = curView==="me" ? myTokens : machTokens;
  const color     = curView==="me" ? "var(--ga)" : "var(--gb)";
  const accentHex = curView==="me" ? "#38bdf8" : "#f97316";
  const label     = curView==="me" ? "👤 TOKEN KAMU" : "🤖 TOKEN MESIN";
  const el        = document.getElementById("chartSection");

  el.innerHTML = `
    <div style="font-family:'Orbitron',sans-serif;font-size:8px;color:${color};
      letter-spacing:1px;margin-bottom:8px;padding:4px 0;">${label}</div>
    ${tokens.map(sym=>`
      <div class="chart-item">
        <div class="chart-header">
          <div><span class="live-dot"></span>
            <span class="ch-sym" style="color:${color}">${sym}/USDT</span>
          </div>
          <div style="display:flex;gap:6px;align-items:center;">
            <span class="ch-price" id="price-${sym}">—</span>
            <span class="ch-chg"   id="chg-${sym}">—</span>
          </div>
        </div>
        <div class="entry-row">
          <span>Entry: <span id="entry-${sym}" style="color:var(--text)">—</span></span>
          <span>Dari entry: <span id="frentry-${sym}" class="ch-pct">—</span></span>
        </div>
        <canvas id="cv-${sym}" height="150"></canvas>
      </div>`).join("")}`;

  tokens.forEach(sym=>{
    const cv = document.getElementById("cv-"+sym);
    if (cv) cv.width = cv.parentElement.clientWidth;
    drawLineChart(sym, accentHex);
    if (!wsConns[sym]) startWS(sym);
  });

  // Pastikan semua token punya WS untuk akumulasi
  [...myTokens,...machTokens].forEach(sym=>{ if(!wsConns[sym]) startWS(sym); });
}

// ════════════════════════════════════
// WEBSOCKET
// ════════════════════════════════════
function startWS(sym) {
  if (wsConns[sym]) return;
  const pair = sym.toLowerCase()+"usdt";
  try {
    const ws = new WebSocket(`wss://stream.binance.com:9443/ws/${pair}@ticker`);
    ws.onmessage = e => {
      const d   = JSON.parse(e.data);
      const cur = parseFloat(d.c);
      const pct = parseFloat(d.P);
      const isUp= pct>=0;

      prices[sym] = cur;

      // Simpan ke history
      if (!priceHistory[sym]) priceHistory[sym]=[];
      // Tambah titik setiap tick (throttle: max 1 per detik)
      const now = Date.now();
      if (!sym._lastTick || now-sym._lastTick > 1000) {
        priceHistory[sym].push(cur);
        if (priceHistory[sym].length > MAX_POINTS) priceHistory[sym].shift();
        sym._lastTick = now;
      }

      // Update harga display
      const pEl  = document.getElementById("price-"+sym);
      const cEl  = document.getElementById("chg-"+sym);
      const frEl = document.getElementById("frentry-"+sym);
      if (pEl) {
        pEl.textContent = cur>100?"$"+cur.toLocaleString("en",{maximumFractionDigits:2}):"$"+cur.toFixed(4);
        pEl.className = "ch-price "+(isUp?"up":"down");
      }
      if (cEl) {
        cEl.textContent=(isUp?"▲ +":"▼ ")+Math.abs(pct).toFixed(2)+"%";
        cEl.className="ch-chg "+(isUp?"up":"down");
      }
      if (entryPrices[sym]&&frEl) {
        const fe=(cur-entryPrices[sym])/entryPrices[sym]*100;
        frEl.textContent=(fe>=0?"+":"")+fe.toFixed(2)+"%";
        frEl.style.color=fe>=0?"var(--green)":"var(--red)";
      }

      // Redraw chart kalau sedang ditampilkan
      const tokens = curView==="me"?myTokens:machTokens;
      if (tokens.includes(sym)) {
        const accentHex = curView==="me"?"#38bdf8":"#f97316";
        drawLineChart(sym, accentHex);
      }

      updateAccum();
    };
    ws.onclose=()=>{ delete wsConns[sym]; setTimeout(()=>startWS(sym),3000); };
    wsConns[sym]=ws;
  } catch(e){}
}

// ════════════════════════════════════
// AKUMULASI
// ════════════════════════════════════
function updateAccum() {
  let myT=0,myC=0,mT=0,mC=0;
  myTokens.forEach(s=>{if(entryPrices[s]&&prices[s]){myT+=(prices[s]-entryPrices[s])/entryPrices[s]*100;myC++;}});
  machTokens.forEach(s=>{if(entryPrices[s]&&prices[s]){mT+=(prices[s]-entryPrices[s])/entryPrices[s]*100;mC++;}});
  const myA=myC>0?myT:null, mA=mC>0?mT:null;
  const myEl=document.getElementById("myAccum"),mEl=document.getElementById("machAccum"),vsEl=document.getElementById("vsStatus");
  if(myEl&&myA!==null){myEl.textContent=(myA>=0?"+":"")+myA.toFixed(2)+"%";myEl.style.color=myA>=0?"var(--green)":"var(--red)";}
  if(mEl&&mA!==null){mEl.textContent=(mA>=0?"+":"")+mA.toFixed(2)+"%";mEl.style.color=mA>=0?"var(--green)":"var(--red)";}
  if(vsEl&&myA!==null&&mA!==null){const w=myA>mA;vsEl.textContent=w?"🏆 UNGGUL":"⚠️ TERTINGGAL";vsEl.style.color=w?"var(--green)":"var(--red)";}
}

// ════════════════════════════════════
// SWITCH VIEW
// ════════════════════════════════════
function switchView(v) {
  curView=v;
  document.getElementById("tsMe").classList.toggle("active",v==="me");
  document.getElementById("tsMac").classList.toggle("active",v==="machine");
  renderCharts();
}

// ════════════════════════════════════
// LOAD ENTRY PRICES
// ════════════════════════════════════
async function loadEntryPrices() {
  if (!sid||sid==="—") return;
  try {
    const RPC="https://bsc-dataseed.binance.org/";
    const CONTRACT="0xA002f937d6aB84e9aC4a0FaC5b5B505E8c9884A8";
    const sidHex=parseInt(sid).toString(16).padStart(64,"0");
    const res=await fetch(RPC,{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({jsonrpc:"2.0",id:1,method:"eth_call",
        params:[{to:CONTRACT,data:"0x575437ba"+sidHex},"latest"]})});
    const json=await res.json();
    if(!json.result||json.result==="0x") return;
    const hex=json.result.slice(2);
    const allSyms=[...myTokens,...machTokens];
    allSyms.forEach((sym,i)=>{
      if(i>=6) return;
      const chunk=hex.slice(i*64,(i+1)*64);
      let n=BigInt("0x"+chunk);
      if(n>=BigInt("0x8"+("0".repeat(63)))) n-=BigInt("0x1"+("0".repeat(64)));
      if(n>0n){
        entryPrices[sym]=Number(n)/1e8;
        const eEl=document.getElementById("entry-"+sym);
        if(eEl){
          const v=entryPrices[sym];
          eEl.textContent=v>100?"$"+v.toLocaleString("en",{maximumFractionDigits:2}):"$"+v.toFixed(4);
        }
        // Set entry sebagai titik awal history
        if(!priceHistory[sym]||priceHistory[sym].length===0){
          priceHistory[sym]=[entryPrices[sym]];
        }
        const accentHex=curView==="me"?"#38bdf8":"#f97316";
        const tokens=curView==="me"?myTokens:machTokens;
        if(tokens.includes(sym)) drawLineChart(sym,accentHex);
      }
    });
  } catch(e){ console.warn("Entry error",e); }
}

// ════════════════════════════════════
// TIMER
// ════════════════════════════════════
function startTimer(){
  if(!endTime) return;
  const totalDur=endTime-startTs;
  timerInt=setInterval(()=>{
    const now=Math.floor(Date.now()/1000),left=endTime-now;
    const el=document.getElementById("timerVal"),pEl=document.getElementById("progressFill");
    if(el){el.textContent=fmtTime(Math.max(0,left));el.className="timer-val "+(left<300?"urgent":"");}
    if(pEl&&totalDur>0){
      pEl.style.width=Math.max(0,Math.min(100,left/totalDur*100))+"%";
      pEl.style.background=left<300?"linear-gradient(90deg,var(--red),#ff6b6b)":left<3600?"linear-gradient(90deg,var(--gold),#fbbf24)":"linear-gradient(90deg,var(--teal),var(--gold))";
    }
    if(left<=0) clearInterval(timerInt);
  },1000);
}

function fmtTime(s){
  if(s<=0) return "00:00:00";
  return `${Math.floor(s/3600).toString().padStart(2,"0")}:${Math.floor((s%3600)/60).toString().padStart(2,"0")}:${(s%60).toString().padStart(2,"0")}`;
}

// ════════════════════════════════════
// INIT
// ════════════════════════════════════
window.addEventListener("load",()=>{
  renderCharts();
  startTimer();
  loadEntryPrices();
  if("serviceWorker" in navigator){
    navigator.serviceWorker.register("/sw.js").then(reg=>{
      setInterval(()=>reg.update(),60000);
      reg.addEventListener("updatefound",()=>{
        const n=reg.installing;
        n.addEventListener("statechange",()=>{if(n.state==="activated")window.location.reload();});
      });
    }).catch(e=>console.warn(e));
    navigator.serviceWorker.addEventListener("controllerchange",()=>window.location.reload());
  }
});
</script>
</body>
</html>
