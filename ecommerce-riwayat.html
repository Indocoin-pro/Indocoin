<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INDOCOIN — Riwayat Pesanan</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
<style>
:root{
  --gold:#facc15;--gold2:#fbbf24;--gold3:#f59e0b;
  --dark:#0a0f1e;--dark2:#0f172a;--dark3:#1e293b;--dark4:#162032;
  --text:#e2e8f0;--muted:#64748b;--green:#22c55e;--blue:#3b82f6;--red:#ef4444;--orange:#f97316;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--dark);color:var(--text);font-family:'Rajdhani',sans-serif;min-height:100vh;padding-bottom:40px;}
@keyframes goldShimmer{0%{background-position:0% center}100%{background-position:300% center}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}

.topnav{display:flex;align-items:center;gap:10px;padding:12px 16px;background:rgba(10,15,30,0.97);backdrop-filter:blur(16px);border-bottom:2px solid rgba(255,255,255,0.12);position:sticky;top:0;z-index:100;}
.back-btn{background:none;border:none;color:var(--text);font-size:18px;cursor:pointer;}
.nav-brand-main{font-family:'Orbitron',sans-serif;font-size:13px;font-weight:900;background:linear-gradient(90deg,#f59e0b,#facc15,#fef08a,#facc15,#f59e0b);background-size:300% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:goldShimmer 3s linear infinite;letter-spacing:2px;}

.container{max-width:820px;margin:0 auto;padding:14px;}

.connect-btn{display:block;margin:60px auto;padding:14px 28px;border-radius:12px;border:none;background:linear-gradient(90deg,var(--gold3),var(--gold));color:#0a0f1e;font-family:'Orbitron',sans-serif;font-weight:700;font-size:13px;cursor:pointer;}

.card{background:var(--dark2);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:14px;margin-bottom:12px;animation:fadeUp 0.3s ease;}
.card-hdr{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px;}
.produk-nama{font-size:14px;font-weight:700;}
.produk-sub{font-size:11px;color:var(--muted);margin-top:2px;}

.status-pill{font-size:10px;font-weight:700;padding:4px 10px;border-radius:20px;white-space:nowrap;}
.status-CREATED{background:rgba(59,130,246,0.15);color:var(--blue);}
.status-PROCESSING{background:rgba(245,158,11,0.15);color:var(--gold3);}
.status-SUCCESS{background:rgba(34,197,94,0.15);color:var(--green);}
.status-REFUNDED{background:rgba(239,68,68,0.15);color:var(--red);}
.status-CANCELLED{background:rgba(100,116,139,0.15);color:var(--muted);}

.timeline{display:flex;align-items:center;margin:12px 0;}
.tl-step{flex:1;text-align:center;position:relative;}
.tl-dot{width:10px;height:10px;border-radius:50%;background:var(--dark4);margin:0 auto 4px;border:2px solid var(--muted);}
.tl-dot.done{background:var(--gold);border-color:var(--gold);}
.tl-dot.active{background:var(--gold3);border-color:var(--gold3);animation:blink 1.2s infinite;}
.tl-label{font-size:9px;color:var(--muted);}
.tl-line{position:absolute;top:5px;left:-50%;width:100%;height:2px;background:var(--dark4);z-index:-1;}
.tl-line.done{background:var(--gold);}

.info-row{display:flex;justify-content:space-between;font-size:12px;padding:4px 0;border-bottom:1px dashed rgba(255,255,255,0.06);}
.info-row span:first-child{color:var(--muted);}

.btn-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.btn{flex:1;min-width:110px;padding:10px;border-radius:9px;border:none;font-weight:700;font-size:12px;cursor:pointer;font-family:'Rajdhani',sans-serif;}
.btn-lacak{background:var(--dark4);color:var(--gold);border:1px solid var(--gold);}
.btn-terima{background:var(--green);color:#08150a;}
.btn-tolak{background:var(--red);color:#fff;}
.btn-cancel{background:var(--dark4);color:var(--red);border:1px solid var(--red);}
.btn:disabled{opacity:0.4;cursor:not-allowed;}

.cod-banner{background:rgba(249,115,22,0.1);border:1px solid var(--orange);border-radius:10px;padding:10px;font-size:12px;margin:10px 0;color:var(--orange);}

.empty{text-align:center;padding:60px 20px;color:var(--muted);font-size:13px;}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--dark3);border:1px solid rgba(255,255,255,0.15);border-radius:10px;padding:10px 18px;font-size:12px;z-index:999;display:none;}
</style>
</head>
<body>

<div class="topnav">
  <button class="back-btn" onclick="window.location.href='e-commerce.html'">←</button>
  <div class="nav-brand-main">RIWAYAT PESANAN</div>
</div>

<div class="container">
  <div id="beforeConnect">
    <button class="connect-btn" onclick="connectWallet()">🔌 Hubungkan Wallet</button>
  </div>
  <div id="listOrder"></div>
</div>

<div id="toast" class="toast"></div>

<script>
const API_BASE = '/api';

const SC = {
  ECOMMERCE_GATEWAY: '0xD60A746f440CE4424634b76e68349e7d6B7bB739',
  CHAIN_ID: 56,
};

const GATEWAY_ABI = [
  'function cancelOrder(bytes32 orderId) external',
  'function confirmCODReceived(bytes32 orderId) external',
  'function confirmCODRejected(bytes32 orderId) external',
];

let _wallet = null, _provider = null, _signer = null;

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(()=>t.style.display='none', 3000);
}

async function connectWallet(){
  if(!window.ethereum){ toast('Wallet browser tidak terdeteksi'); return; }
  const accounts = await window.ethereum.request({method:'eth_requestAccounts'});
  _wallet = accounts[0];
  _provider = new ethers.providers.Web3Provider(window.ethereum);
  _signer = _provider.getSigner();
  document.getElementById('beforeConnect').style.display = 'none';
  muatRiwayat();
}

async function muatRiwayat(){
  const el = document.getElementById('listOrder');
  el.innerHTML = '<div class="empty">Memuat riwayat...</div>';
  try{
    const res = await fetch(`${API_BASE}/orders/history/${_wallet}`);
    const orders = await res.json();
    if(!orders.length){ el.innerHTML = '<div class="empty">Belum ada pesanan</div>'; return; }
    el.innerHTML = orders.map(renderOrderCard).join('');
  }catch(err){
    el.innerHTML = `<div class="empty">Gagal memuat: ${err.message}</div>`;
  }
}

function renderTimeline(status){
  const steps = ['CREATED','PROCESSING','SUCCESS'];
  const idx = steps.indexOf(status);
  const labels = ['Dipesan','Diproses','Selesai'];
  if(status === 'REFUNDED' || status === 'CANCELLED') {
    return `<div class="cod-banner" style="color:var(--red);border-color:var(--red)">Pesanan ${status==='CANCELLED'?'dibatalkan':'direfund'}</div>`;
  }
  return `<div class="timeline">
    ${steps.map((s,i) => `
      <div class="tl-step">
        ${i>0 ? `<div class="tl-line ${i<=idx?'done':''}"></div>` : ''}
        <div class="tl-dot ${i<idx?'done':''} ${i===idx?'active':''}"></div>
        <div class="tl-label">${labels[i]}</div>
      </div>
    `).join('')}
  </div>`;
}

function renderOrderCard(o){
  const items = JSON.parse(o.items_json || '[]');
  const namaTampil = items.length > 1 ? `${items[0]?.namaProduk||o.nama_produk} +${items.length-1} lainnya` : (o.nama_produk || 'Produk');

  return `
  <div class="card">
    <div class="card-hdr">
      <div>
        <div class="produk-nama">${namaTampil}</div>
        <div class="produk-sub">#${o.order_id.slice(0,10)}... · Rp${Number(o.harga_modal + o.fee_admin).toLocaleString('id-ID')}</div>
      </div>
      <div class="status-pill status-${o.onchain_status}">${o.onchain_status}</div>
    </div>

    ${renderTimeline(o.onchain_status)}

    ${o.resi ? `
    <div class="info-row"><span>No. Resi</span><span>${o.resi} ${o.ekspedisi?'('+o.ekspedisi+')':''}</span></div>
    ` : ''}

    ${o.alasan_reject ? `<div class="info-row"><span>Alasan</span><span>${o.alasan_reject}</span></div>` : ''}

    ${o.is_cod && o.onchain_status === 'PROCESSING' ? `
    <div class="cod-banner">📦 Pesanan COD — periksa barang saat kurir datang. Kalau sesuai, klik "Terima". Kalau rusak/tidak sesuai, klik "Tolak" (biaya admin tidak dikembalikan).</div>
    <div class="btn-row">
      <button class="btn btn-terima" onclick="konfirmasiCOD('${o.order_id}', true)">✅ Terima Barang</button>
      <button class="btn btn-tolak" onclick="konfirmasiCOD('${o.order_id}', false)">✖ Tolak Barang</button>
    </div>
    ` : ''}

    <div class="btn-row">
      ${o.resi ? `<button class="btn btn-lacak" onclick="window.open('https://cekresi.com/?noresi=${o.resi}','_blank')">📍 Lacak Paket</button>` : ''}
      ${o.onchain_status === 'CREATED' ? `<button class="btn btn-cancel" onclick="batalkanOrder('${o.order_id}')">✖ Batalkan Pesanan</button>` : ''}
    </div>
  </div>`;
}

async function batalkanOrder(orderId){
  if(!confirm('Batalkan pesanan ini? Dana akan direfund penuh.')) return;
  try{
    const gateway = new ethers.Contract(SC.ECOMMERCE_GATEWAY, GATEWAY_ABI, _signer);
    const tx = await gateway.cancelOrder(orderId);
    toast('Membatalkan...');
    await tx.wait();
    toast('Pesanan dibatalkan, dana sudah direfund.');
    muatRiwayat();
  }catch(err){
    toast('Gagal: ' + (err.reason || err.message));
  }
}

async function konfirmasiCOD(orderId, diterima){
  const pesan = diterima
    ? 'Konfirmasi barang sudah diterima & sesuai?'
    : 'Konfirmasi tolak barang (rusak/tidak sesuai)? Biaya admin tidak dikembalikan, sisanya direfund.';
  if(!confirm(pesan)) return;

  try{
    const gateway = new ethers.Contract(SC.ECOMMERCE_GATEWAY, GATEWAY_ABI, _signer);
    const tx = diterima
      ? await gateway.confirmCODReceived(orderId)
      : await gateway.confirmCODRejected(orderId);
    toast('Memproses konfirmasi...');
    await tx.wait();
    toast(diterima ? 'Terima kasih, pesanan selesai!' : 'Barang ditolak, dana produk direfund.');
    muatRiwayat();
  }catch(err){
    toast('Gagal: ' + (err.reason || err.message));
  }
}

// Auto-connect kalau wallet sudah terhubung sebelumnya di tab lain
if(window.ethereum && window.ethereum.selectedAddress){
  connectWallet();
}
</script>

</body>
</html>
