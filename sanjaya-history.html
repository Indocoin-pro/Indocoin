<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SINGGASANA SANJAYA — Riwayat</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Cinzel+Decorative:wght@400;700;900&family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#f5c842;--gold2:#e8a020;--dark:#0a0705;--dark2:#130e08;
  --text:#f0e0c0;--muted:#8a7060;--border:rgba(245,200,66,0.2);--card:rgba(19,14,8,0.97);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--dark);color:var(--text);font-family:'Crimson Text',serif;min-height:100vh;}
.bg-layer{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 0%,rgba(139,26,26,0.25) 0%,transparent 55%),
  linear-gradient(180deg,#0a0705 0%,#130e08 100%);}
.batik{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0.04;
  background-image:repeating-linear-gradient(45deg,var(--gold) 0,var(--gold) 1px,transparent 0,transparent 50%),
  repeating-linear-gradient(-45deg,var(--gold) 0,var(--gold) 1px,transparent 0,transparent 50%);
  background-size:20px 20px;}
.wrap{position:relative;z-index:2;max-width:480px;margin:0 auto;padding:0 0 30px;}
.topnav{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;
  background:rgba(5,3,2,0.97);backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(245,200,66,0.25);position:sticky;top:0;z-index:100;}
.btn-back{font-family:'Share Tech Mono',monospace;font-size:9px;padding:7px 14px;
  border:1px solid rgba(245,200,66,0.35);border-radius:20px;
  background:rgba(245,200,66,0.06);color:var(--gold);cursor:pointer;
  display:flex;align-items:center;gap:5px;text-decoration:none;}
.nav-brand{font-family:'Cinzel Decorative',serif;font-size:13px;font-weight:900;color:var(--gold);letter-spacing:2px;}
.page{padding:16px;}
.sec{font-family:'Cinzel',serif;font-size:10px;color:var(--muted);letter-spacing:3px;
  margin:16px 0 10px;display:flex;align-items:center;gap:8px;}
.sec::after{content:'';flex:1;height:1px;background:var(--border);}
.empty-state{text-align:center;padding:48px 20px;}
.empty-icon{font-size:48px;margin-bottom:12px;}
.empty-title{font-family:'Cinzel',serif;font-size:13px;color:var(--gold);margin-bottom:6px;}
.empty-sub{font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--muted);line-height:1.7;}
</style>
</head>
<body>
<div class="bg-layer"></div>
<div class="batik"></div>
<div class="wrap">
  <nav class="topnav">
    <a href="sanjaya.html" class="btn-back">← KEMBALI</a>
    <div class="nav-brand">📜 RIWAYAT</div>
    <div style="width:80px"></div>
  </nav>
  <div class="page">
    <div class="sec">📜 RIWAYAT RACE</div>
    <div class="empty-state">
      <div class="empty-icon">📜</div>
      <div class="empty-title">Belum Ada Riwayat</div>
      <div class="empty-sub">Kamu belum pernah mengikuti<br>ekspedisi ke Singgasana Sanjaya.<br><br>Ayo mulai petualanganmu!</div>
    </div>
  </div>
</div>
</body>
</html>
