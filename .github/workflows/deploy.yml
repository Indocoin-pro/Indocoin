name: Deploy to VPS
on:
  push:
    branches: [main]
    paths:
      - 'server.js'
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts
      - name: Copy server.js
        run: scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no server.js ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/root/indocoin/server.js
      - name: Restart PM2
        run: ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "pm2 restart indocoin"
