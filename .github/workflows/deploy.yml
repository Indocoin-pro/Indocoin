name: Deploy to VPS
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Create docs folder di VPS
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "mkdir -p /root/indocoin/docs"

      - name: Copy server.js ke VPS
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            server.js \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/root/indocoin/server.js

      - name: Copy price-feed.js ke VPS
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            price-feed.js \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/root/indocoin/price-feed.js

      - name: Copy semua PDF ke VPS
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            *.pdf \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/root/indocoin/docs/

      - name: Copy semua HTML ke VPS
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            *.html \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/root/indocoin/docs/

      - name: Restart price-feed
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "pm2 restart price-feed"
