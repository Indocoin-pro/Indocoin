<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INDOCOIN — SIGNAL TRADE</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root {
  --gold: #facc15; --gold2: #fbbf24; --gold3: #f59e0b;
  --dark: #0a0f1e; --dark2: #0f172a; --dark3: #1e293b;
  --text: #e2e8f0; --muted: #64748b;
  --accent: #f87171; --accentbg: rgba(248,113,113,0.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--dark); color: var(--text); font-family: 'Rajdhani', sans-serif; min-height: 100vh; overflow-x: hidden; display: flex; flex-direction: column; }
#bgLogo { position: fixed; inset: 0; z-index: 0; pointer-events: none; display: flex; align-items: center; justify-content: center; }
#bgLogo img { width: min(85vw,85vh); height: min(85vw,85vh); object-fit: contain; opacity: 0.03; filter: blur(2px); }
.star { position: fixed; background: #fff; border-radius: 50%; animation: twinkle var(--d) ease-in-out infinite alternate; z-index:0; }
@keyframes twinkle { from{opacity:.1} to{opacity:.7} }
.topnav { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; background: rgba(10,15,30,0.9); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(250,204,21,0.15); position: sticky; top: 0; z-index: 100; }
.nav-left { display: flex; align-items: center; gap: 10px; }
.nav-logo { width: 40px; height: 40px; border-radius: 50%; border: 2.5px solid rgba(255,255,255,0.85); box-shadow: 0 0 10px rgba(255,255,255,0.3); object-fit: cover; }
.nav-brand { display: flex; flex-direction: column; }
.nav-brand-main { font-family: 'Orbitron', sans-serif; font-size: 13px; font-weight: 900; color: var(--gold); letter-spacing: 2px; }
.nav-brand-sub { font-family: 'Share Tech Mono', monospace; font-size: 8px; color: var(--muted); letter-spacing: 1px; }
.btn-back { font-family: 'Share Tech Mono', monospace; font-size: 10px; color: var(--gold); text-decoration: none; letter-spacing: 1px; padding: 6px 12px; border: 1px solid rgba(250,204,21,0.3); border-radius: 20px; background: rgba(250,204,21,0.05); transition: all 0.2s; }
.btn-back:hover { background: rgba(250,204,21,0.12); }
.main { position: relative; z-index: 1; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 24px 100px; text-align: center; }
.cs-icon { font-size: 72px; margin-bottom: 24px; animation: float 3s ease-in-out infinite; }
@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
.cs-badge { font-family: 'Share Tech Mono', monospace; font-size: 9px; letter-spacing: 3px; color: var(--accent); background: var(--accentbg); border: 1px solid var(--accent); opacity: 0.85; padding: 5px 16px; border-radius: 20px; margin-bottom: 20px; display: inline-block; }
.cs-title { font-family: 'Orbitron', sans-serif; font-size: 26px; font-weight: 900; color: var(--accent); letter-spacing: 3px; margin-bottom: 8px; line-height: 1.2; }
.cs-sub { font-family: 'Share Tech Mono', monospace; font-size: 9px; color: var(--muted); letter-spacing: 2px; margin-bottom: 16px; }
.cs-desc { font-size: 15px; color: var(--muted); max-width: 320px; line-height: 1.7; margin-bottom: 36px; }
.cs-bar { width: 240px; height: 4px; background: var(--accentbg); border-radius: 2px; overflow: hidden; margin-bottom: 16px; }
.cs-bar-fill { height: 100%; width: 40%; background: linear-gradient(90deg, var(--accent), var(--gold)); border-radius: 2px; animation: progress 2.5s ease-in-out infinite alternate; }
@keyframes progress { from{width:20%} to{width:75%} }
.cs-notify { font-family: 'Share Tech Mono', monospace; font-size: 10px; color: var(--muted); letter-spacing: 0.5px; margin-bottom: 32px; }
.btn-home { font-family: 'Orbitron', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 2px; color: #0a0f1e; background: linear-gradient(135deg, var(--gold3), var(--gold)); border: none; border-radius: 25px; padding: 14px 32px; cursor: pointer; text-decoration: none; display: inline-block; box-shadow: 0 4px 20px rgba(250,204,21,0.3); transition: all 0.2s; }
.btn-home:hover { transform: translateY(-2px); box-shadow: 0 6px 28px rgba(250,204,21,0.45); }
.bottomnav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 100; background: rgba(5,10,25,0.97); backdrop-filter: blur(16px); border-top: 1px solid rgba(250,204,21,0.2); display: flex; height: 62px; }
.bnav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #6b7280; transition: all 0.2s; }
.bnav-item.active, .bnav-item:hover { color: var(--gold); }
.bnav-icon { font-size: 18px; }
.bnav-label { font-size: 7.5px; font-weight: 700; letter-spacing: 0.8px; font-family: 'Orbitron', sans-serif; }
</style>
</head>
<body>
<div id="bgLogo"><img src="1772782967104.png" alt="" onerror="this.style.display='none'"></div>
<nav class="topnav">
  <div class="nav-left">
    <a href="trade.html" class="btn-back">← BACK</a>
    <img src="1772782967104.png" class="nav-logo" alt="INDOCOIN" onerror="this.style.display='none'">
    <div class="nav-brand">
      <span class="nav-brand-main">INDOCOIN</span>
      <span class="nav-brand-sub">📡 SIGNAL TRADE</span>
    </div>
  </div>
</nav>
<div class="main">
  <div class="cs-icon">📡</div>
  <div class="cs-badge">⏳ COMING SOON</div>
  <div class="cs-title">SIGNAL TRADE</div>
  <div class="cs-sub">Intelligence Trade</div>
  <div class="cs-desc">Beli sinyal dari trader pro atau jual sinyalmu sendiri ke komunitas</div>
  <div class="cs-bar"><div class="cs-bar-fill"></div></div>
  <div class="cs-notify">Fitur ini sedang dalam pengembangan</div>
  <a href="trade.html" class="btn-home">← KEMBALI KE TRADE</a>
</div>
<nav class="bottomnav">
  <a href="dashboard.html" class="bnav-item"><span class="bnav-icon">🏠</span><span class="bnav-label">HOME</span></a>
  <a href="earn.html" class="bnav-item"><span class="bnav-icon">💰</span><span class="bnav-label">EARN</span></a>
  <a href="referral.html" class="bnav-item"><span class="bnav-icon">🌐</span><span class="bnav-label">REFERRAL</span></a>
  <a href="presale.html" class="bnav-item"><span class="bnav-icon">🚀</span><span class="bnav-label">PRESALE</span></a>
  <a href="community.html" class="bnav-item"><span class="bnav-icon">💬</span><span class="bnav-label">COMMUNITY</span></a>
</nav>
<script>
for(let i=0;i<20;i++){
  const s=document.createElement("div"); s.className="star";
  const sz=Math.random()*1.5+0.5;
  s.style.cssText="width:"+sz+"px;height:"+sz+"px;left:"+Math.random()*100+"%;top:"+Math.random()*100+"%;--d:"+(Math.random()*3+2)+"s;animation-delay:"+(Math.random()*3)+"s;";
  document.body.appendChild(s);
}
</script>
</body>
</html>
