<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Riwayat Transaksi — INDOCOIN PPOB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
<style>
:root{
  --bg:#080808;--bg2:#141414;--bg3:#1e1e1e;
  --gold:#c8922a;--gold2:#e8a830;--gold3:#f5c842;
  --text:#f0ebe3;--muted:#7a6a58;--muted2:#9a8870;
  --green:#2ea86a;--red:#c94040;--blue:#3d7ec9;
  --border:rgba(200,146,42,0.2);--border2:rgba(200,146,42,0.12);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{overflow-x:hidden;max-width:100vw;}
body{background:var(--bg);color:var(--text);font-family:'Share Tech Mono',monospace;min-height:100vh;padding-bottom:40px;}

.topbar{position:sticky;top:0;z-index:50;background:rgba(8,8,8,0.97);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);padding:14px 16px;display:flex;align-items:center;gap:10px;}
.topbar a{color:var(--muted2);text-decoration:none;font-size:18px;line-height:1;}
.topbar h1{font-family:'Orbitron',sans-serif;font-size:13px;font-weight:700;letter-spacing:1px;color:var(--text);}

.walletbar{padding:10px 16px;font-size:11px;color:var(--muted2);display:flex;justify-content:space-between;align-items:center;gap:8px;}
.walletbar .addr{font-family:'Share Tech Mono',monospace;color:var(--gold);}
.btn-connect{background:var(--gold);color:#080808;border:none;border-radius:8px;padding:6px 12px;
  font-family:'Orbitron',sans-serif;font-size:9px;font-weight:700;letter-spacing:0.5px;cursor:pointer;}

.filters{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:4px 12px 12px;}
.chip{background:var(--bg2);border:1px solid var(--border2);color:var(--muted2);
  border-radius:8px;padding:7px 2px;font-size:8.5px;font-family:'Orbitron',sans-serif;cursor:pointer;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;}
.chip.active{background:var(--gold);color:#080808;border-color:var(--gold);font-weight:700;}

#list{padding:0 16px;display:flex;flex-direction:column;gap:10px;}
.empty,.loading{text-align:center;padding:60px 20px;color:var(--muted);font-size:12px;}

.card{background:var(--bg2);border:1px solid var(--border2);border-radius:12px;padding:13px 14px;}
.card-top{display:flex;justify-content:space-between;align-items:start;gap:8px;}
.card-produk{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:14px;color:var(--text);flex:1;}
.badge{font-family:'Orbitron',sans-serif;font-size:9px;font-weight:700;padding:3px 8px;border-radius:6px;white-space:nowrap;}
.card-nomor{font-size:12px;color:var(--muted2);margin-top:4px;}
.card-sn{font-size:10px;color:var(--muted2);margin-top:6px;font-family:'Share Tech Mono',monospace;
  background:var(--bg);border:1px dashed var(--border2);border-radius:6px;padding:5px 8px;}
.card-sn b{color:var(--gold3);}
.card-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:8px;}
.card-tanggal{font-size:10px;color:var(--muted);}
.card-harga{font-family:'Orbitron',sans-serif;font-size:12px;font-weight:700;color:var(--gold);}

.card-error{font-size:10px;color:var(--red);margin-top:6px;background:rgba(201,64,64,0.08);
  border-radius:6px;padding:6px 8px;line-height:1.4;}

.btn-refund{margin-top:10px;width:100%;background:transparent;border:1px solid var(--red);color:var(--red);
  border-radius:8px;padding:9px;font-family:'Orbitron',sans-serif;font-size:10px;font-weight:700;
  letter-spacing:0.5px;cursor:pointer;}
.btn-refund:disabled{opacity:0.5;cursor:default;}
.btn-refund.loading{color:var(--muted);border-color:var(--border2);}

.btn-share{margin-top:10px;width:100%;background:transparent;border:1px solid var(--gold);color:var(--gold);
  border-radius:8px;padding:9px;font-family:'Orbitron',sans-serif;font-size:10px;font-weight:700;
  letter-spacing:0.5px;cursor:pointer;}
.btn-share:disabled{opacity:0.5;cursor:default;}

.bukti-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:200;
  align-items:center;justify-content:center;padding:20px;}
.bukti-overlay.show{display:flex;}
.bukti-box{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:16px;max-width:400px;width:100%;}
.bukti-box img{width:100%;border-radius:8px;display:block;}
.bukti-hint{text-align:center;font-size:11px;color:var(--muted2);margin-top:12px;line-height:1.5;}
.bukti-close{margin-top:14px;width:100%;background:var(--gold);color:#080808;border:none;border-radius:8px;
  padding:11px;font-family:'Orbitron',sans-serif;font-size:11px;font-weight:700;cursor:pointer;}

.note-pending{margin-top:8px;font-size:10px;color:var(--muted);font-style:italic;}
</style>
</head>
<body>

<div class="topbar">
  <a href="ppob.html">←</a>
  <h1>RIWAYAT TRANSAKSI</h1>
</div>

<div class="walletbar">
  <span id="walletLabel">Belum terhubung</span>
  <button class="btn-connect" id="btnConnect" onclick="connectWallet()">HUBUNGKAN</button>
</div>

<div class="filters">
  <button class="chip active" data-f="all" onclick="setFilter('all')">Semua</button>
  <button class="chip" data-f="Diproses" onclick="setFilter('Diproses')">Diproses</button>
  <button class="chip" data-f="Berhasil" onclick="setFilter('Berhasil')">Berhasil</button>
  <button class="chip" data-f="Gagal Terkirim" onclick="setFilter('Gagal Terkirim')">Gagal</button>
  <button class="chip" data-f="Direfund" onclick="setFilter('Direfund')">Direfund</button>
</div>

<div id="list"><div class="loading">Hubungkan wallet untuk melihat riwayat.</div></div>

<div class="bukti-overlay" id="buktiOverlay">
  <div class="bukti-box">
    <img id="buktiImg" alt="Bukti transaksi">
    <div class="bukti-hint">Tekan lama gambar untuk simpan/kirim. Kalau tidak bisa, pakai tombol download di bawah.</div>
    <a class="bukti-close" id="buktiDownload" download="bukti-indocoin.png" style="display:block;text-decoration:none;text-align:center;margin-top:10px;">💾 DOWNLOAD GAMBAR</a>
    <button class="bukti-close" style="background:transparent;border:1px solid var(--border);color:var(--muted2);margin-top:8px;" onclick="document.getElementById('buktiOverlay').classList.remove('show')">TUTUP</button>
  </div>
</div>

<script>
const API_BASE = 'https://ppob-api.indocoin.id';
let currentAddress = null;
let allOrders = [];
let activeFilter = 'all';
let ORDER_LOOKUP = {};

const WARNA_BADGE = {
  'Berhasil': 'var(--green)',
  'Direfund': 'var(--muted2)',
  'Diproses': 'var(--gold)',
  'Gagal Terkirim': 'var(--red)',
};

async function connectWallet(){
  if(typeof window.ethereum === 'undefined'){
    alert('Wallet (MetaMask / Trust Wallet) tidak terdeteksi di browser ini.');
    return;
  }
  try{
    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
    currentAddress = accounts[0];
    document.getElementById('walletLabel').textContent = currentAddress.slice(0,6) + '…' + currentAddress.slice(-4);
    document.getElementById('walletLabel').classList.add('addr');
    document.getElementById('btnConnect').style.display = 'none';
    muatRiwayat();
  }catch(err){
    console.error('Gagal connect wallet:', err);
  }
}

function setFilter(f){
  activeFilter = f;
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.dataset.f === f));
  render();
}

async function muatRiwayat(){
  const list = document.getElementById('list');
  list.innerHTML = '<div class="loading">Memuat riwayat...</div>';
  try{
    const res = await fetch(API_BASE + '/api/orders/history/' + currentAddress);
    const data = await res.json();
    allOrders = data.orders || [];
    render();
  }catch(err){
    console.error('Gagal muat riwayat:', err);
    list.innerHTML = '<div class="empty" style="color:var(--red);">Gagal memuat riwayat. Tarik untuk coba lagi.</div>';
  }
}

function render(){
  const list = document.getElementById('list');
  const orders = activeFilter === 'all' ? allOrders : allOrders.filter(o => o.status === activeFilter);

  if(orders.length === 0){
    list.innerHTML = '<div class="empty">Belum ada riwayat pesanan pada kategori ini.</div>';
    return;
  }

  ORDER_LOOKUP = {};
  orders.forEach(o => { ORDER_LOOKUP[o.orderId] = o; });

  list.innerHTML = orders.map(o => {
    const tanggal = new Date(o.createdAt).toLocaleString('id-ID', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
    const hargaTampil = o.harga != null ? 'Rp' + Number(o.harga).toLocaleString('id-ID') : '-';
    const warna = WARNA_BADGE[o.status] || 'var(--muted)';

    const snBaris = o.sn
      ? `<div class="card-sn">SN Bukti Transaksi: <b>${o.sn}</b></div>`
      : '';

    const errorBaris = (o.status === 'Gagal Terkirim' && o.lastError)
      ? `<div class="card-error">Alasan: ${escapeHtml(o.lastError)}</div>`
      : '';

    let tombolRefund = '';
    if(o.bisaRefundManual){
      tombolRefund = `<button class="btn-refund" onclick="refundManual('${o.orderId}', this)">AJUKAN REFUND</button>`;
    } else if(o.status === 'Diproses'){
      tombolRefund = `<div class="note-pending">Sedang diproses oleh provider — mohon tunggu, refund otomatis akan berjalan jika tidak kunjung selesai.</div>`;
    }

    const tombolShare = o.status === 'Berhasil'
      ? `<button class="btn-share" onclick="bagikanBukti('${o.orderId}')">📤 BAGIKAN BUKTI</button>`
      : '';

    return `
      <div class="card">
        <div class="card-top">
          <div class="card-produk">${escapeHtml(o.namaProduk)}</div>
          <div class="badge" style="color:${warna};background:${warna}22;">${o.status}</div>
        </div>
        <div class="card-nomor">${escapeHtml(o.nomorTujuan)}</div>
        ${snBaris}
        ${errorBaris}
        <div class="card-bottom">
          <div class="card-tanggal">${tanggal}</div>
          <div class="card-harga">${hargaTampil}</div>
        </div>
        ${tombolRefund}
        ${tombolShare}
      </div>`;
  }).join('');
}

async function refundManual(orderId, btnEl){
  if(!confirm('Ajukan refund untuk transaksi ini? Saldo akan dikembalikan penuh ke wallet kamu.')) return;
  btnEl.disabled = true;
  btnEl.classList.add('loading');
  btnEl.textContent = 'MEMPROSES...';
  try{
    const res = await fetch(API_BASE + '/api/orders/refund-manual', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ orderId, wallet: currentAddress }),
    });
    const data = await res.json();
    if(!res.ok || !data.success){
      alert(data.error || 'Refund gagal diproses. Coba lagi beberapa saat.');
      btnEl.disabled = false;
      btnEl.classList.remove('loading');
      btnEl.textContent = 'AJUKAN REFUND';
      return;
    }
    alert('Refund berhasil diajukan. Saldo akan masuk ke wallet kamu dalam beberapa saat.');
    muatRiwayat();
  }catch(err){
    console.error('Gagal refund manual:', err);
    alert('Terjadi kesalahan jaringan. Coba lagi.');
    btnEl.disabled = false;
    btnEl.classList.remove('loading');
    btnEl.textContent = 'AJUKAN REFUND';
  }
}

/**
 * Generate gambar bukti transaksi (struk) pakai canvas, lalu share
 * lewat Web Share API (buka menu share HP — bisa langsung pilih
 * WhatsApp dll). Kalau browser tidak dukung Web Share dengan file
 * (misal desktop), fallback ke download gambar biasa.
 */
async function bagikanBukti(orderId){
  const order = ORDER_LOOKUP[orderId];
  if(!order){ alert('Data transaksi tidak ditemukan.'); return; }

  try{
  const canvas = document.createElement('canvas');
  const W = 720, PAD = 40;
  canvas.width = W;
  const ctx = canvas.getContext('2d');

  // Ukur tinggi dulu berdasarkan konten (nama produk bisa panjang/wrap)
  ctx.font = '600 26px Rajdhani, sans-serif';
  const wrapProduk = wrapText(ctx, order.namaProduk, W - PAD*2);
  const tinggiProduk = wrapProduk.length * 32;
  const H = 560 + tinggiProduk;
  canvas.height = H;

  // Warna & font harus di-set ULANG setelah resize (canvas reset context)
  const bg = '#0a0a0a', gold = '#c8922a', gold3 = '#f5c842', text = '#f0ebe3', muted = '#7a6a58', green = '#2ea86a', border = 'rgba(200,146,42,0.25)';

  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // Border tipis di sekeliling
  ctx.strokeStyle = border;
  ctx.lineWidth = 2;
  ctx.strokeRect(6, 6, W-12, H-12);

  let y = 60;
  ctx.textAlign = 'center';

  // Header brand
  ctx.fillStyle = gold3;
  ctx.font = '900 30px Orbitron, sans-serif';
  ctx.fillText('INDOCOIN', W/2, y);
  y += 26;
  ctx.fillStyle = muted;
  ctx.font = '400 14px "Share Tech Mono", monospace';
  ctx.fillText('TOP UP & TAGIHAN', W/2, y);
  y += 40;

  // Badge sukses
  ctx.fillStyle = green;
  ctx.font = '700 20px Orbitron, sans-serif';
  ctx.fillText('✓ TRANSAKSI BERHASIL', W/2, y);
  y += 50;

  // Garis putus
  drawDashedLine(ctx, PAD, y, W-PAD, y, border);
  y += 45;

  // Nama produk (bisa multi baris)
  ctx.fillStyle = text;
  ctx.font = '600 26px Rajdhani, sans-serif';
  wrapProduk.forEach(line => { ctx.fillText(line, W/2, y); y += 32; });
  y += 10;

  // Nomor tujuan
  ctx.fillStyle = muted;
  ctx.font = '400 16px "Share Tech Mono", monospace';
  ctx.fillText(order.nomorTujuan, W/2, y);
  y += 45;

  drawDashedLine(ctx, PAD, y, W-PAD, y, border);
  y += 40;

  // Detail rows kiri-kanan
  ctx.textAlign = 'left';
  const rows = [
    ['Tanggal', new Date(order.createdAt).toLocaleString('id-ID', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' })],
    ['Total Bayar', order.harga != null ? 'Rp' + Number(order.harga).toLocaleString('id-ID') : '-'],
  ];
  if(order.sn) rows.push(['SN', order.sn]);

  rows.forEach(([label, value]) => {
    ctx.fillStyle = muted;
    ctx.font = '400 15px "Share Tech Mono", monospace';
    ctx.fillText(label, PAD, y);
    ctx.fillStyle = text;
    ctx.font = '700 15px "Share Tech Mono", monospace';
    ctx.textAlign = 'right';
    ctx.fillText(value, W-PAD, y);
    ctx.textAlign = 'left';
    y += 34;
  });

  y += 20;
  ctx.textAlign = 'center';
  ctx.fillStyle = muted;
  ctx.font = '400 12px "Share Tech Mono", monospace';
  ctx.fillText('Diverifikasi via indocoin.id', W/2, H-30);

  // Render font custom butuh delay kecil biar kepakai sebelum toDataURL
  // (kalau font belum sempat load, browser fallback ke font sistem —
  // tetap aman, cuma kurang cantik dikit, bukan gagal total)
  await new Promise(r => setTimeout(r, 50));

  canvas.toBlob(async (blob) => {
    if(!blob){ alert('Gagal membuat gambar bukti.'); return; }

    // Coba Web Share dulu (paling nyaman kalau didukung) — tapi DIBUNGKUS
    // try-catch ketat, dan APAPUN hasilnya (berhasil, gagal, atau tidak
    // didukung) selalu lanjut ke tampilan gambar di halaman sebagai jalan
    // aman — beberapa browser dalam-app (wallet dll) berperilaku aneh
    // dengan Web Share/download otomatis, jadi kita tidak pernah gantung
    // ke situ sendirian.
    let shareBerhasil = false;
    try{
      const file = new File([blob], `bukti-indocoin-${orderId.slice(2,10)}.png`, { type: 'image/png' });
      if(navigator.canShare && navigator.canShare({ files: [file] })){
        await navigator.share({
          files: [file],
          title: 'Bukti Transaksi INDOCOIN',
          text: `Bukti pembelian ${order.namaProduk} — ${order.nomorTujuan}`,
        });
        shareBerhasil = true;
      }
    }catch(err){
      // AbortError = user batal share, itu wajar, bukan error. Selain
      // itu, tetap lanjut ke fallback gambar, jangan biarkan user
      // kehilangan bukti transaksinya cuma karena Web Share bermasalah.
      console.warn('Web Share tidak berhasil/didukung, pakai fallback tampilan gambar:', err);
    }

    if(!shareBerhasil){
      // Pakai data URL (base64), BUKAN blob URL — banyak browser bawaan
      // wallet (Trust Wallet dll) membatasi/tidak mendukung long-press-
      // save untuk blob: URL, tapi data: URL didukung jauh lebih luas.
      const dataUrl = canvas.toDataURL('image/png');
      document.getElementById('buktiImg').src = dataUrl;
      const linkDownload = document.getElementById('buktiDownload');
      linkDownload.href = dataUrl;
      linkDownload.download = `bukti-indocoin-${orderId.slice(2,10)}.png`;
      document.getElementById('buktiOverlay').classList.add('show');
    }
  }, 'image/png');
  }catch(err){
    console.error('Gagal membuat bukti transaksi:', err);
    alert('Gagal membuat gambar bukti. Coba lagi.');
  }
}

function wrapText(ctx, text, maxWidth){
  const words = String(text).split(' ');
  const lines = [];
  let current = '';
  words.forEach(word => {
    const test = current ? current + ' ' + word : word;
    if(ctx.measureText(test).width > maxWidth && current){
      lines.push(current);
      current = word;
    } else {
      current = test;
    }
  });
  if(current) lines.push(current);
  return lines;
}

function drawDashedLine(ctx, x1, y, x2, y2, color){
  ctx.save();
  ctx.strokeStyle = color;
  ctx.setLineDash([6, 6]);
  ctx.beginPath();
  ctx.moveTo(x1, y);
  ctx.lineTo(x2, y2);
  ctx.stroke();
  ctx.restore();
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str == null ? '' : String(str);
  return d.innerHTML;
}

if(typeof window.ethereum !== 'undefined'){
  window.ethereum.request({ method: 'eth_accounts' }).then(accounts => {
    if(accounts.length > 0) connectWallet();
  });
  window.ethereum.on('accountsChanged', () => connectWallet());
}
</script>
</body>
</html>
