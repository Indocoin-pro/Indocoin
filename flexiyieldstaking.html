<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INDOCOIN — Dynamic Level Staking</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
<style>
:root{
  --gold:#facc15;--gold2:#fbbf24;--gold3:#f59e0b;
  --dark:#0a0f1e;--dark2:#0f172a;--dark3:#1e293b;--dark4:#162032;
  --text:#e2e8f0;--muted:#64748b;--green:#22c55e;--blue:#3b82f6;--red:#ef4444;
  --purple:#a855f7;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--dark);color:var(--text);font-family:'Rajdhani',sans-serif;min-height:100vh;overflow-x:hidden;}
#bgLogo{position:fixed;inset:0;z-index:0;pointer-events:none;display:flex;align-items:center;justify-content:center;}
#bgLogo img{width:min(85vw,85vh);opacity:0.03;filter:blur(2px);}
.star{position:fixed;background:white;border-radius:50%;pointer-events:none;animation:twinkle var(--d,3s) infinite alternate;}
@keyframes twinkle{from{opacity:0.1}to{opacity:0.6}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes goldShimmer{0%{background-position:0% center}100%{background-position:300% center}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}
@keyframes pulseGold{0%,100%{box-shadow:0 0 0 0 rgba(250,204,21,0.4)}50%{box-shadow:0 0 0 6px rgba(250,204,21,0)}}

/* ── TOPNAV ── */
.topnav{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:rgba(10,15,30,0.97);backdrop-filter:blur(16px);border-bottom:1px solid rgba(250,204,21,0.15);position:sticky;top:0;z-index:100;}
.nav-left{display:flex;align-items:center;gap:10px;}
.nav-logo{width:38px;height:38px;border-radius:50%;border:2px solid #fff;object-fit:cover;flex-shrink:0;box-shadow:0 0 12px rgba(255,255,255,0.15);}
.nav-logo-fb{width:38px;height:38px;border-radius:50%;border:2px solid #fff;background:linear-gradient(135deg,#1e3a8a,#0f172a);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.nav-brand-main{font-family:'Orbitron',sans-serif;font-size:13px;font-weight:900;background:linear-gradient(90deg,#f59e0b,#facc15,#fef08a,#facc15,#f59e0b);background-size:300% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:goldShimmer 3s linear infinite;letter-spacing:2px;display:block;}
.nav-brand-sub{font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--gold);letter-spacing:2px;opacity:0.7;display:block;}
.nav-right{display:flex;align-items:center;gap:8px;}
.wallet-chip{font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--green);background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.3);padding:5px 10px;border-radius:20px;display:none;}
.btn-connect{font-family:'Orbitron',sans-serif;font-size:9px;font-weight:700;padding:6px 12px;border-radius:20px;border:1px solid rgba(250,204,21,0.4);background:rgba(250,204,21,0.1);color:var(--gold);cursor:pointer;letter-spacing:1px;}
.pool-badge{font-family:'Share Tech Mono',monospace;font-size:9px;padding:5px 10px;border-radius:20px;letter-spacing:1px;display:flex;align-items:center;gap:5px;background:rgba(34,197,94,0.15);border:1px solid rgba(34,197,94,0.4);color:var(--green);}
.pool-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:blink 1s infinite;}

/* ── LAYOUT ── */
.layout{position:relative;z-index:1;}
.main{padding:16px 16px 110px;max-width:480px;margin:0 auto;width:100%;}

/* ── LEVEL SCROLL TABS ── */
.level-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none;}
.level-tabs::-webkit-scrollbar{display:none;}
.level-tab{flex-shrink:0;padding:8px 14px;border-radius:12px;cursor:pointer;transition:all 0.25s;border:2px solid rgba(255,255,255,0.15);background:rgba(0,0,0,0.2);text-align:center;}
.level-tab-num{font-family:'Orbitron',sans-serif;font-size:10px;font-weight:700;color:var(--muted);}
.level-tab-roi{font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--muted);margin-top:1px;}
.level-tab.active{background:rgba(250,204,21,0.12);border-color:rgba(255,255,255,0.7);}
.level-tab.active .level-tab-num,.level-tab.active .level-tab-roi{color:var(--gold);}
.level-tab.locked{opacity:0.4;cursor:not-allowed;}
.level-tab.unlocked:not(.active){border-color:rgba(255,255,255,0.3);}

/* ── LEVEL CONTENT ── */
.level-content{display:none;}
.level-content.active{display:block;animation:fadeUp 0.25s ease both;}

/* ── INFO CARD ── */
.info-card{background:linear-gradient(135deg,#0d2557,#0a1628,#0f1f3d);border:2px solid rgba(255,255,255,0.55);border-radius:18px;padding:16px;margin-bottom:12px;position:relative;overflow:hidden;width:100%;}
.info-card::before{content:'';position:absolute;top:-40px;right:-40px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,rgba(250,204,21,0.07),transparent);pointer-events:none;}
.info-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;}
.info-title{font-family:'Orbitron',sans-serif;font-size:15px;font-weight:900;color:var(--gold);}
.info-subtitle{font-size:12px;color:var(--muted);margin-top:2px;}
.badge-aktif{background:rgba(34,197,94,0.15);border:1px solid rgba(34,197,94,0.3);color:var(--green);font-family:'Share Tech Mono',monospace;font-size:9px;padding:4px 10px;border-radius:20px;letter-spacing:1px;white-space:nowrap;}
.badge-locked{background:rgba(100,116,139,0.15);border:1px solid rgba(100,116,139,0.3);color:var(--muted);font-family:'Share Tech Mono',monospace;font-size:9px;padding:4px 10px;border-radius:20px;letter-spacing:1px;white-space:nowrap;}
.info-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;}
.info-stat{background:rgba(0,0,0,0.3);border:2px solid rgba(255,255,255,0.1);border-radius:10px;padding:10px;text-align:center;}
.info-stat-val{font-family:'Orbitron',sans-serif;font-size:17px;font-weight:700;color:var(--gold);}
.info-stat-lbl{font-family:'Share Tech Mono',monospace;font-size:8px;color:var(--muted);letter-spacing:1px;margin-top:2px;text-transform:uppercase;}

/* ── UNLOCK PROGRESS ── */
.unlock-bar-wrap{margin-bottom:12px;}
.unlock-bar-top{display:flex;justify-content:space-between;margin-bottom:5px;}
.unlock-bar-lbl{font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:1px;}
.unlock-bar-pct{font-family:'Orbitron',sans-serif;font-size:10px;color:var(--gold);}
.unlock-bar-bg{height:6px;background:rgba(255,255,255,0.08);border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,0.1);}
.unlock-bar-fill{height:100%;background:linear-gradient(90deg,var(--gold3),var(--gold));border-radius:10px;transition:width 0.5s ease;}

/* ── SECTION DIVIDER ── */
.sec-div{font-family:'Orbitron',sans-serif;font-size:10px;color:var(--gold);letter-spacing:2px;margin:12px 0 8px;display:flex;align-items:center;gap:8px;width:100%;}
.sec-div::after{content:'';flex:1;height:1px;background:rgba(255,255,255,0.1);}

/* ── FORM CARD ── */
.form-card{background:var(--dark4);border:2px solid rgba(255,255,255,0.55);border-radius:14px;padding:14px;width:100%;margin-bottom:4px;}
.input-row{display:flex;gap:8px;margin-bottom:10px;width:100%;}
.input-wrap{flex:1;}
.input-wrap input{width:100%;padding:12px 14px;background:rgba(0,0,0,0.35);border:1px solid rgba(255,255,255,0.15);border-radius:10px;color:white;font-family:'Rajdhani',sans-serif;font-size:15px;outline:none;transition:border-color 0.3s;}
.input-wrap input:focus{border-color:rgba(255,255,255,0.5);}
.input-wrap input::placeholder{color:var(--muted);}
.input-wrap input:disabled{opacity:0.4;cursor:not-allowed;}
.usdt-bal{background:rgba(250,204,21,0.06);border:2px solid rgba(255,255,255,0.4);border-radius:10px;padding:8px 12px;min-width:80px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px;}
.ubl{font-family:'Share Tech Mono',monospace;font-size:8px;color:var(--muted);letter-spacing:1px;}
.ubv{font-family:'Orbitron',sans-serif;font-size:12px;font-weight:700;color:var(--gold);}
.btn-approve{width:100%;padding:12px;margin-bottom:8px;background:rgba(34,197,94,0.1);border:2px solid rgba(255,255,255,0.5);color:var(--green);border-radius:10px;font-family:'Orbitron',sans-serif;font-size:11px;font-weight:700;letter-spacing:1px;cursor:pointer;transition:all 0.3s;}
.btn-approve:hover{background:rgba(34,197,94,0.2);}
.btn-approve:disabled{opacity:0.4;cursor:not-allowed;}
.btn-stake{width:100%;padding:14px;background:linear-gradient(135deg,var(--gold),var(--gold3));color:#000;border:none;border-radius:10px;font-family:'Orbitron',sans-serif;font-size:13px;font-weight:700;letter-spacing:2px;cursor:pointer;transition:all 0.3s;box-shadow:0 4px 18px rgba(250,204,21,0.25);}
.btn-stake:hover{box-shadow:0 4px 30px rgba(250,204,21,0.5);transform:translateY(-1px);}
.btn-stake:disabled{opacity:0.4;cursor:not-allowed;transform:none;}
.status-msg{text-align:center;font-family:'Share Tech Mono',monospace;font-size:10px;margin-top:8px;color:var(--muted);min-height:18px;}
.status-msg.ok{color:var(--green);}
.status-msg.err{color:var(--red);}
.status-msg.info{color:var(--gold);}

/* ── LOCK OVERLAY ── */
.lock-overlay{background:rgba(0,0,0,0.5);border:2px solid rgba(255,255,255,0.2);border-radius:14px;padding:24px;text-align:center;width:100%;margin-bottom:4px;}
.lock-icon{font-size:36px;margin-bottom:8px;}
.lock-title{font-family:'Orbitron',sans-serif;font-size:13px;color:var(--muted);letter-spacing:1px;margin-bottom:6px;}
.lock-desc{font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--muted);line-height:1.7;}

/* ── KALKULATOR ── */
.calc-input{width:100%;padding:12px 14px;background:rgba(0,0,0,0.35);border:1px solid rgba(255,255,255,0.15);border-radius:10px;color:white;font-family:'Rajdhani',sans-serif;font-size:15px;outline:none;transition:border-color 0.3s;margin-bottom:10px;}
.calc-input:focus{border-color:rgba(255,255,255,0.5);}
.calc-input::placeholder{color:var(--muted);}
.calc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;width:100%;}
.calc-item{background:rgba(0,0,0,0.3);border:2px solid rgba(255,255,255,0.1);border-radius:10px;padding:10px;text-align:center;}
.calc-val{font-family:'Orbitron',sans-serif;font-size:13px;font-weight:700;color:var(--gold);}
.calc-lbl{font-family:'Share Tech Mono',monospace;font-size:8px;color:var(--muted);letter-spacing:1px;margin-top:2px;text-transform:uppercase;}
.calc-total{background:rgba(250,204,21,0.06);border:2px solid rgba(255,255,255,0.4);border-radius:10px;padding:11px 14px;display:flex;justify-content:space-between;align-items:center;width:100%;}
.calc-total span{font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--muted);}
.calc-total strong{font-family:'Orbitron',sans-serif;font-size:15px;color:var(--gold);}

/* ── INNER TABS ── */
.inner-tabs{display:flex;gap:6px;margin:12px 0 8px;width:100%;}
.inner-tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 8px;border-radius:12px;cursor:pointer;transition:all 0.25s;border:2px solid rgba(255,255,255,0.2);background:rgba(0,0,0,0.2);flex:1;}
.inner-tab-icon{font-size:16px;line-height:1;}
.inner-tab-label{font-family:'Share Tech Mono',monospace;font-size:8px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;text-align:center;}
.inner-tab.active{background:rgba(250,204,21,0.1);border-color:rgba(255,255,255,0.8);}
.inner-tab.active .inner-tab-label{color:var(--gold);}
.inner-tab:hover:not(.active){background:rgba(255,255,255,0.04);}

/* ── INNER CONTENT ── */
.inner-content{display:none;}
.inner-content.active{display:block;animation:fadeUp 0.2s ease both;}

/* ── RIWAYAT ── */
.empty-state{text-align:center;padding:24px;color:var(--muted);font-size:12px;font-family:'Share Tech Mono',monospace;}
.stake-item{background:rgba(0,0,0,0.25);border:2px solid rgba(255,255,255,0.55);border-radius:12px;padding:14px;margin-bottom:10px;border-left:4px solid var(--gold);}
.si-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.si-name{font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--gold);letter-spacing:1px;}
.si-badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:10px;}
.si-badge.active{background:rgba(34,197,94,0.15);color:var(--green);}
.si-badge.pending{background:rgba(168,85,247,0.15);color:var(--purple);}
.si-badge.done{background:rgba(250,204,21,0.15);color:var(--gold);}
.si-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px;width:100%;}
.si-left{text-align:left;}
.si-right{text-align:right;}
.si-lbl{font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:1px;display:block;}
.si-val{color:var(--text);display:block;font-size:13px;font-weight:700;margin-top:2px;}

/* PROGRESS BAR di riwayat */
.progress-wrap{margin-bottom:10px;}
.progress-top{display:flex;justify-content:space-between;margin-bottom:4px;}
.progress-lbl{font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--muted);}
.progress-pct{font-family:'Orbitron',sans-serif;font-size:10px;color:var(--gold);}
.progress-bg{height:8px;background:rgba(255,255,255,0.06);border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,0.1);}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--gold3),var(--gold));border-radius:10px;transition:width 0.5s;}

.accrued-box{background:rgba(250,204,21,0.06);border:1px solid rgba(250,204,21,0.2);border-radius:8px;padding:8px 12px;text-align:center;margin-bottom:10px;}
.accrued-lbl{font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:1px;}
.accrued-val{font-family:'Orbitron',sans-serif;font-size:16px;color:var(--gold);margin-top:3px;}

.btn-row{display:flex;gap:8px;margin-top:4px;}
.btn-claim{flex:1;padding:11px;background:linear-gradient(135deg,var(--blue),#1d4ed8);color:white;border:none;border-radius:10px;font-family:'Orbitron',sans-serif;font-size:11px;font-weight:700;cursor:pointer;transition:all 0.3s;}
.btn-claim:disabled{opacity:0.4;cursor:not-allowed;}
.btn-early{flex:1;padding:10px;background:rgba(239,68,68,0.1);border:2px solid rgba(255,255,255,0.3);color:var(--red);border-radius:10px;font-family:'Orbitron',sans-serif;font-size:10px;font-weight:700;cursor:pointer;}

/* ── INFO SYARAT ── */
.info-sec-title{font-family:'Orbitron',sans-serif;font-size:9px;color:var(--gold);letter-spacing:2px;margin:14px 0 8px;display:flex;align-items:center;gap:6px;}
.info-sec-title::after{content:'';flex:1;height:1px;background:rgba(255,255,255,0.1);}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;width:100%;}
.info-box-card{background:rgba(0,0,0,0.25);border:2px solid rgba(255,255,255,0.12);border-radius:12px;padding:12px 10px;text-align:center;transition:all 0.2s;}
.info-box-card:hover{border-color:rgba(255,255,255,0.3);}
.info-box-icon{font-size:18px;margin-bottom:4px;}
.info-box-val{font-family:'Orbitron',sans-serif;font-size:14px;font-weight:700;color:var(--gold);margin-bottom:2px;}
.info-box-lbl{font-family:'Share Tech Mono',monospace;font-size:8px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;}
.info-box-full{background:rgba(0,0,0,0.2);border:2px solid rgba(255,255,255,0.1);border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;width:100%;}
.info-box-full:hover{border-color:rgba(255,255,255,0.25);}
.info-bf-left{display:flex;align-items:center;gap:8px;}
.info-bf-icon{font-size:16px;}
.info-bf-lbl{font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--muted);}
.info-bf-val{font-family:'Orbitron',sans-serif;font-size:13px;font-weight:700;color:var(--text);}
.info-bf-val.red{color:var(--red);}
.info-bf-val.green{color:var(--green);}
.info-bf-val.purple{color:var(--purple);}
.cara-kerja{background:rgba(250,204,21,0.04);border:2px solid rgba(255,255,255,0.1);border-radius:12px;padding:12px 14px;margin-top:4px;}
.ck-step{display:flex;align-items:flex-start;gap:10px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.06);}
.ck-step:last-child{border-bottom:none;}
.ck-num{font-family:'Orbitron',sans-serif;font-size:10px;font-weight:700;color:#000;background:var(--gold);width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}
.ck-text{font-size:12px;color:var(--muted);line-height:1.6;}
.ck-text b{color:var(--gold);}

/* ── LEVEL UNLOCK GRID ── */
.level-unlock-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px;}
.lug-item{background:rgba(0,0,0,0.25);border:1px solid rgba(255,255,255,0.08);border-radius:10px;padding:8px 6px;text-align:center;}
.lug-item.done{border-color:rgba(34,197,94,0.3);background:rgba(34,197,94,0.06);}
.lug-item.current{border-color:rgba(250,204,21,0.4);background:rgba(250,204,21,0.08);animation:pulseGold 2s infinite;}
.lug-lbl{font-family:'Share Tech Mono',monospace;font-size:8px;color:var(--muted);letter-spacing:1px;}
.lug-val{font-family:'Orbitron',sans-serif;font-size:11px;color:var(--gold);margin-top:2px;font-weight:700;}
.lug-status{font-size:12px;margin-top:2px;}

/* ── POOL INFO BAR ── */
.pool-bar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px;width:100%;}
.pool-bar-item{background:rgba(0,0,0,0.3);border:2px solid rgba(255,255,255,0.12);border-radius:12px;padding:10px;text-align:center;}
.pbi-val{font-family:'Orbitron',sans-serif;font-size:13px;font-weight:700;color:var(--gold);}
.pbi-lbl{font-family:'Share Tech Mono',monospace;font-size:8px;color:var(--muted);letter-spacing:1px;margin-top:2px;text-transform:uppercase;}

/* ── LEVEL PROGRESS TRACKER ── */
.lvl-tracker{background:rgba(0,0,0,0.25);border:2px solid rgba(255,255,255,0.2);border-radius:14px;padding:14px;margin-bottom:14px;}
.lvl-tracker-title{font-family:'Orbitron',sans-serif;font-size:10px;color:var(--gold);letter-spacing:2px;margin-bottom:10px;}
.lvl-track-row{display:flex;align-items:center;gap:4px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;}
.lvl-track-row::-webkit-scrollbar{display:none;}
.lvl-node{display:flex;flex-direction:column;align-items:center;gap:4px;flex-shrink:0;}
.lvl-node-circle{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Orbitron',sans-serif;font-size:9px;font-weight:700;border:2px solid rgba(255,255,255,0.2);background:rgba(0,0,0,0.3);color:var(--muted);cursor:pointer;transition:all 0.3s;}
.lvl-node-circle.done{background:rgba(34,197,94,0.2);border-color:var(--green);color:var(--green);}
.lvl-node-circle.current{background:rgba(250,204,21,0.15);border-color:var(--gold);color:var(--gold);box-shadow:0 0 10px rgba(250,204,21,0.3);}
.lvl-node-circle.locked{opacity:0.35;}
.lvl-node-lbl{font-family:'Share Tech Mono',monospace;font-size:7px;color:var(--muted);letter-spacing:0.5px;}
.lvl-connector{flex:1;height:2px;background:rgba(255,255,255,0.08);min-width:8px;flex-shrink:1;}
.lvl-connector.done{background:var(--green);}

/* ── REWARD SUMMARY ── */
.reward-summary{background:linear-gradient(135deg,rgba(250,204,21,0.08),rgba(245,158,11,0.04));border:2px solid rgba(255,255,255,0.3);border-radius:14px;padding:14px;margin-bottom:12px;}

function renderTabs() {
  const wrap = document.getElementById('levelTabs');

    const unlocked = levelUnlocked[i];
    const cls = unlocked ? (i === activeLevel-1 ? 'active unlocked' : 'unlocked') : 'locked';
    const icon = levelCompleted[i] ? '✅' : (unlocked ? '' : '🔒');
    return `<div class="level-tab ${cls}" onclick="switchLevel(${l.id})">
      <div class="level-tab-num">${icon} LVL ${l.id}</div>
      <div class="level-tab-roi">${l.roi} ROI</div>
    </div>`;
  }).join('');

  // Render level tracker
  const tracker = document.getElementById('lvlTrackRow');
  if (tracker) {
    let html = '';
    LEVELS.forEach((l,i) => {
      const done    = levelCompleted[i];
      const current = levelUnlocked[i] && !levelCompleted[i];
      const locked  = !levelUnlocked[i];
      const cls = done ? 'done' : (current ? 'current' : 'locked');
      html += `<div class="lvl-node">
        <div class="lvl-node-circle ${cls}" onclick="switchLevel(${l.id})">${done ? '✓' : l.id}</div>
        <div class="lvl-node-lbl">${l.roi}</div>
      </div>`;
      if (i < LEVELS.length-1) {
        html += `<div class="lvl-connector ${done ? 'done' : ''}"></div>`;

    });
    tracker.innerHTML = html;

}

// ── Switch Level ──
function switchLevel(n) {
  if (!levelUnlocked[n-1]) {
    showToast('🔒', `Level ${n} masih terkunci!`); return;
  }
  activeLevel = n;
  document.querySelectorAll('.level-content').forEach((c,i) => c.classList.toggle('active', i===n-1));
  document.querySelectorAll('.level-tab').forEach((t,i) => {
    t.classList.toggle('active', i===n-1);
  });
  // Scroll tab ke posisi aktif
  const tab = document.querySelectorAll('.level-tab')[n-1];
  if(tab) tab.scrollIntoView({behavior:'smooth', block:'nearest', inline:'center'});
}

// ── Switch Inner Tab ──
function switchInner(lv, tab) {
  ['riwayat','info'].forEach(t => {
    document.getElementById(`lv${lv}-${t}`).classList.toggle('active', t===tab);
    document.getElementById(`itab${lv}${t}`).classList.toggle('active', t===tab);
  });
}

// ── Kalkulator ──
function calcReward(lv, val, roiPct, feePct) {
  const u = parseFloat(val)||0;
  const gross = u * roiPct / 100;
  const fee   = gross * feePct / 100;
  const net   = gross - fee;
  const days  = u > 0 ? Math.ceil(roiPct / 0.5) : 0; // estimasi ~0.5%/hari
  document.getElementById('cg'+lv).textContent = '$'+gross.toFixed(2);
  document.getElementById('cf'+lv).textContent = '$'+fee.toFixed(2);
  document.getElementById('cn'+lv).textContent = '$'+net.toFixed(2);
  document.getElementById('cd'+lv).textContent = days > 0 ? '~'+days+'hr' : '—';
  document.getElementById('ct'+lv).textContent = '$'+(u+net).toFixed(2)+' USDT';
}

// ── Connect Wallet ──
async function connectWallet() {
  if (!window.ethereum) { showToast('⚠️','Install MetaMask!'); return; }
  try {
    await window.ethereum.request({method:'eth_requestAccounts'});
    provider = new ethers.providers.Web3Provider(window.ethereum, 'any');
    signer   = provider.getSigner();
    const cid = parseInt(await window.ethereum.request({method:'eth_chainId'}),16);
    if (cid !== 56) {
      try { await window.ethereum.request({method:'wallet_switchEthereumChain',params:[{chainId:'0x38'}]}); }
      catch(e){}
      provider = new ethers.providers.Web3Provider(window.ethereum,'any');
      signer   = provider.getSigner();
    }
    myAddr = await signer.getAddress();
    contract     = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, signer);
    indcContract = new ethers.Contract(INDC_ADDRESS, INDC_ABI, signer);

    document.getElementById('walletChip').style.display = 'block';
    document.getElementById('walletChip').textContent   = myAddr.slice(0,6)+'…'+myAddr.slice(-4);
    document.getElementById('btnConnect').style.display = 'none';

    showToast('✅','Wallet terhubung!');
    await loadChainData();
    window.ethereum.on('accountsChanged', ()=>location.reload());
  } catch(e) { console.error(e); showToast('❌','Gagal connect'); }
}

// ── Load Data dari SC ──
async function loadChainData() {
  if (!contract || !myAddr) return;
  try {
    // Load level status
    const [unlocked, completed] = await contract.getUserLevelStatus(myAddr);
    levelUnlocked  = Array.from(unlocked);
    levelCompleted = Array.from(completed);

    // Re-render dengan data terbaru
    renderTabs();
    renderContent();

    // Load saldo USDT
    const usdtContract = new ethers.Contract(USDT_ADDRESS, INDC_ABI, signer);
    const bal = await usdtContract.balanceOf(myAddr);
    const balFmt = parseFloat(ethers.utils.formatUnits(bal, 18)).toFixed(2);
    LEVELS.forEach(l => {
      const el = document.getElementById('bal'+l.id);
      if (el) el.textContent = balFmt;
    });

    // Load pool info
    try {
      const pool = await contract.getPoolInfo();
      const poolBal = parseFloat(ethers.utils.formatUnits(pool.poolBalance, 18)).toFixed(0);
      document.getElementById('poolBal').textContent = '$'+parseInt(poolBal).toLocaleString();
      document.getElementById('poolStatus').textContent = pool.stakingOpen ? 'OPEN' : 'CLOSED';
      document.getElementById('poolStatus').style.color = pool.stakingOpen ? 'var(--green)' : 'var(--red)';
    } catch(e) {}

    // Reward summary
    const stakes = await contract.getUserStakes(myAddr);
    const activeStakes = stakes.filter(s => !s.claimed && !s.withdrawn).length;
    const highestLevel = levelUnlocked.lastIndexOf(true) + 1;
    const nextLevel    = Math.min(highestLevel + 1, 9);

    document.getElementById('rewardSummary').style.display = 'block';
    document.getElementById('rsActiveStake').textContent = activeStakes;
    document.getElementById('rsLevelReached').textContent = 'LVL '+highestLevel;
    document.getElementById('rsNextLevel').textContent = highestLevel < 9 ? 'LVL '+nextLevel : 'MAX 🏆';
    document.getElementById('totalStakers').textContent = stakes.length+' stake';

    // Total accrued semua stake
    let totalAccrued = 0;
    for(let i=0; i<stakes.length; i++){
      if(!stakes[i].claimed && !stakes[i].withdrawn){
        try{
          const a = await contract.getAccruedReward(myAddr, i);
          totalAccrued += parseFloat(ethers.utils.formatUnits(a.accrued,18));
        }catch(e){}
      }
    }
    document.getElementById('rsAccrued').textContent = '$'+totalAccrued.toFixed(4);

    // Load riwayat stake
    await loadStakes();
  } catch(e) { console.warn('loadChainData error:', e); }
}

// ── Load Riwayat Stake ──
async function loadStakes() {
  if (!contract || !myAddr) return;
  try {
    const stakes = await contract.getUserStakes(myAddr);
    // Kelompokkan per level
    const byLevel = {};
    LEVELS.forEach(l => { byLevel[l.id] = []; });

    stakes.forEach((s, idx) => {
      const lv = s.level + 1; // SC 0-based
      if (byLevel[lv]) byLevel[lv].push({...s, idx});
    });

    for (const [lv, list] of Object.entries(byLevel)) {
      const emptyEl = document.getElementById('emptyStake'+lv);
      const listEl  = document.getElementById('stakeList'+lv);
      if (!emptyEl || !listEl) continue;

      if (!list.length) {
        emptyEl.style.display = 'block';
        listEl.innerHTML = '';
        continue;
      }
      emptyEl.style.display = 'none';

      listEl.innerHTML = await Promise.all(list.map(async (s) => {
        const accr = await contract.getAccruedReward(myAddr, s.idx);
        const accrued = parseFloat(ethers.utils.formatUnits(accr.accrued, 18)).toFixed(4);
        const pct     = accr.progressPct.toNumber();
        const roiDone = accr.roiReached;
        const amount  = parseFloat(ethers.utils.formatUnits(s.amount, 18)).toFixed(2);
        const start   = new Date(s.startTime.toNumber()*1000).toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'});
        const status  = s.claimed ? 'done' : (s.rewardPending ? 'pending' : 'active');
        const statusTxt = s.claimed ? 'SELESAI' : (s.rewardPending ? 'PENDING' : 'AKTIF');

        return `<div class="stake-item">
          <div class="si-top">
            <span class="si-name">📈 LEVEL ${lv} — Stake #${s.idx+1}</span>
            <span class="si-badge ${status}">${statusTxt}</span>
          </div>
          <div class="si-grid">
            <div class="si-left"><span class="si-lbl">MODAL STAKE</span><span class="si-val">$${amount}</span></div>
            <div class="si-right"><span class="si-lbl">REWARD BERJALAN</span><span class="si-val">$${accrued}</span></div>
            <div class="si-left"><span class="si-lbl">MULAI</span><span class="si-val">${start}</span></div>
            <div class="si-right"><span class="si-lbl">PROGRESS</span><span class="si-val" style="color:var(--gold)">${pct}%</span></div>
          </div>
          <div class="progress-wrap">
            <div class="progress-top">
              <span class="progress-lbl">📈 ROI PROGRESS</span>
              <span class="progress-pct">${pct}%</span>
            </div>
            <div class="progress-bg"><div class="progress-fill" style="width:${pct}%"></div></div>
          </div>
          <div class="accrued-box">
            <div class="accrued-lbl">💰 REWARD TERAKUMULASI</div>
            <div class="accrued-val">$${accrued} USDT</div>
          </div>
          <div class="btn-row">
            <button class="btn-claim" onclick="doClaim(${s.idx})" ${!roiDone || s.claimed ? 'disabled' : ''}>
              ${roiDone ? '✅ KLAIM REWARD' : '⏳ BELUM SIAP'}
            </button>
            <button class="btn-early" onclick="doEarlyWithdraw(${s.idx})" ${s.claimed || s.withdrawn ? 'disabled' : ''}>
              ⚠️ EARLY WITHDRAW
            </button>
          </div>
          ${s.rewardPending ? `<button style="width:100%;margin-top:8px;padding:10px;background:rgba(168,85,247,0.1);border:1px solid rgba(168,85,247,0.3);color:var(--purple);border-radius:10px;font-family:'Orbitron',sans-serif;font-size:11px;font-weight:700;cursor:pointer;" onclick="doClaimPending(${s.idx})">🔮 KLAIM PENDING REWARD</button>` : ''}
        </div>`;
      })).then(arr => arr.join(''));
    }
  } catch(e) { console.warn('loadStakes error:', e); }
}

// ── Approve USDT ──
async function doApprove(lv) {
  if (!indcContract) { showToast('🔗','Connect wallet dulu!'); return; }
  const inp = document.getElementById('inp'+lv);
  const val = parseFloat(inp.value)||0;
  if (val <= 0) { setMsg(lv,'Masukkan jumlah USDT','err'); return; }
  try {
    const usdtContract = new ethers.Contract(USDT_ADDRESS, INDC_ABI, signer);
    const amt = ethers.utils.parseUnits(val.toString(), 18);
    setMsg(lv,'Approve USDT... (konfirmasi MetaMask)','info');
    const tx = await usdtContract.approve(CONTRACT_ADDRESS, amt);
    await tx.wait();
    setMsg(lv,'Approve sukses! Sekarang klik STAKE','ok');
    showToast('✅','Approve berhasil!');
  } catch(e) {
    console.error(e);
    setMsg(lv, e.code===4001 ? 'Dibatalkan' : 'Approve gagal', 'err');
  }
}

// ── Stake ──
async function doStake(lv) {
  if (!contract) { showToast('🔗','Connect wallet dulu!'); return; }
  const inp = document.getElementById('inp'+lv);
  const val = parseFloat(inp.value)||0;
  const lvData = LEVELS[lv-1];
  if (val < lvData.minU) { setMsg(lv,`Min stake ${lvData.min}`,'err'); return; }
  if (val > lvData.maxU) { setMsg(lv,`Max stake ${lvData.max}`,'err'); return; }
  try {
    const amt = ethers.utils.parseUnits(val.toString(), 18);
    // Cek allowance dulu
    const usdtContract = new ethers.Contract(USDT_ADDRESS, INDC_ABI, signer);
    const allowance = await usdtContract.allowance(myAddr, CONTRACT_ADDRESS);
    if (allowance.lt(amt)) { setMsg(lv,'Approve USDT dulu!','err'); return; }
    setMsg(lv,'Stake... (konfirmasi MetaMask)','info');
    const tx = await contract.stake(lv-1, amt); // SC 0-based
    setMsg(lv,'Menunggu konfirmasi...','info');
    await tx.wait();
    setMsg(lv,'Stake berhasil! 🎉','ok');
    showToast('📈','Stake Level '+lv+' berhasil!');
    inp.value = '';
    await loadChainData();
  } catch(e) {
    console.error(e);
    setMsg(lv, e.code===4001 ? 'Dibatalkan' : (e.reason||'Gagal stake'), 'err');
  }
}

// ── Claim Reward ──
async function doClaim(idx) {
  if (!contract) return;
  try {
    showToast('⏳','Klaim reward...');
    const tx = await contract.claimReward(idx);
    await tx.wait();
    showToast('✅','Reward berhasil diklaim!');
    await loadChainData();
  } catch(e) { showToast('❌', e.reason||'Gagal klaim'); }
}

// ── Claim Pending ──
async function doClaimPending(idx) {
  if (!contract) return;
  try {
    showToast('⏳','Klaim pending reward...');
    const tx = await contract.claimPending(idx);
    await tx.wait();
    showToast('✅','Pending reward diklaim!');
    await loadChainData();
  } catch(e) { showToast('❌', e.reason||'Gagal klaim pending'); }
}

// ── Early Withdraw ──
async function doEarlyWithdraw(idx) {
  if (!confirm('⚠️ Early withdraw kena penalti 3% dari modal. Lanjut?')) return;
  if (!contract) return;
  try {
    showToast('⏳','Proses early withdraw...');
    const tx = await contract.earlyWithdraw(idx);
    await tx.wait();
    showToast('✅','Early withdraw berhasil!');
    await loadChainData();
  } catch(e) { showToast('❌', e.reason||'Gagal withdraw'); }
}

// ── Helpers ──
function setMsg(lv, msg, type) {
  const el = document.getElementById('msg'+lv);
  if (el) { el.textContent = msg; el.className = 'status-msg '+type; }
}

function showToast(ico, msg) {
  let t = document.getElementById('_toast');
  if (!t) {
    t = document.createElement('div');
    t.id = '_toast';
    t.style.cssText = 'position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#1e293b;border:1px solid rgba(250,204,21,0.3);color:#e2e8f0;padding:10px 20px;border-radius:20px;font-family:Share Tech Mono,monospace;font-size:12px;z-index:999;transition:opacity 0.3s;white-space:nowrap;';
    document.body.appendChild(t);
  }
  t.textContent = ico+' '+msg;
  t.style.opacity = '1';
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>{ t.style.opacity='0'; }, 3000);
}
