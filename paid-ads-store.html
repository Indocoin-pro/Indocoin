<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INDOCOIN — Detail Toko</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#facc15;--gold2:#fbbf24;--gold3:#f59e0b;
  --dark:#0a0f1e;--dark2:#0f172a;--dark3:#1e293b;--dark4:#162032;
  --text:#e2e8f0;--muted:#64748b;--green:#22c55e;--blue:#3b82f6;--red:#ef4444;
  --glow:0 0 20px #facc1566;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--dark);color:var(--text);font-family:'Rajdhani',sans-serif;min-height:100vh;overflow-x:hidden;}
#bgLogo{position:fixed;inset:0;z-index:0;pointer-events:none;display:flex;align-items:center;justify-content:center;}
#bgLogo img{width:min(85vw,85vh);height:min(85vw,85vh);object-fit:contain;opacity:0.03;filter:blur(2px);}
.layout{position:relative;z-index:1;}

/* NAV */
.topnav{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;background:rgba(10,15,30,0.95);backdrop-filter:blur(16px);border-bottom:1px solid rgba(250,204,21,0.15);position:sticky;top:0;z-index:100;}
.nav-left{display:flex;align-items:center;gap:10px;}
.nav-back{width:34px;height:34px;border-radius:10px;background:rgba(250,204,21,0.08);border:1px solid rgba(250,204,21,0.2);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;transition:all 0.3s;text-decoration:none;color:var(--text);}
.nav-back:hover{background:rgba(250,204,21,0.15);}
.nav-title{font-family:'Orbitron',sans-serif;font-size:13px;font-weight:900;color:var(--gold);letter-spacing:1px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.nav-wa{width:34px;height:34px;border-radius:10px;background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.3);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;transition:all 0.3s;text-decoration:none;}
.nav-wa:hover{background:rgba(34,197,94,0.2);}

.main{padding:0 0 120px;max-width:480px;margin:0 auto;}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

/* STORE HERO BANNER */
.store-banner{height:180px;position:relative;overflow:hidden;}
.store-banner-bg{position:absolute;inset:0;background:linear-gradient(135deg,#0a0f1e,#0d1a0d);}
.store-banner-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(250,204,21,0.05) 1px,transparent 1px),linear-gradient(90deg,rgba(250,204,21,0.05) 1px,transparent 1px);background-size:30px 30px;animation:gridMove 10s linear infinite;}
@keyframes gridMove{0%{background-position:0 0}100%{background-position:30px 30px}}
.store-banner-glowL{position:absolute;left:-30px;top:-30px;width:200px;height:200px;background:radial-gradient(circle,rgba(250,204,21,0.2),transparent 70%);animation:gPulse 4s ease-in-out infinite alternate;}
@keyframes gPulse{0%{opacity:0.5;transform:scale(0.9)}100%{opacity:1;transform:scale(1.1)}}
.store-banner-scan{position:absolute;top:0;left:-10%;width:50px;height:100%;background:linear-gradient(90deg,transparent,rgba(250,204,21,0.08),transparent);animation:scanH 5s linear infinite;}
@keyframes scanH{0%{left:-10%}100%{left:110%}}
.store-banner-content{position:absolute;inset:0;display:flex;align-items:flex-end;padding:16px;}
.store-avatar{width:72px;height:72px;border-radius:16px;background:rgba(250,204,21,0.1);border:2px solid rgba(250,204,21,0.4);display:flex;align-items:center;justify-content:center;font-size:32px;flex-shrink:0;box-shadow:0 0 25px rgba(250,204,21,0.3);animation:iconPulse 2.5s ease-in-out infinite alternate;}
@keyframes iconPulse{0%{box-shadow:0 0 15px rgba(250,204,21,0.2)}100%{box-shadow:0 0 35px rgba(250,204,21,0.5)}}
.store-banner-info{margin-left:14px;flex:1;}
.store-cat-badge{display:inline-block;font-family:'Orbitron',sans-serif;font-size:9px;padding:3px 8px;border-radius:6px;letter-spacing:1px;margin-bottom:6px;}
.badge-umkm{background:rgba(34,197,94,0.2);border:1px solid rgba(34,197,94,0.4);color:#4ade80;}
.badge-ud{background:rgba(250,204,21,0.2);border:1px solid rgba(250,204,21,0.4);color:#facc15;}
.badge-cv{background:rgba(59,130,246,0.2);border:1px solid rgba(59,130,246,0.4);color:#60a5fa;}
.badge-pt{background:rgba(139,92,246,0.2);border:1px solid rgba(139,92,246,0.4);color:#a78bfa;}
.store-name{font-family:'Orbitron',sans-serif;font-size:18px;font-weight:900;color:#fff;text-shadow:0 0 15px rgba(250,204,21,0.3);letter-spacing:0.5px;}
.store-verified{display:inline-flex;align-items:center;gap:4px;font-size:10px;color:var(--green);font-family:'Share Tech Mono',monospace;margin-top:4px;}

/* INFO STRIP */
.info-strip{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:rgba(250,204,21,0.08);border-bottom:1px solid rgba(250,204,21,0.1);animation:fadeUp 0.4s ease both;}
.info-cell{background:var(--dark);padding:12px 8px;text-align:center;}
.info-val{font-family:'Orbitron',sans-serif;font-size:16px;font-weight:900;color:var(--gold);}
.info-lbl{font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:1px;margin-top:3px;text-transform:uppercase;}

/* BODY PADDING */
.body-pad{padding:16px;}

/* STORE DETAILS */
.detail-card{background:var(--dark4);border:1px solid rgba(250,204,21,0.1);border-radius:16px;padding:14px;margin-bottom:14px;animation:fadeUp 0.45s ease both;animation-delay:0.05s;}
.detail-row{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.04);}
.detail-row:last-child{border-bottom:none;}
.detail-icon{font-size:18px;width:28px;text-align:center;flex-shrink:0;}
.detail-info{flex:1;}
.detail-label{font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;}
.detail-value{font-size:14px;color:var(--text);margin-top:2px;font-weight:600;}
.detail-value.gold{color:var(--gold);}
.detail-value.green{color:var(--green);}

/* SECTION TITLE */
.sec-title{font-family:'Orbitron',sans-serif;font-size:11px;color:var(--gold);letter-spacing:2px;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.sec-title::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(250,204,21,0.3),transparent);}

/* PRODUCTS */
.products-section{margin-bottom:14px;animation:fadeUp 0.5s ease both;animation-delay:0.08s;}
.product-card{background:var(--dark4);border:1px solid rgba(250,204,21,0.1);border-radius:14px;padding:14px;margin-bottom:10px;transition:all 0.3s;cursor:pointer;}
.product-card:hover{border-color:rgba(250,204,21,0.3);transform:translateY(-1px);}
.product-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.product-name{font-size:15px;font-weight:700;color:var(--text);}
.product-price-wrap{text-align:right;}
.product-price-indc{font-family:'Orbitron',sans-serif;font-size:15px;font-weight:900;color:var(--gold);}
.product-price-usd{font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--muted);margin-top:2px;}
.product-desc{font-size:12px;color:var(--muted);margin-bottom:10px;line-height:1.5;}
.product-footer{display:flex;align-items:center;justify-content:space-between;}
.product-sold{font-size:11px;color:var(--muted);}
.product-sold b{color:var(--green);}
.btn-wa{
  background:linear-gradient(135deg,#16a34a,#15803d);
  color:#fff;border:none;border-radius:10px;
  font-family:'Orbitron',sans-serif;font-size:10px;font-weight:900;
  padding:8px 14px;letter-spacing:1px;cursor:pointer;
  transition:all 0.3s;box-shadow:0 0 15px rgba(34,197,94,0.25);
  display:flex;align-items:center;gap:5px;text-decoration:none;
}
.btn-wa:hover{box-shadow:0 0 25px rgba(34,197,94,0.5);transform:translateY(-1px);}
.price-hidden{font-size:12px;color:var(--muted);font-style:italic;}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:200;background:rgba(10,15,30,0.97);backdrop-filter:blur(20px);border-top:1px solid rgba(250,204,21,0.15);display:flex;justify-content:space-around;align-items:center;padding:8px 0 12px;}
.bn-item{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:4px 12px;border-radius:10px;transition:all 0.2s;text-decoration:none;}
.bn-item:hover{background:rgba(250,204,21,0.08);}
.bn-icon{font-size:20px;line-height:1;}
.bn-label{font-family:'Share Tech Mono',monospace;font-size:8px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;}
.star-bg{position:fixed;pointer-events:none;}
</style>
</head>
<body>

<div id="bgLogo"><img src="1772782967104.png" alt="" onerror="this.style.display='none'"></div>

<!-- No order modal - katalog only -->

<div class="layout">
  <nav class="topnav">
    <div class="nav-left">
      <a href="paid-ads.html" class="nav-back">←</a>
      <span class="nav-title" id="navTitle">Detail Toko</span>
    </div>
    <a class="nav-wa" id="navWa" href="#" title="WhatsApp">💬</a>
  </nav>

  <div class="main">
    <!-- STORE HERO -->
    <div class="store-banner" id="storeBanner">
      <div class="store-banner-bg"></div>
      <div class="store-banner-grid"></div>
      <div class="store-banner-glowL"></div>
      <div class="store-banner-scan"></div>
      <div class="store-banner-content">
        <div class="store-avatar" id="storeAvatar">🏪</div>
        <div class="store-banner-info">
          <div class="store-cat-badge badge-umkm" id="storeCatBadge">UMKM</div>
          <div class="store-name" id="storeName">Nama Toko</div>
          <div class="store-verified" id="storeVerified">✓ TERVERIFIKASI · INDOCOIN</div>
        </div>
      </div>
    </div>

    <!-- INFO STRIP -->
    <div class="info-strip">
      <div class="info-cell"><div class="info-val" id="infoTerjual">—</div><div class="info-lbl">Kunjungan</div></div>
      <div class="info-cell"><div class="info-val" id="infoProduk">—</div><div class="info-lbl">Produk</div></div>
      <div class="info-cell"><div class="info-val" id="infoJam" style="font-size:11px;">—</div><div class="info-lbl">Jam Buka</div></div>
    </div>

    <div class="body-pad">

      <!-- STORE DETAILS -->
      <div class="detail-card">
        <div class="detail-row">
          <div class="detail-icon">📍</div>
          <div class="detail-info">
            <div class="detail-label">Lokasi</div>
            <div class="detail-value" id="detailKota">—</div>
          </div>
        </div>
        <div class="detail-row">
          <div class="detail-icon">🕐</div>
          <div class="detail-info">
            <div class="detail-label">Jam Operasional</div>
            <div class="detail-value green" id="detailJam">—</div>
          </div>
        </div>
        <div class="detail-row">
          <div class="detail-icon">📱</div>
          <div class="detail-info">
            <div class="detail-label">WhatsApp</div>
            <div class="detail-value gold" id="detailWa">—</div>
          </div>
        </div>
        <div class="detail-row">
          <div class="detail-icon">💛</div>
          <div class="detail-info">
            <div class="detail-label">Wallet BNB</div>
            <div class="detail-value" id="detailWallet" style="font-family:'Share Tech Mono',monospace;font-size:11px;word-break:break-all;">—</div>
          </div>
        </div>
      </div>

      <!-- PRODUCTS -->
      <div class="products-section">
        <div class="sec-title">🛍️ DAFTAR PRODUK</div>
        <div id="productsList"></div>
      </div>


    </div>
  </div>

  <nav class="bottom-nav">
    <a href="dashboard.html" class="bn-item"><div class="bn-icon">🏠</div><div class="bn-label">Home</div></a>
    <a href="earn.html" class="bn-item"><div class="bn-icon">💰</div><div class="bn-label">Earn</div></a>
    <a href="paid-ads.html" class="bn-item"><div class="bn-icon">📢</div><div class="bn-label">Iklan</div></a>
    <a href="referral.html" class="bn-item"><div class="bn-icon">👥</div><div class="bn-label">Referral</div></a>
    <a href="community.html" class="bn-item"><div class="bn-icon">🌐</div><div class="bn-label">Community</div></a>
  </nav>
</div>

<script type="module">
import { initializeApp }                          from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
import { getAuth, onAuthStateChanged }            from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
import { getFirestore, doc, getDoc, updateDoc,
         increment }                              from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey           : "AIzaSyBrhDJiIcEJsZ-fN0RIDlV0XaOA8ZPjJsw",
  authDomain       : "indocoin-network.firebaseapp.com",
  projectId        : "indocoin-network",
  storageBucket    : "indocoin-network.firebasestorage.app",
  messagingSenderId: "742922450154",
  appId            : "1:742922450154:web:97e0847e85bfe3e9f9d393"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

const INDC_PRICE = 0.003;
let currentUser  = null;
let store        = null;
let storeUid     = null;

// ── AUTH ──
onAuthStateChanged(auth, user => {
  currentUser = user;
  // Tampilkan/sembunyikan form review berdasarkan login
  const writeReview = document.querySelector('.write-review');
  if (writeReview) {
    writeReview.style.display = user ? 'block' : 'none';
  }
  if (!user) {
    // Tambah info login untuk review
    const infoEl = document.getElementById('reviewLoginInfo');
    if (infoEl) infoEl.style.display = 'block';
  }
});

// ── LOAD STORE DATA ──
async function loadStore() {
  const params  = new URLSearchParams(window.location.search);
  storeUid      = params.get('id');

  if (!storeUid) {
    showError('Toko tidak ditemukan');
    return;
  }

  try {
    // Ambil dari paidAdsPublic (data publik)
    const snap = await getDoc(doc(db, 'paidAdsPublic', storeUid));

    if (!snap.exists() || !snap.data().active) {
      showError('Toko tidak aktif atau tidak ditemukan');
      return;
    }

    store = { id: snap.id, ...snap.data() };

    // Cek apakah suspended
    if (snap.data().suspended) {
      showError('Toko ini sedang ditangguhkan oleh admin');
      return;
    }

    renderStore();
    loadReviews();

    // Catat kunjungan (increment view count)
    updateDoc(doc(db, 'paidAdsPublic', storeUid), {
      viewCount: increment(1)
    }).catch(() => {}); // silent fail

  } catch (e) {
    console.error(e);
    showError('Gagal memuat data toko. Coba refresh halaman.');
  }
}

// ── RENDER STORE ──
function renderStore() {
  // NAV
  document.getElementById('navTitle').textContent = store.namaUsaha || '—';
  const waNum = (store.whatsapp || '').replace(/[^0-9]/g, '');
  const waFormatted = waNum.startsWith('0') ? '62' + waNum.substring(1) : waNum;
  document.getElementById('navWa').href = `https://wa.me/${waFormatted}`;

  // HERO
  const avatarEl = document.getElementById('storeAvatar');
  if (store.profilUrl) {
    avatarEl.innerHTML = `<img src="${store.profilUrl}" style="width:100%;height:100%;object-fit:cover;border-radius:16px;">`;
  } else {
    avatarEl.textContent = '🏪';
  }

  document.getElementById('storeName').textContent = store.namaUsaha || '—';

  const catBadge = document.getElementById('storeCatBadge');
  catBadge.textContent = (store.kategori || 'UMKM').toUpperCase();
  catBadge.className   = `store-cat-badge badge-${(store.kategori||'umkm').toLowerCase()}`;

  document.getElementById('storeVerified').style.display =
    (store.active && !store.suspended) ? 'flex' : 'none';

  // INFO STRIP
  const views = store.viewCount || 0;
  document.getElementById('infoTerjual').textContent = views >= 1000
    ? (views/1000).toFixed(1)+'K' : views;
  document.getElementById('infoProduk').textContent  = (store.produk || []).length;
  document.getElementById('infoJam').textContent     = store.jamOperasional || '—';

  // DETAIL ROWS
  document.getElementById('detailKota').textContent = store.kota || '—';
  document.getElementById('detailJam').textContent  = store.jamOperasional || '—';
  document.getElementById('detailWa').textContent   = store.whatsapp || '—';

  const walletEl = document.getElementById('detailWallet');
  walletEl.textContent = store.walletAddress
    ? store.walletAddress.substring(0,10)+'...'+store.walletAddress.slice(-6)
    : '—';

  // PRODUK
  renderProducts();

  // Banner overlay di hero
  if (store.bannerUrl) {
    const heroEl = document.querySelector('.store-banner');
    if (heroEl) {
      const d = document.createElement('div');
      d.style.cssText = 'position:absolute;inset:0;z-index:0;overflow:hidden;';
      d.innerHTML = `<img src="${store.bannerUrl}" style="width:100%;height:100%;object-fit:cover;opacity:0.3;">`;
      heroEl.insertBefore(d, heroEl.firstChild);
    }
  }
}

// ── RENDER PRODUCTS ──
function renderProducts() {
  const prodList = document.getElementById('productsList');
  const produk   = store.produk || [];

  if (!produk.length) {
    prodList.innerHTML = `<div style="text-align:center;padding:20px;color:var(--muted);">Belum ada produk ditampilkan</div>`;
    return;
  }

  const waNum  = (store.whatsapp || '').replace(/[^0-9]/g, '');
  const waBase = `https://wa.me/${waNum.startsWith('0') ? '62'+waNum.substring(1) : waNum}`;

  prodList.innerHTML = produk.map(p => {
    const priceSection = p.showPrice && p.harga > 0
      ? `<div class="product-price-wrap">
          <div class="product-price-indc">${Number(p.harga).toLocaleString('id-ID')} INDC</div>
          <div class="product-price-usd">≈ $${(Number(p.harga) * INDC_PRICE).toFixed(2)} USD</div>
         </div>`
      : `<div class="price-hidden">Tanya harga via WA</div>`;

    const waMsg = encodeURIComponent(
      `Halo kak, saya dari komunitas Indocoin. Saya tertarik dengan *${p.nama}* dari toko *${store.namaUsaha}*. Boleh info lebih lanjut?`
    );

    return `
    <div class="product-card">
      <div class="product-top">
        <div class="product-name">${p.nama}</div>
        ${priceSection}
      </div>
      ${p.desc ? `<div class="product-desc">${p.desc}</div>` : ''}
      <div class="product-footer">
        <div class="product-sold" style="font-size:11px;color:var(--muted);">📦 Tersedia</div>
        <a href="${waBase}?text=${waMsg}" target="_blank" class="btn-wa">💬 Tanya WA</a>
      </div>
    </div>`;
  }).join('');
}


// ── ERROR STATE ──
function showError(msg) {
  document.querySelector('.main').innerHTML = `
    <div style="text-align:center;padding:60px 20px;">
      <div style="font-size:48px;margin-bottom:16px;">😕</div>
      <div style="font-family:'Orbitron',sans-serif;font-size:14px;color:var(--gold);margin-bottom:8px;">TOKO TIDAK DITEMUKAN</div>
      <div style="font-size:13px;color:var(--muted);margin-bottom:24px;">${msg}</div>
      <a href="paid-ads.html" style="background:rgba(250,204,21,0.1);border:1px solid rgba(250,204,21,0.3);color:var(--gold);font-family:'Orbitron',sans-serif;font-size:11px;padding:10px 20px;border-radius:10px;text-decoration:none;letter-spacing:1px;">← KEMBALI KE DAFTAR TOKO</a>
    </div>`;
}

// ── INIT ──
loadStore();
</script>
<script>
if("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/sw.js").then(reg => {
      reg.addEventListener("updatefound", () => {
        const newSW = reg.installing;
        newSW.addEventListener("statechange", () => {
          if(newSW.state === "installed" && navigator.serviceWorker.controller){
            newSW.postMessage("skipWaiting");
            window.location.reload();
          }
        });
      });
    }).catch(e => console.warn("SW:", e));
  });
}
</script>
</body>
</html>
