<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INDOCOIN — Dynamic Level Staking</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js">
/* Auto-connect saat halaman dibuka */
(async function autoConnect(){

  const accounts = await window.ethereum.request({method:'eth_accounts'}).catch(()=>[]);
  if(accounts.length){ await connectWallet(); }
  // Tidak auto-connect jika belum pernah connect — tunggu user klik
})();
</script>
<style>
:root{
  --bg:#080808;--bg2:#111111;--bg3:#1a1a1a;
  --white:#f5f0e8;--white2:#a89880;--white3:#6b5a48;
  --gold:#c8922a;--gold2:#e8a830;--gold3:#f5c842;
  --green:#2ea86a;--red:#c94040;--blue:#a89880;--purple:#a89880;
  --border:rgba(200,146,42,0.18);--border2:rgba(200,146,42,0.1);
  --dark:#080808;--dark2:#111111;--dark3:#1a1a1a;--dark4:#111111;
  --text:#f5f0e8;--muted:#a89880;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--white);font-family:'Rajdhani',sans-serif;min-height:100vh;overflow-x:hidden;}
#bgLogo{position:fixed;inset:0;z-index:0;pointer-events:none;display:flex;align-items:center;justify-content:center;}
#bgLogo img{width:min(85vw,85vh);opacity:0.03;filter:blur(2px);}
.star{position:fixed;background:white;border-radius:50%;pointer-events:none;animation:twinkle var(--d,3s) infinite alternate;}
@keyframes twinkle{from{opacity:0.1}to{opacity:0.6}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes goldShimmer{0%{background-position:0% center}100%{background-position:300% center}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}
.grid-bg{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(200,146,42,0.05) 1px,transparent 1px),linear-gradient(90deg,rgba(200,146,42,0.05) 1px,transparent 1px);background-size:36px 36px;}
.grid-bg::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 90% 50% at 50% 0%,rgba(200,146,42,0.07) 0%,transparent 65%);}
@keyframes scan{0%{top:-2px}100%{top:100vh}}
.scanline{position:fixed;left:0;right:0;height:2px;z-index:1;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(200,146,42,0.3) 40%,rgba(200,146,42,0.1) 60%,transparent);animation:scan 10s linear infinite;opacity:0.4;}
@keyframes pulseGold{0%,100%{box-shadow:0 0 0 0 rgba(250,204,21,0.4)}50%{box-shadow:0 0 0 6px rgba(250,204,21,0)}}

/* ── TOPNAV ── */
.topnav{display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:54px;background:rgba(8,8,8,0.98);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:200;}
.nav-left{display:flex;align-items:center;gap:10px;}
.nav-logo{width:38px;height:38px;border-radius:50%;border:2px solid #fff;object-fit:cover;flex-shrink:0;box-shadow:0 0 12px rgba(255,255,255,0.15);}
.nav-logo-fb{width:38px;height:38px;border-radius:50%;border:2px solid #fff;background:linear-gradient(135deg,#1e3a8a,#0f172a);display:flex;align-items:center;justify-content:center;font-size:0;display:none;flex-shrink:0;}
.nav-brand-main{font-family:'Orbitron',sans-serif;font-size:13px;font-weight:800;color:var(--white);letter-spacing:3px;display:block;}
.nav-brand-sub{font-family:'Share Tech Mono',monospace;font-size:7px;color:var(--gold2);letter-spacing:2px;display:block;}
.nav-right{display:flex;align-items:center;gap:8px;}
.wallet-chip{font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--white2);background:rgba(168,152,128,0.08);border:1px solid rgba(168,152,128,0.25);padding:5px 10px;border-radius:20px;display:none;}
.btn-connect{font-family:'Orbitron',sans-serif;font-size:9px;font-weight:700;padding:6px 12px;border-radius:20px;border:1px solid rgba(250,204,21,0.4);background:rgba(250,204,21,0.1);color:var(--gold);cursor:pointer;letter-spacing:1px;}
.pool-badge{font-family:'Share Tech Mono',monospace;font-size:9px;padding:5px 10px;border-radius:20px;letter-spacing:1px;display:flex;align-items:center;gap:5px;background:rgba(168,152,128,0.1);border:1px solid rgba(168,152,128,0.3);color:var(--white2);}
.pool-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:blink 1s infinite;}

/* ── LAYOUT ── */
.layout{position:relative;z-index:1;}
.main{padding:16px 16px 110px;max-width:480px;margin:0 auto;width:100%;}

/* ── LEVEL SCROLL TABS ── */
.level-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none;}
.level-tabs::-webkit-scrollbar{display:none;}
.level-tab{flex-shrink:0;padding:8px 14px;border-radius:12px;cursor:pointer;transition:all 0.25s;border:2px solid rgba(255,255,255,0.15);background:rgba(0,0,0,0.2);text-align:center;}
.level-tab-num{font-family:'Orbitron',sans-serif;font-size:10px;font-weight:700;color:var(--muted);}
.level-tab-roi{font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--muted);margin-top:1px;}
.level-tab.active{background:rgba(250,204,21,0.12);border-color:rgba(255,255,255,0.7);}
.level-tab.active .level-tab-num,.level-tab.active .level-tab-roi{color:var(--gold);}
.level-tab.locked{opacity:0.4;cursor:not-allowed;}
.level-tab.unlocked:not(.active){border-color:rgba(255,255,255,0.3);}

/* ── LEVEL CONTENT ── */
.level-content{display:none;}
.level-content.active{display:block;animation:fadeUp 0.25s ease both;}

/* ── INFO CARD ── */
.info-card{background:linear-gradient(135deg,#0d2557,#0a1628,#0f1f3d);border:1px solid rgba(255,255,255,0.2);border-radius:18px;padding:16px;margin-bottom:12px;position:relative;overflow:hidden;width:100%;}
.info-card::before{content:'';position:absolute;top:-40px;right:-40px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,rgba(250,204,21,0.07),transparent);pointer-events:none;}
.info-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;}
.info-title{font-family:'Orbitron',sans-serif;font-size:13px;font-weight:900;color:var(--gold);}
.info-subtitle{font-size:12px;color:var(--muted);margin-top:2px;}
.badge-aktif{background:rgba(168,152,128,0.1);border:1px solid rgba(168,152,128,0.25);color:var(--white2);font-family:'Share Tech Mono',monospace;font-size:9px;padding:4px 10px;border-radius:20px;letter-spacing:1px;white-space:nowrap;}
.badge-locked{background:rgba(100,116,139,0.15);border:1px solid rgba(100,116,139,0.3);color:var(--muted);font-family:'Share Tech Mono',monospace;font-size:9px;padding:4px 10px;border-radius:20px;letter-spacing:1px;white-space:nowrap;}
.info-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;}
.info-stat{background:rgba(0,0,0,0.3);border:2px solid rgba(255,255,255,0.1);border-radius:10px;padding:10px;text-align:center;}
.info-stat-val{font-family:'Orbitron',sans-serif;font-size:14px;font-weight:700;color:var(--gold);}
.info-stat-lbl{font-family:'Share Tech Mono',monospace;font-size:8px;color:var(--muted);letter-spacing:1px;margin-top:2px;text-transform:uppercase;}

/* ── UNLOCK PROGRESS ── */
.unlock-bar-wrap{margin-bottom:12px;}
.unlock-bar-top{display:flex;justify-content:space-between;margin-bottom:5px;}
.unlock-bar-lbl{font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:1px;}
.unlock-bar-pct{font-family:'Orbitron',sans-serif;font-size:10px;color:var(--gold);}
.unlock-bar-bg{height:6px;background:rgba(255,255,255,0.08);border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,0.1);}
.unlock-bar-fill{height:100%;background:linear-gradient(90deg,var(--gold3),var(--gold));border-radius:10px;transition:width 0.5s ease;}

/* ── SECTION DIVIDER ── */
.sec-div{font-family:'Orbitron',sans-serif;font-size:10px;color:var(--gold);letter-spacing:2px;margin:12px 0 8px;display:flex;align-items:center;gap:8px;width:100%;}
.sec-div::after{content:'';flex:1;height:1px;background:rgba(255,255,255,0.1);}

/* ── FORM CARD ── */
.form-card{background:var(--dark4);border:1px solid rgba(255,255,255,0.2);border-radius:14px;padding:14px;width:100%;margin-bottom:4px;}
.input-row{display:flex;gap:8px;margin-bottom:10px;width:100%;}
.input-wrap{flex:1;}
.input-wrap input{width:100%;padding:12px 14px;background:rgba(0,0,0,0.35);border:1px solid rgba(255,255,255,0.15);border-radius:10px;color:white;font-family:'Rajdhani',sans-serif;font-size:13px;outline:none;transition:border-color 0.3s;}
.input-wrap input:focus{border-color:rgba(255,255,255,0.5);}
.input-wrap input::placeholder{color:var(--muted);}
.input-wrap input:disabled{opacity:0.4;cursor:not-allowed;}
.usdt-bal{background:rgba(250,204,21,0.06);border:2px solid rgba(255,255,255,0.4);border-radius:10px;padding:8px 12px;min-width:80px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px;}
.ubl{font-family:'Share Tech Mono',monospace;font-size:8px;color:var(--muted);letter-spacing:1px;}
.ubv{font-family:'Orbitron',sans-serif;font-size:12px;font-weight:700;color:var(--gold);}
.btn-approve{width:100%;padding:12px;margin-bottom:8px;background:rgba(168,152,128,0.08);border:1px solid rgba(255,255,255,0.2);color:var(--white2);border-radius:10px;font-family:'Orbitron',sans-serif;font-size:11px;font-weight:700;letter-spacing:1px;cursor:pointer;transition:all 0.3s;}
.btn-approve:hover{background:rgba(168,152,128,0.12);}
.btn-approve:disabled{opacity:0.4;cursor:not-allowed;}
.btn-stake{width:100%;padding:14px;background:linear-gradient(135deg,var(--gold),var(--gold3));color:#000;border:none;border-radius:10px;font-family:'Orbitron',sans-serif;font-size:13px;font-weight:700;letter-spacing:2px;cursor:pointer;transition:all 0.3s;box-shadow:0 4px 18px rgba(250,204,21,0.25);}
.btn-stake:hover{box-shadow:0 4px 30px rgba(250,204,21,0.5);transform:translateY(-1px);}
.btn-stake:disabled{opacity:0.4;cursor:not-allowed;transform:none;}
.status-msg{text-align:center;font-family:'Share Tech Mono',monospace;font-size:10px;margin-top:8px;color:var(--muted);min-height:18px;}
.status-msg.ok{color:var(--white2);}
.status-msg.err{color:var(--white2);}
.status-msg.info{color:var(--gold);}

/* ── LOCK OVERLAY ── */
.lock-overlay{background:rgba(0,0,0,0.5);border:2px solid rgba(255,255,255,0.2);border-radius:14px;padding:24px;text-align:center;width:100%;margin-bottom:4px;}
.lock-icon{font-size:14px;margin-bottom:8px;}
.lock-title{font-family:'Orbitron',sans-serif;font-size:13px;color:var(--muted);letter-spacing:1px;margin-bottom:6px;}
.lock-desc{font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--muted);line-height:1.7;}

/* ── KALKULATOR ── */
.calc-input{width:100%;padding:12px 14px;background:rgba(0,0,0,0.35);border:1px solid rgba(255,255,255,0.15);border-radius:10px;color:white;font-family:'Rajdhani',sans-serif;font-size:13px;outline:none;transition:border-color 0.3s;margin-bottom:10px;}
.calc-input:focus{border-color:rgba(255,255,255,0.5);}
.calc-input::placeholder{color:var(--muted);}
.calc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;width:100%;}
.calc-item{background:rgba(0,0,0,0.3);border:2px solid rgba(255,255,255,0.1);border-radius:10px;padding:10px;text-align:center;}
.calc-val{font-family:'Orbitron',sans-serif;font-size:13px;font-weight:700;color:var(--gold);}
.calc-lbl{font-family:'Share Tech Mono',monospace;font-size:8px;color:var(--muted);letter-spacing:1px;margin-top:2px;text-transform:uppercase;}
.calc-total{background:rgba(250,204,21,0.06);border:2px solid rgba(255,255,255,0.4);border-radius:10px;padding:11px 14px;display:flex;justify-content:space-between;align-items:center;width:100%;}
.calc-total span{font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--muted);}
.calc-total strong{font-family:'Orbitron',sans-serif;font-size:13px;color:var(--gold);}

/* ── INNER TABS ── */
.inner-tabs{display:flex;gap:6px;margin:12px 0 8px;width:100%;}
.inner-tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 8px;border-radius:12px;cursor:pointer;transition:all 0.25s;border:2px solid rgba(255,255,255,0.2);background:rgba(0,0,0,0.2);flex:1;}
.inner-tab-icon{font-size:0;display:none;line-height:1;}
.inner-tab-label{font-family:'Share Tech Mono',monospace;font-size:8px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;text-align:center;}
.inner-tab.active{background:rgba(250,204,21,0.1);border-color:rgba(255,255,255,0.8);}
.inner-tab.active .inner-tab-label{color:var(--gold);}
.inner-tab:hover:not(.active){background:rgba(255,255,255,0.04);}

/* ── INNER CONTENT ── */
.inner-content{display:none;}
.inner-content.active{display:block;animation:fadeUp 0.2s ease both;}

/* ── RIWAYAT ── */
.empty-state{text-align:center;padding:24px;color:var(--muted);font-size:12px;font-family:'Share Tech Mono',monospace;}
.stake-item{background:rgba(0,0,0,0.25);border:1px solid rgba(255,255,255,0.2);border-radius:12px;padding:14px;margin-bottom:10px;border-left:4px solid var(--gold);}
.si-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.si-name{font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--gold);letter-spacing:1px;}
.si-badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:10px;}
.si-badge.active{background:rgba(168,152,128,0.1);color:var(--white2);}
.si-badge.pending{background:rgba(168,152,128,0.15);color:var(--white2);}
.si-badge.done{background:rgba(250,204,21,0.15);color:var(--gold);}
.si-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px;width:100%;}
.si-left{text-align:left;}
.si-right{text-align:right;}
.si-lbl{font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:1px;display:block;}
.si-val{color:var(--text);display:block;font-size:13px;font-weight:700;margin-top:2px;}

/* PROGRESS BAR di riwayat */
.progress-wrap{margin-bottom:10px;}
.progress-top{display:flex;justify-content:space-between;margin-bottom:4px;}
.progress-lbl{font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--muted);}
.progress-pct{font-family:'Orbitron',sans-serif;font-size:10px;color:var(--gold);}
.progress-bg{height:8px;background:rgba(255,255,255,0.06);border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,0.1);}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--gold3),var(--gold));border-radius:10px;transition:width 0.5s;}

.accrued-box{background:rgba(250,204,21,0.06);border:1px solid rgba(250,204,21,0.2);border-radius:8px;padding:8px 12px;text-align:center;margin-bottom:10px;}
.accrued-lbl{font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:1px;}
