<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preview — Banner Placeholder Paid Ad Space</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0a0f1e;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;font-family:'Rajdhani',sans-serif;}
.wrap{width:100%;max-width:420px;}
.title{font-family:'Orbitron',sans-serif;font-size:10px;color:#facc15;letter-spacing:2px;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.title::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(250,204,21,0.3),transparent);}

/* ── SLOT ── */
.ads-banner-slot{width:100%;height:120px;border-radius:14px;position:relative;overflow:hidden;border:2px solid rgba(250,204,21,0.45);cursor:pointer;}

/* ── PLACEHOLDER ── */
.ads-ph-bg{position:absolute;inset:0;background:linear-gradient(135deg,#0a0f1e,#0d1a0d);}
.ads-ph-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(250,204,21,0.05) 1px,transparent 1px),linear-gradient(90deg,rgba(250,204,21,0.05) 1px,transparent 1px);background-size:28px 28px;animation:gridMove 10s linear infinite;}
.ads-ph-glowL{position:absolute;left:-30px;top:-30px;width:160px;height:160px;background:radial-gradient(circle,rgba(250,204,21,0.18),transparent 70%);animation:gPulse 3.5s ease-in-out infinite alternate;}
.ads-ph-scan{position:absolute;top:0;left:-10%;width:45px;height:100%;background:linear-gradient(90deg,transparent,rgba(250,204,21,0.09),transparent);animation:scanH 4.5s linear infinite;}
.ads-ph-border{position:absolute;inset:10px;inset-bottom:30px;border-radius:8px;border:1.5px dashed rgba(250,204,21,0.22);animation:borderBreath 3s ease-in-out infinite alternate;z-index:0;pointer-events:none;bottom:30px;}
.ads-ph-corner{position:absolute;width:13px;height:13px;border-color:#facc15;border-style:solid;animation:cornerFade 3s ease-in-out infinite alternate;}
.ads-ph-corner.tl{top:9px;left:9px;border-width:2px 0 0 2px;animation-delay:0s;}
.ads-ph-corner.tr{top:9px;right:9px;border-width:2px 2px 0 0;animation-delay:0.3s;}
.ads-ph-corner.bl{bottom:28px;left:9px;border-width:0 0 2px 2px;animation-delay:0.6s;}
.ads-ph-corner.br{bottom:28px;right:9px;border-width:0 2px 2px 0;animation-delay:0.9s;}
.ads-ph-center{position:absolute;top:0;left:0;right:0;bottom:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;z-index:1;}
.ads-ph-icon{font-size:22px;display:inline-block;transform:scaleX(-1);animation:iconSway 5s ease-in-out infinite;}
.ads-ph-text{font-family:'Orbitron',sans-serif;font-size:13px;font-weight:900;letter-spacing:2px;background:linear-gradient(90deg,rgba(250,204,21,0.3),rgba(250,204,21,1) 30%,#fff 50%,rgba(250,204,21,1) 70%,rgba(250,204,21,0.3));background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:slideSpinLoop 6s cubic-bezier(0.4,0,0.2,1) infinite,shimmerText 3s linear infinite;white-space:nowrap;}
.ads-ph-sub{font-size:10px;color:rgba(250,204,21,0.6);letter-spacing:1.5px;text-transform:uppercase;animation:subFade 3s ease-in-out infinite alternate;}

/* Pasang iklan strip bawah */
.ads-ph-pasang-wrap{
  position:absolute;bottom:0;left:0;right:0;
  height:26px;
  background:rgba(250,204,21,0.06);
  border-top:1px solid rgba(250,204,21,0.18);
  display:flex;align-items:center;justify-content:flex-end;
  padding:0 14px;gap:5px;z-index:2;
}
.ads-ph-hand{font-size:13px;animation:handBlink 1.2s ease-in-out infinite;}
.ads-ph-pasang{font-size:9px;color:rgba(250,204,21,0.85);font-family:'Orbitron',sans-serif;letter-spacing:1px;cursor:pointer;text-decoration:underline;animation:pasangPulse 3s ease-in-out infinite alternate;}

@keyframes gridMove{0%{background-position:0 0}100%{background-position:28px 28px}}
@keyframes gPulse{0%{opacity:0.5;transform:scale(0.88)}100%{opacity:1;transform:scale(1.12)}}
@keyframes scanH{0%{left:-10%}100%{left:110%}}
@keyframes borderBreath{0%{border-color:rgba(250,204,21,0.12)}100%{border-color:rgba(250,204,21,0.38)}}
@keyframes cornerFade{0%{opacity:0.2}100%{opacity:0.9}}
@keyframes iconSway{
  0%{transform:scaleX(-1) translateX(0) rotate(0);opacity:0.6}
  15%{transform:scaleX(-1) translateX(-7px) rotate(-12deg);opacity:1}
  30%{transform:scaleX(-1) translateX(7px) rotate(12deg);opacity:1}
  65%{transform:scaleX(-1) translateX(0) rotate(0);opacity:0.7}
  100%{transform:scaleX(-1) translateX(0) rotate(0);opacity:0.6}
}
@keyframes slideSpinLoop{
  0%{transform:translateX(-120%) rotate(0);opacity:0}
  18%{transform:translateX(0) rotate(0);opacity:1}
  38%{transform:translateX(0) rotate(0);opacity:1}
  52%{transform:translateX(0) rotate(180deg);opacity:1}
  62%{transform:translateX(0) rotate(360deg);opacity:1}
  90%{transform:translateX(0) rotate(360deg);opacity:1}
  100%{transform:translateX(-120%) rotate(360deg);opacity:0}
}
@keyframes shimmerText{0%{background-position:0% center}100%{background-position:200% center}}
@keyframes subFade{0%{opacity:0.3}100%{opacity:0.7}}
@keyframes handBlink{0%,100%{opacity:1;transform:translateX(0)}50%{opacity:0.2;transform:translateX(-3px)}}
@keyframes pasangPulse{0%{opacity:0.4}100%{opacity:1}}
</style>
</head>
<body>
<div class="wrap">
  <div class="title">📢 PAID AD SPACE</div>
  <div class="ads-banner-slot">
    <div class="ads-ph-bg"></div>
    <div class="ads-ph-grid"></div>
    <div class="ads-ph-glowL"></div>
    <div class="ads-ph-scan"></div>
    <div class="ads-ph-border"></div>
    <div class="ads-ph-corner tl"></div>
    <div class="ads-ph-corner tr"></div>
    <div class="ads-ph-corner bl"></div>
    <div class="ads-ph-corner br"></div>
    <div class="ads-ph-center">
      <div class="ads-ph-icon">📢</div>
      <div class="ads-ph-text">Pajang Iklan Kamu Di Sini</div>
      <div class="ads-ph-sub">Raih pelanggan komunitas Indocoin</div>
    </div>
    <div class="ads-ph-pasang-wrap">
      <span class="ads-ph-hand">👉</span>
      <span class="ads-ph-pasang">pasang iklan</span>
    </div>
  </div>
</div>
</body>
</html>
