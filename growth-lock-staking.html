<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INDOCOIN — Growth Lock Staking</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080808;--bg2:#111111;--bg3:#1a1a1a;
  --white:#f5f0e8;--white2:#a89880;--white3:#6b5a48;
  --gold:#c8922a;--gold2:#e8a830;--gold3:#f5c842;
  --green:#2ea86a;--red:#c94040;--blue:#a89880;
  --border:rgba(200,146,42,0.18);--border2:rgba(200,146,42,0.1);
  --dark:#080808;--dark2:#111111;--dark3:#1a1a1a;--dark4:#111111;
  --text:#f5f0e8;--muted:#a89880;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--white);font-family:'Rajdhani',sans-serif;min-height:100vh;overflow-x:hidden;}

/* BG LOGO */
#bgLogo{position:fixed;inset:0;z-index:0;pointer-events:none;display:flex;align-items:center;justify-content:center;}
#bgLogo img{width:min(85vw,85vh);opacity:0.03;filter:blur(2px);}

/* STARS */
.star{position:fixed;background:white;border-radius:50%;pointer-events:none;animation:twinkle var(--d,3s) infinite alternate;}
@keyframes twinkle{from{opacity:0.1}to{opacity:0.6}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes goldShimmer{0%{background-position:0% center}100%{background-position:300% center}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}
.grid-bg{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(200,146,42,0.05) 1px,transparent 1px),linear-gradient(90deg,rgba(200,146,42,0.05) 1px,transparent 1px);background-size:36px 36px;}
.grid-bg::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 90% 50% at 50% 0%,rgba(200,146,42,0.07) 0%,transparent 65%);}
@keyframes scan{0%{top:-2px}100%{top:100vh}}
.scanline{position:fixed;left:0;right:0;height:2px;z-index:1;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(200,146,42,0.3) 40%,rgba(200,146,42,0.1) 60%,transparent);animation:scan 10s linear infinite;opacity:0.4;}

/* ── TOPNAV ── */
.topnav{display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:54px;background:rgba(8,8,8,0.98);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:200;}
.nav-left{display:flex;align-items:center;gap:10px;}
.nav-logo{width:38px;height:38px;border-radius:50%;border:2px solid #fff;object-fit:cover;flex-shrink:0;box-shadow:0 0 12px rgba(255,255,255,0.15);}
.nav-logo-fb{width:38px;height:38px;border-radius:50%;border:2px solid rgba(255,255,255,0.6);background:linear-gradient(135deg,#1e3a8a,#0f172a);display:flex;align-items:center;justify-content:center;font-size:0;display:none;flex-shrink:0;}
.nav-brand{display:flex;flex-direction:column;}
.nav-brand-main{font-family:'Orbitron',sans-serif;font-size:13px;font-weight:800;color:var(--white);letter-spacing:3px;}
.nav-brand-sub{font-family:'Share Tech Mono',monospace;font-size:7px;color:var(--gold2);letter-spacing:2px;}
.pool-badge{font-family:'Share Tech Mono',monospace;font-size:9px;padding:5px 12px;border-radius:20px;letter-spacing:1px;display:flex;align-items:center;gap:5px;background:rgba(168,152,128,0.1);border:1px solid rgba(168,152,128,0.3);color:var(--white2);}
.pool-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:blink 1s infinite;}

/* ── LAYOUT ── */
.layout{position:relative;z-index:1;}
.main{padding:16px 16px 110px;max-width:480px;margin:0 auto;width:100%;}

/* ── OPSI TABS (atas) ── */
.opsi-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:rgba(0,0,0,0.3);border-radius:14px;padding:4px;margin-bottom:14px;width:100%;}
.opsi-tab{padding:10px 4px;border-radius:10px;text-align:center;cursor:pointer;transition:all 0.25s;border:1px solid transparent;}
.opsi-tab-period{font-family:'Orbitron',sans-serif;font-size:10px;font-weight:700;color:var(--muted);}
.opsi-tab-rate{font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--muted);margin-top:2px;}
.opsi-tab.active{background:linear-gradient(135deg,rgba(250,204,21,0.15),rgba(245,158,11,0.08));border-color:rgba(250,204,21,0.4);}
.opsi-tab.active .opsi-tab-period,
.opsi-tab.active .opsi-tab-rate{color:var(--gold);}
.opsi-tab:hover:not(.active){background:rgba(250,204,21,0.05);}

/* ── OPSI CONTENT ── */
.opsi-content{display:none;}
.opsi-content.active{display:block;animation:fadeUp 0.25s ease both;}

/* ── INFO CARD ── */
.info-card{background:linear-gradient(135deg,#0d2557,#0a1628,#0f1f3d);border:2px solid rgba(255,255,255,0.7);border-radius:18px;padding:16px;margin-bottom:12px;position:relative;overflow:hidden;width:100%;box-shadow:0 4px 20px rgba(0,0,0,0.3);}
.info-card::before{content:'';position:absolute;top:-40px;right:-40px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,rgba(184,134,11,0.06),transparent);pointer-events:none;}
.info-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;}
.info-title{font-family:'Orbitron',sans-serif;font-size:10px;font-weight:900;color:var(--gold);}
.info-subtitle{font-size:12px;color:var(--muted);margin-top:2px;}
.info-aktif{background:rgba(168,152,128,0.1);border:1px solid rgba(168,152,128,0.25);color:var(--white2);font-family:'Share Tech Mono',monospace;font-size:9px;padding:4px 10px;border-radius:20px;letter-spacing:1px;white-space:nowrap;}
.info-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;}
.info-stat{background:rgba(0,0,0,0.3);border:2px solid rgba(255,255,255,0.6);border-radius:10px;padding:10px;text-align:center;}
.info-stat-val{font-family:'Orbitron',sans-serif;font-size:14px;font-weight:700;color:var(--gold);}
.info-stat-lbl{font-family:'Share Tech Mono',monospace;font-size:8px;color:var(--muted);letter-spacing:1px;margin-top:2px;text-transform:uppercase;}

/* ── SECTION DIVIDER ── */
.sec-div{font-family:'Orbitron',sans-serif;font-size:10px;color:var(--gold);letter-spacing:2px;margin:12px 0 8px;display:flex;align-items:center;gap:8px;width:100%;}
.sec-div::after{content:'';flex:1;height:1px;background:rgba(250,204,21,0.15);}

/* ── FORM CARD ── */
.form-card{background:var(--dark4);border:2px solid rgba(255,255,255,0.55);border-radius:14px;padding:14px;width:100%;margin-bottom:4px;}
.input-row{display:flex;gap:8px;margin-bottom:10px;width:100%;}
.input-wrap{flex:1;}
.input-wrap input{width:100%;padding:12px 14px;background:rgba(0,0,0,0.35);border:2px solid rgba(255,255,255,0.65);border-radius:10px;color:var(--text);font-family:'Rajdhani',sans-serif;font-size:14px;outline:none;transition:border-color 0.3s;}
.input-wrap input:focus{border-color:rgba(255,255,255,0.9);}
.input-wrap input::placeholder{color:rgba(122,106,48,0.5);}
.usdt-bal{background:rgba(250,204,21,0.06);border:2px solid rgba(255,255,255,0.65);border-radius:10px;padding:8px 12px;min-width:80px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px;}
.ubl{font-family:'Share Tech Mono',monospace;font-size:8px;color:var(--muted);letter-spacing:1px;}
.ubv{font-family:'Orbitron',sans-serif;font-size:12px;font-weight:700;color:var(--gold);}
.btn-approve{width:100%;padding:12px;margin-bottom:8px;background:rgba(168,152,128,0.08);border:2px solid rgba(255,255,255,0.65);color:var(--white2);border-radius:10px;font-family:'Orbitron',sans-serif;font-size:11px;font-weight:700;letter-spacing:1px;cursor:pointer;transition:all 0.3s;}
.btn-approve:hover{background:rgba(168,152,128,0.12);}
.btn-stake{width:100%;padding:14px;background:linear-gradient(135deg,var(--gold),var(--gold3));color:#000;border:none;border-radius:10px;font-family:'Orbitron',sans-serif;font-size:13px;font-weight:700;letter-spacing:2px;cursor:pointer;transition:all 0.3s;box-shadow:0 4px 18px rgba(250,204,21,0.25);}
.btn-stake:hover{box-shadow:0 4px 30px rgba(250,204,21,0.5);transform:translateY(-1px);}
.status-msg{text-align:center;font-family:'Share Tech Mono',monospace;font-size:10px;margin-top:8px;color:var(--muted);}

/* ── KALKULATOR ── */
.calc-input{width:100%;padding:12px 14px;background:rgba(0,0,0,0.35);border:2px solid rgba(255,255,255,0.65);border-radius:10px;color:var(--text);font-family:'Rajdhani',sans-serif;font-size:10px;outline:none;transition:border-color 0.3s;margin-bottom:10px;}
.calc-input:focus{border-color:rgba(255,255,255,0.9);}
.calc-input::placeholder{color:rgba(122,106,48,0.5);}
.calc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;width:100%;}
.calc-item{background:rgba(0,0,0,0.3);border:2px solid rgba(255,255,255,0.55);border-radius:10px;padding:10px;text-align:center;}
.calc-val{font-family:'Orbitron',sans-serif;font-size:13px;font-weight:700;color:var(--gold);}
.calc-lbl{font-family:'Share Tech Mono',monospace;font-size:8px;color:var(--muted);letter-spacing:1px;margin-top:2px;text-transform:uppercase;}
.calc-total{background:rgba(250,204,21,0.06);border:2px solid rgba(255,255,255,0.65);border-radius:10px;padding:11px 14px;display:flex;justify-content:space-between;align-items:center;width:100%;}
.calc-total span{font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--muted);}
.calc-total strong{font-family:'Orbitron',sans-serif;font-size:13px;color:var(--gold);}

/* ── INNER TABS ── */
.inner-tabs{display:flex;gap:6px;margin:12px 0 8px;width:100%;}
.inner-tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 8px;border-radius:12px;cursor:pointer;transition:all 0.25s;border:2px solid rgba(255,255,255,0.55);background:rgba(0,0,0,0.2);flex:1;}
.inner-tab-icon{font-size:0;display:none;line-height:1;}
.inner-tab-label{font-family:'Share Tech Mono',monospace;font-size:8px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;text-align:center;margin-top:1px;}
.inner-tab.active{background:rgba(250,204,21,0.1);border-color:rgba(255,255,255,0.8);}
.inner-tab.active .inner-tab-label{color:var(--gold);}
.inner-tab:hover:not(.active){background:rgba(255,255,255,0.04);}

/* ── INNER CONTENT ── */
.inner-content{display:none;}
.inner-content.active{display:block;animation:fadeUp 0.2s ease both;}

/* ── RIWAYAT ── */
.empty-state{text-align:center;padding:24px;color:var(--muted);font-size:12px;font-family:'Share Tech Mono',monospace;}
.stake-item{background:rgba(0,0,0,0.25);border:2px solid rgba(255,255,255,0.55);border-radius:12px;padding:14px;margin-bottom:10px;border-left:4px solid var(--gold);}
.si-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.si-name{font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--gold);letter-spacing:1px;}
.si-badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:10px;background:rgba(168,152,128,0.1);color:var(--white2);}
.si-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px;width:100%;}
.si-left{text-align:left;}
.si-right{text-align:right;}
.si-lbl{font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:1px;display:block;}
.si-val{color:var(--text);display:block;font-size:13px;font-weight:700;margin-top:2px;}
.countdown-row{background:rgba(250,204,21,0.05);border:2px solid rgba(255,255,255,0.6);border-radius:8px;padding:8px 12px;text-align:center;margin-bottom:10px;}
.countdown-lbl{font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:1px;}
.countdown-val{font-family:'Share Tech Mono',monospace;font-size:14px;color:var(--gold);letter-spacing:3px;margin-top:3px;}
.btn-early{width:100%;padding:10px;background:rgba(239,68,68,0.1);border:2px solid rgba(255,255,255,0.65);color:var(--red);border-radius:10px;font-family:'Orbitron',sans-serif;font-size:11px;font-weight:700;cursor:pointer;transition:all 0.2s;}
.btn-early:hover{background:rgba(239,68,68,0.2);}

/* ── INFO SYARAT ── */
.info-sec-title{font-family:'Orbitron',sans-serif;font-size:9px;color:var(--gold);letter-spacing:2px;margin:14px 0 8px;opacity:0.9;display:flex;align-items:center;gap:6px;}
.info-sec-title::after{content:'';flex:1;height:1px;background:rgba(255,255,255,0.12);}

/* Grid kotak 2 kolom */
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:4px;width:100%;}
.info-box-card{background:rgba(0,0,0,0.25);border:2px solid rgba(255,255,255,0.6);border-radius:12px;padding:12px 10px;text-align:center;transition:all 0.2s;}
.info-box-card:hover{border-color:rgba(255,255,255,0.75);}
.info-box-icon{font-size:0;display:none;margin-bottom:4px;}
.info-box-val{font-family:'Orbitron',sans-serif;font-size:14px;font-weight:700;color:var(--gold);margin-bottom:2px;}
.info-box-lbl{font-family:'Share Tech Mono',monospace;font-size:8px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;}

/* Kotak penuh 1 kolom */
.info-box-full{background:rgba(0,0,0,0.2);border:2px solid rgba(255,255,255,0.55);border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;width:100%;}
.info-box-full:hover{border-color:rgba(255,255,255,0.7);}
.info-bf-left{display:flex;align-items:center;gap:8px;}
.info-bf-icon{font-size:0;display:none;}
.info-bf-lbl{font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:1px;}
.info-bf-val{font-family:'Orbitron',sans-serif;font-size:13px;font-weight:700;color:var(--text);}
.info-bf-val.red{color:var(--red);}
.info-bf-val.green{color:var(--white2);}

/* Cara kerja steps */
.cara-kerja{background:rgba(250,204,21,0.04);border:2px solid rgba(255,255,255,0.55);border-radius:12px;padding:12px 14px;margin-top:4px;}
.ck-step{display:flex;align-items:flex-start;gap:10px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.06);}
.ck-step:last-child{border-bottom:none;padding-bottom:0;}
.ck-num{font-family:'Orbitron',sans-serif;font-size:10px;font-weight:700;color:#000;background:var(--gold);width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}
.ck-text{font-size:12px;color:var(--muted);line-height:1.5;}
.ck-text b{color:var(--gold);}

/* ── BOTTOM NAV ── */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:200;background:rgba(8,8,8,0.99);backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;height:60px;}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0;border-radius:0;transition:color 0.2s;text-decoration:none;cursor:pointer;color:var(--muted);}
.bn-item.active{background:transparent;color:var(--gold);}
.bn-item:hover{color:var(--gold);}
.bn-icon{font-size:20px;line-height:1;}
.bn-label{font-family:'Orbitron',sans-serif;font-size:7px;font-weight:700;color:inherit;letter-spacing:1px;text-transform:uppercase;}
.bn-item.active .bn-label{color:inherit;}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
</head>
<body>

<div id="bgLogo"><img src="1772782967104.png" alt=""></div>

<div class="grid-bg"></div>
<div class="scanline"></div>
<div class="layout">

<!-- ── TOPNAV ── -->
<nav class="topnav">
  <div class="nav-left">
    <img src="1772782967104.png" class="nav-logo" alt="INDOCOIN"
         onerror="this.style.display='none';document.getElementById('logoFb').style.display='flex'">
    <div id="logoFb" class="nav-logo-fb" style="display:none"></div>
    <div class="nav-brand">
      <span class="nav-brand-main">INDOCOIN</span>
      <span class="nav-brand-sub">▸ GROWTH LOCK STAKING</span>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:8px;">
    <div class="pool-badge"><span class="pool-dot"></span>OPEN</div>
    <button id="walletBtn" onclick="connectWallet()" style="font-family:'Share Tech Mono',monospace;font-size:9px;padding:5px 12px;border-radius:20px;letter-spacing:1px;background:rgba(250,204,21,0.1);border:1px solid rgba(250,204,21,0.4);color:var(--gold);cursor:pointer;transition:all 0.2s;">CONNECT</button>
  </div>
</nav>

<div class="main">

  <!-- PILIH OPSI -->
  <div class="opsi-tabs">
    <div class="opsi-tab active" onclick="switchOpsi(1)">
      <div class="opsi-tab-period">1 BLN</div>
      <div class="opsi-tab-rate">0.3%/hr</div>
    </div>
    <div class="opsi-tab" onclick="switchOpsi(2)">
      <div class="opsi-tab-period">3 BLN</div>
      <div class="opsi-tab-rate">0.5%/hr</div>
    </div>
    <div class="opsi-tab" onclick="switchOpsi(3)">
      <div class="opsi-tab-period">6 BLN</div>
      <div class="opsi-tab-rate">0.7%/hr</div>
    </div>
    <div class="opsi-tab" onclick="switchOpsi(4)">
      <div class="opsi-tab-period">12 BLN</div>
      <div class="opsi-tab-rate">1%/hr</div>
    </div>
  </div>

  <!-- ════════ OPSI CONTENT ════════ -->
  <!-- Dirender oleh JS supaya 100% konsisten -->
  <div id="opsiWrap"></div>

</div><!-- /main -->
</div><!-- /layout -->

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <a href="dashboard.html" class="bn-item"><span class="bn-icon">🏠</span><span class="bn-label">HOME</span></a>
  <a href="earn.html"      class="bn-item active"><span class="bn-icon">💰</span><span class="bn-label">EARN</span></a>
  <a href="referral.html"  class="bn-item"><span class="bn-icon">🌐</span><span class="bn-label">REFERRAL</span></a>
  <a href="presale.html"   class="bn-item"><span class="bn-icon">🚀</span><span class="bn-label">PRESALE</span></a>
  <a href="community.html" class="bn-item"><span class="bn-icon">💬</span><span class="bn-label">COMMUNITY</span></a>
</nav>

<script>
/* ─ Data tiap opsi ─ */
const OPSI = [
  { id:1, label:'OPSI 1', period:'30 Hari Lock Period', days:30,  rate:0.003, fee:0.03, biaya:'3%',  maxS:'$300',   totalR:'9%'   },
  { id:2, label:'OPSI 2', period:'90 Hari Lock Period', days:90,  rate:0.005, fee:0.05, biaya:'5%',  maxS:'$500',   totalR:'45%'  },
  { id:3, label:'OPSI 3', period:'180 Hari Lock Period',days:180, rate:0.007, fee:0.07, biaya:'7%',  maxS:'$700',   totalR:'126%' },
  { id:4, label:'OPSI 4', period:'365 Hari Lock Period',days:365, rate:0.01,  fee:0.1,  biaya:'10%', maxS:'$1,000', totalR:'365%' },
];

/* ─ Render semua opsi ─ */
function renderOpsi() {
  const wrap = document.getElementById('opsiWrap');
  wrap.innerHTML = OPSI.map((o,idx) => `
  <div class="opsi-content${idx===0?' active':''}" id="opsi${o.id}">

    <!-- INFO STATS -->
    <div class="info-card">
      <div class="info-head">
        <div>
          <div class="info-title">${o.label}</div>
          <div class="info-subtitle">${o.period}</div>
        </div>
        <div class="info-aktif">✓ AKTIF</div>
      </div>
      <div class="info-stats">
        <div class="info-stat"><div class="info-stat-val">${parseFloat((o.rate*100).toFixed(4))}%</div><div class="info-stat-lbl">Reward/Hari</div></div>
        <div class="info-stat"><div class="info-stat-val">${o.totalR}</div><div class="info-stat-lbl">Total Reward</div></div>
        <div class="info-stat"><div class="info-stat-val">$10</div><div class="info-stat-lbl">Min Stake</div></div>
        <div class="info-stat"><div class="info-stat-val">${o.maxS}</div><div class="info-stat-lbl">Max Stake</div></div>
      </div>
    </div>

    <!-- STAKE -->
    <div class="sec-div"> STAKE SEKARANG</div>
    <div class="form-card">
      <div class="input-row">
        <div class="input-wrap"><input type="number" placeholder="Jumlah USDT (Min $10)" id="inp${o.id}"></div>
        <div class="usdt-bal"><span class="ubl">SALDO</span><span class="ubv" id="bal${o.id}">—</span></div>
      </div>

    <div class="inner-content active" id="o${o.id}-riwayat">
      ${o.id===1 ? `
      <div class="stake-item">
        <div class="si-top">
          <span class="si-name">OPSI 1 — 30 Hari</span>
          <span class="si-badge">AKTIF</span>
        </div>
        <div class="si-grid">
          <div class="si-left"><span class="si-lbl">MODAL STAKE</span><span class="si-val">$100.00 USDT</span></div>
          <div class="si-right"><span class="si-lbl">REWARD BERSIH</span><span class="si-val">$8.73 USDT</span></div>
          <div class="si-left"><span class="si-lbl">MULAI</span><span class="si-val">08 Mar 2026</span></div>
          <div class="si-right"><span class="si-lbl">SELESAI</span><span class="si-val">07 Apr 2026</span></div>
        </div>
        <div class="countdown-row">
          <div class="countdown-lbl">⏳ SISA WAKTU LOCK</div>
          <div class="countdown-val" id="cdemo">29H 23J 45M</div>
        </div>
        <button class="btn-early" onclick="earlyUnstake(${o.id})">️ UNSTAKE DINI (PENALTI 3%)</button>
      </div>` : `<div class="empty-state">Belum ada stake aktif di Opsi ${o.id}</div>`}
    </div>

    <!-- INFO -->
    <div class="inner-content" id="o${o.id}-info">
      <div class="info-sec-title">SYARAT STAKING</div>
      <div class="info-grid">
        <div class="info-box-card">
          <div class="info-box-icon">💰</div>
          <div class="info-box-val">$10</div>
          <div class="info-box-lbl">Min Stake</div>
        </div>
        <div class="info-box-card">
          <div class="info-box-icon"></div>
          <div class="info-box-val">${o.maxS}</div>
          <div class="info-box-lbl">Max Stake</div>
        </div>
        <div class="info-box-card">
          <div class="info-box-icon">⏳</div>
          <div class="info-box-val">${o.days}H</div>
          <div class="info-box-lbl">Lock Period</div>
        </div>
        <div class="info-box-card">
          <div class="info-box-icon"></div>
          <div class="info-box-val">${parseFloat((o.rate*100).toFixed(4))}%</div>
          <div class="info-box-lbl">Reward/Hari</div>
        </div>
      </div>
      <div class="info-box-card" style="text-align:center;margin-bottom:4px;background:rgba(250,204,21,0.06);border-color:rgba(250,204,21,0.2);">
        <div class="info-box-icon"></div>
        <div class="info-box-val" style="font-size:14px">${o.totalR}</div>
        <div class="info-box-lbl">Total Reward Keseluruhan</div>

      <div class="info-sec-title">BIAYA & PENALTI</div>

        <span class="info-bf-val">${o.biaya} dari reward</span>

        <span class="info-bf-val green">Setelah ${o.days} hari</span>
      </div>

      <div class="info-sec-title">CARA KERJA</div>
      <div class="cara-kerja">
        <div class="ck-step"><div class="ck-num">1</div><div class="ck-text">Approve USDT → lalu klik <b>STAKE SEKARANG</b></div></div>
        <div class="ck-step"><div class="ck-num">2</div><div class="ck-text">USDT terkunci selama <b>${o.days} hari</b> di smart contract BSC</div></div>
        <div class="ck-step"><div class="ck-num">3</div><div class="ck-text">Reward <b>${parseFloat((o.rate*100).toFixed(4))}%/hari</b> dihitung otomatis dari modal</div></div>
        <div class="ck-step"><div class="ck-num">4</div><div class="ck-text">Setelah lock selesai, klaim <b>modal + reward bersih</b></div></div>
        <div class="ck-step"><div class="ck-num">5</div><div class="ck-text">Unstake dini? Kena penalti <b>3% dari modal</b></div></div>
      </div>
    </div>

  </div>

}

/* ─ Switch opsi utama ─ */
function switchOpsi(n) {
  document.querySelectorAll('.opsi-tab').forEach((t,i)=>t.classList.toggle('active',i===n-1));
  document.querySelectorAll('.opsi-content').forEach((c,i)=>c.classList.toggle('active',i===n-1));
}

/* ─ Switch inner tab ─ */
function switchInner(opsi, tab) {
  ['riwayat','info'].forEach(t=>{
    document.getElementById(`o${opsi}-${t}`).classList.toggle('active', t===tab);
    document.getElementById(`itab${opsi}${t}`).classList.toggle('active', t===tab);
  });
}

/* ─ Kalkulator ─ */
function calcReward(id, val, days, rate, fee) {
  const u=parseFloat(val)||0;
  const gross=u*rate*days, f=gross*fee, net=gross-f, daily=u*rate;
  document.getElementById('cg'+id).textContent='$'+gross.toFixed(2);
  document.getElementById('cf'+id).textContent='$'+f.toFixed(2);
  document.getElementById('cn'+id).textContent='$'+net.toFixed(2);
  document.getElementById('cd'+id).textContent='$'+daily.toFixed(2);
  document.getElementById('ct'+id).textContent='$'+(u+net).toFixed(2)+' USDT';
}

/* ════════════════════════════════════════════════════
   SMART CONTRACT INTEGRATION — Growth Lock Staking
   ════════════════════════════════════════════════════ */

const SC = {
  STAKING:  '0xf017dF02f2BEFe09B7969E5E818c320607C5d900',
  USDT:     '0x55d398326f99059fF775485246999027B3197955',
  CHAIN_ID: 56,
};

const STAKING_ABI = [
  {"inputs":[{"internalType":"uint256","name":"amount","type":"uint256"},{"internalType":"uint256","name":"durationDays","type":"uint256"}],"name":"stake","outputs":[],"stateMutability":"nonpayable","type":"function"},
  {"inputs":[{"internalType":"uint256","name":"stakeIndex","type":"uint256"}],"name":"unstake","outputs":[],"stateMutability":"nonpayable","type":"function"},
  {"inputs":[{"internalType":"uint256","name":"stakeIndex","type":"uint256"}],"name":"emergencyUnstake","outputs":[],"stateMutability":"nonpayable","type":"function"},
  {"inputs":[],"name":"claimAllRewards","outputs":[],"stateMutability":"nonpayable","type":"function"},
  {"inputs":[{"internalType":"address","name":"user","type":"address"}],"name":"getUserStakes","outputs":[{"components":[{"internalType":"uint256","name":"amount","type":"uint256"},{"internalType":"uint256","name":"startTime","type":"uint256"},{"internalType":"uint256","name":"endTime","type":"uint256"},{"internalType":"uint256","name":"reward","type":"uint256"},{"internalType":"bool","name":"claimed","type":"bool"}],"internalType":"struct GrowthLockStaking.Stake[]","name":"","type":"tuple[]"}],"stateMutability":"view","type":"function"},
  {"inputs":[{"internalType":"address","name":"user","type":"address"}],"name":"getPendingReward","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],"stateMutability":"view","type":"function"},
  {"inputs":[],"name":"totalStaked","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],"stateMutability":"view","type":"function"},
];

const ERC20_ABI = [
  {"inputs":[{"internalType":"address","name":"account","type":"address"}],"name":"balanceOf","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],"stateMutability":"view","type":"function"},
  {"inputs":[{"internalType":"address","name":"owner","type":"address"},{"internalType":"address","name":"spender","type":"address"}],"name":"allowance","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],"stateMutability":"view","type":"function"},
  {"inputs":[{"internalType":"address","name":"spender","type":"address"},{"internalType":"uint256","name":"amount","type":"uint256"}],"name":"approve","outputs":[{"internalType":"bool","name":"","type":"bool"}],"stateMutability":"nonpayable","type":"function"},
];

let _provider, _signer, _wallet, _staking, _usdt;
const MAX_UINT = '0xffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff';

function shortAddr(a){ return a ? a.slice(0,6)+'…'+a.slice(-4) : ''; }
function fromWei(v){ return (Number(BigInt(v.toString())) / 1e18).toFixed(4); }
function toWei(v){ return ethers.utils.parseUnits(String(parseFloat(v)||0), 18); }

function setMsg(id, txt, color=''){
  const el = document.getElementById('msg'+id);
  if(el){ el.textContent = txt; el.style.color = color || ''; }
}

async function connectWallet() {
  if(!window.ethereum){ alert('Install MetaMask atau Trust Wallet terlebih dahulu!'); return; }
  try {
    const accounts = await window.ethereum.request({method:'eth_requestAccounts'});
    _wallet = accounts[0];
    const chainHex = await window.ethereum.request({method:'eth_chainId'});
    if(parseInt(chainHex,16) !== SC.CHAIN_ID) {
      try {
        await window.ethereum.request({method:'wallet_switchEthereumChain',params:[{chainId:'0x38'}]});
      } catch(e) {
        if(e.code===4902) await window.ethereum.request({method:'wallet_addEthereumChain',params:[{chainId:'0x38',chainName:'BNB Smart Chain',rpcUrls:['https://bsc-dataseed1.binance.org/'],nativeCurrency:{name:'BNB',symbol:'BNB',decimals:18},blockExplorerUrls:['https://bscscan.com/']}]});
      }
    }
    _provider = new ethers.providers.Web3Provider(window.ethereum);
    _signer   = _provider.getSigner();
    _staking  = new ethers.Contract(SC.STAKING, STAKING_ABI, _signer);
    _usdt     = new ethers.Contract(SC.USDT,    ERC20_ABI,   _signer);

    const btn = document.getElementById('walletBtn');
    if(btn) btn.textContent = shortAddr(_wallet);

    await loadBalances();
    OPSI.forEach(o => setMsg(o.id, 'Wallet terhubung. Masukkan jumlah & approve.', 'var(--gold2)'));

    window.ethereum.on('accountsChanged', a=>{ if(a[0]){_wallet=a[0]; loadBalances();} });
    window.ethereum.on('chainChanged', ()=>location.reload());
  } catch(e) {
    console.error(e);
    alert('Gagal connect: '+(e.message||e));
  }
}

async function loadBalances() {
  if(!_wallet||!_usdt) return;
  try {
    const bal = await _usdt.balanceOf(_wallet);
    const fmt = parseFloat(fromWei(bal)).toFixed(2);
    OPSI.forEach(o => {
      const el = document.getElementById('bal'+o.id);
      if(el) el.textContent = '$'+fmt;
    });
  } catch(e){ console.error('loadBalances',e); }
}

async function approveUSDT(opsiId) {
  if(!_wallet){ await connectWallet(); return; }
  const btn = document.getElementById('btnApprove'+opsiId);
  btn.textContent = '⏳ Approving...'; btn.disabled = true;
  setMsg(opsiId, 'Menunggu konfirmasi approve...', 'var(--gold)');
  try {
    const tx = await _usdt.approve(SC.STAKING, MAX_UINT);
    await tx.wait();
    btn.textContent = '✓ APPROVED';
    setMsg(opsiId, 'Approve berhasil! Sekarang bisa stake.', 'var(--gold2)');
    document.getElementById('btnStake'+opsiId).style.opacity = '1';
  } catch(e) {
    btn.textContent = 'APPROVE USDT'; btn.disabled = false;
    setMsg(opsiId, 'Approve dibatalkan: '+(e.reason||e.message||''), 'var(--red)');
  }
}

async function doStake(opsiId, days) {
  if(!_wallet){ await connectWallet(); return; }
  const val = document.getElementById('inp'+opsiId).value;
  if(!val || parseFloat(val) <= 0){ setMsg(opsiId,'Masukkan jumlah USDT terlebih dahulu','var(--red)'); return; }
  if(parseFloat(val) < 10){ setMsg(opsiId,'Minimum stake $10 USDT','var(--red)'); return; }
  const btn = document.getElementById('btnStake'+opsiId);
  btn.textContent = '⏳ Staking...'; btn.disabled = true;
  setMsg(opsiId, 'Menunggu konfirmasi transaksi...', 'var(--gold)');
  try {
    const amtWei = toWei(val);
    const allow  = await _usdt.allowance(_wallet, SC.STAKING);
    if(allow.lt(amtWei)){
      setMsg(opsiId, 'Allowance kurang, silakan Approve dulu.', 'var(--red)');
      btn.textContent = 'STAKE SEKARANG'; btn.disabled = false; return;
    }
    const tx = await _staking.stake(amtWei, days);
    setMsg(opsiId, 'Transaksi dikirim, menunggu konfirmasi...', 'var(--gold)');
    await tx.wait();
    setMsg(opsiId, '✓ Stake berhasil! USDT terkunci '+days+' hari.', 'var(--gold2)');
    document.getElementById('inp'+opsiId).value = '';
    await loadBalances();
  } catch(e) {
    setMsg(opsiId, 'Stake gagal: '+(e.reason||e.message||''), 'var(--red)');
  } finally {
    btn.textContent = 'STAKE SEKARANG'; btn.disabled = false;
  }
}

async function earlyUnstake(opsiId) {
  if(!_wallet){ await connectWallet(); return; }
  if(!confirm('Unstake dini kena penalti 3% dari modal. Lanjutkan?')) return;
  setMsg(opsiId, 'Memproses unstake dini...', 'var(--gold)');
  try {
    const stakes = await _staking.getUserStakes(_wallet);
    const idx = stakes.findIndex(s => !s.claimed);
    if(idx < 0){ setMsg(opsiId,'Tidak ada posisi aktif.','var(--red)'); return; }
    const tx = await _staking.emergencyUnstake(idx);
    await tx.wait();
    setMsg(opsiId, '✓ Unstake dini berhasil.', 'var(--gold2)');
    await loadBalances();
  } catch(e) {
    setMsg(opsiId, 'Gagal: '+(e.reason||e.message||''), 'var(--red)');
  }
}

/* Auto-connect saat halaman dibuka */
(async function autoConnect(){
  if(!window.ethereum) return;
  /* Cek dulu apakah sudah pernah connect — jika ya, langsung reconnect tanpa popup */
  const accounts = await window.ethereum.request({method:'eth_accounts'}).catch(()=>[]);
  if(accounts.length){
    await connectWallet();
  } else {
    /* Belum pernah connect — langsung request (akan muncul popup MetaMask) */
    await connectWallet();
  }
})();

/* ─ Stars ─ */
for(let i=0;i<45;i++){
  const s=document.createElement('div'); s.className='star';
  const sz=Math.random()*2+0.4;
  s.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${(Math.random()*3+2).toFixed(1)}s;animation-delay:${(Math.random()*3).toFixed(1)}s;`;
  document.body.appendChild(s);
}

/* ─ Init ─ */
renderOpsi();
</script>
<script>
if("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/sw.js").then(reg => {
      reg.addEventListener("updatefound", () => {
        const newSW = reg.installing;
        newSW.addEventListener("statechange", () => {
          if(newSW.state === "installed" && navigator.serviceWorker.controller){
            newSW.postMessage("skipWaiting");
            window.location.reload();
          }
        });
      });
    }).catch(e => console.warn("SW:", e));
  });
}
</script>
