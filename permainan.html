<style>
:root {
  --gold:#facc15;--gold2:#fbbf24;--gold3:#f59e0b;
  --dark:#0a0f1e;--dark2:#0f172a;--dark3:#1e293b;
  --text:#e2e8f0;--muted:#64748b;
  --green:#34d399;--red:#f87171;--cyan:#38bdf8;--violet:#a78bfa;
  --orange:#fb923c;--pink:#f472b6;
  --border:rgba(250,204,21,0.12);--card:rgba(15,23,42,0.97);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--dark);color:var(--text);font-family:'Rajdhani',sans-serif;min-height:100vh;overflow-x:hidden;}

/* ── STARS BG ── */
.star{position:fixed;background:#fff;border-radius:50%;animation:twinkle var(--d) ease-in-out infinite alternate;z-index:0;pointer-events:none;}
@keyframes twinkle{from{opacity:.04}to{opacity:.45}}

/* ── ANIMATED GRID LINES ── */
.grid-bg{position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(250,204,21,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(250,204,21,0.03) 1px, transparent 1px);
  background-size:40px 40px;
  animation:gridMove 20s linear infinite;}
@keyframes gridMove{from{background-position:0 0}to{background-position:40px 40px}}

/* ── TOPNAV ── */
.topnav{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;
  background:rgba(5,10,25,0.98);backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(255,68,68,0.2);
  position:sticky;top:0;z-index:100;}
.nav-back{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--gold);}
.nav-back-icon{font-size:18px;}
.nav-brand{font-family:'Orbitron',sans-serif;font-size:13px;font-weight:900;color:var(--gold);letter-spacing:2px;text-shadow:0 0 15px rgba(250,204,21,0.5);}
.nav-sub{font-family:'Share Tech Mono',monospace;font-size:8px;color:var(--muted);letter-spacing:1px;}
.nav-count{font-family:'Orbitron',sans-serif;font-size:9px;font-weight:700;
  background:rgba(250,204,21,0.1);border:1px solid rgba(250,204,21,0.3);
  border-radius:20px;padding:4px 10px;color:var(--gold);}

/* ── HERO BANNER ── */
.hero-banner{position:relative;z-index:1;padding:28px 16px 20px;text-align:center;overflow:hidden;}
.hero-banner::before{content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 0%, rgba(250,204,21,0.08) 0%, transparent 70%);
  pointer-events:none;}
.hero-gametitle{font-family:'Orbitron',sans-serif;font-size:28px;font-weight:900;
  background:linear-gradient(135deg,var(--gold),var(--orange),var(--red));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  letter-spacing:4px;margin-bottom:4px;
  animation:titlePulse 3s ease-in-out infinite;}
@keyframes titlePulse{0%,100%{filter:drop-shadow(0 0 8px rgba(250,204,21,0.4))}50%{filter:drop-shadow(0 0 20px rgba(250,204,21,0.8))}}
.hero-subtitle{font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:2px;margin-bottom:14px;}
.hero-stats{display:flex;justify-content:center;gap:20px;}
.hstat-pill{display:flex;flex-direction:column;align-items:center;gap:2px;}
.hstat-num{font-family:'Orbitron',sans-serif;font-size:16px;font-weight:900;color:var(--gold);}
.hstat-lbl{font-family:'Share Tech Mono',monospace;font-size:8px;color:var(--muted);letter-spacing:1px;}

/* ── FILTER TABS ── */
.filter-wrap{position:relative;z-index:1;padding:0 12px 12px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;}
.filter-wrap::-webkit-scrollbar{display:none;}
.ftab{flex-shrink:0;padding:6px 14px;border-radius:20px;font-family:'Orbitron',sans-serif;font-size:8px;font-weight:700;
  border:1px solid var(--border);background:rgba(255,255,255,0.03);color:var(--muted);
  cursor:pointer;transition:all .25s;letter-spacing:.5px;}
.ftab.on{background:rgba(250,204,21,0.12);border-color:rgba(250,204,21,0.5);color:var(--gold);
  box-shadow:0 0 12px rgba(250,204,21,0.15);}

/* ── GAME GRID ── */
.page{position:relative;z-index:1;padding:0 10px 84px;}
.game-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

/* ── GAME CARD ── */
.game-card{position:relative;border-radius:16px;overflow:hidden;cursor:pointer;
  border:1px solid var(--border);background:var(--card);
  transition:transform .25s,box-shadow .25s;
  animation:fadeUp .4s ease both;}
.game-card:active{transform:scale(0.96);}
.game-card.live:hover,.game-card.live:focus{
  transform:translateY(-3px);
  box-shadow:0 8px 30px rgba(250,204,21,0.2);}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

/* CARD THUMB */
.card-thumb{position:relative;height:110px;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.thumb-bg{position:absolute;inset:0;}
.thumb-emoji{font-size:52px;position:relative;z-index:1;filter:drop-shadow(0 4px 12px rgba(0,0,0,0.5));
  transition:transform .3s;}
.game-card:active .thumb-emoji{transform:scale(1.15);}

/* SCAN LINE on thumb */
.scan-line{position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,rgba(250,204,21,0.6),transparent);
  animation:scanAnim 3s ease-in-out infinite;z-index:2;}
@keyframes scanAnim{0%{top:-2px;opacity:0}20%{opacity:1}80%{opacity:1}100%{top:110px;opacity:0}}

/* STATUS BADGE */
.status-badge{position:absolute;top:8px;right:8px;z-index:3;
  font-family:'Orbitron',sans-serif;font-size:7px;font-weight:700;
  padding:3px 8px;border-radius:20px;letter-spacing:.5px;}
.badge-live{background:rgba(52,211,153,0.2);border:1px solid rgba(52,211,153,0.5);color:var(--green);}
.badge-soon{background:rgba(100,116,139,0.2);border:1px solid rgba(100,116,139,0.3);color:var(--muted);}
.badge-hot{background:rgba(248,113,113,0.2);border:1px solid rgba(248,113,113,0.5);color:var(--red);}
.badge-new{background:rgba(250,204,21,0.2);border:1px solid rgba(250,204,21,0.5);color:var(--gold);}

/* LIVE DOT */
.live-dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--green);
  box-shadow:0 0 6px var(--green);animation:blink 1.2s ease-in-out infinite;margin-right:3px;vertical-align:middle;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}

/* CARD BODY */
.card-body{padding:10px 12px 12px;}
.card-name{font-family:'Orbitron',sans-serif;font-size:11px;font-weight:900;
  color:var(--text);letter-spacing:1px;margin-bottom:2px;}
.card-genre{font-family:'Share Tech Mono',monospace;font-size:8px;color:var(--muted);margin-bottom:6px;}
.card-desc{font-family:'Rajdhani',sans-serif;font-size:11px;color:rgba(226,232,240,0.6);
  line-height:1.4;margin-bottom:8px;min-height:30px;}
.card-footer{display:flex;align-items:center;justify-content:space-between;}
.card-players{font-family:'Share Tech Mono',monospace;font-size:8px;color:var(--muted);}
.card-reward{font-family:'Orbitron',sans-serif;font-size:9px;font-weight:700;color:var(--gold);}

/* COMING SOON OVERLAY */
.soon-overlay{position:absolute;inset:0;background:rgba(10,15,30,0.7);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  backdrop-filter:blur(2px);z-index:10;}
.soon-text{font-family:'Orbitron',sans-serif;font-size:9px;font-weight:700;
  color:var(--muted);letter-spacing:2px;margin-top:4px;}
.soon-lock{font-size:24px;filter:grayscale(1);opacity:0.5;}

/* PROGRESS BAR (for coming soon) */
.progress-bar{height:3px;border-radius:2px;background:rgba(255,255,255,0.06);margin-top:6px;overflow:hidden;}
.progress-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--gold),var(--orange));}

/* ── FEATURED CARD (INDOWAR - full width) ── */
.game-card.featured{grid-column:1/-1;}
.game-card.featured .card-thumb{height:160px;}
.game-card.featured .thumb-emoji{font-size:72px;}
.game-card.featured .card-name{font-size:16px;letter-spacing:2px;}
.game-card.featured .card-desc{font-size:12px;min-height:auto;}
.featured-tag{position:absolute;top:10px;left:10px;z-index:3;
  font-family:'Orbitron',sans-serif;font-size:7px;font-weight:700;
  background:linear-gradient(135deg,var(--gold),var(--orange));
  color:#000;padding:3px 9px;border-radius:20px;letter-spacing:.5px;}

/* ── BOTTOM NAV ── */
.bottomnav{position:fixed;bottom:0;left:0;right:0;z-index:100;
  background:rgba(5,10,25,0.98);backdrop-filter:blur(16px);
  border-top:1px solid rgba(250,204,21,0.2);display:flex;height:60px;}
.bnav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;text-decoration:none;color:#6b7280;transition:all .2s;}
.bnav-item.active,.bnav-item:hover{color:var(--gold);}
.bnav-icon{font-size:17px;}
.bnav-label{font-size:7px;font-weight:700;letter-spacing:.8px;font-family:'Orbitron',sans-serif;}

/* ── TOAST ── */
.toast{position:fixed;bottom:72px;left:50%;transform:translateX(-50%);
  background:rgba(15,23,42,0.97);border:1px solid var(--border);
  border-radius:20px;padding:9px 18px;
  font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--text);
  z-index:999;white-space:nowrap;animation:toastIn .3s ease;}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* ── SECTION LABEL ── */
.section-label{font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--muted);
  letter-spacing:2px;margin:14px 0 8px;display:flex;align-items:center;gap:6px;}
.section-label::after{content:'';flex:1;height:1px;background:var(--border);}
</style>

function renderGames(filter){
  const grid = document.getElementById("gameGrid");
  const filtered = GAMES.filter(g => g.filter.includes(filter));

  grid.innerHTML = filtered.map((g, i) => {
    const isFeatured = g.featured;
    const isLive = g.status === "live";

    const badgeHTML = g.badgeType === "live"
      ? `<div class="status-badge badge-live"><span class="live-dot"></span>${g.badgeText}</div>`
      : g.badgeType === "hot"
      ? `<div class="status-badge badge-hot">🔥 ${g.badgeText}</div>`
      : g.badgeType === "new"
      ? `<div class="status-badge badge-new">✨ ${g.badgeText}</div>`
      : `<div class="status-badge badge-soon">${g.badgeText}</div>`;

    const soonOverlay = !isLive ? `
      <div class="soon-overlay">
        <div class="soon-lock">🔒</div>
        <div class="soon-text">COMING SOON</div>
      </div>` : '';

    const cardClick = isLive && g.url
      ? `onclick="window.location.href='${g.url}'"` : `onclick="showSoon('${g.name}')"`;

    return `
    <div class="game-card ${isFeatured?'featured':''} ${isLive?'live':''}"
      style="animation-delay:${i*0.07}s" ${cardClick}>
      ${isFeatured ? '<div class="featured-tag">⭐ GAME UNGGULAN</div>' : ''}
      ${soonOverlay}
      <div class="card-thumb">
        <div class="thumb-bg" style="background:${g.bg}"></div>
        <div class="scan-line" style="animation-delay:${i*0.3}s"></div>
        ${g.icon
          ? `<img src="${g.icon}" alt="${g.name}" style="height:${isFeatured?'140px':'90px'};width:auto;position:relative;z-index:1;object-fit:contain;filter:drop-shadow(0 4px 16px rgba(255,68,68,0.5));transition:transform .3s;">`
          : `<span class="thumb-emoji">${g.emoji}</span>`
        }
        ${badgeHTML}
      </div>
      <div class="card-body">
        <div class="card-name">${g.name}</div>
        <div class="card-genre">${g.genre}</div>
        <div class="card-desc">${g.desc}</div>
        ${!isLive ? `<div class="progress-bar"><div class="progress-fill" style="width:${g.progress}%"></div></div>` : ''}
        <div class="card-footer">
          <div class="card-players">👥 ${g.players}</div>
          <div class="card-reward">💎 ${g.reward}</div>
        </div>
      </div>
    </div>`;
  }).join("");
}

// Filter tabs
document.querySelectorAll(".ftab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".ftab").forEach(t => t.classList.remove("on"));
    tab.classList.add("on");
    activeFilter = tab.dataset.filter;
    renderGames(activeFilter);
  });
});

function showSoon(name){
  showToast("🔒 "+name+" belum tersedia — Coming Soon!");
}

function showToast(msg){
  document.querySelectorAll(".toast").forEach(t=>t.remove());
  const el=document.createElement("div"); el.className="toast";
  el.textContent=msg; document.body.appendChild(el);
  setTimeout(()=>el.remove(),2500);
}

// Bintang background
for(let i=0;i<25;i++){
  const s=document.createElement("div"); s.className="star";
  const sz=Math.random()*1.5+.4;
  s.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${Math.random()*3+2}s;animation-delay:${Math.random()*4}s;`;
  document.body.appendChild(s);
}

renderGames("all");
