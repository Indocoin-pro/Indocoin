<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Sync — VIP Volume</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Share Tech Mono',monospace,sans-serif;background:#0b0b0b;color:#f0e8d8;padding:14px;font-size:13px;}
  h1{font-size:16px;color:#f0b429;margin-bottom:4px;}
  .sub{color:#888;font-size:11px;margin-bottom:16px;}
  .card{background:#161616;border:1px solid #2a2a2a;border-radius:10px;padding:14px;margin-bottom:12px;}
  .btn{background:linear-gradient(135deg,#c8922a,#f0b429);color:#000;font-weight:700;border:none;border-radius:8px;padding:10px 18px;font-size:12px;cursor:pointer;letter-spacing:1px;}
  .btn:disabled{opacity:0.4;cursor:not-allowed;}
  .btn-sm{padding:6px 12px;font-size:10px;border-radius:6px;}
  textarea{width:100%;background:#000;color:#f0e8d8;border:1px solid #333;border-radius:6px;padding:8px;font-family:monospace;font-size:11px;min-height:90px;margin-top:8px;}
  table{width:100%;border-collapse:collapse;font-size:11px;margin-top:10px;}
  th,td{border-bottom:1px solid #2a2a2a;padding:6px 4px;text-align:left;word-break:break-all;}
  th{color:#f0b429;font-weight:700;}
  .ok{color:#22c55e;}
  .pending{color:#f97316;}
  .err{color:#ef4444;}
  .addr{font-size:10px;color:#9ca3af;}
  .grp{font-size:11px;color:#f0b429;font-weight:700;margin-top:10px;}
  #log{background:#000;border:1px solid #2a2a2a;border-radius:8px;padding:10px;font-size:10px;height:140px;overflow-y:auto;margin-top:10px;line-height:1.6;}
  .status-line{margin-bottom:8px;font-size:11px;color:#ccc;}
</style>
</head>
<body>

<h1>🔧 ADMIN SYNC — VIP VOLUME</h1>
<div class="sub">Catch-up volume staking downline ke Aggregator (per upline VIP)</div>

<div class="card">
  <button class="btn" id="btnConnect">Connect Wallet (Dev)</button>
  <div class="status-line" id="walletStatus">Belum connect</div>
</div>

<div class="card">
  <div class="status-line">Masukkan address upline VIP (1 per baris, max 10):</div>
  <textarea id="inpUplines" placeholder="0x.....&#10;0x.....&#10;0x.....&#10;0x....."></textarea>
  <button class="btn" id="btnScan" disabled style="margin-top:8px;">1. Cek Downline & Volume</button>
  <div class="status-line" id="scanStatus">Belum di-scan</div>
</div>

<div class="card" id="resultCard" style="display:none;">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
    <span id="resultSummary"></span>
    <button class="btn btn-sm" id="btnSyncAll">SYNC SEMUA YANG BELUM</button>
  </div>
  <div id="resultContainer"></div>
</div>

<div class="card">
  <div class="status-line" style="margin-bottom:4px;">📋 LOG</div>
  <div id="log"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
<script>
const WELCOME_ADDR     = '0xE96A96fbf0DbF778Ce142aEae47254E94c440903';
const AGGREGATOR_ADDR  = '0xD4109384EB4086E37265ec71f11e443269bf5110';
const REFMASTER_ADDR   = '0xde257f4C4fe50A650E7D7771ebe43a842CBE35D9';

const WELCOME_ABI = [
  "function getPositionCount(address user) external view returns (uint256)",
  "function getPosition(address user, uint256 idx) external view returns (uint256 indcStaked, uint256 usdtEquivalent, uint256 startTime, uint256 lastCheckpoint, uint256 reward, bool active, bool checkpointPending, uint256 nextCheckpointTime)"
];
const AGGREGATOR_ABI = [
  "function getUserVolume(address user) external view returns (uint256)",
  "function reportVolumeUSDT(address user, uint256 usdtAmount, uint8 activityType) external"
];
const REFMASTER_ABI = [
  "function getDirectDownlines(address _user) external view returns (address[] memory)"
];

let _provider, _signer, _wallet;
let _groups = []; // [{upline, downlines: [{user, total, synced}]}]

function log(msg) {
  const el = document.getElementById('log');
  const time = new Date().toLocaleTimeString('id-ID');
  el.innerHTML += `[${time}] ${msg}<br>`;
  el.scrollTop = el.scrollHeight;
}

document.getElementById('btnConnect').onclick = async () => {
  if (!window.ethereum) { log('❌ Wallet tidak ditemukan'); return; }
  try {
    _provider = new ethers.providers.Web3Provider(window.ethereum, { name: 'bnb', chainId: 56 });
    await _provider.send("eth_requestAccounts", []);
    _signer = _provider.getSigner();
    _wallet = await _signer.getAddress();
    document.getElementById('walletStatus').innerHTML = `✅ Connected: ${_wallet}`;
    document.getElementById('btnScan').disabled = false;
    log('Wallet connected: ' + _wallet);
  } catch(e) {
    log('❌ Connect gagal: ' + (e.message || e));
  }
};

document.getElementById('btnScan').onclick = async () => {
  const btn = document.getElementById('btnScan');
  btn.disabled = true;
  document.getElementById('scanStatus').textContent = '⏳ Mengambil data...';

  try {
    const raw = document.getElementById('inpUplines').value.trim();
    const uplines = raw.split('\n').map(s => s.trim()).filter(s => s.length === 42 && s.startsWith('0x'));

    if (uplines.length === 0) {
      log('❌ Tidak ada address valid di input.');
      document.getElementById('scanStatus').textContent = '❌ Input kosong/tidak valid.';
      btn.disabled = false;
      return;
    }

    log(`Memproses ${uplines.length} upline...`);

    const refMaster = new ethers.Contract(REFMASTER_ADDR, REFMASTER_ABI, _provider);
    const welcome   = new ethers.Contract(WELCOME_ADDR, WELCOME_ABI, _provider);
    const agg       = new ethers.Contract(AGGREGATOR_ADDR, AGGREGATOR_ABI, _provider);

    _groups = [];

    for (const upline of uplines) {
      log(`Cek seluruh pohon downline dari ${upline} (sampai 10 level)...`);

      // BFS rekursif sampai 10 level
      let allDownlines = []; // [{addr, level}]
      let currentLevel = [upline];
      let visited = new Set([upline.toLowerCase()]);

      for (let level = 1; level <= 10; level++) {
        if (currentLevel.length === 0) break;
        let nextLevel = [];
        for (const addr of currentLevel) {
          try {
            const dls = await refMaster.getDirectDownlines(addr);
            for (const dl of dls) {
              if (visited.has(dl.toLowerCase())) continue;
              visited.add(dl.toLowerCase());
              allDownlines.push({ addr: dl, level });
              nextLevel.push(dl);
            }
          } catch(e) {
            log(`  ⚠️ Gagal ambil downline ${addr}: ` + (e.message || e));
          }
        }
        log(`  Level ${level}: ${nextLevel.length} downline baru`);
        currentLevel = nextLevel;
      }

      log(`  → Total ${allDownlines.length} downline di seluruh pohon`);

      const group = { upline, downlines: [] };

      for (const item of allDownlines) {
        const dl = item.addr;
        let total = ethers.BigNumber.from(0);
        try {
          const count = await welcome.getPositionCount(dl);
          for (let i = 0; i < count; i++) {
            const pos = await welcome.getPosition(dl, i);
            total = total.add(pos.usdtEquivalent);
          }
        } catch(e) {
          log(`  ⚠️ Gagal ambil posisi ${dl}: ` + (e.message || e));
        }

        let currentVol = ethers.BigNumber.from(0);
        try {
          currentVol = await agg.getUserVolume(dl);
        } catch(e) { /* ignore */ }

        group.downlines.push({
          user: dl,
          level: item.level,
          total: total,
          synced: currentVol.gt(0),
          currentVol: currentVol
        });
      }

      _groups.push(group);
    }

    renderTable();
    document.getElementById('resultCard').style.display = 'block';
    document.getElementById('scanStatus').textContent = `✅ Selesai.`;
    log('Scan selesai.');

  } catch(e) {
    log('❌ Gagal: ' + (e.message || e));
    document.getElementById('scanStatus').textContent = '❌ Gagal, lihat log.';
  } finally {
    btn.disabled = false;
  }
};

function renderTable() {
  const container = document.getElementById('resultContainer');
  container.innerHTML = '';
  let totalDL = 0, unsyncedCount = 0;

  for (const group of _groups) {
    const grpDiv = document.createElement('div');
    grpDiv.className = 'grp';
    grpDiv.textContent = `Upline: ${group.upline} (${group.downlines.length} downline)`;
    container.appendChild(grpDiv);

    const table = document.createElement('table');
    table.innerHTML = `<thead><tr><th>Lv</th><th>Downline</th><th>Total USDT</th><th>Status</th><th>Aksi</th></tr></thead><tbody></tbody>`;
    const body = table.querySelector('tbody');

    for (const row of group.downlines) {
      totalDL++;
      if (!row.synced) unsyncedCount++;
      const totalUsd = ethers.utils.formatUnits(row.total, 18);
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${row.level}</td>
        <td class="addr">${row.user}</td>
        <td>$${parseFloat(totalUsd).toFixed(2)}</td>
        <td class="${row.synced ? 'ok' : 'pending'}">${row.synced ? '✅ Sudah' : '⏳ Belum'}</td>
        <td><button class="btn btn-sm" data-user="${row.user}" ${row.synced || row.total.isZero() ? 'disabled' : ''}>Sync</button></td>
      `;
      body.appendChild(tr);
    }

    table.appendChild(body);
    container.appendChild(table);
  }

  document.getElementById('resultSummary').textContent =
    `${totalDL} downline total, ${unsyncedCount} belum sync`;

  container.querySelectorAll('button[data-user]').forEach(btn => {
    btn.onclick = () => syncUser(btn.dataset.user, btn);
  });
}

async function syncUser(userAddr, btnEl) {
  let row = null;
  for (const g of _groups) {
    row = g.downlines.find(r => r.user.toLowerCase() === userAddr.toLowerCase());
    if (row) break;
  }
  if (!row || row.total.isZero()) return;

  if (btnEl) { btnEl.disabled = true; btnEl.textContent = '...'; }
  log(`Sync ${userAddr} — $${ethers.utils.formatUnits(row.total, 18)}...`);

  try {
    const agg = new ethers.Contract(AGGREGATOR_ADDR, AGGREGATOR_ABI, _signer);
    const tx = await agg.reportVolumeUSDT(userAddr, row.total, 2);
    log(`Tx terkirim: ${tx.hash} — menunggu konfirmasi...`);
    await tx.wait();
    log(`✅ Sukses: ${userAddr}`);
    row.synced = true;
    renderTable();
  } catch(e) {
    log(`❌ Gagal untuk ${userAddr}: ` + (e.reason || e.message || e));
    if (btnEl) { btnEl.disabled = false; btnEl.textContent = 'Sync'; }
  }
}

document.getElementById('btnSyncAll').onclick = async () => {
  let allUnsynced = [];
  for (const g of _groups) {
    for (const row of g.downlines) {
      if (!row.synced && !row.total.isZero()) allUnsynced.push(row);
    }
  }
  if (allUnsynced.length === 0) { log('Tidak ada yang perlu disync.'); return; }

  log(`Mulai sync ${allUnsynced.length} downline secara berurutan...`);
  for (const row of allUnsynced) {
    await syncUser(row.user);
    await new Promise(r => setTimeout(r, 1000));
  }
  log('🎉 Sync semua selesai.');
};
</script>
</body>
</html>
