import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
import { getDatabase, ref, push, set, get } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-database.js";

  apiKey:"AIzaSyBrhDJiIcEJsZ-fN0RIDlV0XaOA8ZPjJsw",
  authDomain:"indocoin-network.firebaseapp.com",

});
const _fbDb = getDatabase(_fbApp);

// Simpan request USDT + data matching profit ke Firebase
window._fbSaveRequest = async (data) => {
  try { await push(ref(_fbDb, 'usdt_requests'), data); }

};

// Ambil matching profit akumulasi Paket A dari Firebase
window._fbGetMatchingA = async (wallet) => {

function switchOpsi(n){
  document.querySelectorAll('.opsi-tab').forEach((t,i)=>t.classList.toggle('active',i===n-1));
  document.querySelectorAll('.opsi-content').forEach((c,i)=>c.classList.toggle('active',i===n-1));
}
function switchInner(opsi,tab){
  const tabs=opsi===1?['riwayat','info']:['riwayat','request','info'];
  tabs.forEach(t=>{
    const c=document.getElementById(`o${opsi}-${t}`),b=document.getElementById(`itab${opsi}${t}`);
    if(c)c.classList.toggle('active',t===tab);if(b)b.classList.toggle('active',t===tab);
  });
}
function calcPreview(id,val,rate){
  const amt=parseFloat(val)||0,days=Math.max(0,Math.floor((LOCK_END-Date.now())/86400000));
  const daily=amt*rate,total=daily*days;
  document.getElementById('kd'+id).textContent=fmtN(daily)+' INDC';
  document.getElementById('kh'+id).textContent=days+' hari';
  document.getElementById('kg'+id).textContent=fmtN(total)+' INDC';
  document.getElementById('kt'+id).textContent=fmtN(amt+total)+' INDC';
  if(id===2)document.getElementById('ku'+id).textContent='$'+(daily*INDC_PRICE).toFixed(3);
}
function calcReward(id){calcPreview(id,document.getElementById('inp'+id).value,PAKET[id-1].rate);}
function calcRequest(){
  const indc=parseFloat(document.getElementById('inpReq').value)||0;
  document.getElementById('usdtPreview').textContent='$'+(indc*INDC_PRICE).toFixed(2)+' USDT';
}

async function connectWallet(){
  if(!window.ethereum){alert('Install MetaMask atau Trust Wallet terlebih dahulu!');return;}
  try{
    const accounts=await window.ethereum.request({method:'eth_requestAccounts'});
    _wallet=accounts[0];
    const chainHex=await window.ethereum.request({method:'eth_chainId'});
    if(parseInt(chainHex,16)!==SC.CHAIN_ID){
      try{await window.ethereum.request({method:'wallet_switchEthereumChain',params:[{chainId:'0x38'}]});}
      catch(e){if(e.code===4902)await window.ethereum.request({method:'wallet_addEthereumChain',params:[{chainId:'0x38',chainName:'BNB Smart Chain',rpcUrls:['https://bsc-dataseed1.binance.org/'],nativeCurrency:{name:'BNB',symbol:'BNB',decimals:18},blockExplorerUrls:['https://bscscan.com/']}]});}
    }
    _provider=new ethers.providers.Web3Provider(window.ethereum);
    _signer=_provider.getSigner();
    _staking=new ethers.Contract(SC.STAKING,STAKING_ABI,_signer);
    _indc=new ethers.Contract(SC.INDC,ERC20_ABI,_signer);
    _master=new ethers.Contract(SC.MASTER,MASTER_ABI_LITE,_provider);
    document.getElementById('walletBtn').textContent=shortAddr(_wallet);
    await loadBalances();await loadStakeData();
    PAKET.forEach(p=>setMsg(p.id,'Wallet terhubung. Masukkan jumlah & approve.','var(--green)'));
    setMsg('Req','Wallet terhubung. Masukkan jumlah INDC untuk request USDT.','var(--green)');
    window.ethereum.on('accountsChanged',a=>{if(a[0]){_wallet=a[0];loadBalances();loadStakeData();}});
    window.ethereum.on('chainChanged',()=>location.reload());
  }catch(e){console.error(e);alert('Gagal connect: '+(e.message||e));}
}
async function loadBalances(){
  if(!_wallet||!_indc)return;
  try{const bal=await _indc.balanceOf(_wallet);const fmt=fmtN(fromINDC(bal));PAKET.forEach(p=>{const el=document.getElementById('bal'+p.id);if(el)el.textContent=fmt+' INDC';});}catch(e){console.error(e);}
}

      </div>`;
    }
    const b=await _staking.getStakePaketB(_wallet);const bAmt=fromINDC(b.amount);
    if(bAmt>0){
      document.getElementById('empty2').style.display='none';
      const since=new Date(Number(b.since)*1000);const pending=fromINDC(b.pendingReward);
      document.getElementById('stakeList2').innerHTML=`<div class="stake-item">
        <div class="si-top"><span class="si-name">💧 PAKET B — FLEXIBLE REWARD</span><span class="si-badge">AKTIF</span></div>
        <div class="si-grid">
          <div class="si-left"><span class="si-lbl">MODAL STAKE</span><span class="si-val">${fmtN(bAmt)} INDC</span></div>
          <div class="si-right"><span class="si-lbl">PENDING REWARD</span><span class="si-val">${fmtN(pending)} INDC</span></div>
          <div class="si-left"><span class="si-lbl">MULAI</span><span class="si-val">${since.toLocaleDateString('id-ID')}</span></div>
          <div class="si-right"><span class="si-lbl">UNLOCK MODAL</span><span class="si-val">30 Mei 2026</span></div>
        </div>
        <div class="countdown-row"><div class="countdown-lbl">⏳ SISA WAKTU LOCK MODAL</div><div class="countdown-val" id="cdStakeB">-- H -- J -- M</div></div>
        <button class="btn-unstake" id="btnUnstakeB" onclick="unstakeB()" disabled>📤 UNSTAKE MODAL — 30 MEI 2026</button>
      </div>`;
      const pEl=document.getElementById('pendingB');if(pEl)pEl.textContent=fmtN(pending)+' INDC';
      const uEl=document.getElementById('pendingBusd');if(uEl)uEl.textContent=(pending*INDC_PRICE).toFixed(2);
      // Hitung matching profit dari downline
      if(_master && pending > 0){
        hitungMatchingProfit(pending).then(({total})=>{
          const elM=document.getElementById('matchingB');
          const elMU=document.getElementById('matchingBusd');
          const elT=document.getElementById('totalRequestB');
          if(elM) elM.textContent=total.toFixed(2)+' INDC';
          if(elMU) elMU.textContent=(total*INDC_PRICE).toFixed(2);
          if(elT) elT.textContent=(pending+total).toFixed(2)+' INDC';
        });
      }
    }
    const reqs=await _staking.getRequests(_wallet);
    if(reqs.length>0){
      document.getElementById('emptyReq').style.display='none';
      document.getElementById('reqList').innerHTML=reqs.slice().reverse().map(r=>{
        const indc=fromINDC(r.indcAmount),usdt=(indc*INDC_PRICE).toFixed(2),dt=new Date(Number(r.timestamp)*1000).toLocaleDateString('id-ID');
        return `<div class="req-item"><div class="req-item-top"><span class="req-item-name">💸 REQUEST USDT</span><span class="${r.approved?'req-status-ok':'req-status-pending'}">${r.approved?'✅ APPROVED':'⏳ PENDING'}</span></div>
          <div class="req-item-grid">
            <div><span class="si-lbl">INDC DIJUAL</span><span class="si-val">${fmtN(indc)} INDC</span></div>
            <div style="text-align:right"><span class="si-lbl">USDT DITERIMA</span><span class="si-val">$${usdt}</span></div>
            <div><span class="si-lbl">TANGGAL</span><span class="si-val">${dt}</span></div>
          </div></div>`;
      }).join('');
    }
  }catch(e){console.error(e);}
}
async function approveINDC(id){
  if(!_wallet){await connectWallet();return;}
  const btn=document.getElementById('btnApprove'+id);btn.textContent='⏳ Approving...';btn.disabled=true;
  setMsg(id,'Menunggu konfirmasi approve...','var(--gold)');
  try{const tx=await _indc.approve(SC.STAKING,MAX_UINT);await tx.wait();btn.textContent='✅ APPROVED';setMsg(id,'Approve berhasil! Sekarang bisa stake.','var(--green)');}
  catch(e){btn.textContent='✅ APPROVE INDC';btn.disabled=false;setMsg(id,'Approve dibatalkan: '+(e.reason||e.message||''),'var(--red)');}
}
async function doStake(id){
  if(!_wallet){await connectWallet();return;}
  const p=PAKET[id-1],val=parseFloat(document.getElementById('inp'+id).value)||0;
  if(val<p.minNum){setMsg(id,'Minimum stake '+p.minS+' INDC','var(--red)');return;}
  if(val>p.maxNum){setMsg(id,'Maksimal stake '+p.maxS+' INDC','var(--red)');return;}
  const btn=document.getElementById('btnStake'+id);btn.textContent='⏳ Staking...';btn.disabled=true;
  setMsg(id,'Menunggu konfirmasi transaksi...','var(--gold)');
  try{
    const amtWei=toINDC(val),allow=await _indc.allowance(_wallet,SC.STAKING);
    if(allow.lt(amtWei)){setMsg(id,'Allowance kurang, Approve dulu.','var(--red)');btn.textContent='🔒 STAKE '+p.label;btn.disabled=false;return;}
    const tx=id===1?await _staking.stakePaketA(amtWei):await _staking.stakePaketB(amtWei);
    setMsg(id,'Transaksi dikirim...','var(--gold)');await tx.wait();
    setMsg(id,'✅ Stake '+p.label+' berhasil! INDC terkunci hingga 30 Mei 2026.','var(--green)');
    document.getElementById('inp'+id).value='';await loadBalances();await loadStakeData();
  }catch(e){setMsg(id,'Stake gagal: '+(e.reason||e.message||''),'var(--red)');}
  finally{btn.textContent='🔒 STAKE '+p.label;btn.disabled=false;}
}

// ═══ HITUNG MATCHING PROFIT DOWNLINE ═══
async function hitungMatchingProfit(rewardINDC) {
  if (!_master || !_wallet) return { total: 0, uplines: [] };
  try {
    const PCT = [3, 2, 1, 1, 1, 1, 1, 1, 1, 1]; // level 1-10
    const uplines = [];
    let current = _wallet;

    for (let i = 0; i < 10; i++) {
      const info = await _master.getUserInfo(current);
      const upline = info.upline;
      if (!upline || upline === '0x0000000000000000000000000000000000000000') break;
      const bonus = (rewardINDC * PCT[i]) / 100;
      uplines.push({ wallet: upline, level: i + 1, pct: PCT[i], bonus });
      current = upline;
    }

    const total = uplines.reduce((s, u) => s + u.bonus, 0);
    return { total, uplines };
  } catch(e) {
    console.warn('Hitung matching:', e);
    return { total: 0, uplines: [] };
  }
}

// Update tampilan matching profit saat input berubah
async function updateMatchingPreview() {
  const val = parseFloat(document.getElementById('inpReq').value) || 0;
  if (val <= 0 || !_wallet) return;
  const { total } = await hitungMatchingProfit(val);
  const elM = document.getElementById('matchingB');
  const elMU = document.getElementById('matchingBusd');
  const elT = document.getElementById('totalRequestB');
  if (elM) elM.textContent = total.toFixed(2) + ' INDC';
  if (elMU) elMU.textContent = (total * INDC_PRICE).toFixed(2);
  const pending = parseFloat(document.getElementById('pendingB')?.textContent) || 0;
  if (elT) elT.textContent = (pending + total).toFixed(2) + ' INDC';
}

async function doRequest(){
  if(!_wallet){await connectWallet();return;}
  const val=parseFloat(document.getElementById('inpReq').value)||0;
  if(val<MIN_REQ_INDC){setMsg('Req','Minimum '+MIN_REQ_INDC+' INDC ($1 USDT)','var(--red)');return;}
  const btn=document.getElementById('btnReq');btn.textContent='⏳ Menghitung...';btn.disabled=true;
  setMsg('Req','Menghitung matching profit downline...','var(--gold)');

  try{
    // Hitung matching profit dulu
    const { total: matchingTotal, uplines } = await hitungMatchingProfit(val);

    setMsg('Req','Menunggu konfirmasi transaksi...','var(--gold)');
    const tx=await _staking.requestUSDT(toINDC(val));
    setMsg('Req','Transaksi dikirim...','var(--gold)');
    await tx.wait();

    // Simpan ke Firebase dengan data matching profit
    if (typeof window._fbSaveRequest === 'function') {
      await window._fbSaveRequest({
        user: _wallet,
        indcAmount: val,
        usdtAmount: val * INDC_PRICE,
        matchingTotal,
        uplines,
        ts: Date.now(),
        status: 'pending'
      });
    }

    setMsg('Req','✅ Request berhasil! Dev akan kirim USDT ke wallet kamu.','var(--green)');
    document.getElementById('inpReq').value='';
    document.getElementById('usdtPreview').textContent='$0.00 USDT';
    const elM = document.getElementById('matchingB');
    const elT = document.getElementById('totalRequestB');
    if(elM) elM.textContent = '0 INDC';
    if(elT) elT.textContent = '0 INDC';
    await loadStakeData();
  }catch(e){setMsg('Req','Request gagal: '+(e.reason||e.message||''),'var(--red)');}
  finally{btn.textContent='💸 REQUEST USDT KE WALLET';btn.disabled=false;}
}

function updateCountdowns(){
  const now=Date.now(),diff=Math.max(0,LOCK_END-now);
  const d=Math.floor(diff/86400000),h=Math.floor((diff%86400000)/3600000),m=Math.floor((diff%3600000)/60000),s=Math.floor((diff%60000)/1000);
  const str=`${d}H ${h}J ${m}M ${s}D`;
  ['cd1','cd2','cdStakeA','cdStakeB'].forEach(id=>{const el=document.getElementById(id);if(el)el.textContent=str;});
  const passed=Date.now()>=LOCK_END;
  const ca=document.getElementById('btnClaimA'),ub=document.getElementById('btnUnstakeB');
  if(ca&&ca.textContent.includes('CLAIM'))ca.disabled=!passed;
  if(ub&&ub.textContent.includes('UNSTAKE'))ub.disabled=!passed;
}
setInterval(updateCountdowns,1000);
updateCountdowns();
