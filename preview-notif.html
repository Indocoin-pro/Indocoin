<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preview Notifikasi</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0a0705;color:#f0e0c0;font-family:'Arial',sans-serif;min-height:100vh;padding:20px;}
.indc-notif{
  position:fixed;top:12px;left:-100%;
  width:calc(100% - 24px);max-width:420px;
  background:rgba(5,3,2,0.97);
  border:1px solid rgba(245,200,66,0.4);
  border-radius:12px;padding:10px 14px;
  display:flex;align-items:center;gap:10px;
  box-shadow:0 4px 20px rgba(0,0,0,0.7);
  z-index:99999;transition:left 0.4s ease;
}
.indc-notif.show{left:12px;}
.indc-notif-icon{font-size:20px;flex-shrink:0;}
.indc-notif-text{flex:1;font-size:11px;font-weight:700;letter-spacing:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.indc-notif-text.green{color:#00ff41;}
.indc-notif-text.gold{color:#f5c842;}
.page-title{font-size:11px;letter-spacing:3px;color:#4a3a28;text-align:center;margin:80px 0 24px;}
.btn-wrap{display:flex;flex-direction:column;gap:10px;max-width:320px;margin:0 auto;}
.btn{padding:13px;border:none;border-radius:10px;font-size:11px;font-weight:700;cursor:pointer;letter-spacing:1px;}
.btn-green{background:rgba(0,255,65,0.1);border:1px solid rgba(0,255,65,0.3);color:#00ff41;}
.btn-gold{background:rgba(245,200,66,0.1);border:1px solid rgba(245,200,66,0.3);color:#f5c842;}
.note{font-size:9px;color:#3a2a1a;text-align:center;margin-top:16px;letter-spacing:1px;}
</style>
</head>
<body>
<div class="indc-notif" id="notif">
  <div class="indc-notif-icon" id="notifIcon"></div>
  <div class="indc-notif-text" id="notifText"></div>
</div>
<div class="page-title">// PREVIEW NOTIFIKASI</div>
<div class="btn-wrap">
  <button class="btn btn-green" onclick="show('⚗️','BRAINCLASH · Indocoin membuka room Sains 350 INDC','green')">⚗️ Room BrainClash</button>
  <button class="btn btn-gold" onclick="show('⚔️','SANJAYA · Ksatria membuka room 200 INDC','gold')">⚔️ Room Sanjaya</button>
  <button class="btn btn-green" onclick="show('👥','BRAINCLASH · 2/4 player sudah bergabung!','green')">👥 Pemain Join</button>
  <button class="btn btn-gold" onclick="show('👑','SANJAYA · Room penuh! Ekspedisi dimulai!','gold')">👑 Room Penuh</button>
</div>
<div class="note">TAP TOMBOL · MUNCUL 3 DETIK DARI KIRI</div>
<script>
let t=null;
function show(icon,msg,type){
  const el=document.getElementById('notif');
  document.getElementById('notifIcon').textContent=icon;
  const textEl=document.getElementById('notifText');
  textEl.textContent=msg;
  textEl.className='indc-notif-text '+type;
  el.style.borderColor=type==='green'?'rgba(0,255,65,0.4)':'rgba(245,200,66,0.4)';
  el.classList.add('show');
  if(t) clearTimeout(t);
  t=setTimeout(()=>el.classList.remove('show'),3000);
}
</script>
</body>
</html>
