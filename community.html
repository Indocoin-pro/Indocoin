<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>INDOCOIN — Community</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --blue: #2563eb;
  --blue2: #1d4ed8;
  --blue3: #3b82f6;
  --bluelight: #eff6ff;
  --bluelight2: #dbeafe;
  --dark: #0f172a;
  --dark2: #1e293b;
  --text: #1e293b;
  --text2: #64748b;
  --white: #ffffff;
  --border: #e2e8f0;
  --green: #22c55e;
  --red: #ef4444;
  --shadow: 0 2px 12px rgba(37,99,235,0.1);
}

html, body {
  height: 100%;
  font-family: 'Inter', sans-serif;
  background: var(--bluelight);
  color: var(--text);
  overflow: hidden;
}

/* ===== APP SHELL ===== */
.app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
  max-width: 480px;
  margin: 0 auto;
  background: var(--white);
  box-shadow: 0 0 40px rgba(0,0,0,0.1);
}

/* ===== TOP NAV ===== */
.topnav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  background: var(--blue);
  flex-shrink: 0;
}
.logo {
  font-size: 18px;
  font-weight: 700;
  color: var(--white);
  letter-spacing: 1px;
}
.nav-right { display: flex; align-items: center; gap: 8px; }
#navUser { font-size: 12px; color: rgba(255,255,255,0.8); }
.btn-signout {
  background: rgba(255,255,255,0.15);
  color: var(--white);
  border: 1px solid rgba(255,255,255,0.3);
  padding: 5px 10px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  font-family: 'Inter', sans-serif;
}

/* ===== ONLINE BAR ===== */
.online-bar {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 16px;
  background: var(--bluelight);
  border-bottom: 1px solid var(--border);
  font-size: 12px;
  color: var(--text2);
  flex-shrink: 0;
}
.online-dot {
  width: 7px; height: 7px;
  background: var(--green);
  border-radius: 50%;
  box-shadow: 0 0 5px var(--green);
}

/* ===== CHAT AREA ===== */
.chat-area {
  flex: 1;
  overflow-y: auto;
  padding: 12px 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  background: var(--bluelight);
}
.chat-area::-webkit-scrollbar { width: 4px; }
.chat-area::-webkit-scrollbar-thumb { background: var(--bluelight2); border-radius: 4px; }

/* ===== DATE DIVIDER ===== */
.date-divider {
  text-align: center;
  font-size: 11px;
  color: var(--text2);
  padding: 4px 0;
  position: relative;
}
.date-divider::before, .date-divider::after {
  content: '';
  position: absolute;
  top: 50%;
  width: 35%;
  height: 1px;
  background: var(--border);
}
.date-divider::before { left: 0; }
.date-divider::after { right: 0; }

/* ===== MESSAGE BUBBLES ===== */
.msg-row {
  display: flex;
  gap: 8px;
  align-items: flex-end;
}
.msg-row.me { flex-direction: row-reverse; }

.msg-avatar {
  width: 30px; height: 30px;
  border-radius: 50%;
  background: var(--blue);
  color: var(--white);
  font-size: 11px;
  font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.msg-row.me .msg-avatar { background: var(--blue2); }

.msg-body { max-width: 72%; display: flex; flex-direction: column; gap: 2px; }
.msg-row.me .msg-body { align-items: flex-end; }

.msg-name { font-size: 11px; color: var(--blue); font-weight: 600; padding-left: 2px; }
.msg-row.me .msg-name { display: none; }

.msg-bubble {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 16px 16px 16px 4px;
  padding: 8px 12px;
  font-size: 14px;
  line-height: 1.45;
  word-break: break-word;
  box-shadow: var(--shadow);
}
.msg-row.me .msg-bubble {
  background: var(--blue);
  color: var(--white);
  border: none;
  border-radius: 16px 16px 4px 16px;
}

.msg-footer {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 2px;
}
.msg-row.me .msg-footer { flex-direction: row-reverse; }

.msg-time { font-size: 10px; color: var(--text2); }
.msg-row.me .msg-time { color: rgba(255,255,255,0.6); }

/* Reactions */
.msg-reactions { display: flex; gap: 3px; flex-wrap: wrap; margin-top: 3px; }
.reaction-btn {
  background: var(--bluelight);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 2px 7px;
  font-size: 12px;
  cursor: pointer;
  display: flex; align-items: center; gap: 3px;
}
.reaction-btn.active {
  background: var(--bluelight2);
  border-color: var(--blue3);
  color: var(--blue);
}
.reaction-count { font-size: 11px; font-weight: 600; }

/* Emoji picker */
.emoji-picker {
  display: none;
  gap: 4px;
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 4px 8px;
  box-shadow: var(--shadow);
  position: absolute;
  z-index: 10;
}
.emoji-picker.show { display: flex; }
.emoji-opt {
  font-size: 16px;
  cursor: pointer;
  padding: 2px;
  border-radius: 4px;
}
.emoji-opt:hover { background: var(--bluelight); }

.msg-wrapper { position: relative; }

/* Delete button */
.btn-del {
  background: none;
  border: none;
  color: var(--text2);
  font-size: 13px;
  cursor: pointer;
  padding: 2px 4px;
  border-radius: 4px;
  opacity: 0.6;
}
.btn-del:hover { opacity: 1; color: var(--red); }

/* Admin badge */
.admin-badge {
  background: var(--blue);
  color: var(--white);
  font-size: 9px;
  font-weight: 700;
  padding: 1px 5px;
  border-radius: 4px;
  letter-spacing: 0.5px;
}

/* ===== INPUT AREA ===== */
.input-area {
  padding: 10px 12px;
  background: var(--white);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}
.input-row {
  display: flex;
  gap: 8px;
  align-items: flex-end;
}
#chatInput {
  flex: 1;
  background: var(--bluelight);
  border: 1.5px solid var(--border);
  border-radius: 22px;
  padding: 10px 16px;
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  color: var(--text);
  outline: none;
  resize: none;
  max-height: 100px;
  line-height: 1.4;
}
#chatInput:focus { border-color: var(--blue3); background: var(--white); }
#chatInput::placeholder { color: var(--text2); }
.btn-send {
  width: 42px; height: 42px;
  background: var(--blue);
  border: none;
  border-radius: 50%;
  color: var(--white);
  font-size: 17px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  box-shadow: 0 2px 8px rgba(37,99,235,0.4);
}
.btn-send:active { transform: scale(0.93); }
.char-counter {
  font-size: 11px;
  color: var(--text2);
  text-align: right;
  padding: 3px 4px 0;
}
.char-counter.warn { color: orange; }
.char-counter.limit { color: var(--red); }

/* ===== BOTTOM NAV ===== */
.bottomnav {
  display: flex;
  background: var(--white);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}
.bnav-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 8px 4px;
  color: var(--text2);
  text-decoration: none;
  font-size: 10px;
  font-weight: 600;
  gap: 3px;
}
.bnav-item.active { color: var(--blue); }
.bnav-icon { font-size: 19px; }

/* ===== NOT LOGGED IN ===== */
.not-logged {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  padding: 30px;
  text-align: center;
  background: var(--bluelight);
}
.not-logged h2 { font-size: 20px; color: var(--blue); }
.not-logged p { font-size: 14px; color: var(--text2); }
.btn-login {
  background: var(--blue);
  color: var(--white);
  border: none;
  padding: 13px 30px;
  border-radius: 12px;
  font-family: 'Inter', sans-serif;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  box-shadow: 0 4px 12px rgba(37,99,235,0.3);
}

/* ===== TOAST ===== */
.toast {
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--dark2);
  color: var(--white);
  padding: 8px 18px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 500;
  opacity: 0;
  transition: opacity 0.3s;
  z-index: 999;
  white-space: nowrap;
}
.toast.show { opacity: 1; }

/* Empty state */
.empty-chat {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--text2);
  font-size: 14px;
  gap: 8px;
}
</style>
</head>
<body>

<div class="app">

  <!-- TOP NAV -->
  <div class="topnav">
    <div class="logo">INDOCOIN</div>
    <div class="nav-right">
      <span id="navUser"></span>
      <button class="btn-signout" onclick="doSignOut()">KELUAR</button>
    </div>
  </div>

  <!-- MAIN (saat login) -->
  <div id="mainContent" style="display:none; flex:1; display:none; flex-direction:column; overflow:hidden;">

    <!-- ONLINE BAR -->
    <div class="online-bar">
      <span class="online-dot"></span>
      <span id="onlineCount">-- member online</span>
    </div>

    <!-- CHAT AREA -->
    <div class="chat-area" id="chatArea">
      <div class="empty-chat">
        <div style="font-size:40px">💬</div>
        <div>Belum ada pesan. Mulai percakapan!</div>
      </div>
    </div>

    <!-- INPUT -->
    <div class="input-area">
      <div class="input-row">
        <textarea id="chatInput" placeholder="Tulis pesan..." maxlength="3000" rows="1"
          oninput="autoResize(this);updateCharCount()"
          onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg();}"></textarea>
        <button class="btn-send" onclick="sendMsg()">➤</button>
      </div>
      <div class="char-counter" id="charCounter">0 / 3000</div>
    </div>

  </div>

  <!-- NOT LOGGED IN -->
  <div id="notLoggedIn" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:30px;text-align:center;background:var(--bluelight);">
    <div style="font-size:50px">🔒</div>
    <h2 style="font-size:20px;color:var(--blue);">Belum Login</h2>
    <p style="font-size:14px;color:var(--text2);">Silakan login untuk bergabung dengan komunitas</p>
    <button class="btn-login" onclick="window.location.href='landing.html'">🔑 LOGIN SEKARANG</button>
  </div>

  <!-- BOTTOM NAV -->
  <nav class="bottomnav">
    <a class="bnav-item" href="dashboard.html"><span class="bnav-icon">🏠</span>HOME</a>
    <a class="bnav-item" href="earn.html"><span class="bnav-icon">💰</span>EARN</a>
    <a class="bnav-item" href="referral.html"><span class="bnav-icon">🌐</span>REFERRAL</a>
    <a class="bnav-item" href="presale.html"><span class="bnav-icon">🚀</span>PRESALE</a>
    <a class="bnav-item active" href="community.html"><span class="bnav-icon">💬</span>COMMUNITY</a>
  </nav>

</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
import {
  getDatabase, ref, push, onValue, set, get, remove, serverTimestamp, query, limitToLast, orderByChild
} from "https://www.gstatic.com/firebasejs/11.0.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBrhDJiIcEJsZ-fN0RIDlV0XaOA8ZPjJsw",
  authDomain: "indocoin-network.firebaseapp.com",
  projectId: "indocoin-network",
  storageBucket: "indocoin-network.firebasestorage.app",
  messagingSenderId: "742922450154",
  appId: "1:742922450154:web:97e0847e85bfe3e9f9d393",
  databaseURL: "https://indocoin-network-default-rtdb.asia-southeast1.firebasedatabase.app"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

let currentUser = null;
let currentName = '';
let isAdmin = false;

function esc(t) {
  return String(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ===== AUTH =====
onAuthStateChanged(auth, user => {
  if (user) {
    currentUser = user;
    currentName = user.displayName || user.email.split('@')[0];
    const uname = (user.displayName||'').toLowerCase();
    const uemail = (user.email||'').toLowerCase();
    isAdmin = uname === 'indocoin' || uname === 'admin' ||
              uemail.includes('indocoin') || uemail.includes('admin@');

    document.getElementById('navUser').textContent = currentName + (isAdmin ? ' 👑' : '');
    document.getElementById('mainContent').style.display = 'flex';
    document.getElementById('mainContent').style.flexDirection = 'column';
    document.getElementById('mainContent').style.overflow = 'hidden';
    document.getElementById('mainContent').style.flex = '1';
    document.getElementById('notLoggedIn').style.display = 'none';

    updateOnline();
    startChat();
  } else {
    currentUser = null;
    document.getElementById('mainContent').style.display = 'none';
    document.getElementById('notLoggedIn').style.display = 'flex';
  }
});

window.doSignOut = () => signOut(auth).then(() => window.location.href = 'landing.html');

// ===== ONLINE =====
function updateOnline() {
  const r = ref(db, 'online/' + currentUser.uid);
  set(r, { name: currentName, ts: serverTimestamp() });
  onValue(ref(db, 'online'), snap => {
    const c = snap.exists() ? Object.keys(snap.val()).length : 0;
    document.getElementById('onlineCount').textContent = c + ' member online';
  });
}

// ===== CHAT =====
let _chatUnsubscribe = null;
function startChat() {
  // Matikan listener lama jika ada — cegah multiple listener
  if (_chatUnsubscribe) {
    _chatUnsubscribe();
    _chatUnsubscribe = null;
  }
  const msgsRef = query(ref(db, 'community_chat'), orderByChild('ts'), limitToLast(50));
  _chatUnsubscribe = onValue(msgsRef, snap => {
    renderChat(snap);
  });
}

function renderChat(snap) {
  const area = document.getElementById('chatArea');
  if (!area) return;

  const wasAtBottom = area.scrollHeight - area.scrollTop <= area.clientHeight + 80;

  if (!snap || !snap.exists()) {
    area.innerHTML = '<div class="empty-chat"><div style="font-size:40px">💬</div><div>Belum ada pesan. Mulai percakapan!</div></div>';
    return;
  }

  const msgs = [];
  snap.forEach(c => msgs.push({ id: c.key, ...c.val() }));

  area.innerHTML = '';
  let lastDate = '';
  const emojis = ['👍','❤️','🔥','😂','🚀'];

  msgs.forEach(msg => {
    const isMe = currentUser && msg.uid === currentUser.uid;
    const init = (msg.name||'U').slice(0,2).toUpperCase();
    const d = msg.ts ? new Date(msg.ts) : new Date();
    const dateStr = d.toLocaleDateString('id-ID', {weekday:'long', day:'numeric', month:'long'});
    const timeStr = d.toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'});

    if (dateStr !== lastDate) {
      area.innerHTML += `<div class="date-divider">${dateStr}</div>`;
      lastDate = dateStr;
    }

    const canDelete = isMe || isAdmin;
    const reactions = msg.reactions || {};

    const reactionBtns = emojis.map(e => {
      const key = encodeURIComponent(e);
      const arr = reactions[key] || [];
      const count = arr.length;
      const hasReacted = arr.includes(currentUser.uid);
      return count > 0
        ? `<button class="reaction-btn ${hasReacted?'active':''}" onclick="window.toggleReaction('${msg.id}','${e}')">
            ${e} <span class="reaction-count">${count}</span>
           </button>`
        : '';
    }).join('');

    const emojiPicker = emojis.map(e =>
      `<span class="emoji-opt" onclick="window.toggleReaction('${msg.id}','${e}')">${e}</span>`
    ).join('');

    area.innerHTML += `
      <div class="msg-row ${isMe?'me':''}" id="msg-${msg.id}">
        <div class="msg-avatar">${init}</div>
        <div class="msg-body">
          ${!isMe ? `<div class="msg-name">${esc(msg.name||'User')} ${msg.isAdmin?'<span class="admin-badge">ADMIN</span>':''}</div>` : ''}
          <div class="msg-wrapper">
            <div class="msg-bubble" onclick="window.toggleEmojiPicker('picker-${msg.id}')">${esc(msg.text||'')}</div>
            <div class="emoji-picker" id="picker-${msg.id}">${emojiPicker}</div>
          </div>
          <div class="msg-reactions">${reactionBtns}</div>
          <div class="msg-footer">
            <span class="msg-time">${timeStr}</span>
            ${canDelete ? `<button class="btn-del" onclick="window.deleteMsg('${msg.id}')" title="Hapus">🗑</button>` : ''}
          </div>
        </div>
      </div>`;
  });

  if (wasAtBottom) area.scrollTop = area.scrollHeight;
}

// ===== SEND =====
window.sendMsg = function() {
  const input = document.getElementById('chatInput');
  const text = (input.value||'').trim();
  if (!text || !currentUser) return;
  input.value = '';
  input.style.height = 'auto';
  document.getElementById('charCounter').textContent = '0 / 3000';
  push(ref(db, 'community_chat'), {
    uid: currentUser.uid,
    name: currentName,
    text: text,
    ts: Date.now(),
    isAdmin: isAdmin
  }).then(() => {
    // Scroll ke bawah setelah kirim
    const area = document.getElementById('chatArea');
    if (area) setTimeout(() => area.scrollTop = area.scrollHeight, 300);
  }).catch(err => {
    input.value = text;
    showToast('❌ Gagal kirim: ' + (err.message||err.code));
  });
};

// ===== DELETE =====
window.deleteMsg = function(msgId) {
  if (!currentUser) return;
  if (!confirm('Hapus pesan ini?')) return;
  const msgRef = ref(db, 'community_chat/' + msgId);
  get(msgRef).then(snap => {
    if (!snap.exists()) return;
    const msg = snap.val();
    if (msg.uid !== currentUser.uid && !isAdmin) return;
    remove(msgRef).then(() => showToast('✅ Pesan dihapus'));
  });
};

// ===== REACTIONS =====
window.toggleReaction = function(msgId, emoji) {
  if (!currentUser) return;
  const key = 'community_chat/' + msgId + '/reactions/' + encodeURIComponent(emoji);
  const rRef = ref(db, key);
  get(rRef).then(snap => {
    const arr = snap.exists() ? snap.val() : [];
    const idx = arr.indexOf(currentUser.uid);
    if (idx === -1) arr.push(currentUser.uid);
    else arr.splice(idx, 1);
    set(rRef, arr);
  });
  // Tutup picker
  document.querySelectorAll('.emoji-picker').forEach(p => p.classList.remove('show'));
};

window.toggleEmojiPicker = function(pickerId) {
  const picker = document.getElementById(pickerId);
  if (!picker) return;
  const isOpen = picker.classList.contains('show');
  document.querySelectorAll('.emoji-picker').forEach(p => p.classList.remove('show'));
  if (!isOpen) picker.classList.add('show');
};

// Tutup picker saat klik di luar
document.addEventListener('click', e => {
  if (!e.target.closest('.msg-wrapper')) {
    document.querySelectorAll('.emoji-picker').forEach(p => p.classList.remove('show'));
  }
});

</script>

<script>
// Auto resize textarea
window.autoResize = function(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 100) + 'px';
};

window.updateCharCount = function() {
  const input = document.getElementById('chatInput');
  const counter = document.getElementById('charCounter');
  if (!input || !counter) return;
  const len = input.value.length;
  counter.textContent = len + ' / 3000';
  counter.className = 'char-counter';
  if (len > 2700) counter.classList.add('limit');
  else if (len > 2000) counter.classList.add('warn');
};
</script>

</body>
</html>
