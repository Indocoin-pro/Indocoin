<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>INDOCOIN — Community</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --blue: #2563eb;
  --blue2: #1d4ed8;
  --blue3: #3b82f6;
  --bluelight: #eff6ff;
  --bluelight2: #dbeafe;
  --dark: #0f172a;
  --dark2: #1e293b;
  --text: #1e293b;
  --text2: #64748b;
  --white: #ffffff;
  --border: #e2e8f0;
  --green: #22c55e;
  --red: #ef4444;
  --shadow: 0 2px 12px rgba(37,99,235,0.1);
}

html, body {
  height: 100%;
  font-family: 'Inter', sans-serif;
  background: var(--bluelight);
  color: var(--text);
  overflow: hidden;
}

/* ===== APP SHELL ===== */
.app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
  max-width: 480px;
  margin: 0 auto;
  background: var(--white);
  box-shadow: 0 0 40px rgba(0,0,0,0.1);
}

/* ===== TOP NAV ===== */
.topnav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  background: var(--blue);
  flex-shrink: 0;
}
.logo {
  font-size: 18px;
  font-weight: 700;
  color: var(--white);
  letter-spacing: 1px;
}
.nav-right { display: flex; align-items: center; gap: 8px; }
#navUser { font-size: 12px; color: rgba(255,255,255,0.8); }
.btn-signout {
  background: rgba(255,255,255,0.15);
  color: var(--white);
  border: 1px solid rgba(255,255,255,0.3);
  padding: 5px 10px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  font-family: 'Inter', sans-serif;
}

/* ===== ONLINE BAR ===== */
.online-bar {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 16px;
  background: var(--bluelight);
  border-bottom: 1px solid var(--border);
  font-size: 12px;
  color: var(--text2);
  flex-shrink: 0;
}
.online-dot {
  width: 7px; height: 7px;
  background: var(--green);
  border-radius: 50%;
  box-shadow: 0 0 5px var(--green);
}

/* ===== CHAT AREA ===== */
.chat-area {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 12px 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  background: var(--bluelight);
}
.chat-area::-webkit-scrollbar { width: 4px; }
.chat-area::-webkit-scrollbar-thumb { background: var(--bluelight2); border-radius: 4px; }

/* ===== DATE DIVIDER ===== */
.date-divider {
  text-align: center;
  font-size: 11px;
  color: var(--text2);
  padding: 4px 0;
  position: relative;
}
.date-divider::before, .date-divider::after {
  content: '';
  position: absolute;
  top: 50%;
  width: 35%;
  height: 1px;
  background: var(--border);
}
.date-divider::before { left: 0; }
.date-divider::after { right: 0; }

/* ===== MESSAGE BUBBLES ===== */
.msg-row {
  display: flex;
  gap: 8px;
  align-items: flex-start;
}
.msg-row.me { flex-direction: row-reverse; }

.msg-avatar {
  width: 30px; height: 30px;
  border-radius: 50%;
  background: var(--blue);
  color: var(--white);
  font-size: 11px;
  font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.msg-row.me .msg-avatar { background: var(--blue2); }

.msg-body { max-width: 72%; display: flex; flex-direction: column; gap: 2px; }
.msg-row.me .msg-body { align-items: flex-end; }

.msg-name { font-size: 11px; color: var(--blue); font-weight: 600; padding-left: 2px; }
.msg-row.me .msg-name { display: none; }

.msg-bubble {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 16px 16px 16px 4px;
  padding: 7px 10px 20px;
  font-size: 12px;
  line-height: 1.45;
  word-break: break-word;
  box-shadow: var(--shadow);
}
.msg-row.me .msg-bubble {
  background: var(--blue);
  color: var(--white);
  border: none;
  border-radius: 16px 16px 4px 16px;
}

.msg-footer {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 2px;
}
.msg-row.me .msg-footer { flex-direction: row-reverse; }

.msg-time { font-size: 10px; color: var(--text2); }
.msg-row.me .msg-time { color: rgba(255,255,255,0.6); }

/* Reactions */
.msg-reactions { display: flex; gap: 3px; flex-wrap: wrap; margin-top: 3px; }
.reaction-btn {
  background: var(--bluelight);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 1px 4px;
  font-size: 8px;
  cursor: pointer;
  display: flex; align-items: center; gap: 2px;
}
.reaction-btn.active {
  background: var(--bluelight2);
  border-color: var(--blue3);
  color: var(--blue);
}
.reaction-count { font-size: 8px; font-weight: 600; }

/* Emoji picker */
.emoji-picker {
  display: none;
  gap: 4px;
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 4px 8px;
  box-shadow: var(--shadow);
  position: absolute;
  z-index: 10;
}
.emoji-picker.show { display: flex; }
.emoji-opt {
  font-size: 16px;
  cursor: pointer;
  padding: 2px;
  border-radius: 4px;
}
.emoji-opt:hover { background: var(--bluelight); }

.msg-wrapper { position: relative; }

/* Jam + reaction di dalam bubble */
.bubble-footer {
  position:absolute; bottom:4px; right:8px;
  display:flex; align-items:center; gap:4px;
}
.msg-time-inner {
  font-size:9px; color:#94a3b8; white-space:nowrap; line-height:1;
}
.msg-row.me .msg-time-inner { color:rgba(255,255,255,0.65); }
.reaction-inline {
  display:inline-flex; align-items:center; gap:1px;
  background:rgba(0,0,0,0.06); border-radius:10px;
  padding:1px 4px; font-size:9px; color:#475569; cursor:pointer;
}
.msg-row.me .reaction-inline { background:rgba(255,255,255,0.2); color:rgba(255,255,255,0.9); }
.reaction-inline.active { background:#dbeafe; color:#2563eb; }
.msg-row.me .reaction-inline.active { background:rgba(255,255,255,0.3); color:#fff; }
.edited-label { font-size:9px;color:rgba(255,255,255,0.65);font-style:italic;margin-left:4px; }
.msg-row:not(.me) .edited-label { color:var(--text2); }
.reply-in-bubble { background:rgba(37,99,235,0.08);border-left:3px solid var(--blue);border-radius:4px;padding:3px 7px;margin-bottom:5px;font-size:10px; }
.msg-row.me .edited-label { font-size:9px;color:rgba(255,255,255,0.65);font-style:italic;margin-left:4px; }
.msg-row:not(.me) .edited-label { color:var(--text2); }
.reply-in-bubble { background:rgba(255,255,255,0.15);border-color:rgba(255,255,255,0.6); }
.reply-in-name { font-weight:700;color:var(--blue);font-size:10px;margin-bottom:1px; }
.msg-row.me .reply-in-name { color:rgba(255,255,255,0.9); }
.reply-in-text { color:var(--text2);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px; }
.msg-row.me .reply-in-text { color:rgba(255,255,255,0.75); }
.btn-more { background:none;border:none;cursor:pointer;padding:2px 1px;flex-shrink:0;margin-top:0;display:flex;flex-direction:column;gap:2px;align-items:center; }
.btn-more-dot { width:3px;height:3px;background:var(--text2);border-radius:50%;display:block; }
.msg-menu-wrap { position:relative; }
.msg-menu { display:none;position:fixed;background:var(--white);border:1px solid var(--border);border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,0.15);z-index:999;min-width:130px;overflow:hidden; }
.msg-menu.show { display:block; }
.msg-menu-item { display:flex;align-items:center;gap:8px;padding:9px 12px;font-size:12px;cursor:pointer;color:var(--text); }
.msg-menu-item:active { background:var(--bluelight); }
.msg-menu-item.danger { color:var(--red); }
.msg-menu-divider { height:1px;background:var(--bluelight); }

/* Delete button */
.btn-del {
  background: none;
  border: none;
  color: var(--text2);
  font-size: 13px;
  cursor: pointer;
  padding: 2px 4px;
  border-radius: 4px;
  opacity: 0.6;
}
.btn-del:hover { opacity: 1; color: var(--red); }

/* Admin badge */
.admin-badge {
  background: var(--blue);
  color: var(--white);
  font-size: 9px;
  font-weight: 700;
  padding: 1px 5px;
  border-radius: 4px;
  letter-spacing: 0.5px;
}

/* ===== INPUT AREA ===== */
.input-area {
  padding: 10px 12px;
  background: var(--white);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}
.input-row {
  display: flex;
  gap: 8px;
  align-items: flex-end;
}
#chatInput {
  flex: 1;
  background: var(--bluelight);
  border: 1.5px solid var(--border);
  border-radius: 22px;
  padding: 10px 16px;
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  color: var(--text);
  outline: none;
  resize: none;
  max-height: 100px;
  line-height: 1.4;
}
#chatInput:focus { border-color: var(--blue3); background: var(--white); }
#chatInput::placeholder { color: var(--text2); }
.btn-send {
  width: 42px; height: 42px;
  background: var(--blue);
  border: none;
  border-radius: 50%;
  color: var(--white);
  font-size: 17px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  box-shadow: 0 2px 8px rgba(37,99,235,0.4);
}
.btn-send:active { transform: scale(0.93); }
.char-counter {
  font-size: 11px;
  color: var(--text2);
  text-align: right;
  padding: 3px 4px 0;
}
.char-counter.warn { color: orange; }
.char-counter.limit { color: var(--red); }

/* ===== BOTTOM NAV ===== */
.bottomnav {
  display: flex;
  background: var(--white);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}
.bnav-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 8px 4px;
  color: var(--text2);
  text-decoration: none;
  font-size: 10px;
  font-weight: 600;
  gap: 3px;
}
.bnav-item.active { color: var(--blue); }
.bnav-icon { font-size: 19px; }

/* ===== NOT LOGGED IN ===== */
.not-logged {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  padding: 30px;
  text-align: center;
  background: var(--bluelight);
}
.not-logged h2 { font-size: 20px; color: var(--blue); }
.not-logged p { font-size: 14px; color: var(--text2); }
.btn-login {
  background: var(--blue);
  color: var(--white);
  border: none;
  padding: 13px 30px;
  border-radius: 12px;
  font-family: 'Inter', sans-serif;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  box-shadow: 0 4px 12px rgba(37,99,235,0.3);
}

/* ===== TOAST ===== */
.toast {
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--dark2);
  color: var(--white);
  padding: 8px 18px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 500;
  opacity: 0;
  transition: opacity 0.3s;
  z-index: 999;
  white-space: nowrap;
}
.toast.show { opacity: 1; }

/* Empty state */
.empty-chat {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--text2);
  font-size: 14px;
  gap: 8px;
}
</style>
</head>
<body>

<div class="app">

  <!-- TOP NAV -->
  <div class="topnav">
    <div class="logo">INDOCOIN</div>
    <div class="nav-right">
      <span id="navUser"></span>
      <button class="btn-signout" onclick="doSignOut()">KELUAR</button>
    </div>
  </div>

  <!-- MAIN (saat login) -->
  <div id="mainContent" style="display:none; flex-direction:column; overflow:hidden; flex:1; min-height:0;">

    <!-- ONLINE BAR -->
    <div class="online-bar">
      <span class="online-dot"></span>
      <span id="onlineCount">-- member online</span>
    </div>

    <!-- CHAT AREA -->
    <div class="chat-area" id="chatArea">
      <div class="empty-chat">
        <div style="font-size:40px">💬</div>
        <div>Belum ada pesan. Mulai percakapan!</div>
      </div>
    </div>

    <!-- REPLY PREVIEW -->
    <div id="replyPreview" style="display:none;padding:6px 10px;background:var(--white);border-top:1px solid var(--border);flex-shrink:0;">
      <div style="display:flex;align-items:center;gap:8px;">
        <div style="flex:1;background:var(--bluelight);border-left:3px solid var(--blue);border-radius:4px;padding:4px 8px;">
          <div id="replyPreviewName" style="font-size:10px;font-weight:700;color:var(--blue);"></div>
          <div id="replyPreviewText" style="font-size:10px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px;"></div>
        </div>
        <button onclick="window.closeReply()" style="background:none;border:none;color:var(--text2);font-size:16px;cursor:pointer;">✕</button>
      </div>
    </div>

    <!-- INPUT -->
    <div class="input-area">
      <div class="input-row">
        <textarea id="chatInput" placeholder="Tulis pesan..." maxlength="3000" rows="1"
          oninput="autoResize(this);updateCharCount()"
          onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg();}"></textarea>
        <button class="btn-send" onclick="sendMsg()">➤</button>
      </div>
      <div class="char-counter" id="charCounter">0 / 3000</div>
    </div>

  </div>

  <!-- NOT LOGGED IN -->
  <div id="notLoggedIn" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:30px;text-align:center;background:var(--bluelight);">
    <div style="font-size:50px">🔒</div>
    <h2 style="font-size:20px;color:var(--blue);">Belum Login</h2>
    <p style="font-size:14px;color:var(--text2);">Silakan login untuk bergabung dengan komunitas</p>
    <button class="btn-login" onclick="window.location.href='landing.html'">🔑 LOGIN SEKARANG</button>
  </div>

  <!-- BOTTOM NAV -->
  <nav class="bottomnav">
    <a class="bnav-item" href="dashboard.html"><span class="bnav-icon">🏠</span>HOME</a>
    <a class="bnav-item" href="earn.html"><span class="bnav-icon">💰</span>EARN</a>
    <a class="bnav-item" href="referral.html"><span class="bnav-icon">🌐</span>REFERRAL</a>
    <a class="bnav-item" href="presale.html"><span class="bnav-icon">🚀</span>PRESALE</a>
    <a class="bnav-item active" href="community.html"><span class="bnav-icon">💬</span>COMMUNITY</a>
  </nav>

</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
import {
  getDatabase, ref, push, onValue, set, get, remove, serverTimestamp, query, limitToLast, orderByChild
} from "https://www.gstatic.com/firebasejs/11.0.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBrhDJiIcEJsZ-fN0RIDlV0XaOA8ZPjJsw",
  authDomain: "indocoin-network.firebaseapp.com",
  projectId: "indocoin-network",
  storageBucket: "indocoin-network.firebasestorage.app",
  messagingSenderId: "742922450154",
  appId: "1:742922450154:web:97e0847e85bfe3e9f9d393",
  databaseURL: "https://indocoin-network-default-rtdb.asia-southeast1.firebasedatabase.app"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

let currentUser = null;
let currentName = '';
let isAdmin = false;

function esc(t) {
  return String(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ===== AUTH =====
onAuthStateChanged(auth, user => {
  if (user) {
    currentUser = user;
    currentName = user.displayName || user.email.split('@')[0];
    const uname = (user.displayName||'').toLowerCase();
    const uemail = (user.email||'').toLowerCase();
    isAdmin = uname === 'indocoin' || uname === 'admin' ||
              uemail.includes('indocoin') || uemail.includes('admin@');

    document.getElementById('navUser').textContent = currentName + (isAdmin ? ' 👑' : '');
    const mc = document.getElementById('mainContent');
    mc.style.display = 'flex';
    mc.style.flexDirection = 'column';
    mc.style.overflow = 'hidden';
    mc.style.flex = '1';
    mc.style.minHeight = '0';
    mc.style.height = '100%';
    document.getElementById('notLoggedIn').style.display = 'none';

    updateOnline();
    startChat();
  } else {
    currentUser = null;
    document.getElementById('mainContent').style.display = 'none';
    document.getElementById('notLoggedIn').style.display = 'flex';
  }
});

window.doSignOut = () => signOut(auth).then(() => window.location.href = 'landing.html');

// ===== ONLINE =====
function updateOnline() {
  const r = ref(db, 'online/' + currentUser.uid);
  set(r, { name: currentName, ts: serverTimestamp() });
  onValue(ref(db, 'online'), snap => {
    const c = snap.exists() ? Object.keys(snap.val()).length : 0;
    document.getElementById('onlineCount').textContent = c + ' member online';
  });
}

// ===== CHAT =====
let _chatUnsubscribe = null;
let _renderedIds = new Set(); // Simpan ID pesan yang sudah ditampilkan
let _chatInitialized = false; // Flag apakah sudah load awal

function startChat() {
  if (_chatUnsubscribe) {
    _chatUnsubscribe();
    _chatUnsubscribe = null;
  }
  _renderedIds = new Set();
  _chatInitialized = false;

  const area = document.getElementById('chatArea');
  if (area) area.innerHTML = '';

  // STEP 1: Load 50 pesan terakhir sekali saja
  // 7 hari ke belakang
  const sevenDaysAgo = Date.now() - (7 * 24 * 60 * 60 * 1000);
  // Max 100 chat terakhir, filter 7 hari di client
  const msgsRef = query(ref(db, 'community_chat'), orderByChild('ts'), limitToLast(100));
  get(msgsRef).then(snap => {
    if (snap && snap.exists()) {
      const msgs = [];
      snap.forEach(c => msgs.push({ id: c.key, ...c.val() }));
      // Filter: hanya sembunyikan yang JELAS lebih dari 7 hari
      // Kalau ts tidak ada atau tidak valid → tetap tampil (aman)
      msgs.filter(msg => {
        if (!msg.ts || typeof msg.ts !== 'number') return true; // tampil jika ts tidak valid
        return msg.ts >= sevenDaysAgo; // tampil jika dalam 7 hari
      }).forEach(msg => {
        appendMsg(msg);
        _renderedIds.add(msg.id);
      });
      // Scroll ke bawah setelah load awal
      if (area) requestAnimationFrame(() => { area.scrollTop = area.scrollHeight; });
    } else {
      if (area) area.innerHTML = '<div class="empty-chat"><div style="font-size:40px">💬</div><div>Belum ada pesan. Mulai percakapan!</div></div>';
    }
    _chatInitialized = true;

    // STEP 2: Listen hanya untuk pesan BARU setelah load awal
    const newMsgsRef = query(ref(db, 'community_chat'), orderByChild('ts'), limitToLast(1));
    _chatUnsubscribe = onValue(newMsgsRef, snap => {
      if (!_chatInitialized) return;
      if (!snap || !snap.exists()) return;
      snap.forEach(c => {
        const msg = { id: c.key, ...c.val() };
        if (!_renderedIds.has(msg.id)) {
          // Hapus empty-chat jika ada
          const empty = area ? area.querySelector('.empty-chat') : null;
          if (empty) empty.remove();
          appendMsg(msg);
          _renderedIds.add(msg.id);
          // Scroll ke bawah untuk pesan baru
          if (area) requestAnimationFrame(() => { area.scrollTop = area.scrollHeight; });
        }
      });
    });
  }).catch(err => {
    showToast('❌ Gagal memuat chat');
  });
}

// ===== APPEND SATU PESAN KE AREA =====
function appendMsg(msg) {
  const area = document.getElementById('chatArea');
  if (!area || !currentUser) return;

  try {
    const isMe = msg.uid === currentUser.uid;
    const init = (msg.name||'U').slice(0,2).toUpperCase();
    const d = msg.ts ? new Date(msg.ts) : new Date();

    // Format manual — kompatibel semua dApp browser
    const HARI  = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
    const BULAN = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
    const dateStr = HARI[d.getDay()] + ', ' + d.getDate() + ' ' + BULAN[d.getMonth()] + ' ' + d.getFullYear();
    const hh = String(d.getHours()).padStart(2,'0');
    const mm = String(d.getMinutes()).padStart(2,'0');
    const timeStr = hh + ':' + mm;

    // Tambah date divider jika tanggal berbeda dari sebelumnya
    const lastDateStr = area.dataset.lastDate || '';
    if (dateStr !== lastDateStr) {
      const divider = document.createElement('div');
      divider.className = 'date-divider';
      divider.textContent = dateStr;
      area.appendChild(divider);
      area.dataset.lastDate = dateStr;
    }

    // Buat elemen pesan
    const emojis = ['👍','❤️','🔥','😂','🚀'];
    const canDelete = isMe || isAdmin;
    const reactions = msg.reactions || {};

    const reactionBtns = emojis.map(e => {
      const key = encodeURIComponent(e);
      const arr = reactions[key] || [];
      const count = arr.length;
      const hasReacted = arr.includes(currentUser.uid);
      if (count === 0) return '';
      const cls = hasReacted ? 'reaction-inline active' : 'reaction-inline';
      return '<span class="' + cls + '" data-key="' + key + '" data-count="' + count + '" onclick="window.toggleReaction(&quot;' + msg.id + '&quot;,&quot;' + key + '&quot;)">' + e + ' ' + count + '</span>';
    }).join('');

    const emojiPicker = emojis.map(e =>
      `<span class="emoji-opt" onclick="window.toggleReaction('${msg.id}','${e}')">${e}</span>`
    ).join('');

    // Reply box jika ada
    const replyBox = msg.replyTo
      ? '<div class="reply-in-bubble"><div class="reply-in-name">' + esc(msg.replyTo.name||'') + '</div><div class="reply-in-text">' + esc(msg.replyTo.text||'') + '</div></div>'
      : '';

    const row = document.createElement('div');
    row.className = 'msg-row' + (isMe ? ' me' : '');
    row.id = 'msg-' + msg.id;
    row.innerHTML = `
      <div class="msg-avatar">${init}</div>
      <div class="msg-body">
        ${!isMe ? `<div class="msg-name">${esc(msg.name||'User')} ${msg.isAdmin?'<span class="admin-badge">ADMIN</span>':''}</div>` : ''}
        <div style="display:flex;align-items:flex-start;gap:3px;">
          <div class="msg-wrapper">
            <div class="msg-bubble" onclick="window.toggleEmojiPicker('picker-${msg.id}')">
              ${replyBox}${esc(msg.text||'')}${msg.edited ? '<span class="edited-label"> diedit</span>' : ''}
              <div class="bubble-footer">
                ${reactionBtns}
                <span class="msg-time-inner">${timeStr}</span>
              </div>
            </div>
            <div class="emoji-picker" id="picker-${msg.id}">${emojiPicker}</div>
          </div>
          <div class="msg-menu-wrap">
            <button class="btn-more" onclick="window.toggleMsgMenu(event,'${msg.id}')">
              <span class="btn-more-dot"></span>
              <span class="btn-more-dot"></span>
              <span class="btn-more-dot"></span>
            </button>
            <div class="msg-menu" id="menu-${msg.id}">
              <div class="msg-menu-item" onclick="window.doReply(event,'${msg.id}','${esc(msg.name||'User')}')">↩️ Reply</div>
              <div class="msg-menu-divider"></div>
              ${(isMe || isAdmin) && (msg.editCount||0) < 3 ? '<div class="msg-menu-item" onclick="window.doEdit(event,\''+msg.id+'\',\''+esc(msg.text||'')+'\')">✏️ Edit</div><div class="msg-menu-divider"></div>' : ''}
              <div class="msg-menu-divider"></div>
              <div class="msg-menu-item danger" onclick="window.deleteMsg('${msg.id}')">🗑 Hapus</div>
            </div>
          </div>
        </div>

      </div>`;

    area.appendChild(row);
  } catch(e) {
    console.warn('appendMsg error:', e.message);
  }
}

function renderChat(snap) {
  const area = document.getElementById('chatArea');
  if (!area) return;

  const wasAtBottom = area.scrollHeight - area.scrollTop <= area.clientHeight + 80;

  if (!snap || !snap.exists()) {
    area.innerHTML = '<div class="empty-chat"><div style="font-size:40px">💬</div><div>Belum ada pesan. Mulai percakapan!</div></div>';
    return;
  }

  const msgs = [];
  snap.forEach(c => msgs.push({ id: c.key, ...c.val() }));

  // Hapus debug toast — tidak perlu lagi
  const html_parts = [];
  let lastDate = '';
  const emojis = ['👍','❤️','🔥','😂','🚀'];

  msgs.forEach(msg => {
    try {
    const isMe = currentUser && msg.uid === currentUser.uid;
    const init = (msg.name||'U').slice(0,2).toUpperCase();
    const d = msg.ts ? new Date(msg.ts) : new Date();

    // Format manual — kompatibel semua dApp browser tanpa locale
    const HARI  = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
    const BULAN = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
    const dateStr = HARI[d.getDay()] + ', ' + d.getDate() + ' ' + BULAN[d.getMonth()] + ' ' + d.getFullYear();
    const hh = String(d.getHours()).padStart(2,'0');
    const mm = String(d.getMinutes()).padStart(2,'0');
    const timeStr = hh + ':' + mm;

    if (dateStr !== lastDate) {
      html_parts.push(`<div class="date-divider">${dateStr}</div>`);
      lastDate = dateStr;
    }

    const canDelete = isMe || isAdmin;
    const reactions = msg.reactions || {};

    const reactionBtns = emojis.map(e => {
      const key = encodeURIComponent(e);
      const arr = reactions[key] || [];
      const count = arr.length;
      const hasReacted = arr.includes(currentUser.uid);
      return count > 0
        ? `<button class="reaction-btn ${hasReacted?'active':''}" onclick="window.toggleReaction('${msg.id}','${e}')">
            ${e} <span class="reaction-count">${count}</span>
           </button>`
        : '';
    }).join('');

    const emojiPicker = emojis.map(e =>
      `<span class="emoji-opt" onclick="window.toggleReaction('${msg.id}','${e}')">${e}</span>`
    ).join('');

    html_parts.push(`
      <div class="msg-row ${isMe?'me':''}" id="msg-${msg.id}">
        <div class="msg-avatar">${init}</div>
        <div class="msg-body">
          ${!isMe ? `<div class="msg-name">${esc(msg.name||'User')} ${msg.isAdmin?'<span class="admin-badge">ADMIN</span>':''}</div>` : ''}
          <div class="msg-wrapper">
            <div class="msg-bubble" onclick="window.toggleEmojiPicker('picker-${msg.id}')">${esc(msg.text||'')}</div>
            <div class="emoji-picker" id="picker-${msg.id}">${emojiPicker}</div>
          </div>
          <div class="msg-reactions">${reactionBtns}</div>
          <div class="msg-footer">
            <span class="msg-time">${timeStr}</span>
            ${canDelete ? `<button class="btn-del" onclick="window.deleteMsg('${msg.id}')" title="Hapus">🗑</button>` : ''}
          </div>
        </div>
      </div>`);
    } catch(msgErr) {
      // Skip pesan yang bermasalah, lanjut ke pesan berikutnya
      showToast('⚠️ Skip 1 pesan: ' + (msgErr.message||'').slice(0,30));
    }
  });

  // Render semua sekaligus — lebih aman dan cepat
  if (html_parts.length === 0) {
    showToast('⚠️ 0 dari ' + msgs.length + ' pesan berhasil render');
    area.innerHTML = '<div class="empty-chat"><div style="font-size:40px">⚠️</div><div>Gagal menampilkan pesan</div></div>';
    return;
  }

  area.innerHTML = html_parts.join('');

  // Force scroll ke bawah
  requestAnimationFrame(() => {
    area.scrollTop = area.scrollHeight;
  });
}

// ===== SEND =====
window.sendMsg = function() {
  const input = document.getElementById('chatInput');
  const text = (input.value||'').trim();
  if (!text || !currentUser) return;
  input.value = '';
  input.style.height = 'auto';
  document.getElementById('charCounter').textContent = '0 / 3000';
  // Mode edit
  if (_editMsgId) {
    const editRef = ref(db, 'community_chat/' + _editMsgId);
    // Optimistic update — update DOM langsung dulu
    const msgRow = document.getElementById('msg-' + _editMsgId);
    if (msgRow) {
      const bubble = msgRow.querySelector('.msg-bubble');
      if (bubble) {
        const footer = bubble.querySelector('.bubble-footer');
        const replyBox = bubble.querySelector('.reply-in-bubble');
        const footerHTML = footer ? footer.outerHTML : '';
        const replyHTML = replyBox ? replyBox.outerHTML : '';
        bubble.innerHTML = replyHTML + esc(text) + '<span class="edited-label"> diedit</span>' + footerHTML;
      }
    }
    showToast('✅ Pesan diupdate');
    const savedId = _editMsgId;
    window.closeEdit();
    // Sinkron ke Firebase di background
    get(editRef).then(snap => {
      if (!snap.exists()) return;
      const msg = snap.val();
      if (msg.uid !== currentUser.uid && !isAdmin) return;
      if ((msg.editCount||0) >= 3) { showToast('❌ Maksimal 3x edit'); return; }
      set(editRef, { ...msg, text: text, edited: true, editCount: (msg.editCount||0) + 1 });
    }).catch(() => showToast('❌ Gagal edit'));
    return;
  }

  const msgData = {
    uid: currentUser.uid,
    name: currentName,
    text: text,
    ts: Date.now(),
    isAdmin: isAdmin
  };
  if (_replyTo) {
    msgData.replyTo = { name: _replyTo.name, text: _replyTo.text };
    window.closeReply();
  }
  push(ref(db, 'community_chat'), msgData).then(() => {
    // Scroll ke bawah setelah kirim
    const area = document.getElementById('chatArea');
    if (area) setTimeout(() => area.scrollTop = area.scrollHeight, 300);
  }).catch(err => {
    input.value = text;
    showToast('❌ Gagal kirim: ' + (err.message||err.code));
  });
};

// ===== DELETE =====
window.deleteMsg = function(msgId) {
  if (!currentUser) return;
  if (!confirm('Hapus pesan ini?')) return;
  document.querySelectorAll('.msg-menu').forEach(m => m.classList.remove('show'));
  const msgRef = ref(db, 'community_chat/' + msgId);
  get(msgRef).then(snap => {
    if (!snap.exists()) return;
    const msg = snap.val();
    if (msg.uid !== currentUser.uid && !isAdmin) return;
    // Hapus dari DOM langsung — optimistic
    const el = document.getElementById('msg-' + msgId);
    if (el) el.remove();
    showToast('✅ Pesan dihapus');
    // Hapus dari Firebase di background
    remove(msgRef).catch(() => showToast('❌ Gagal hapus'));
  });
};

// ===== REACTIONS =====
window.toggleReaction = function(msgId, emojiOrKey) {
  if (!currentUser) return;
  document.querySelectorAll('.emoji-picker').forEach(p => p.classList.remove('show'));

  // emojiOrKey bisa emoji langsung atau encoded key
  const emojiKey = encodeURIComponent(emojiOrKey).length === emojiOrKey.length
    ? emojiOrKey  // sudah encoded
    : encodeURIComponent(emojiOrKey);

  const rRef = ref(db, 'community_chat/' + msgId + '/reactions/' + emojiKey);

  // Optimistic update — update DOM dulu tanpa tunggu Firebase
  const msgRow = document.getElementById('msg-' + msgId);
  if (msgRow) {
    const footer = msgRow.querySelector('.bubble-footer');
    if (footer) {
      const timeEl = footer.querySelector('.msg-time-inner');
      const timeText = timeEl ? timeEl.textContent : '';
      // Cari span reaction yang ada
      const existing = footer.querySelector('[data-key="' + emojiKey + '"]');
      const emoji = decodeURIComponent(emojiKey);
      if (existing) {
        let count = parseInt(existing.getAttribute('data-count') || '1');
        const hasReacted = existing.classList.contains('active');
        if (hasReacted) { count--; } else { count++; }
        if (count <= 0) {
          existing.remove();
        } else {
          existing.setAttribute('data-count', count);
          existing.textContent = emoji + ' ' + count;
          existing.classList.toggle('active', !hasReacted);
        }
      } else {
        // Tambah reaction baru
        const span = document.createElement('span');
        span.className = 'reaction-inline active';
        span.setAttribute('data-key', emojiKey);
        span.setAttribute('data-count', '1');
        span.textContent = emoji + ' 1';
        span.onclick = function() { window.toggleReaction(msgId, emojiKey); };
        footer.insertBefore(span, timeEl);
      }
    }
  }

  // Sinkron ke Firebase di background
  get(rRef).then(snap => {
    const arr = snap.exists() ? (snap.val() || []) : [];
    const idx = arr.indexOf(currentUser.uid);
    if (idx === -1) arr.push(currentUser.uid);
    else arr.splice(idx, 1);
    return set(rRef, arr.length > 0 ? arr : null);
  }).catch(() => {});
};

window.toggleEmojiPicker = function(pickerId) {
  const picker = document.getElementById(pickerId);
  if (!picker) return;
  const isOpen = picker.classList.contains('show');
  document.querySelectorAll('.emoji-picker').forEach(p => p.classList.remove('show'));
  document.querySelectorAll('.msg-menu').forEach(m => m.classList.remove('show'));
  if (!isOpen) picker.classList.add('show');
};

window.toggleMsgMenu = function(event, msgId) {
  event.stopPropagation();
  const menu = document.getElementById('menu-' + msgId);
  if (!menu) return;
  const isOpen = menu.classList.contains('show');
  document.querySelectorAll('.msg-menu').forEach(m => m.classList.remove('show'));
  document.querySelectorAll('.emoji-picker').forEach(p => p.classList.remove('show'));
  if (!isOpen) {
    const rect = event.target.getBoundingClientRect();
    menu.style.top = (rect.bottom + 4) + 'px';
    menu.style.left = Math.min(rect.left, window.innerWidth - 150) + 'px';
    menu.classList.add('show');
  }
};

let _replyTo = null;
window.doReply = function(event, msgId, senderName) {
  event.stopPropagation();
  document.querySelectorAll('.msg-menu').forEach(m => m.classList.remove('show'));
  const bubble = document.querySelector('#msg-' + msgId + ' .msg-bubble');
  const text = bubble ? (bubble.innerText || bubble.textContent || '').trim() : '';
  _replyTo = { msgId: msgId, name: senderName, text: text };
  document.getElementById('replyPreviewName').textContent = senderName;
  document.getElementById('replyPreviewText').textContent = text;
  document.getElementById('replyPreview').style.display = 'block';
  document.getElementById('chatInput').focus();
};
window.closeReply = function() {
  _replyTo = null;
  document.getElementById('replyPreview').style.display = 'none';
};

let _editMsgId = null;
window.doEdit = function(event, msgId, currentText) {
  event.stopPropagation();
  document.querySelectorAll('.msg-menu').forEach(m => m.classList.remove('show'));
  _editMsgId = msgId;
  _replyTo = null;
  document.getElementById('replyPreview').style.display = 'none';
  const input = document.getElementById('chatInput');
  input.value = currentText;
  autoResize(input);
  input.focus();
  showToast('✏️ Mode edit — kirim untuk simpan');
};
window.closeEdit = function() {
  _editMsgId = null;
  document.getElementById('chatInput').value = '';
};

// Tutup picker & menu saat klik di luar
document.addEventListener('click', e => {
  if (!e.target.closest('.msg-wrapper') && !e.target.closest('.msg-menu-wrap')) {
    document.querySelectorAll('.emoji-picker').forEach(p => p.classList.remove('show'));
    document.querySelectorAll('.msg-menu').forEach(m => m.classList.remove('show'));
  }
});

</script>

<script>
// Auto resize textarea
window.autoResize = function(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 100) + 'px';
};

window.updateCharCount = function() {
  const input = document.getElementById('chatInput');
  const counter = document.getElementById('charCounter');
  if (!input || !counter) return;
  const len = input.value.length;
  counter.textContent = len + ' / 3000';
  counter.className = 'char-counter';
  if (len > 2700) counter.classList.add('limit');
  else if (len > 2000) counter.classList.add('warn');
};
</script>
