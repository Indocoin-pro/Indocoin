<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Code Merchant — INDOCOIN</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{
  background:#ffffff;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  font-family:'Rajdhani',sans-serif;
  padding:30px 20px 20px;
}

/* KOTAK CROP — garis putus abu */
.crop-box{
  border:1.5px dashed #bbbbbb;
  border-radius:16px;
  padding:24px 20px 20px;
  width:260px;
  display:flex;
  flex-direction:column;
  align-items:center;
  background:#ffffff;
}

/* NAMA TOKO */
.store-name{
  font-family:'Orbitron',sans-serif;
  font-size:13px;
  font-weight:900;
  color:#000000;
  text-align:center;
  margin-bottom:8px;
  word-break:break-word;
}

/* GARIS GOLD */
.divider{
  width:100%;
  height:2px;
  background:linear-gradient(90deg,transparent,#c8922a,transparent);
  margin-bottom:14px;
}

/* QR IMAGE */
.qr-img{
  width:180px;
  height:180px;
  border-radius:4px;
  display:block;
}

/* BRANDING BAWAH */
.brand-url{
  font-family:'Courier New',monospace;
  font-size:9px;
  color:#888888;
  margin-top:10px;
  letter-spacing:1px;
}
.brand-name{
  font-family:'Orbitron',sans-serif;
  font-size:10px;
  font-weight:900;
  color:#c8922a;
  margin-top:4px;
  letter-spacing:2px;
}

/* TOMBOL KEMBALI */
.btn-back{
  margin-top:28px;
  padding:12px 40px;
  border-radius:12px;
  border:1px solid #c8922a;
  background:transparent;
  color:#c8922a;
  font-family:'Orbitron',sans-serif;
  font-size:11px;
  font-weight:700;
  letter-spacing:2px;
  cursor:pointer;
}
</style>
</head>
<body>

<!-- KOTAK CROP -->
<div class="crop-box">
  <div class="store-name" id="storeName">—</div>
  <div class="divider"></div>
  <img class="qr-img" id="qrImg" src="" alt="QR Code">
  <div class="brand-url">indocoin.id</div>
  <div class="brand-name">INDOCOIN MERCHANT</div>
</div>

<!-- TOMBOL KEMBALI -->
<button class="btn-back" onclick="window.location.href='merchant.html'">← KEMBALI</button>

<script>
const params = new URLSearchParams(window.location.search);
const addr   = params.get('addr') || '';
const nama   = params.get('nama') || 'INDOCOIN MERCHANT';

document.getElementById('storeName').textContent = nama;

const payUrl = `https://indocoin.id/merchant-pay.html?addr=${addr}`;
const qrApi  = `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(payUrl)}&bgcolor=ffffff&color=000000&margin=1`;

document.getElementById('qrImg').src = qrApi;
</script>
</body>
</html>
