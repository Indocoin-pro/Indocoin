<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Code Merchant — INDOCOIN</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{
  background:#080808;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  font-family:'Rajdhani',sans-serif;
  padding:20px;
}

/* QR CARD — persis seperti di dashboard */
.qr-card{
  background:#ffffff;
  border-radius:20px;
  padding:24px 20px 20px;
  width:240px;
  display:flex;
  flex-direction:column;
  align-items:center;
  box-shadow:0 8px 40px rgba(0,0,0,0.5);
}
.qr-store-name{
  font-family:'Orbitron',sans-serif;
  font-size:13px;
  font-weight:900;
  color:#000000;
  text-align:center;
  margin-bottom:8px;
  word-break:break-word;
}
.qr-divider{
  width:100%;
  height:2px;
  background:linear-gradient(90deg,transparent,#c8922a,transparent);
  margin-bottom:12px;
}
.qr-img{
  width:170px;
  height:170px;
  border-radius:6px;
  display:block;
}
.qr-url{
  font-family:'Courier New',monospace;
  font-size:7px;
  color:#888888;
  text-align:center;
  margin-top:10px;
  word-break:break-all;
  padding:0 4px;
}
.qr-brand{
  font-family:'Orbitron',sans-serif;
  font-size:10px;
  font-weight:900;
  color:#c8922a;
  margin-top:6px;
  letter-spacing:1px;
}

/* TOMBOL */
.btn-wrap{
  display:flex;
  flex-direction:column;
  gap:10px;
  width:240px;
  margin-top:20px;
}
.btn-share{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:none;
  background:linear-gradient(135deg,#c8922a,#e8a830);
  color:#000;
  font-family:'Orbitron',sans-serif;
  font-size:12px;
  font-weight:700;
  letter-spacing:2px;
  cursor:pointer;
}
.btn-back{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:1px solid rgba(200,146,42,0.4);
  background:transparent;
  color:#a89880;
  font-family:'Orbitron',sans-serif;
  font-size:10px;
  letter-spacing:1px;
  cursor:pointer;
}
.hint{
  font-family:'Courier New',monospace;
  font-size:10px;
  color:#6b5a48;
  text-align:center;
  margin-top:8px;
  line-height:1.6;
}
</style>
</head>
<body>

<!-- QR CARD -->
<div class="qr-card" id="qrCard">
  <div class="qr-store-name" id="storeName">—</div>
  <div class="qr-divider"></div>
  <img class="qr-img" id="qrImg" src="" alt="QR Code">
  <div class="qr-url" id="qrUrl">—</div>
  <div class="qr-brand">INDOCOIN MERCHANT</div>
</div>

<!-- TOMBOL -->
<div class="btn-wrap">
  <button class="btn-share" id="btnShare" onclick="shareQR()">⬆ SHARE / SIMPAN</button>
  <button class="btn-back" onclick="history.back()">← KEMBALI</button>
</div>
<div class="hint" id="hintText">Tap SHARE untuk kirim ke WhatsApp,<br>Instagram, atau simpan ke galeri.</div>

<script>
// Ambil parameter dari URL
const params  = new URLSearchParams(window.location.search);
const addr    = params.get('addr') || '';
const nama    = params.get('nama') || 'INDOCOIN MERCHANT';

// Tampilkan nama toko
document.getElementById('storeName').textContent = nama;

// Generate QR dari API
const payUrl = `https://indocoin.id/merchant-pay.html?addr=${addr}`;
const qrApi  = `https://api.qrserver.com/v1/create-qr-code/?size=170x170&data=${encodeURIComponent(payUrl)}&bgcolor=ffffff&color=000000&margin=1`;

document.getElementById('qrImg').src = qrApi;
document.getElementById('qrUrl').textContent = payUrl;

// SHARE via Web Share API
async function shareQR(){
  // Coba native share
  if(navigator.share){
    try{
      await navigator.share({
        title : `QR Code ${nama} — INDOCOIN`,
        text  : `Scan QR ini untuk bayar ke ${nama} via INDOCOIN`,
        url   : payUrl
      });
      return;
    } catch(e){ console.log('share cancelled'); }
  }

  // Fallback: screenshot hint
  document.getElementById('hintText').textContent = 'Screenshot halaman ini lalu bagikan via WhatsApp atau simpan ke galeri.';
  document.getElementById('hintText').style.color = '#c8922a';
}
</script>
</body>
</html>
