<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INDOCOIN — Paid Ad Space</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root {
  --gold:#facc15;--gold2:#fbbf24;--gold3:#f59e0b;
  --dark:#0a0f1e;--dark2:#0f172a;--dark3:#1e293b;--dark4:#162032;
  --text:#e2e8f0;--muted:#64748b;--green:#22c55e;--blue:#3b82f6;--red:#ef4444;
  --glow:0 0 20px #facc1566;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--dark);color:var(--text);font-family:'Rajdhani',sans-serif;min-height:100vh;overflow-x:hidden;}

#bgLogo{position:fixed;inset:0;z-index:0;pointer-events:none;display:flex;align-items:center;justify-content:center;}
#bgLogo img{width:min(85vw,85vh);height:min(85vw,85vh);object-fit:contain;opacity:0.03;filter:blur(2px);}
.star{position:fixed;background:white;border-radius:50%;pointer-events:none;animation:twinkle var(--d) infinite alternate;}
@keyframes twinkle{from{opacity:0.1}to{opacity:0.7}}
.layout{position:relative;z-index:1;min-height:100vh;}

/* TOP NAV */
.topnav{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;background:rgba(10,15,30,0.95);backdrop-filter:blur(16px);border-bottom:1px solid rgba(250,204,21,0.15);position:sticky;top:0;z-index:100;}
.nav-left{display:flex;align-items:center;gap:10px;}
.nav-back{width:34px;height:34px;border-radius:10px;background:rgba(250,204,21,0.08);border:1px solid rgba(250,204,21,0.2);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;transition:all 0.3s;text-decoration:none;color:var(--text);}
.nav-back:hover{background:rgba(250,204,21,0.15);}
.nav-title-wrap{display:flex;flex-direction:column;line-height:1.2;}
.nav-title{font-family:'Orbitron',sans-serif;font-size:13px;font-weight:900;color:var(--gold);letter-spacing:2px;}
.nav-sub{font-family:'Share Tech Mono',monospace;font-size:8px;color:var(--muted);letter-spacing:1px;}
.nav-slot{background:rgba(34,197,94,0.12);border:1px solid rgba(34,197,94,0.3);color:var(--green);font-size:9px;font-family:'Share Tech Mono',monospace;padding:4px 10px;border-radius:20px;letter-spacing:1px;display:flex;align-items:center;gap:5px;}
.slot-dot{width:6px;height:6px;background:var(--green);border-radius:50%;animation:blink 1s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}

.main{padding:16px 16px 100px;max-width:480px;margin:0 auto;}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

/* ── BANNER SLIDESHOW ── */
.banner-section{margin-bottom:16px;animation:fadeUp 0.4s ease both;}
.banner-slot{
  width:100%;height:160px;border-radius:16px;
  position:relative;overflow:hidden;
  border:1px solid rgba(250,204,21,0.12);
}
/* Placeholder state */
.banner-ph-bg{position:absolute;inset:0;background:linear-gradient(135deg,#0a0f1e,#0d1a0d,#0a0f1e);}
.banner-ph-grid{
  position:absolute;inset:0;
  background-image:linear-gradient(rgba(250,204,21,0.055) 1px,transparent 1px),linear-gradient(90deg,rgba(250,204,21,0.055) 1px,transparent 1px);
  background-size:30px 30px;animation:gridMove 10s linear infinite;
}
@keyframes gridMove{0%{background-position:0 0}100%{background-position:30px 30px}}
.banner-ph-glowL{position:absolute;left:-40px;top:-40px;width:200px;height:200px;background:radial-gradient(circle,rgba(250,204,21,0.22),transparent 70%);animation:gPulse 3.5s ease-in-out infinite alternate;}
.banner-ph-glowR{position:absolute;right:-40px;bottom:-40px;width:180px;height:180px;background:radial-gradient(circle,rgba(34,197,94,0.18),transparent 70%);animation:gPulse 3.5s ease-in-out infinite alternate-reverse;}
@keyframes gPulse{0%{opacity:0.5;transform:scale(0.88)}100%{opacity:1;transform:scale(1.12)}}
.banner-ph-scan{position:absolute;top:0;left:-10%;width:55px;height:100%;background:linear-gradient(90deg,transparent,rgba(250,204,21,0.1),transparent);animation:scanH 4.5s linear infinite;}
@keyframes scanH{0%{left:-10%}100%{left:110%}}
.banner-ph-border{position:absolute;inset:22px;border-radius:10px;border:1.5px dashed rgba(250,204,21,0.25);animation:borderBreath 3s ease-in-out infinite alternate;}
@keyframes borderBreath{0%{border-color:rgba(250,204,21,0.15)}100%{border-color:rgba(250,204,21,0.4)}}
.ph-corner{position:absolute;width:16px;height:16px;border-color:#facc15;border-style:solid;animation:cornerFade 3s ease-in-out infinite alternate;}
.ph-corner.tl{top:10px;left:10px;border-width:2px 0 0 2px;animation-delay:0s;}
.ph-corner.tr{top:10px;right:10px;border-width:2px 2px 0 0;animation-delay:0.3s;}
.ph-corner.bl{bottom:10px;left:10px;border-width:0 0 2px 2px;animation-delay:0.6s;}
.ph-corner.br{bottom:10px;right:10px;border-width:0 2px 2px 0;animation-delay:0.9s;}
@keyframes cornerFade{0%{opacity:0.2}100%{opacity:0.9}}
.banner-ph-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;}
.ph-icon{font-size:26px;display:inline-block;transform:scaleX(-1);animation:iconSway 5s ease-in-out infinite;}
@keyframes iconSway{
  0%{transform:scaleX(-1) translateX(0) rotate(0);opacity:0.6}
  15%{transform:scaleX(-1) translateX(-8px) rotate(-12deg);opacity:1}
  30%{transform:scaleX(-1) translateX(8px) rotate(12deg);opacity:1}
  65%{transform:scaleX(-1) translateX(0) rotate(0);opacity:0.7}
  100%{transform:scaleX(-1) translateX(0) rotate(0);opacity:0.6}
}
.ph-main-text{
  font-family:'Orbitron',sans-serif;font-size:17px;font-weight:900;letter-spacing:2px;
  background:linear-gradient(90deg,rgba(250,204,21,0.3),rgba(250,204,21,1) 30%,#fff 50%,rgba(250,204,21,1) 70%,rgba(250,204,21,0.3));
  background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  animation:slideSpinLoop 6s cubic-bezier(0.4,0,0.2,1) infinite,shimmerText 3s linear infinite;
  white-space:nowrap;
}
@keyframes slideSpinLoop{
  0%{transform:translateX(-120%) rotate(0);opacity:0}
  18%{transform:translateX(0) rotate(0);opacity:1}
  38%{transform:translateX(0) rotate(0);opacity:1}
  52%{transform:translateX(0) rotate(180deg);opacity:1}
  62%{transform:translateX(0) rotate(360deg);opacity:1}
  90%{transform:translateX(0) rotate(360deg);opacity:1}
  100%{transform:translateX(-120%) rotate(360deg);opacity:0}
}
@keyframes shimmerText{0%{background-position:0% center}100%{background-position:200% center}}
.ph-sub{font-size:10px;color:#64748b;letter-spacing:1.5px;text-transform:uppercase;font-family:'Rajdhani',sans-serif;animation:subFade 3s ease-in-out infinite alternate;}
@keyframes subFade{0%{opacity:0.3}100%{opacity:0.7}}
.ph-pasang-wrap{position:absolute;bottom:10px;right:26px;display:flex;align-items:center;gap:5px;}
.ph-hand{font-size:13px;animation:handBlink 1.2s ease-in-out infinite;}
@keyframes handBlink{0%,100%{opacity:1;transform:translateX(0)}50%{opacity:0.2;transform:translateX(-3px)}}
.ph-pasang{font-size:9px;color:rgba(250,204,21,0.45);font-family:'Orbitron',sans-serif;letter-spacing:1px;cursor:pointer;text-decoration:underline;transition:color 0.3s;animation:pasangPulse 3s ease-in-out infinite alternate;}
.ph-pasang:hover{color:#facc15;}
@keyframes pasangPulse{0%{opacity:0.4}100%{opacity:1}}

/* Active banner */
.banner-active{position:absolute;inset:0;display:none;}
.banner-active.show{display:block;}
.banner-dots{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:5px;z-index:10;}
.bdot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,0.3);transition:all 0.3s;cursor:pointer;}
.bdot.active{background:var(--gold);width:18px;border-radius:3px;}

/* ── CTA BUTTON ── */
.cta-wrap{margin-bottom:16px;animation:fadeUp 0.45s ease both;animation-delay:0.05s;}
.btn-pasang{
  width:100%;padding:16px;
  background:linear-gradient(135deg,var(--gold),var(--gold3));
  color:#000;border:none;border-radius:14px;
  font-family:'Orbitron',sans-serif;font-size:14px;font-weight:900;
  letter-spacing:2px;cursor:pointer;transition:all 0.3s;
  box-shadow:0 4px 25px rgba(250,204,21,0.3);
  display:flex;align-items:center;justify-content:center;gap:10px;
  text-decoration:none;
}
.btn-pasang:hover{transform:translateY(-2px);box-shadow:0 6px 35px rgba(250,204,21,0.5);}
.btn-pasang-pulse{animation:btnPulse 2s ease-in-out infinite;}
@keyframes btnPulse{0%,100%{box-shadow:0 4px 25px rgba(250,204,21,0.3)}50%{box-shadow:0 4px 40px rgba(250,204,21,0.6)}}

/* ── STATS ── */
.stats-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px;animation:fadeUp 0.5s ease both;animation-delay:0.08s;}
.stat-card{background:var(--dark4);border:1px solid rgba(250,204,21,0.1);border-radius:14px;padding:12px 8px;text-align:center;}
.stat-val{font-family:'Orbitron',sans-serif;font-size:20px;font-weight:900;color:var(--gold);}
.stat-lbl{font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:1px;margin-top:3px;text-transform:uppercase;}

/* ── SEARCH & FILTER ── */
.search-wrap{margin-bottom:12px;animation:fadeUp 0.5s ease both;animation-delay:0.1s;position:relative;}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:16px;pointer-events:none;}
.search-input{
  width:100%;padding:12px 14px 12px 42px;
  background:rgba(0,0,0,0.3);border:1px solid rgba(250,204,21,0.15);
  border-radius:12px;color:var(--text);
  font-family:'Rajdhani',sans-serif;font-size:15px;outline:none;transition:all 0.3s;
}
.search-input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(250,204,21,0.06);}
.search-input::placeholder{color:var(--muted);}

.filter-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;animation:fadeUp 0.5s ease both;animation-delay:0.12s;-webkit-overflow-scrolling:touch;}
.filter-scroll::-webkit-scrollbar{display:none;}
.filter-btn{
  flex-shrink:0;padding:7px 14px;
  background:rgba(0,0,0,0.3);border:1px solid rgba(250,204,21,0.15);
  border-radius:20px;color:var(--muted);
  font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:1px;
  cursor:pointer;transition:all 0.3s;white-space:nowrap;
}
.filter-btn:hover,.filter-btn.active{background:rgba(250,204,21,0.1);border-color:var(--gold);color:var(--gold);}

/* ── SORT ROW ── */
.sort-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;animation:fadeUp 0.5s ease both;animation-delay:0.14s;}
.sort-label{font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:1px;}
.sort-select{background:rgba(0,0,0,0.3);border:1px solid rgba(250,204,21,0.15);border-radius:8px;color:var(--muted);font-family:'Share Tech Mono',monospace;font-size:10px;padding:5px 10px;outline:none;cursor:pointer;}

/* ── ADVERTISER CARDS ── */
.ads-grid{display:flex;flex-direction:column;gap:12px;animation:fadeUp 0.55s ease both;animation-delay:0.16s;}
.ad-card{
  background:var(--dark4);border:1px solid rgba(250,204,21,0.1);
  border-radius:16px;overflow:hidden;cursor:pointer;
  transition:all 0.3s;text-decoration:none;color:inherit;display:block;
  position:relative;
}
.ad-card:hover{border-color:rgba(250,204,21,0.35);transform:translateY(-2px);box-shadow:0 8px 30px rgba(0,0,0,0.4);}
.ad-card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(250,204,21,0.03),transparent);opacity:0;transition:opacity 0.3s;}
.ad-card:hover::before{opacity:1;}

/* Card banner strip */
.ad-banner-strip{height:70px;position:relative;overflow:hidden;}
.ad-banner-img{width:100%;height:100%;object-fit:cover;}
.ad-banner-placeholder{
  width:100%;height:100%;
  background:linear-gradient(135deg,#0a0f1e,#0d1a0d);
  display:flex;align-items:center;justify-content:center;
  font-size:28px;
}
.ad-cat-badge{
  position:absolute;top:8px;left:8px;
  font-family:'Orbitron',sans-serif;font-size:8px;font-weight:700;
  padding:3px 8px;border-radius:6px;letter-spacing:1px;
}
.badge-umkm{background:rgba(34,197,94,0.2);border:1px solid rgba(34,197,94,0.4);color:#4ade80;}
.badge-ud{background:rgba(250,204,21,0.2);border:1px solid rgba(250,204,21,0.4);color:#facc15;}
.badge-cv{background:rgba(59,130,246,0.2);border:1px solid rgba(59,130,246,0.4);color:#60a5fa;}
.badge-pt{background:rgba(139,92,246,0.2);border:1px solid rgba(139,92,246,0.4);color:#a78bfa;}
.ad-verified{position:absolute;top:8px;right:8px;background:rgba(0,0,0,0.6);border-radius:6px;padding:3px 6px;font-size:9px;color:var(--green);font-family:'Share Tech Mono',monospace;}

/* Card body */
.ad-body{padding:12px 14px;}
.ad-top{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.ad-avatar{
  width:44px;height:44px;border-radius:10px;flex-shrink:0;
  background:rgba(250,204,21,0.08);border:1.5px solid rgba(250,204,21,0.2);
  display:flex;align-items:center;justify-content:center;font-size:20px;
  overflow:hidden;
}
.ad-avatar img{width:100%;height:100%;object-fit:cover;}
.ad-info{flex:1;min-width:0;}
.ad-name{font-family:'Orbitron',sans-serif;font-size:13px;font-weight:900;color:var(--text);letter-spacing:0.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ad-loc{font-size:11px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:4px;}
.ad-rating{display:flex;align-items:center;gap:4px;flex-shrink:0;}
.ad-stars{color:var(--gold);font-size:12px;letter-spacing:1px;}
.ad-rval{font-family:'Orbitron',sans-serif;font-size:12px;font-weight:700;color:var(--gold);}

/* Products preview */
.ad-products{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:10px;}
.ad-products::-webkit-scrollbar{display:none;}
.ad-prod{
  flex-shrink:0;background:rgba(0,0,0,0.25);border:1px solid rgba(255,255,255,0.06);
  border-radius:8px;padding:6px 10px;
}
.ad-prod-name{font-size:11px;color:var(--text);white-space:nowrap;}
.ad-prod-price{font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--gold);margin-top:2px;}

/* Card footer */
.ad-footer{display:flex;justify-content:space-between;align-items:center;padding-top:8px;border-top:1px solid rgba(255,255,255,0.05);}
.ad-sold{font-size:11px;color:var(--muted);}
.ad-sold b{color:var(--green);}
.ad-cta{
  background:rgba(250,204,21,0.1);border:1px solid rgba(250,204,21,0.25);
  color:var(--gold);font-family:'Orbitron',sans-serif;font-size:9px;
  padding:5px 12px;border-radius:8px;letter-spacing:1px;
  transition:all 0.3s;
}
.ad-card:hover .ad-cta{background:rgba(250,204,21,0.2);border-color:var(--gold);}

/* Empty state */
.empty-state{text-align:center;padding:40px 20px;color:var(--muted);}
.empty-icon{font-size:40px;margin-bottom:12px;opacity:0.5;}
.empty-text{font-size:14px;letter-spacing:0.5px;}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:200;background:rgba(10,15,30,0.97);backdrop-filter:blur(20px);border-top:1px solid rgba(250,204,21,0.15);display:flex;justify-content:space-around;align-items:center;padding:8px 0 12px;}
.bn-item{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:4px 12px;border-radius:10px;transition:all 0.2s;text-decoration:none;}
.bn-item:hover,.bn-item.active{background:rgba(250,204,21,0.08);}
.bn-icon{font-size:20px;line-height:1;}
.bn-label{font-family:'Share Tech Mono',monospace;font-size:8px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;}
.bn-item.active .bn-label{color:var(--gold);}
</style>
</head>
<body>

<div id="bgLogo"><img src="1772782967104.png" alt="" onerror="this.style.display='none'"></div>

<div class="layout">
  <!-- TOP NAV -->
  <nav class="topnav">
    <div class="nav-left">
      <a href="dashboard.html" class="nav-back">←</a>
      <div class="nav-title-wrap">
        <span class="nav-title">PAID AD SPACE</span>
        <span class="nav-sub">📢 Marketplace Komunitas INDC</span>
      </div>
    </div>
    <div class="nav-slot"><span class="slot-dot"></span><span id="navSlot">13 slot</span></div>
  </nav>

  <div class="main">

    <!-- BANNER SLIDESHOW -->
    <div class="banner-section">
      <div class="banner-slot" id="bannerSlot">
        <!-- Placeholder (tampil saat tidak ada iklan aktif / sedang rotate) -->
        <div id="bannerPlaceholder">
          <div class="banner-ph-bg"></div>
          <div class="banner-ph-grid"></div>
          <div class="banner-ph-glowL"></div>
          <div class="banner-ph-glowR"></div>
          <div class="banner-ph-scan"></div>
          <div class="banner-ph-border"></div>
          <div class="ph-corner tl"></div>
          <div class="ph-corner tr"></div>
          <div class="ph-corner bl"></div>
          <div class="ph-corner br"></div>
          <div class="banner-ph-center">
            <div class="ph-icon">📢</div>
            <div class="ph-main-text">Pajang Iklan Kamu Di Sini</div>
            <div class="ph-sub">Raih pelanggan komunitas Indocoin</div>
          </div>
          <div class="ph-pasang-wrap">
            <span class="ph-hand">👉</span>
            <span class="ph-pasang" onclick="window.location.href='paid-ads-register.html'">pasang iklan</span>
          </div>
        </div>
        <!-- Active banners (inject via JS) -->
        <div id="activeBanners"></div>
        <div class="banner-dots" id="bannerDots"></div>
      </div>
    </div>

    <!-- CTA BUTTON -->
    <div class="cta-wrap">
      <a href="paid-ads-register.html" class="btn-pasang btn-pasang-pulse">
        <span>📢</span>
        <span>PASANG IKLAN SEKARANG</span>
        <span style="font-size:11px;opacity:0.7;">→</span>
      </a>
    </div>

    <!-- STATS -->
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-val" id="statAktif">87</div>
        <div class="stat-lbl">Pengiklan Aktif</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" style="color:var(--red)" id="statSisa">13</div>
        <div class="stat-lbl">Sisa Slot</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" style="color:var(--green)" id="statProduk">342</div>
        <div class="stat-lbl">Total Produk</div>
      </div>
    </div>

    <!-- SEARCH -->
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input class="search-input" type="text" id="searchInput" placeholder="Cari nama toko atau produk..." oninput="filterAds()">
    </div>

    <!-- FILTER -->
    <div class="filter-scroll">
      <button class="filter-btn active" onclick="setFilter('semua',this)">🏪 Semua</button>
      <button class="filter-btn" onclick="setFilter('umkm',this)">🌿 UMKM</button>
      <button class="filter-btn" onclick="setFilter('ud',this)">⭐ UD</button>
      <button class="filter-btn" onclick="setFilter('cv',this)">💼 CV</button>
      <button class="filter-btn" onclick="setFilter('pt',this)">🏢 PT</button>
    </div>

    <!-- SORT -->
    <div class="sort-row">
      <span class="sort-label">URUTKAN</span>
      <select class="sort-select" id="sortSelect" onchange="filterAds()">
        <option value="terbaru">Terbaru</option>
        <option value="rating">Rating Tertinggi</option>
        <option value="terjual">Terlaris</option>
        <option value="harga-asc">Harga Terendah</option>
        <option value="harga-desc">Harga Tertinggi</option>
      </select>
    </div>

    <!-- ADS GRID -->
    <div class="ads-grid" id="adsGrid"></div>

  </div>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <a href="dashboard.html" class="bn-item"><div class="bn-icon">🏠</div><div class="bn-label">Home</div></a>
    <a href="earn.html" class="bn-item"><div class="bn-icon">💰</div><div class="bn-label">Earn</div></a>
    <a href="paid-ads.html" class="bn-item active"><div class="bn-icon">📢</div><div class="bn-label">Iklan</div></a>
    <a href="referral.html" class="bn-item"><div class="bn-icon">👥</div><div class="bn-label">Referral</div></a>
    <a href="community.html" class="bn-item"><div class="bn-icon">🌐</div><div class="bn-label">Community</div></a>
  </nav>
</div>

<script type="module">
import { initializeApp }                                           from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
import { getAuth, onAuthStateChanged }                            from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
import { getFirestore, collection, getDocs, query, where }       from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey:"AIzaSyBrhDJiIcEJsZ-fN0RIDlV0XaOA8ZPjJsw",
  authDomain:"indocoin-network.firebaseapp.com",
  projectId:"indocoin-network",
  storageBucket:"indocoin-network.firebasestorage.app",
  messagingSenderId:"742922450154",
  appId:"1:742922450154:web:97e0847e85bfe3e9f9d393"
};
const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

// Stars
for(let i=0;i<30;i++){
  const s=document.createElement('div');s.className='star';
  const sz=Math.random()*2+1;
  s.style.cssText=`width:${sz}px;height:${sz}px;top:${Math.random()*100}%;left:${Math.random()*100}%;--d:${Math.random()*3+2}s;`;
  document.body.appendChild(s);
}

let allAds = [];
let activeFilter = 'semua';
let currentBannerIdx = 0;

async function loadAds() {
  try {
    const q    = query(collection(db,'paidAdsPublic'), where('active','==',true));
    const snap = await getDocs(q);
    allAds     = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  } catch(e) { console.warn('Firestore load failed, using empty list'); allAds = []; }

  const aktif  = allAds.length;
  const sisa   = Math.max(0, 100 - aktif);
  const prods  = allAds.reduce((n,a) => n + (a.produk?.length||0), 0);
  document.getElementById('statAktif').textContent  = aktif;
  document.getElementById('statSisa').textContent   = sisa;
  document.getElementById('statProduk').textContent = prods;
  document.getElementById('navSlot').textContent    = sisa + ' slot';

  renderBanners();
  filterAds();
}

function renderBanners() {
  if (!allAds.length) return;
  document.getElementById('bannerPlaceholder').style.display = 'none';
  const container = document.getElementById('activeBanners');
  const dotsEl    = document.getElementById('bannerDots');
  container.innerHTML = ''; dotsEl.innerHTML = '';
  allAds.slice(0,5).forEach((ad,i) => {
    const div = document.createElement('div');
    div.className = 'banner-active'+(i===0?' show':'');
    div.innerHTML = buildActiveBanner(ad);
    container.appendChild(div);
    const dot = document.createElement('div');
    dot.className = 'bdot'+(i===0?' active':'');
    dot.onclick = () => goToBanner(i);
    dotsEl.appendChild(dot);
  });
  if (allAds.length > 1) setInterval(() => goToBanner((currentBannerIdx+1) % Math.min(allAds.length,5)), 5000);
}

function goToBanner(idx) {
  document.querySelectorAll('.banner-active').forEach((b,i) => b.classList.toggle('show', i===idx));
  document.querySelectorAll('.bdot').forEach((d,i) => d.classList.toggle('active', i===idx));
  currentBannerIdx = idx;
}

function buildActiveBanner(ad) {
  const cc = {UMKM:'#22c55e',UD:'#facc15',CV:'#60a5fa',PT:'#a78bfa'}[ad.kategori]||'#facc15';
  const av = ad.profilUrl ? `<img src="${ad.profilUrl}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">` : '<span style="font-size:28px;">&#127978;</span>';
  const pt = ad.produk?.[0]?.showPrice ? `ab ${(ad.produk[0].harga||0).toLocaleString('id-ID')} INDC` : (ad.produk?.[0]?.nama||'');
  return `<div style="position:absolute;inset:0;background:linear-gradient(135deg,#0a0f1e,#0d1a0d);cursor:pointer;" onclick="window.location.href='paid-ads-store.html?id=${ad.id}'">
    <div style="position:absolute;left:-30px;top:-30px;width:180px;height:180px;background:radial-gradient(circle,${cc}33,transparent 70%);"></div>
    <div style="position:absolute;inset:0;display:flex;align-items:center;padding:0 24px;gap:18px;">
      <div style="width:70px;height:70px;border-radius:50%;background:rgba(250,204,21,0.08);border:2px solid ${cc}88;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;">${av}</div>
      <div style="flex:1;min-width:0;">
        <div style="font-family:'Orbitron',sans-serif;font-size:9px;color:${cc};letter-spacing:2px;margin-bottom:4px;">${ad.kategori}</div>
        <div style="font-family:'Orbitron',sans-serif;font-size:18px;font-weight:900;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${ad.namaUsaha}</div>
        <div style="font-size:12px;color:#94a3b8;margin-top:3px;">&#128205; ${ad.kota} &middot; ${ad.jamOperasional||''}</div>
      </div>
      <div style="text-align:right;flex-shrink:0;">
        <div style="font-family:'Orbitron',sans-serif;font-size:12px;color:#facc15;font-weight:900;">${pt}</div>
        <div style="margin-top:8px;background:linear-gradient(135deg,#facc15,#f59e0b);color:#000;font-family:'Orbitron',sans-serif;font-size:9px;font-weight:700;padding:6px 12px;border-radius:8px;">LIHAT TOKO</div>
      </div>
    </div>
    <div style="position:absolute;bottom:8px;right:10px;font-size:9px;color:rgba(250,204,21,0.3);font-family:'Orbitron',sans-serif;text-decoration:underline;cursor:pointer;" onclick="event.stopPropagation();window.location.href='paid-ads-register.html'">pasang iklan</div>
  </div>`;
}

window.setFilter = function(cat, btn) {
  activeFilter = cat;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  filterAds();
};

function filterAds() {
  const q    = document.getElementById('searchInput').value.toLowerCase();
  const sort = document.getElementById('sortSelect').value;
  let filtered = allAds.filter(a => {
    const mc = activeFilter==='semua' || a.kategori?.toLowerCase()===activeFilter;
    const mq = a.namaUsaha?.toLowerCase().includes(q) || a.produk?.some(p=>p.nama?.toLowerCase().includes(q));
    return mc && mq;
  });
  if (sort==='rating')      filtered.sort((a,b)=>(b.rating||0)-(a.rating||0));
  else if (sort==='terbaru') filtered.sort((a,b)=>(b.registeredAt?.seconds||0)-(a.registeredAt?.seconds||0));
  else if (sort==='harga-asc')  filtered.sort((a,b)=>(a.produk?.[0]?.harga||0)-(b.produk?.[0]?.harga||0));
  else if (sort==='harga-desc') filtered.sort((a,b)=>(b.produk?.[0]?.harga||0)-(a.produk?.[0]?.harga||0));
  renderAds(filtered);
}
window.filterAds = filterAds;

function renderAds(list) {
  const grid = document.getElementById('adsGrid');
  if (!list.length) { grid.innerHTML=`<div class="empty-state"><div class="empty-icon">&#128269;</div><div class="empty-text">Tidak ada pengiklan ditemukan</div></div>`; return; }
  const bm = {UMKM:'badge-umkm',UD:'badge-ud',CV:'badge-cv',PT:'badge-pt'};
  grid.innerHTML = list.map(ad => {
    const prods = (ad.produk||[]).map(p=>`<div class="ad-prod"><div class="ad-prod-name">${p.nama}</div><div class="ad-prod-price">${p.showPrice?(p.harga||0).toLocaleString('id-ID')+' INDC':'Tanya WA'}</div></div>`).join('');
    const av2 = ad.profilUrl ? `<img src="${ad.profilUrl}" style="width:100%;height:100%;object-fit:cover;">` : '<span style="font-size:22px;">&#127978;</span>';
    return `<a href="paid-ads-store.html?id=${ad.id}" class="ad-card">
      <div class="ad-banner-strip">
        ${ad.bannerUrl?`<img src="${ad.bannerUrl}" class="ad-banner-img">`:`<div class="ad-banner-placeholder">&#127978;</div>`}
        <div class="ad-cat-badge ${bm[ad.kategori]||'badge-umkm'}">${ad.kategori}</div>
        <div class="ad-verified">&#10003; AKTIF</div>
      </div>
      <div class="ad-body">
        <div class="ad-top">
          <div class="ad-avatar">${av2}</div>
          <div class="ad-info"><div class="ad-name">${ad.namaUsaha}</div><div class="ad-loc">&#128205; ${ad.kota}</div></div>
          <div class="ad-rating"><span class="ad-rval">${(ad.rating||0).toFixed(1)}</span><span class="ad-stars">&#9733;</span></div>
        </div>
        <div class="ad-products">${prods||'<div style="font-size:11px;color:var(--muted);">Lihat detail toko</div>'}</div>
        <div class="ad-footer"><div class="ad-sold">&#128241; ${ad.whatsapp||'—'}</div><div class="ad-cta">LIHAT TOKO &rarr;</div></div>
      </div>
    </a>`;
  }).join('');
}

loadAds();
</script>
<script>
if("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/sw.js").then(reg => {
      reg.addEventListener("updatefound", () => {
        const newSW = reg.installing;
        newSW.addEventListener("statechange", () => {
          if(newSW.state === "installed" && navigator.serviceWorker.controller){
            newSW.postMessage("skipWaiting");
            window.location.reload();
          }
        });
      });
    }).catch(e => console.warn("SW:", e));
  });
}
</script>
