<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INDOCOIN — E-Commerce Admin Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
<style>
:root{
  --gold:#facc15;--gold2:#fbbf24;--gold3:#f59e0b;
  --dark:#0a0f1e;--dark2:#0f172a;--dark3:#1e293b;--dark4:#162032;
  --text:#e2e8f0;--muted:#64748b;--green:#22c55e;--blue:#3b82f6;--red:#ef4444;
  --cyan:#06b6d4;--purple:#a855f7;--orange:#f97316;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--dark);color:var(--text);font-family:'Rajdhani',sans-serif;min-height:100vh;overflow-x:hidden;padding-bottom:60px;}
@keyframes goldShimmer{0%{background-position:0% center}100%{background-position:300% center}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}

.topnav{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:rgba(10,15,30,0.97);backdrop-filter:blur(16px);border-bottom:2px solid rgba(255,255,255,0.15);position:sticky;top:0;z-index:100;}
.nav-brand-main{font-family:'Orbitron',sans-serif;font-size:13px;font-weight:900;background:linear-gradient(90deg,#f59e0b,#facc15,#fef08a,#facc15,#f59e0b);background-size:300% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:goldShimmer 3s linear infinite;letter-spacing:2px;}
.nav-brand-sub{font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--orange);letter-spacing:2px;opacity:0.9;}
.wallet-badge{font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--gold);background:rgba(250,204,21,0.1);border:1px solid rgba(250,204,21,0.3);border-radius:8px;padding:6px 10px;}

.container{max-width:820px;margin:0 auto;padding:16px;}

.denied{text-align:center;padding:80px 20px;}
.denied-icon{font-size:48px;margin-bottom:12px;}
.denied-title{font-family:'Orbitron',sans-serif;font-size:16px;color:var(--red);margin-bottom:8px;}
.denied-sub{font-size:13px;color:var(--muted);}

.connect-btn{display:block;margin:60px auto;padding:14px 28px;border-radius:12px;border:none;background:linear-gradient(90deg,var(--gold3),var(--gold));color:#0a0f1e;font-family:'Orbitron',sans-serif;font-weight:700;font-size:13px;cursor:pointer;}

.tabs{display:flex;gap:6px;margin:16px 0;overflow-x:auto;padding-bottom:4px;}
.tab{flex-shrink:0;padding:9px 16px;border-radius:10px;background:var(--dark3);border:1px solid rgba(255,255,255,0.08);font-size:13px;font-weight:600;cursor:pointer;color:var(--muted);white-space:nowrap;}
.tab.active{background:linear-gradient(90deg,var(--gold3),var(--gold));color:#0a0f1e;}

.card{background:var(--dark2);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:14px;margin-bottom:12px;animation:fadeUp 0.3s ease;}
.card-hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;gap:8px;}
.order-id{font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--muted);word-break:break-all;}
.status-pill{font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap;flex-shrink:0;}
.status-CREATED{background:rgba(59,130,246,0.15);color:var(--blue);}
.status-PROCESSING{background:rgba(245,158,11,0.15);color:var(--gold3);}
.status-SUCCESS{background:rgba(34,197,94,0.15);color:var(--green);}
.status-REFUNDED{background:rgba(239,68,68,0.15);color:var(--red);}

.info-row{display:flex;justify-content:space-between;font-size:12px;padding:4px 0;border-bottom:1px dashed rgba(255,255,255,0.06);}
.info-row span:first-child{color:var(--muted);}
.info-row span:last-child{text-align:right;max-width:60%;word-break:break-word;}

.alert-badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;margin-left:6px;}
.alert-1{background:rgba(245,158,11,0.15);color:var(--gold3);}
.alert-2{background:rgba(239,68,68,0.15);color:var(--red);animation:blink 1s infinite;}

.btn-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.btn{flex:1;min-width:100px;padding:9px 10px;border-radius:9px;border:none;font-weight:700;font-size:12px;cursor:pointer;font-family:'Rajdhani',sans-serif;}
.btn-terima{background:var(--green);color:#08150a;}
.btn-tolak{background:var(--red);color:#fff;}
.btn-cod{background:var(--orange);color:#1e1004;}
.btn-sukses{background:linear-gradient(90deg,var(--gold3),var(--gold));color:#0a0f1e;}
.btn-gagal{background:var(--dark4);color:var(--red);border:1px solid var(--red);}
.btn-secondary{background:var(--dark4);color:var(--text);border:1px solid rgba(255,255,255,0.1);}
.btn:disabled{opacity:0.4;cursor:not-allowed;}

input,textarea{width:100%;padding:9px 10px;border-radius:8px;border:1px solid rgba(255,255,255,0.12);background:var(--dark3);color:var(--text);font-family:'Rajdhani',sans-serif;font-size:13px;margin-top:6px;}
label{font-size:11px;color:var(--muted);margin-top:8px;display:block;}

.empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:13px;}

.katalog-item{display:flex;gap:10px;align-items:center;}
.katalog-thumb{width:56px;height:56px;border-radius:8px;object-fit:cover;background:var(--dark3);flex-shrink:0;}
.katalog-info{flex:1;min-width:0;}
.katalog-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.katalog-price{font-size:11px;color:var(--gold);}
.dev-only-badge{font-size:9px;background:rgba(168,85,247,0.15);color:var(--purple);padding:2px 7px;border-radius:20px;margin-left:6px;}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--dark3);border:1px solid rgba(255,255,255,0.15);border-radius:10px;padding:10px 18px;font-size:12px;z-index:999;display:none;}
</style>
</head>
<body>

<div class="topnav">
  <div>
    <div class="nav-brand-main">INDOCOIN</div>
    <div class="nav-brand-sub">E-COMMERCE ADMIN</div>
  </div>
  <div id="walletBadge" class="wallet-badge" style="display:none"></div>
</div>

<div class="container">
  <div id="beforeConnect">
    <button class="connect-btn" onclick="connectWallet()">🔌 Hubungkan Wallet</button>
  </div>

  <div id="deniedView" style="display:none" class="denied">
    <div class="denied-icon">🚫</div>
    <div class="denied-title">AKSES DITOLAK</div>
    <div class="denied-sub">Wallet ini bukan admin e-commerce yang terdaftar</div>
  </div>

  <div id="mainView" style="display:none">
    <div class="tabs">
      <div class="tab active" data-tab="pending" onclick="gantiTab('pending')">📋 Order Aktif</div>
      <div class="tab" data-tab="katalog" onclick="gantiTab('katalog')">🛍️ Katalog Unggulan</div>
    </div>

    <div id="tabPending"></div>

    <div id="tabKatalog" style="display:none">
      <div class="card">
        <label>Tempel link produk (Shopee/Tokopedia)</label>
        <input id="inputKatalogLink" placeholder="https://shopee.co.id/...">
        <label>Kategori</label>
        <input id="inputKatalogKategori" placeholder="Elektronik, Fashion, dll">
        <div class="btn-row">
          <button class="btn btn-sukses" onclick="tambahKatalog()">+ Tambah ke Katalog (coba auto-fetch)</button>
        </div>
      </div>

      <div class="card">
        <div style="font-size:12px;font-weight:700;color:var(--gold3);margin-bottom:6px;">✏️ Isi Manual (kalau auto-fetch gagal)</div>
        <label>Link produk (harus sudah ditambah di atas dulu)</label>
        <input id="manualLink" placeholder="https://shopee.co.id/...">
        <label>Nama Produk</label>
        <input id="manualNama" placeholder="Nama produk">
        <label>Harga (Rupiah, produk+ongkir)</label>
        <input id="manualHarga" type="number" placeholder="Contoh: 150000">
        <label>Nama Toko</label>
        <input id="manualToko" placeholder="Nama toko/seller">
        <label>Link Foto (satu URL dulu, boleh kosong)</label>
        <input id="manualFoto" placeholder="https://...jpg">
        <label>Deskripsi (boleh kosong)</label>
        <textarea id="manualDeskripsi" rows="2" placeholder="Deskripsi singkat produk"></textarea>
        <div class="btn-row">
          <button class="btn btn-secondary" onclick="isiManual()">💾 Simpan Isi Manual</button>
        </div>
      </div>

      <div id="katalogList"></div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
const API_BASE = 'https://ecommerce-api.indocoin.id/api';

const SC = {
  DEV: '0xa16E9579E19eB19e6E24B211121BdCD7996809Cc',
  CHAIN_ID: 56,
};

let _wallet = null, _provider = null, _signer = null, _isAdmin = false, _isDev = false;

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(()=>t.style.display='none', 3000);
}

async function connectWallet(){
  if(!window.ethereum){ toast('Wallet browser tidak terdeteksi'); return; }
  try{
    const accounts = await window.ethereum.request({method:'eth_requestAccounts'});
    _wallet = accounts[0];
    _provider = new ethers.providers.Web3Provider(window.ethereum);
    _signer = _provider.getSigner();

    const chainHex = await window.ethereum.request({method:'eth_chainId'});
    if(parseInt(chainHex,16) !== SC.CHAIN_ID){
      toast('Silakan pindah ke jaringan BSC Mainnet');
      return;
    }

    document.getElementById('beforeConnect').style.display = 'none';
    const badge = document.getElementById('walletBadge');
    badge.style.display = 'block';
    badge.textContent = _wallet.slice(0,6)+'...'+_wallet.slice(-4);

    await cekAksesAdmin();
  }catch(err){
    toast('Gagal hubungkan wallet: '+err.message);
  }
}

async function cekAksesAdmin(){
  try{
    const res = await fetch(`${API_BASE}/admin/orders/pending`, {
      headers: { 'x-wallet-address': _wallet }
    });
    if(res.status === 403 || res.status === 401){
      document.getElementById('deniedView').style.display = 'block';
      return;
    }
    _isAdmin = true;
    _isDev = _wallet.toLowerCase() === SC.DEV.toLowerCase();
    document.getElementById('mainView').style.display = 'block';
    muatOrderPending();
    muatKatalog();
  }catch(err){
    toast('Gagal cek akses: '+err.message);
  }
}

function gantiTab(nama){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===nama));
  document.getElementById('tabPending').style.display = nama==='pending' ? 'block' : 'none';
  document.getElementById('tabKatalog').style.display = nama==='katalog' ? 'block' : 'none';
}

// ─────────────────────────────────────────────
// ORDER AKTIF
// ─────────────────────────────────────────────

async function muatOrderPending(){
  const el = document.getElementById('tabPending');
  el.innerHTML = '<div class="empty">Memuat...</div>';
  try{
    const res = await fetch(`${API_BASE}/admin/orders/pending`, { headers: { 'x-wallet-address': _wallet } });
    const orders = await res.json();
    if(!orders.length){ el.innerHTML = '<div class="empty">Tidak ada order aktif saat ini</div>'; return; }
    el.innerHTML = orders.map(renderOrderCard).join('');
  }catch(err){
    el.innerHTML = `<div class="empty">Gagal memuat: ${err.message}</div>`;
  }
}

function renderOrderCard(o){
  const alamat = o.alamat_penerima || {};
  const isCreated = o.onchain_status === 'CREATED';
  const isProcessing = o.onchain_status === 'PROCESSING';

  return `
  <div class="card">
    <div class="card-hdr">
      <div class="order-id">#${o.order_id.slice(0,10)}...</div>
      <div class="status-pill status-${o.onchain_status}">${o.onchain_status}</div>
    </div>
    <div class="info-row"><span>Produk</span><span>${o.nama_produk || '(menunggu data)'}</span></div>
    <div class="info-row"><span>Link</span><span><a href="${o.link_produk}" target="_blank" style="color:var(--cyan)">Buka link</a></span></div>
    <div class="info-row"><span>Harga Modal</span><span>Rp${Number(o.harga_modal).toLocaleString('id-ID')}</span></div>
    <div class="info-row"><span>Fee Admin</span><span>Rp${Number(o.fee_admin).toLocaleString('id-ID')}</span></div>
    <div class="info-row"><span>Penerima</span><span>${alamat.nama||'-'} / ${alamat.telepon||'-'}</span></div>
    <div class="info-row"><span>Alamat</span><span>${alamat.alamatLengkap||'-'}</span></div>

    ${isCreated ? `
    <div class="btn-row">
      <button class="btn btn-terima" onclick="prosesOrder('${o.order_id}', false)">✅ Terima (Bayar Langsung)</button>
      <button class="btn btn-cod" onclick="prosesOrder('${o.order_id}', true)">📦 Terima sbg COD</button>
    </div>
    <div class="btn-row">
      <button class="btn btn-tolak" onclick="tolakOrder('${o.order_id}')">✖ Tolak Order</button>
    </div>
    ` : ''}

    ${isProcessing && !o.is_cod ? `
    <label>Nomor Resi</label>
    <input id="resi-${o.order_id}" placeholder="Nomor resi ekspedisi" value="${o.resi||''}">
    <label>Ekspedisi</label>
    <input id="eksp-${o.order_id}" placeholder="JNE / J&T / SiCepat / dll" value="${o.ekspedisi||''}">
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="simpanResi('${o.order_id}')">💾 Simpan Resi</button>
    </div>
    <div class="btn-row">
      <button class="btn btn-sukses" onclick="laporSukses('${o.order_id}')">✅ Lapor Sukses</button>
      <button class="btn btn-gagal" onclick="laporGagal('${o.order_id}')">⚠ Lapor Gagal</button>
    </div>
    ` : ''}

    ${isProcessing && o.is_cod ? `
    <div class="info-row"><span>Jalur COD</span><span>Menunggu konfirmasi buyer (terima/tolak) — tidak perlu aksi admin di sini</span></div>
    <label>Nomor Resi (opsional, buat catatan)</label>
    <input id="resi-${o.order_id}" placeholder="Nomor resi ekspedisi" value="${o.resi||''}">
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="simpanResi('${o.order_id}')">💾 Simpan Resi</button>
    </div>
    ` : ''}
  </div>`;
}

async function prosesOrder(orderId, isCOD){
  if(!confirm(isCOD ? 'Proses order ini sebagai COD?' : 'Proses order ini (Bayar Langsung)? Modal akan cair ke Operational Wallet.')) return;
  try{
    const res = await fetch(`${API_BASE}/admin/orders/proses`, {
      method:'POST', headers:{'Content-Type':'application/json','x-wallet-address':_wallet},
      body: JSON.stringify({ orderId, isCOD })
    });
    const data = await res.json();
    if(!data.sukses) throw new Error(data.error || 'Gagal');
    toast('Order diproses. TX: '+data.txHash.slice(0,10)+'...');
    muatOrderPending();
  }catch(err){ toast('Gagal: '+err.message); }
}

async function tolakOrder(orderId){
  const alasan = prompt('Alasan penolakan (barang terlarang, order kelewat besar, dll):');
  if(alasan===null) return;
  try{
    const res = await fetch(`${API_BASE}/admin/orders/tolak`, {
      method:'POST', headers:{'Content-Type':'application/json','x-wallet-address':_wallet},
      body: JSON.stringify({ orderId, alasan })
    });
    const data = await res.json();
    if(!data.sukses) throw new Error(data.error || 'Gagal');
    toast('Order ditolak, dana direfund otomatis.');
    muatOrderPending();
  }catch(err){ toast('Gagal: '+err.message); }
}

async function simpanResi(orderId){
  const resi = document.getElementById('resi-'+orderId).value;
  const ekspedisiEl = document.getElementById('eksp-'+orderId);
  const ekspedisi = ekspedisiEl ? ekspedisiEl.value : null;
  try{
    const res = await fetch(`${API_BASE}/admin/orders/resi`, {
      method:'POST', headers:{'Content-Type':'application/json','x-wallet-address':_wallet},
      body: JSON.stringify({ orderId, resi, ekspedisi })
    });
    const data = await res.json();
    if(!data.sukses) throw new Error('Gagal simpan');
    toast('Resi disimpan.');
  }catch(err){ toast('Gagal: '+err.message); }
}

async function laporSukses(orderId){
  if(!confirm('Lapor sukses? Fee (biaya admin) akan cair ke pool.')) return;
  try{
    const res = await fetch(`${API_BASE}/admin/orders/lapor-sukses`, {
      method:'POST', headers:{'Content-Type':'application/json','x-wallet-address':_wallet},
      body: JSON.stringify({ orderId })
    });
    const data = await res.json();
    if(!data.sukses) throw new Error(data.error || 'Gagal');
    toast('Order sukses. TX: '+data.txHash.slice(0,10)+'...');
    muatOrderPending();
  }catch(err){ toast('Gagal: '+err.message); }
}

async function laporGagal(orderId){
  const alasan = prompt('Alasan gagal (stok habis, gagal kirim, dll):');
  if(alasan===null) return;
  try{
    const res = await fetch(`${API_BASE}/admin/orders/lapor-gagal`, {
      method:'POST', headers:{'Content-Type':'application/json','x-wallet-address':_wallet},
      body: JSON.stringify({ orderId, alasan })
    });
    const data = await res.json();
    if(!data.sukses) throw new Error(data.error || 'Gagal');
    toast('Dilaporkan gagal, fee direfund ke user.');
    muatOrderPending();
  }catch(err){ toast('Gagal: '+err.message); }
}

// ─────────────────────────────────────────────
// KATALOG
// ─────────────────────────────────────────────

async function muatKatalog(){
  const el = document.getElementById('katalogList');
  el.innerHTML = '<div class="empty">Memuat...</div>';
  try{
    const res = await fetch(`${API_BASE}/katalog`);
    const list = await res.json();
    if(!list.length){ el.innerHTML = '<div class="empty">Katalog masih kosong</div>'; return; }
    el.innerHTML = list.map(renderKatalogCard).join('');
  }catch(err){
    el.innerHTML = `<div class="empty">Gagal memuat: ${err.message}</div>`;
  }
}

function renderKatalogCard(p){
  const foto = (p.foto_url && p.foto_url[0]) || '';
  const devBadge = _isDev ? '<span class="dev-only-badge">DEV</span>' : '';
  return `
  <div class="card">
    <div class="katalog-item">
      ${foto ? `<img class="katalog-thumb" src="${foto}">` : '<div class="katalog-thumb"></div>'}
      <div class="katalog-info">
        <div class="katalog-name">${p.nama_produk || '(belum ter-fetch)'} ${p.fetch_gagal_terakhir ? '⚠️' : ''}</div>
        <div class="katalog-price">Rp${Number(p.harga_modal||0).toLocaleString('id-ID')} · ${p.kategori||'-'}</div>
      </div>
    </div>
    ${_isDev ? `
    <label>Fee Manual (kosongkan buat pakai kurva otomatis) ${devBadge}</label>
    <input id="fee-${p.id}" type="number" placeholder="Contoh: 5000" value="${p.fee_manual ?? ''}">
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="setFeeManual(${p.id}, '${p.link_produk}')">💾 Simpan Fee</button>
      <button class="btn btn-tolak" onclick="hapusKatalog('${p.link_produk}')">🗑 Hapus</button>
    </div>
    ` : `
    <div class="btn-row">
      <button class="btn btn-tolak" onclick="hapusKatalog('${p.link_produk}')">🗑 Hapus dari Katalog</button>
    </div>
    `}
  </div>`;
}

async function tambahKatalog(){
  const link = document.getElementById('inputKatalogLink').value.trim();
  const kategori = document.getElementById('inputKatalogKategori').value.trim();
  if(!link){ toast('Isi link produk dulu'); return; }
  try{
    const res = await fetch(`${API_BASE}/admin/katalog/tambah`, {
      method:'POST', headers:{'Content-Type':'application/json','x-wallet-address':_wallet},
      body: JSON.stringify({ link, kategori })
    });
    const data = await res.json();
    if(!data.sukses) throw new Error(data.error || 'Gagal');
    toast(data.autoFetchBerhasil ? 'Produk ditambahkan & data ter-fetch otomatis.' : 'Ditambahkan, tapi auto-fetch gagal — isi manual di bawah.');
    document.getElementById('manualLink').value = link;
    document.getElementById('inputKatalogLink').value = '';
    document.getElementById('inputKatalogKategori').value = '';
    muatKatalog();
  }catch(err){ toast('Gagal: '+err.message); }
}

async function isiManual(){
  const link = document.getElementById('manualLink').value.trim();
  const namaProduk = document.getElementById('manualNama').value.trim();
  const hargaModal = document.getElementById('manualHarga').value;
  const namaToko = document.getElementById('manualToko').value.trim();
  const fotoUrl = document.getElementById('manualFoto').value.trim();
  const deskripsi = document.getElementById('manualDeskripsi').value.trim();

  if(!link || !namaProduk || !hargaModal){ toast('Link, nama, dan harga wajib diisi'); return; }

  try{
    const res = await fetch(`${API_BASE}/admin/katalog/manual`, {
      method:'POST', headers:{'Content-Type':'application/json','x-wallet-address':_wallet},
      body: JSON.stringify({ link, namaProduk, hargaModal, namaToko, fotoUrl, deskripsi })
    });
    const data = await res.json();
    if(!data.sukses) throw new Error(data.error || 'Gagal (pastikan link ini sudah ditambah dulu lewat tombol di atas)');
    toast('Isi manual tersimpan.');
    document.getElementById('manualLink').value = '';
    document.getElementById('manualNama').value = '';
    document.getElementById('manualHarga').value = '';
    document.getElementById('manualToko').value = '';
    document.getElementById('manualFoto').value = '';
    document.getElementById('manualDeskripsi').value = '';
    muatKatalog();
  }catch(err){ toast('Gagal: '+err.message); }
}

async function hapusKatalog(link){
  if(!confirm('Hapus produk ini dari katalog? (order aktif yang masih pakai produk ini tetap lanjut normal)')) return;
  try{
    const res = await fetch(`${API_BASE}/admin/katalog/hapus`, {
      method:'POST', headers:{'Content-Type':'application/json','x-wallet-address':_wallet},
      body: JSON.stringify({ link })
    });
    const data = await res.json();
    if(!data.sukses) throw new Error('Gagal');
    toast('Dihapus dari katalog.');
    muatKatalog();
  }catch(err){ toast('Gagal: '+err.message); }
}

async function setFeeManual(id, link){
  const val = document.getElementById('fee-'+id).value;
  const feeManual = val === '' ? null : Number(val);
  try{
    const res = await fetch(`${API_BASE}/dev/katalog/set-fee`, {
      method:'POST', headers:{'Content-Type':'application/json','x-wallet-address':_wallet},
      body: JSON.stringify({ link, feeManual })
    });
    const data = await res.json();
    if(!data.sukses) throw new Error(data.error || 'Gagal (khusus wallet Dev)');
    toast('Fee manual disimpan.');
    muatKatalog();
  }catch(err){ toast('Gagal: '+err.message); }
}

// Auto-refresh order pending tiap 30 detik biar admin gak perlu manual reload
setInterval(()=>{ if(_isAdmin) muatOrderPending(); }, 30000);
</script>
